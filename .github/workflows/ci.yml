name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Controlli (astro check, tsc, prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check

  unit:
    name: Test unitari (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build e test dei contenuti
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Contenuti (schema, riferimenti, traduzioni, argomenti legacy, URL assoluti)
        run: npx vitest run tests/content
      - name: Link interni del sito compilato
        run: node tools/check-links.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 3

  e2e:
    name: Playwright (smoke, axe WCAG 2.2 AA, visual)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Immagine ufficiale: stesso Chromium e stessi font delle baseline visive.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Verifica baseline visive
        run: |
          if [ -z "$(ls -A tests/e2e/__screenshots__ 2>/dev/null)" ]; then
            echo "::error::Mancano le baseline visive: avvia il workflow 'Aggiorna baseline visive' su questo branch."
            exit 1
          fi
      - run: npx playwright test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - run: npm run lhci
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7
