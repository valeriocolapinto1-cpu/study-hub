# Rigenera le baseline dei test visivi nello stesso ambiente della CI
# (container Playwright) e le committa sul branch da cui è avviato.
# Si avvia a mano (Actions → "Aggiorna baseline visive" → Run workflow) oppure
# con un push su un branch diverso da main il cui ultimo commit contiene "[baseline]"
# nel messaggio: serve quando una modifica voluta cambia l'aspetto delle pagine campione.
name: Aggiorna baseline visive

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[baseline]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: rm -rf tests/e2e/__screenshots__
      - run: npx playwright test --project=visual --update-snapshots
      - name: Commit delle baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "Baseline invariate."
          else
            git commit -m "Aggiorna le baseline dei test visivi (generate in CI)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
