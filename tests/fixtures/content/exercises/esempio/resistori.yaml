- id: impedenza-rl
  topic: resistori
  objectives: [resistori.1]
  difficulty: 3
  kind: static
  statement:
    it: 'Calcola l''impedenza di una serie con $R = 3\,\Omega$ e reattanza induttiva $X_L = 4\,\Omega$.'
    en: 'Find the impedance of a series with $R = 3\,\Omega$ and inductive reactance $X_L = 4\,\Omega$.'
  steps:
    - title: { it: Somma in serie, en: Series sum }
      body:
        {
          it: '$Z = R + jX_L = 3 + j4\,\Omega = 5\angle 53{,}13^\circ\,\Omega$',
          en: '$Z = R + jX_L = 3 + j4\,\Omega = 5\angle 53.13^\circ\,\Omega$',
        }
  answer:
    - { label: { it: Z, en: Z }, value: '3+4j', unit: Ω }
  origin: originale
