  kind: static
  statement:
    it: 'Un partitore con $R_1 = 1\,\text{k}\Omega$ e $R_2 = 3\,\text{k}\Omega$ è alimentato a $V = 8$ V. Calcola la corrente e la tensione su $R_2$.'
    en: 'A divider with $R_1 = 1\,\text{k}\Omega$ and $R_2 = 3\,\text{k}\Omega$ is supplied with $V = 8$ V. Find the current and the voltage across $R_2$.'
  steps:
    - title: { it: Resistenza equivalente, en: Equivalent resistance }
      body: { it: '$R = R_1 + R_2 = 4\,\text{k}\Omega$', en: '$R = R_1 + R_2 = 4\,\text{k}\Omega$' }
    - title: { it: Corrente, en: Current }
      body: { it: '$I = V/R = 2$ mA', en: '$I = V/R = 2$ mA' }
    - title: { it: Tensione su R2, en: Voltage across R2 }
      body: { it: '$V_2 = R_2 I = 6$ V', en: '$V_2 = R_2 I = 6$ V' }
