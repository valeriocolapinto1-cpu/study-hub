      en: Define the $Z$ and $Y$ matrices
  - id: doppi-bipoli-z-y.2
    text:
      it: Misurare/calcolare i parametri con prove a vuoto e in corto
      en: Measure/compute the parameters with open- and short-circuit tests
  - id: doppi-bipoli-z-y.3
    text:
      it: Riconoscere la reciprocità
      en: Recognise reciprocity
group:
  it: VI · Caratterizzazione esterna
  en: VI · External characterisation
