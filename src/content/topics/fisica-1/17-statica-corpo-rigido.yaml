id: statica-corpo-rigido
course: fisica-1
order: 17
title:
  it: Statica dei corpi rigidi
summary:
  it: >-
    Equilibrio significa che le forze non spingono il corpo da nessuna parte E non lo fanno girare attorno a
    nessun perno.
group:
  it: Sistemi di punti e corpo rigido
  en: Systems of particles and rigid bodies
objectives:
  - id: statica-corpo-rigido.1
    text:
      it: Enunciare le due condizioni di equilibrio e la loro origine dalle cardinali
  - id: statica-corpo-rigido.2
    text:
      it: Dimostrare che con ΣF = 0 il momento non dipende dal polo
  - id: statica-corpo-rigido.3
    text:
      it: Dimostrare che il peso equivale a una forza unica nel baricentro
  - id: statica-corpo-rigido.4
    text:
      it: Risolvere l'esempio della scala (o della trave) impostando le 3 equazioni
  - id: statica-corpo-rigido.5
    text:
      it: Usare strategicamente la scelta del polo
  - id: statica-corpo-rigido.6
    text:
      it: Discutere stabilità con il criterio del potenziale/baricentro
