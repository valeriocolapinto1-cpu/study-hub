id: teoria-cinetica-gas
course: fisica-1
order: 24
title:
  it: 'Teoria cinetica dei gas: la pressione dei gas perfetti'
  en: 'Kinetic theory of gases: the pressure of ideal gases'
summary:
  it: >-
    La pressione di un gas è un tamburellare fittissimo di molecole sulla parete: ogni urto è una piccola
    spinta, e la media di miliardi di spinte al secondo è una forza costante.
  en: >-
    The pressure of a gas is a dense drumming of molecules on the wall: each collision is a tiny push, and the
    average of billions of pushes per second is a steady force.
group:
  it: Fluidi e termodinamica
  en: Fluids and thermodynamics
objectives:
  - id: teoria-cinetica-gas.1
    text:
      it: Elencare le ipotesi del modello di gas perfetto
      en: List the assumptions of the ideal-gas model
  - id: teoria-cinetica-gas.2
    text:
      it: Calcolare l'impulso ceduto in un urto elastico sulla parete
      en: Compute the impulse transferred in an elastic collision with the wall
  - id: teoria-cinetica-gas.3
    text:
      it: Contare gli urti per unità di tempo sulla parete
      en: Count the collisions per unit time on the wall
  - id: teoria-cinetica-gas.4
    text:
      it: Usare l'isotropia per passare da ⟨v_x²⟩ a ⟨v²⟩/3
      en: Use isotropy to go from ⟨v_x²⟩ to ⟨v²⟩/3
  - id: teoria-cinetica-gas.5
    text:
      it: Ottenere pV = (2/3)N⟨½mv²⟩
      en: Obtain pV = (2/3)N⟨½mv²⟩
  - id: teoria-cinetica-gas.6
    text:
      it: Confrontare con pV = Nk_BT e interpretare la temperatura
      en: Compare with pV = Nk_BT and interpret temperature
  - id: teoria-cinetica-gas.7
    text:
      it: Definire la velocità quadratica media
      en: Define the root-mean-square speed
