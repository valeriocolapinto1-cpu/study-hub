- id: orale-t-10
  topic: albero-coalbero
  objectives:
    - albero-coalbero.1
    - albero-coalbero.2
  kind: orale
  front:
    it: '**Albero, coalbero e matrici A e B.** Definisci albero e coalbero, maglie e tagli fondamentali, e scrivi la relazione tra i blocchi di $A$ e $B$.'
    en: '**Tree, cotree and matrices A and B.** Define tree and cotree, fundamental loops and cut sets, and write the relation between the blocks of $A$ and $B$.'
  back:
    it: |-
      **Risposta modello.** Un albero è un sottografo connesso che contiene tutti i nodi e non ha maglie: ha n-1 rami; il coalbero ha b-n+1 rami. Ogni ramo di coalbero individua una maglia fondamentale, ogni ramo d'albero un taglio fondamentale. Dalla KVL e KCL si ha A B^T = 0. In forma a blocchi, con A = [At Ac] e B = [Bt 1], si ottiene B_t = -(A_t^{-1} A_c)^T, cioè -F^T.

      **Punti da toccare:**

      - Albero: sottografo connesso con tutti i nodi e senza maglie, $n-1$ rami; coalbero $b-n+1$
      - Maglia fondamentale: albero + un ramo di coalbero; taglio fondamentale: un ramo d'albero
      - Dalla KVL/KCL: $A B^{T}=0$
      - Forma a blocchi: $B_t=-(A_t^{-1}A_c)^{T}$ (con $B_c=1$)
    en: |-
      **Model answer.** A tree is a connected subgraph containing all the nodes and no loops: it has n-1 branches; the cotree has b-n+1 branches. Each cotree branch identifies a fundamental loop, each tree branch a fundamental cut set. From KVL and KCL, A B^T = 0. In block form, with A = [At Ac] and B = [Bt 1], B_t = -(A_t^{-1} A_c)^T, i.e. -F^T.

      **Points to cover:**

      - Tree: connected subgraph with all the nodes and no loops, $n-1$ branches; cotree $b-n+1$
      - Fundamental loop: tree + one cotree branch; fundamental cut set: one tree branch
      - From KVL/KCL: $A B^{T}=0$
      - Block form: $B_t=-(A_t^{-1}A_c)^{T}$ (with $B_c=1$)
- id: formula-albero-coalbero
  topic: albero-coalbero
  objectives:
    - albero-coalbero.2
  kind: formula
  front:
    it: 'Scrivi la formula: **Maglie e tagli fondamentali**. Uso: Costruire B e Q.'
    en: 'Write the formula: **Fundamental loops and cut sets**. Use: Building B and Q.'
  back:
    it: |-
      $$\#\text{maglie fond.}=b-n+1,\qquad \#\text{tagli fond.}=n-1$$

      n nodi, b rami
    en: |-
      $$\#\text{maglie fond.}=b-n+1,\qquad \#\text{tagli fond.}=n-1$$

      n nodes, b branches
