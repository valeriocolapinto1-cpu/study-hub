      passive sign convention
- id: formula-bilancio-p
  topic: conservazione-potenza-complessa
  objectives:
    - conservazione-potenza-complessa.2
    - conservazione-potenza-complessa.1
  kind: formula
  front:
    it: 'Scrivi la formula: **Bilancio delle potenze**. Uso: Verifica di un calcolo di potenze.'
    en: 'Write the formula: **Power balance**. Use: Checking a power computation.'
  back:
    it: |-
      $$\sum P_{gen}=\sum P_{ass},\quad \sum Q_{gen}=\sum Q_{ass}$$

      P attive [W]; Q reattive [var]
    en: |-
      $$\sum P_{gen}=\sum P_{ass},\quad \sum Q_{gen}=\sum Q_{ass}$$

      P active [W]; Q reactive [var]
