- id: formula-adatt-trasf
  topic: massimo-trasferimento-potenza
  objectives:
    - massimo-trasferimento-potenza.3
  kind: formula
  front:
    it: 'Scrivi la formula: **Adattamento con trasformatore**. Uso: Adattare un carico con un trasformatore ideale.'
    en: 'Write the formula: **Matching with a transformer**. Use: Matching a load with an ideal transformer.'
  back:
    it: |-
      $$n^2R_L=R_{th}$$

      n rapporto di trasformazione; R_L carico [Ω]; R_th [Ω]
    en: |-
      $$n^2R_L=R_{th}$$

      n turns ratio; R_L load [Ω]; R_th [Ω]
