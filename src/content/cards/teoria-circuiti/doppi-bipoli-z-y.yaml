- id: formula-z11
  topic: doppi-bipoli-z-y
  objectives:
    - doppi-bipoli-z-y.2
  kind: formula
  front:
    it: 'Scrivi la formula: **Misura dei parametri Z**.'
    en: 'Write the formula: **Measuring the Z parameters**.'
  back:
    it: |-
      $$z_{11}=\frac{v_1}{i_1}\Big|_{i_2=0},\ \ z_{21}=\frac{v_2}{i_1}\Big|_{i_2=0}$$

      porta 2 aperta
    en: |-
      $$z_{11}=\frac{v_1}{i_1}\Big|_{i_2=0},\ \ z_{21}=\frac{v_2}{i_1}\Big|_{i_2=0}$$

      port 2 open
- id: formula-y11
  topic: doppi-bipoli-z-y
  objectives:
    - doppi-bipoli-z-y.2
  kind: formula
  front:
    it: 'Scrivi la formula: **Misura dei parametri Y**.'
    en: 'Write the formula: **Measuring the Y parameters**.'
  back:
    it: |-
      $$y_{11}=\frac{i_1}{v_1}\Big|_{v_2=0},\ \ y_{21}=\frac{i_2}{v_1}\Big|_{v_2=0}$$

      porta 2 in corto
    en: |-
      $$y_{11}=\frac{i_1}{v_1}\Big|_{v_2=0},\ \ y_{21}=\frac{i_2}{v_1}\Big|_{v_2=0}$$

      port 2 shorted
- id: formula-reciprocita
  topic: doppi-bipoli-z-y
  objectives:
    - doppi-bipoli-z-y.3
  kind: formula
  front:
    it: 'Scrivi la formula: **Reciprocità**.'
    en: 'Write the formula: **Reciprocity**.'
  back:
    it: |-
      $$z_{12}=z_{21},\quad y_{12}=y_{21}$$

      reti di soli R, L, C
    en: |-
      $$z_{12}=z_{21},\quad y_{12}=y_{21}$$

      networks of R, L, C only
- id: formula-rete-t
  topic: doppi-bipoli-z-y
  objectives:
    - doppi-bipoli-z-y.1
  kind: formula
  front:
    it: 'Scrivi la formula: **Rete a T**.'
    en: 'Write the formula: **T network**.'
  back:
    it: |-
      $$Z=\begin{pmatrix}R_a+R_c&R_c\\R_c&R_b+R_c\end{pmatrix}$$

      R_a, R_b in serie; R_c in derivazione
    en: |-
      $$Z=\begin{pmatrix}R_a+R_c&R_c\\R_c&R_b+R_c\end{pmatrix}$$

      R_a, R_b in series; R_c in shunt
- id: formula-rete-pi
  topic: doppi-bipoli-z-y
  objectives:
    - doppi-bipoli-z-y.1
  kind: formula
  front:
    it: 'Scrivi la formula: **Rete a π**.'
    en: 'Write the formula: **π network**.'
  back:
    it: |-
      $$Y=\begin{pmatrix}G_a+G_c&-G_c\\-G_c&G_b+G_c\end{pmatrix}$$

      G_a, G_b in derivazione; G_c in serie
    en: |-
      $$Y=\begin{pmatrix}G_a+G_c&-G_c\\-G_c&G_b+G_c\end{pmatrix}$$

      G_a, G_b in shunt; G_c in series
