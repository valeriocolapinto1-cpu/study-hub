- id: formula-cosphi
  topic: potenza-complessa
  objectives:
    - potenza-complessa.1
    - potenza-complessa.3
  kind: formula
  front:
    it: 'Scrivi la formula: **Fattore di potenza**. Uso: Fattore di potenza e tangente dello sfasamento.'
    en: 'Write the formula: **Power factor**. Use: Power factor and tangent of the phase angle.'
  back:
    it: |-
      $$\cos\varphi=\frac{P}{|S|},\ \tan\varphi=\frac QP$$

      P attiva [W]; Q reattiva [var]; |S| apparente [VA]
    en: |-
      $$\cos\varphi=\frac{P}{|S|},\ \tan\varphi=\frac QP$$

      P active [W]; Q reactive [var]; |S| apparent [VA]
