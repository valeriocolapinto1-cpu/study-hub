    - statica-corpo-rigido.6
  kind: concetto
  front:
    it: 'Ipotesi di validità: Statica dei corpi rigidi'
    en: 'Validity assumptions: Statics of rigid bodies'
  back:
    it: >-
      Corpo perfettamente rigido; campo di gravità uniforme (per baricentro ≡ CM); vincoli lisci o scabri
      modellati con reazioni normali e attrito statico ≤ μ_sN.
    en: >-
      Perfectly rigid body; uniform gravitational field (for centre of gravity ≡ CM); smooth or rough
      constraints modelled with normal reactions and static friction ≤ μ_sN.
- id: statica-corpo-rigido-casi-limite
  topic: statica-corpo-rigido
  objectives:
    - statica-corpo-rigido.1
    - statica-corpo-rigido.2
    - statica-corpo-rigido.3
    - statica-corpo-rigido.4
    - statica-corpo-rigido.5
    - statica-corpo-rigido.6
  kind: concetto
  front:
    it: 'Casi limite: Statica dei corpi rigidi'
    en: 'Limiting cases: Statics of rigid bodies'
  back:
    it: >-
      Corpo appoggiato al limite del ribaltamento: la reazione normale si concentra sullo spigolo. Attrito
      insufficiente: l'equilibrio è impossibile e il corpo slitta. Coppia di forze: risultante nulla ma
      momento non nullo — non c'è equilibrio, il corpo ruota.
    en: >-
      A body on the verge of tipping: the normal reaction concentrates on the edge. Insufficient friction:
      equilibrium is impossible and the body slides. A couple: zero resultant but non-zero torque — no
      equilibrium, the body rotates.
- id: statica-corpo-rigido-errori
  topic: statica-corpo-rigido
  objectives:
    - statica-corpo-rigido.1
    - statica-corpo-rigido.2
    - statica-corpo-rigido.3
    - statica-corpo-rigido.4
    - statica-corpo-rigido.5
    - statica-corpo-rigido.6
  kind: concetto
  front:
    it: 'Errori da evitare: Statica dei corpi rigidi'
    en: 'Mistakes to avoid: Statics of rigid bodies'
  back:
    it: >-
      - Imporre solo ΣF = 0 dimenticando i momenti (una coppia ha risultante nulla ma fa ruotare).

      - Cambiare polo a metà del calcolo dei momenti.

      - Sbagliare il braccio delle forze (usare la distanza dal punto di applicazione invece che dalla retta
      d'azione).

      - Dimenticare che l'attrito statico è un'incognita ≤ μ_sN, non uguale a μ_sN salvo al limite dello
      slittamento.
    en: >-
      - Imposing only ΣF = 0 and forgetting torques (a couple has zero resultant but makes things rotate).

      - Changing pole halfway through the torque calculation.

      - Getting the lever arm wrong (using the distance from the point of application instead of from the line
      of action).

      - Forgetting that static friction is an unknown ≤ μ_sN, not equal to μ_sN except at the verge of
      slipping.
