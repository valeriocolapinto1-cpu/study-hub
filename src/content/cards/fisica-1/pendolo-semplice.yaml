    - pendolo-semplice.6
    - pendolo-semplice.7
  kind: concetto
  front:
    it: 'Ipotesi di validità: Pendolo semplice'
    en: 'Validity assumptions: Simple pendulum'
  back:
    it: >-
      Filo inestensibile e di massa trascurabile; massa puntiforme; assenza di attriti e resistenza dell'aria;
      campo di gravità uniforme; per l'isocronismo, piccole oscillazioni (sin θ ≈ θ).
    en: >-
      Inextensible string of negligible mass; point mass; no friction or air drag; uniform gravitational
      field; for isochronism, small oscillations (sin θ ≈ θ).
- id: pendolo-semplice-casi-limite
  topic: pendolo-semplice
  objectives:
    - pendolo-semplice.1
    - pendolo-semplice.2
    - pendolo-semplice.3
    - pendolo-semplice.4
    - pendolo-semplice.5
    - pendolo-semplice.6
    - pendolo-semplice.7
  kind: concetto
  front:
    it: 'Casi limite: Pendolo semplice'
    en: 'Limiting cases: Simple pendulum'
  back:
    it: >-
      Grandi ampiezze: il periodo cresce con θ₀, \(T \approx T_0(1 + \theta_0^2/16)\). L → 0: T → 0. g → 0
      (caduta libera, orbita): il pendolo non oscilla affatto. θ₀ = π: equilibrio instabile in cima.
    en: >-
      Large amplitudes: the period grows with θ₀, \(T \approx T_0(1 + \theta_0^2/16)\). L → 0: T → 0. g → 0
      (free fall, orbit): the pendulum does not oscillate at all. θ₀ = π: unstable equilibrium at the top.
- id: pendolo-semplice-errori
  topic: pendolo-semplice
  objectives:
    - pendolo-semplice.1
    - pendolo-semplice.2
    - pendolo-semplice.3
    - pendolo-semplice.4
    - pendolo-semplice.5
    - pendolo-semplice.6
    - pendolo-semplice.7
  kind: concetto
  front:
    it: 'Errori da evitare: Pendolo semplice'
    en: 'Mistakes to avoid: Simple pendulum'
  back:
    it: |-
      - Dire che il periodo non dipende dall'ampiezza in generale: vale solo per piccole oscillazioni.
      - Includere la massa nel periodo: si semplifica perché massa inerziale e gravitazionale coincidono.
      - Proiettare male il peso: la componente di richiamo è mg sin θ, quella lungo il filo mg cos θ.
      - Dimenticare che la tensione deve anche fornire la forza centripeta: T ≠ mg cos θ durante il moto.
    en: |-
      - Saying that the period never depends on the amplitude: this holds only for small oscillations.
      - Including the mass in the period: it cancels because inertial and gravitational mass coincide.
      - Projecting the weight wrongly: the restoring component is mg sin θ, the one along the string mg cos θ.
      - Forgetting that the tension must also provide the centripetal force: T ≠ mg cos θ during the motion.
