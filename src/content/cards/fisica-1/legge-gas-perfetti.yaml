  kind: formula
  front:
    it: Le formule chiave di «Legge empirica dei gas perfetti»
    en: The key formulas of “Empirical ideal-gas law”
  back:
    it: |-
      - \(pV = nRT\)
      - \(pV = Nk_BT\)
      - \(\frac{p_1V_1}{T_1} = \frac{p_2V_2}{T_2}\)
      - \(R = 8.314\;\text{J/(mol·K)}\)
    en: |-
      - \(pV = nRT\)
      - \(pV = Nk_BT\)
      - \(\frac{p_1V_1}{T_1} = \frac{p_2V_2}{T_2}\)
      - \(R = 8.314\;\text{J/(mol·K)}\)
- id: legge-gas-perfetti-ipotesi
  topic: legge-gas-perfetti
  objectives:
    - legge-gas-perfetti.1
    - legge-gas-perfetti.2
    - legge-gas-perfetti.3
    - legge-gas-perfetti.4
    - legge-gas-perfetti.5
    - legge-gas-perfetti.6
    - legge-gas-perfetti.7
  kind: concetto
  front:
    it: 'Ipotesi di validità: Legge empirica dei gas perfetti'
    en: 'Validity assumptions: Empirical ideal-gas law'
  back:
    it: >-
      Gas sufficientemente rarefatto (limite di bassa densità): tutte le leggi empiriche valgono tanto meglio
      quanto più il gas è lontano dalla condensazione; equilibrio termodinamico (p, T uniformi e ben
      definite).
    en: >-
      Sufficiently rarefied gas (low-density limit): all the empirical laws hold better the further the gas is
      from condensation; thermodynamic equilibrium (uniform, well-defined p and T).
- id: legge-gas-perfetti-casi-limite
  topic: legge-gas-perfetti
  objectives:
    - legge-gas-perfetti.1
    - legge-gas-perfetti.2
    - legge-gas-perfetti.3
    - legge-gas-perfetti.4
    - legge-gas-perfetti.5
    - legge-gas-perfetti.6
    - legge-gas-perfetti.7
  kind: concetto
  front:
    it: 'Casi limite: Legge empirica dei gas perfetti'
    en: 'Limiting cases: Empirical ideal-gas law'
  back:
    it: >-
      Alta densità/bassa T: deviazioni descritte da Van der Waals \((p + an^2/V^2)(V - nb) = nRT\). Vicino
      alla liquefazione la legge fallisce del tutto. Nel limite p → 0 tutti i gas reali tendono al
      comportamento perfetto: per questo il gas perfetto definisce la scala di temperatura.
    en: >-
      High density/low T: deviations described by Van der Waals \((p + an^2/V^2)(V - nb) = nRT\). Close to
      liquefaction the law fails completely. In the limit p → 0 all real gases tend to ideal behaviour: this
      is why the ideal gas defines the temperature scale.
- id: legge-gas-perfetti-errori
  topic: legge-gas-perfetti
  objectives:
    - legge-gas-perfetti.1
    - legge-gas-perfetti.2
    - legge-gas-perfetti.3
    - legge-gas-perfetti.4
    - legge-gas-perfetti.5
    - legge-gas-perfetti.6
    - legge-gas-perfetti.7
  kind: concetto
  front:
    it: 'Errori da evitare: Legge empirica dei gas perfetti'
    en: 'Mistakes to avoid: Empirical ideal-gas law'
  back:
    it: |-
      - Usare la temperatura in gradi Celsius dentro pV = nRT: serve il kelvin.
      - Sbagliare unità di R (8.314 J/mol·K vs 0.0821 L·atm/mol·K).
      - Applicare la legge a vapori vicini alla condensazione.
      - Confondere n (moli) con N (molecole) e R con k_B.
    en: |-
      - Using the temperature in degrees Celsius in pV = nRT: kelvin is required.
      - Getting the units of R wrong (8.314 J/mol·K vs 0.0821 L·atm/mol·K).
      - Applying the law to vapours close to condensation.
      - Confusing n (moles) with N (molecules) and R with k_B.
