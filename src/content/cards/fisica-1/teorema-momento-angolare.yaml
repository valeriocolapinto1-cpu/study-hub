    - teorema-momento-angolare.7
  kind: concetto
  front:
    it: 'Ipotesi di validità: Teorema del momento angolare (seconda equazione cardinale)'
    en: 'Validity assumptions: Angular momentum theorem (second cardinal equation)'
  back:
    it: >-
      Terza legge di Newton in forma forte (forze interne centrali); polo fisso in sistema inerziale oppure
      polo nel CM; per L = Iω serve un corpo rigido che ruota attorno a un asse fisso o di simmetria.
    en: >-
      Newton's third law in strong form (central internal forces); pole fixed in an inertial frame or pole at
      the CM; L = Iω requires a rigid body rotating about a fixed or symmetry axis.
- id: teorema-momento-angolare-casi-limite
  topic: teorema-momento-angolare
  objectives:
    - teorema-momento-angolare.1
    - teorema-momento-angolare.2
    - teorema-momento-angolare.3
    - teorema-momento-angolare.4
    - teorema-momento-angolare.5
    - teorema-momento-angolare.6
    - teorema-momento-angolare.7
  kind: concetto
  front:
    it: 'Casi limite: Teorema del momento angolare (seconda equazione cardinale)'
    en: 'Limiting cases: Angular momentum theorem (second cardinal equation)'
  back:
    it: >-
      Sistema isolato o forze a momento nullo: L conservato. Forze centrali col polo nel centro: si ritrova la
      conservazione per il punto materiale. Se l'asse non è di simmetria, L non è parallelo a ω e compaiono
      momenti sui supporti (squilibrio delle ruote).
    en: >-
      Isolated system or forces with zero torque: L conserved. Central forces with the pole at the centre: the
      conservation for the point particle is recovered. If the axis is not a symmetry axis, L is not parallel
      to ω and torques appear on the bearings (wheel imbalance).
- id: teorema-momento-angolare-errori
  topic: teorema-momento-angolare
  objectives:
    - teorema-momento-angolare.1
    - teorema-momento-angolare.2
    - teorema-momento-angolare.3
    - teorema-momento-angolare.4
    - teorema-momento-angolare.5
    - teorema-momento-angolare.6
    - teorema-momento-angolare.7
  kind: concetto
  front:
    it: 'Errori da evitare: Teorema del momento angolare (seconda equazione cardinale)'
    en: 'Mistakes to avoid: Angular momentum theorem (second cardinal equation)'
  back:
    it: >-
      - Usare come polo un punto mobile qualsiasi senza il termine correttivo: solo il CM è sempre lecito.

      - Includere momenti delle forze interne.

      - Scrivere L = Iω come relazione vettoriale generale: vale sull'asse di rotazione (o per assi
      principali).

      - Dimenticare di verificare che il polo usato per τ e quello usato per L siano lo stesso.
    en: |-
      - Using an arbitrary moving point as pole without the correction term: only the CM is always admissible.
      - Including torques of internal forces.
      - Writing L = Iω as a general vector relation: it holds along the rotation axis (or for principal axes).
      - Forgetting to check that the pole used for τ and the one used for L are the same.
