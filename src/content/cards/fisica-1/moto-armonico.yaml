    - moto-armonico.3
    - moto-armonico.4
    - moto-armonico.5
    - moto-armonico.6
  kind: concetto
  front:
    it: 'Ipotesi di validità: Moto armonico: ampiezza, pulsazione, periodo, fase iniziale'
    en: 'Validity assumptions: Simple harmonic motion: amplitude, angular frequency, period, initial phase'
  back:
    it: >-
      Moto unidimensionale; forza (o accelerazione) di richiamo esattamente lineare in x. Nessuna
      dissipazione.
    en: One-dimensional motion; restoring force (or acceleration) exactly linear in x. No dissipation.
- id: moto-armonico-casi-limite
  topic: moto-armonico
  objectives:
    - moto-armonico.1
    - moto-armonico.2
    - moto-armonico.3
    - moto-armonico.4
    - moto-armonico.5
    - moto-armonico.6
  kind: concetto
  front:
    it: 'Casi limite: Moto armonico: ampiezza, pulsazione, periodo, fase iniziale'
    en: 'Limiting cases: Simple harmonic motion: amplitude, angular frequency, period, initial phase'
  back:
    it: >-
      Se \(v_0 = 0\): φ = 0 e A = x₀ (parte da fermo dall'estremo). Se \(x_0 = 0\): φ = ±π/2 e A = v₀/ω (parte
      dall'equilibrio con velocità massima). Per ω → 0 il periodo diverge: il sistema non richiama più.
    en: >-
      If \(v_0 = 0\): φ = 0 and A = x₀ (it starts at rest from the turning point). If \(x_0 = 0\): φ = ±π/2
      and A = v₀/ω (it starts from equilibrium with maximum speed). For ω → 0 the period diverges: the system
      no longer restores.
- id: moto-armonico-errori
  topic: moto-armonico
  objectives:
    - moto-armonico.1
    - moto-armonico.2
    - moto-armonico.3
    - moto-armonico.4
    - moto-armonico.5
    - moto-armonico.6
  kind: concetto
  front:
    it: 'Errori da evitare: Moto armonico: ampiezza, pulsazione, periodo, fase iniziale'
    en: 'Mistakes to avoid: Simple harmonic motion: amplitude, angular frequency, period, initial phase'
  back:
    it: |-
      - Confondere pulsazione ω (rad/s) e frequenza ν (Hz): ω = 2πν.
      - Credere che il periodo dipenda dall'ampiezza: nel moto armonico ideale è isocrono.
      - Sbagliare i segni derivando: la velocità è −Aω sin(…), non +.
      - Dimenticare che A e φ vengono dalle condizioni iniziali, non dall'equazione del moto.
    en: |-
      - Confusing angular frequency ω (rad/s) and frequency ν (Hz): ω = 2πν.
      - Believing that the period depends on the amplitude: ideal harmonic motion is isochronous.
      - Getting signs wrong when differentiating: the velocity is −Aω sin(…), not +.
      - Forgetting that A and φ come from the initial conditions, not from the equation of motion.
