- id: primo-principio-definizione
  topic: primo-principio
  objectives:
    - primo-principio.1
  kind: definizione
  front:
    it: 'Definizione: Primo principio della termodinamica'
  back:
    it: >-
      Il primo principio della termodinamica è la conservazione dell'energia estesa ai fenomeni termici: la
      variazione di energia interna di un sistema è \(\Delta U = Q - W\), dove Q è il calore assorbito DAL
      sistema e W il lavoro compiuto DAL sistema (convenzione usuale in Fisica 1). U è una funzione di stato
      (dipende solo dallo stato del sistema), mentre Q e W dipendono dalla trasformazione: in forma
      infinitesima \(dU = \delta Q - \delta W\), con δ a ricordare che calore e lavoro non sono differenziali
      esatti.
