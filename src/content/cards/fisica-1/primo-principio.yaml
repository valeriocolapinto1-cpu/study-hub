  kind: concetto
  front:
    it: 'Ipotesi di validità: Primo principio della termodinamica'
  back:
    it: >-
      Sistema chiuso (non scambia materia); per W = ∫p dV trasformazioni quasi-statiche (p definita a ogni
      istante); convenzione dei segni dichiarata esplicitamente (Q > 0 assorbito, W > 0 compiuto dal sistema).
- id: primo-principio-casi-limite
  topic: primo-principio
  objectives:
    - primo-principio.1
    - primo-principio.2
    - primo-principio.3
    - primo-principio.4
    - primo-principio.5
    - primo-principio.6
    - primo-principio.7
  kind: concetto
  front:
    it: 'Casi limite: Primo principio della termodinamica'
  back:
    it: >-
      Trasformazione ciclica: ΔU = 0 ⇒ Q = W (tutto il calore netto diventa lavoro netto e viceversa).
      Adiabatica: Q = 0. Espansione libera (nel vuoto): W = 0 e Q = 0 ⇒ ΔU = 0, ma NON è quasi-statica: niente
      W = ∫p dV.
- id: primo-principio-errori
  topic: primo-principio
  objectives:
    - primo-principio.1
    - primo-principio.2
    - primo-principio.3
    - primo-principio.4
