    - primo-principio.7
  kind: formula
  front:
    it: Le formule chiave di «Primo principio della termodinamica»
  back:
    it: |-
      - \(\Delta U = Q - W\)
      - \(W = \int p\,dV\)
      - \(Q_{isot} = nRT\ln\frac{V_2}{V_1}\)
      - \(pV^\gamma = \text{cost},\; TV^{\gamma-1} = \text{cost}\)
