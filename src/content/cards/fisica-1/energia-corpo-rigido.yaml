    - energia-corpo-rigido.6
  kind: orale
  front:
    it: 'Esponi all''orale: «Energia cinetica e meccanica di un corpo rigido».'
  back:
    it: >-
      Un corpo rigido immagazzina energia cinetica in due 'serbatoi': il moto d'insieme del baricentro e la
      rotazione attorno a esso. La scelta tra le due scritture equivalenti (asse fisso vs König) è solo
      questione di comodità: l'energia è la stessa. Il potenziale, invece, ha un solo serbatoio: la quota del
      baricentro.


      **Scaletta:**


      - Ricavare K = ½Iω² per l'asse fisso

      - Scrivere la forma di König e mostrare la coerenza delle due scritture

      - Dimostrare U = Mgz_cm

      - Spiegare perché il lavoro delle forze interne di un rigido è nullo

      - Precisare le condizioni per conservare E (vincoli ideali)

      - Risolvere l'esempio dell'asta incernierata che cade
