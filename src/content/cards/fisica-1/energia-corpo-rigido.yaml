- id: energia-corpo-rigido-casi-limite
  topic: energia-corpo-rigido
  objectives:
    - energia-corpo-rigido.1
    - energia-corpo-rigido.2
    - energia-corpo-rigido.3
    - energia-corpo-rigido.4
    - energia-corpo-rigido.5
    - energia-corpo-rigido.6
  kind: concetto
  front:
    it: 'Casi limite: Energia cinetica e meccanica di un corpo rigido'
    en: 'Limiting cases: Kinetic and mechanical energy of a rigid body'
  back:
    it: >-
      Pura traslazione: K = ½Mv². Pura rotazione baricentrica: K = ½I_cmω². Rotolamento puro: entrambi i
      termini con il vincolo v = ωR. Perno scabro o strisciamento: E non si conserva, ΔE = W_attrito.
    en: >-
      Pure translation: K = ½Mv². Pure rotation about the CM: K = ½I_cmω². Pure rolling: both terms with the
      constraint v = ωR. Rough pivot or slipping: E is not conserved, ΔE = W_friction.
- id: energia-corpo-rigido-errori
  topic: energia-corpo-rigido
  objectives:
    - energia-corpo-rigido.1
    - energia-corpo-rigido.2
    - energia-corpo-rigido.3
    - energia-corpo-rigido.4
    - energia-corpo-rigido.5
    - energia-corpo-rigido.6
  kind: concetto
  front:
    it: 'Errori da evitare: Energia cinetica e meccanica di un corpo rigido'
    en: 'Mistakes to avoid: Kinetic and mechanical energy of a rigid body'
  back:
    it: |-
      - Sommare ½I_asse ω² (con I rispetto al perno) E ½Mv_cm²: si conta due volte la traslazione.
      - Usare I_cm quando la rotazione è attorno a un perno decentrato (o viceversa) senza Huygens-Steiner.
      - Calcolare U con la quota di un punto qualsiasi invece che del CM.
      - Dimenticare di verificare che i vincoli non lavorino prima di conservare E.
    en: |-
      - Adding ½I_axis ω² (with I about the pivot) AND ½Mv_cm²: translation is counted twice.
      - Using I_cm when the rotation is about an off-centre pivot (or vice versa) without Huygens–Steiner.
      - Computing U with the height of an arbitrary point instead of the CM.
      - Forgetting to check that the constraints do no work before conserving E.
