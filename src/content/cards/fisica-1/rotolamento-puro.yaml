- id: rotolamento-puro-casi-limite
  topic: rotolamento-puro
  objectives:
    - rotolamento-puro.1
    - rotolamento-puro.2
    - rotolamento-puro.3
    - rotolamento-puro.4
    - rotolamento-puro.5
    - rotolamento-puro.6
    - rotolamento-puro.7
  kind: concetto
  front:
    it: 'Casi limite: Rotolamento puro'
  back:
    it: >-
      μ_s = 0 (piano liscio): il corpo non può rotolare, slitta traslando con a = g sin θ senza ruotare. β → 0
      (massa tutta nel centro): a → g sin θ, come un punto che scivola. Strisciamento: v_cm ≠ ωR, l'attrito
      diventa dinamico e dissipa finché il vincolo non si ristabilisce.
- id: rotolamento-puro-errori
  topic: rotolamento-puro
  objectives:
