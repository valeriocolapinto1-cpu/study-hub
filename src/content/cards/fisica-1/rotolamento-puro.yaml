    - rotolamento-puro.7
  kind: concetto
  front:
    it: 'Ipotesi di validità: Rotolamento puro'
    en: 'Validity assumptions: Pure rolling'
  back:
    it: >-
      Corpo rigido a sezione circolare; contatto puntiforme; rotolamento puro (v_contatto = 0) con attrito
      statico sufficiente; si trascura l'attrito volvente (resistenza al rotolamento).
    en: >-
      Rigid body with circular cross-section; point contact; pure rolling (v_contact = 0) with sufficient
      static friction; rolling resistance is neglected.
- id: rotolamento-puro-casi-limite
  topic: rotolamento-puro
  objectives:
    - rotolamento-puro.1
    - rotolamento-puro.2
    - rotolamento-puro.3
    - rotolamento-puro.4
    - rotolamento-puro.5
    - rotolamento-puro.6
    - rotolamento-puro.7
  kind: concetto
  front:
    it: 'Casi limite: Rotolamento puro'
    en: 'Limiting cases: Pure rolling'
  back:
    it: >-
      μ_s = 0 (piano liscio): il corpo non può rotolare, slitta traslando con a = g sin θ senza ruotare. β → 0
      (massa tutta nel centro): a → g sin θ, come un punto che scivola. Strisciamento: v_cm ≠ ωR, l'attrito
      diventa dinamico e dissipa finché il vincolo non si ristabilisce.
    en: >-
      μ_s = 0 (smooth plane): the body cannot roll, it slides translating with a = g sin θ without rotating. β
      → 0 (all mass at the centre): a → g sin θ, like a sliding point. Slipping: v_cm ≠ ωR, friction becomes
      kinetic and dissipates until the constraint is restored.
- id: rotolamento-puro-errori
  topic: rotolamento-puro
  objectives:
    - rotolamento-puro.1
    - rotolamento-puro.2
    - rotolamento-puro.3
    - rotolamento-puro.4
    - rotolamento-puro.5
    - rotolamento-puro.6
    - rotolamento-puro.7
  kind: concetto
  front:
    it: 'Errori da evitare: Rotolamento puro'
    en: 'Mistakes to avoid: Pure rolling'
  back:
    it: >-
      - Dire che l'attrito statico dissipa energia nel rotolamento puro: il punto di applicazione è fermo, W =
      0.

      - Imporre f_s = μ_sN: nel rotolamento f_s è un'incognita, μ_sN è solo il suo limite.

      - Dimenticare il termine rotazionale nell'energia.

      - Applicare v_cm = ωR anche quando il corpo striscia.
    en: >-
      - Saying that static friction dissipates energy in pure rolling: the point of application is at rest, W
      = 0.

      - Imposing f_s = μ_sN: in rolling f_s is an unknown, μ_sN is only its limit.

      - Forgetting the rotational term in the energy.

      - Applying v_cm = ωR even when the body slips.
