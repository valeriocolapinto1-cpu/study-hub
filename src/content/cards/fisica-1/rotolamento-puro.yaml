    - rotolamento-puro.7
  kind: orale
  front:
    it: 'Esponi all''orale: «Rotolamento puro».'
  back:
    it: >-
      Nel rotolamento l'attrito statico è un 'regista' che non spende energia: costringe traslazione e
      rotazione a marciare insieme (v = ωR) redistribuendo la spinta della gravità tra i due moti. La gara sul
      piano inclinato la vince chi ha meno inerzia rotazionale relativa: la sfera batte il disco che batte
      l'anello — sempre, a prescindere da massa e raggio.


      **Scaletta:**


      - Enunciare e giustificare il vincolo v_cm = ωR

      - Scrivere K con König e il vincolo (forma con β)

      - Impostare le due cardinali per la discesa dal piano inclinato

      - Ricavare a_cm = g sinθ/(1+β) e f_s

      - Ricavare la condizione sul μ_s per il rotolamento puro

      - Rifare il calcolo con la conservazione dell'energia

      - Spiegare perché l'attrito statico non dissipa
