    - teorema-di-carnot.7
  kind: concetto
  front:
    it: 'Casi limite: Teorema di Carnot'
    en: "Limiting cases: Carnot's theorem"
  back:
    it: >-
      Macchina irreversibile: η < η_rev strettamente (attriti, salti termici finiti). Macchina reversibile: η
      = 1 − T_F/T_C esattamente. Il teorema non dice nulla sulla potenza: la macchina di Carnot ideale è
      infinitamente lenta.
    en: >-
      Irreversible engine: η < η_rev strictly (friction, finite temperature jumps). Reversible engine: η = 1 −
      T_F/T_C exactly. The theorem says nothing about power: the ideal Carnot engine is infinitely slow.
- id: teorema-di-carnot-errori
  topic: teorema-di-carnot
  objectives:
    - teorema-di-carnot.1
    - teorema-di-carnot.2
    - teorema-di-carnot.3
    - teorema-di-carnot.4
    - teorema-di-carnot.5
    - teorema-di-carnot.6
    - teorema-di-carnot.7
  kind: concetto
  front:
    it: 'Errori da evitare: Teorema di Carnot'
    en: "Mistakes to avoid: Carnot's theorem"
  back:
    it: >-
      - Dimostrare il teorema usando solo il ciclo di Carnot a gas perfetto: la forza del teorema è
      l'universalità, che richiede l'argomento per assurdo.

      - Dimenticare che l'inversione richiede la reversibilità di R: una macchina reale non si può 'far girare
      al contrario' con gli stessi scambi.

      - Concludere che tutte le macchine hanno η = 1 − T_F/T_C: solo le reversibili; le altre stanno sotto.

      - Trascurare la clausola 'stesse due sorgenti'.
    en: >-
      - Proving the theorem using only the ideal-gas Carnot cycle: the strength of the theorem is its
      universality, which requires the argument by contradiction.

      - Forgetting that reversing requires R to be reversible: a real engine cannot be 'run backwards' with
      the same exchanges.

      - Concluding that all engines have η = 1 − T_F/T_C: only reversible ones; the others fall below.

      - Neglecting the clause 'same two reservoirs'.
