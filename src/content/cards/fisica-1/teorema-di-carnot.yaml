  kind: concetto
  front:
    it: 'Ipotesi di validità: Teorema di Carnot'
    en: "Validity assumptions: Carnot's theorem"
  back:
    it: >-
      Validità del secondo principio (enunciato di Clausius o Kelvin-Planck); due sorgenti termiche ideali a
      temperature fisse; macchine cicliche. La macchina X è del tutto arbitraria (reale, irreversibile,
      qualunque fluido).
    en: >-
      Validity of the second law (Clausius or Kelvin–Planck statement); two ideal thermal reservoirs at fixed
      temperatures; cyclic machines. Engine X is completely arbitrary (real, irreversible, any fluid).
