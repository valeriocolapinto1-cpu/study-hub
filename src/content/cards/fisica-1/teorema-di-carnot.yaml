    - teorema-di-carnot.7
  kind: orale
  front:
    it: 'Esponi all''orale: «Teorema di Carnot».'
  back:
    it: >-
      Il teorema mette un tetto universale all'efficienza: non importa quanto ingegnoso sia il progetto, il
      rendimento è limitato dal solo dislivello di temperatura. Il trucco della dimostrazione è elegante: se
      qualcuno costruisse una macchina migliore di Carnot, accoppiandola a una Carnot rovesciata otterremmo
      una pompa di calore gratuita — e la natura, per il secondo principio, non concede pasti gratis.


      **Scaletta:**


      - Enunciare le due parti del teorema

      - Impostare la dimostrazione per assurdo con la macchina composta

      - Spiegare il ruolo essenziale della reversibilità di R

      - Mostrare la violazione di Clausius nel bilancio

      - Dimostrare l'uguaglianza dei rendimenti reversibili nei due versi

      - Dedurre |Q_F|/Q_C = T_F/T_C e la scala assoluta

      - Distinguere il caso irreversibile (disuguaglianza stretta)
