    - teorema-di-carnot.7
  kind: concetto
  front:
    it: 'Casi limite: Teorema di Carnot'
  back:
    it: >-
      Macchina irreversibile: η < η_rev strettamente (attriti, salti termici finiti). Macchina reversibile: η
      = 1 − T_F/T_C esattamente. Il teorema non dice nulla sulla potenza: la macchina di Carnot ideale è
      infinitamente lenta.
