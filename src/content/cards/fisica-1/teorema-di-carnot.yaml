- id: teorema-di-carnot-definizione
  topic: teorema-di-carnot
  objectives:
    - teorema-di-carnot.1
  kind: definizione
  front:
    it: 'Definizione: Teorema di Carnot'
  back:
    it: >-
      Il teorema di Carnot afferma: (1) nessuna macchina termica operante tra due sorgenti può avere
      rendimento maggiore della macchina reversibile di Carnot operante tra le stesse sorgenti; (2) tutte le
      macchine reversibili tra le stesse due sorgenti hanno lo stesso rendimento, \(\eta_{rev} = 1 -
      T_F/T_C\), indipendente dal fluido e dal meccanismo. Il teorema fonda la scala termodinamica assoluta di
      temperatura.
