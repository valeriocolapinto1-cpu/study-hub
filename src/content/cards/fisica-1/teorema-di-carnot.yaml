    - teorema-di-carnot.7
  kind: formula
  front:
    it: Le formule chiave di «Teorema di Carnot»
    en: The key formulas of “Carnot's theorem”
  back:
    it: |-
      - \(\eta_{qualsiasi} \le \eta_{rev} = 1 - \frac{T_F}{T_C}\)
      - \(\frac{|Q_F|}{Q_C} = \frac{T_F}{T_C}\;(\text{rev})\)
    en: |-
      - \(\eta_{any} \le \eta_{rev} = 1 - \frac{T_F}{T_C}\)
      - \(\frac{|Q_F|}{Q_C} = \frac{T_F}{T_C}\;(\text{rev})\)
