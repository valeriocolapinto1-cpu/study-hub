    - momenti-di-inerzia.7
  kind: concetto
  front:
    it: 'Ipotesi di validità: Momenti di inerzia e teorema di Huygens-Steiner'
    en: 'Validity assumptions: Moments of inertia and the Huygens–Steiner theorem'
  back:
    it: >-
      Corpo rigido (distanze mutue fisse); per Huygens-Steiner i due assi devono essere PARALLELI e uno dei
      due deve passare per il CM; densità nota per i calcoli integrali.
    en: >-
      Rigid body (fixed mutual distances); for Huygens–Steiner the two axes must be PARALLEL and one of them
      must pass through the CM; known density for integral calculations.
- id: momenti-di-inerzia-casi-limite
  topic: momenti-di-inerzia
  objectives:
    - momenti-di-inerzia.1
    - momenti-di-inerzia.2
    - momenti-di-inerzia.3
    - momenti-di-inerzia.4
    - momenti-di-inerzia.5
    - momenti-di-inerzia.6
    - momenti-di-inerzia.7
  kind: concetto
  front:
    it: 'Casi limite: Momenti di inerzia e teorema di Huygens-Steiner'
    en: 'Limiting cases: Moments of inertia and the Huygens–Steiner theorem'
  back:
    it: >-
      Tutta la massa sull'asse: I = 0. Massa concentrata a distanza R: I = MR² (punto materiale). A parità di
      massa e raggio: anello > disco > sfera, perché conta quanta massa sta lontana dall'asse. d = 0: I =
      I_cm, il minimo tra tutti gli assi paralleli.
    en: >-
      All the mass on the axis: I = 0. Mass concentrated at distance R: I = MR² (point particle). For equal
      mass and radius: ring > disc > sphere, because what matters is how much mass lies far from the axis. d =
      0: I = I_cm, the minimum among all parallel axes.
- id: momenti-di-inerzia-errori
  topic: momenti-di-inerzia
  objectives:
    - momenti-di-inerzia.1
    - momenti-di-inerzia.2
    - momenti-di-inerzia.3
    - momenti-di-inerzia.4
    - momenti-di-inerzia.5
    - momenti-di-inerzia.6
    - momenti-di-inerzia.7
  kind: concetto
  front:
    it: 'Errori da evitare: Momenti di inerzia e teorema di Huygens-Steiner'
    en: 'Mistakes to avoid: Moments of inertia and the Huygens–Steiner theorem'
  back:
    it: >-
      - Applicare Huygens-Steiner tra due assi di cui nessuno passa per il CM (va fatto in due passi via
      I_cm).

      - Dire che I dipende solo dalla massa: dipende soprattutto dalla sua distribuzione (r²).

      - Usare il raggio del corpo al posto della distanza dall'asse nell'integrale.

      - Dimenticare che I_cm è il minimo: I rispetto a qualsiasi altro asse parallelo è maggiore.
    en: >-
      - Applying Huygens–Steiner between two axes neither of which passes through the CM (it must be done in
      two steps via I_cm).

      - Saying that I depends only on the mass: it depends above all on its distribution (r²).

      - Using the radius of the body instead of the distance from the axis in the integral.

      - Forgetting that I_cm is the minimum: I about any other parallel axis is larger.
