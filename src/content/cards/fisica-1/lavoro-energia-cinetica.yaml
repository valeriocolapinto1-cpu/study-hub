  kind: formula
  front:
    it: Le formule chiave di «Lavoro di una forza e teorema lavoro-energia cinetica»
    en: The key formulas of “Work of a force and the work–kinetic energy theorem”
  back:
    it: |-
      - \(W = \int_A^B \vec{F}\cdot d\vec{r}\)
      - \(K = \frac{1}{2}mv^2\)
      - \(W_{tot} = \Delta K\)
      - \(P = \vec{F}\cdot\vec{v}\)
    en: |-
      - \(W = \int_A^B \vec{F}\cdot d\vec{r}\)
      - \(K = \frac{1}{2}mv^2\)
      - \(W_{tot} = \Delta K\)
      - \(P = \vec{F}\cdot\vec{v}\)
- id: lavoro-energia-cinetica-ipotesi
  topic: lavoro-energia-cinetica
  objectives:
    - lavoro-energia-cinetica.1
    - lavoro-energia-cinetica.2
    - lavoro-energia-cinetica.3
    - lavoro-energia-cinetica.4
    - lavoro-energia-cinetica.5
    - lavoro-energia-cinetica.6
  kind: concetto
  front:
    it: 'Ipotesi di validità: Lavoro di una forza e teorema lavoro-energia cinetica'
    en: 'Validity assumptions: Work of a force and the work–kinetic energy theorem'
  back:
    it: >-
      Punto materiale (per i corpi estesi il teorema va applicato con cautela: conta lo spostamento del punto
      di applicazione); meccanica classica; il teorema vale per QUALSIASI tipo di forza, conservativa o no.
    en: >-
      Point particle (for extended bodies the theorem must be applied with care: what matters is the
      displacement of the point of application); classical mechanics; the theorem holds for ANY kind of force,
      conservative or not.
- id: lavoro-energia-cinetica-casi-limite
  topic: lavoro-energia-cinetica
  objectives:
    - lavoro-energia-cinetica.1
    - lavoro-energia-cinetica.2
    - lavoro-energia-cinetica.3
    - lavoro-energia-cinetica.4
    - lavoro-energia-cinetica.5
    - lavoro-energia-cinetica.6
  kind: concetto
  front:
    it: 'Casi limite: Lavoro di una forza e teorema lavoro-energia cinetica'
    en: 'Limiting cases: Work of a force and the work–kinetic energy theorem'
  back:
    it: >-
      Forza costante e parallela allo spostamento rettilineo: W = Fs (formula elementare). Forza
      perpendicolare: W = 0, moto circolare uniforme. Se W_tot < 0 il corpo rallenta (es. frenata: W_attrito =
      −ΔK).
    en: >-
      Constant force parallel to a straight displacement: W = Fs (elementary formula). Perpendicular force: W
      = 0, uniform circular motion. If W_tot < 0 the body slows down (e.g. braking: W_friction = −ΔK).
- id: lavoro-energia-cinetica-errori
  topic: lavoro-energia-cinetica
  objectives:
    - lavoro-energia-cinetica.1
    - lavoro-energia-cinetica.2
    - lavoro-energia-cinetica.3
    - lavoro-energia-cinetica.4
    - lavoro-energia-cinetica.5
    - lavoro-energia-cinetica.6
  kind: concetto
  front:
    it: 'Errori da evitare: Lavoro di una forza e teorema lavoro-energia cinetica'
    en: 'Mistakes to avoid: Work of a force and the work–kinetic energy theorem'
  back:
    it: >-
      - Applicare ΔK = W della sola forza che interessa dimenticando le altre: il teorema riguarda il lavoro
      TOTALE.

      - Dire che una forza 'grande' fa sempre lavoro: se è perpendicolare allo spostamento il lavoro è nullo.

      - Trattare il lavoro come una quantità che dipende solo da posizione iniziale e finale: in generale
      dipende dal cammino (salvo forze conservative).

      - Dimenticare che il lavoro è uno scalare con segno, non un vettore.
    en: >-
      - Applying ΔK = W of only the force of interest and forgetting the others: the theorem is about the
      TOTAL work.

      - Saying that a 'large' force always does work: if it is perpendicular to the displacement the work is
      zero.

      - Treating work as a quantity that depends only on the initial and final positions: in general it
      depends on the path (except for conservative forces).

      - Forgetting that work is a signed scalar, not a vector.
