    - legge-di-stevino.4
    - legge-di-stevino.5
    - legge-di-stevino.6
    - legge-di-stevino.7
  kind: concetto
  front:
    it: 'Casi limite: Pressione e legge di Stevino'
  back:
    it: >-
      Gas su piccoli dislivelli: ρ minuscola, p quasi uniforme (si trascura Stevino nell'aria di una stanza).
      Atmosfera su grande scala: ρ non costante, integrando con il gas perfetto isotermo si ottiene
      l'esponenziale barometrica. g → 0 (orbita): niente gradiente di pressione, il fluido fluttua.
