    - legge-di-stevino.7
  kind: orale
  front:
    it: 'Esponi all''orale: «Pressione e legge di Stevino».'
  back:
    it: >-
      Ogni strato di fluido deve sorreggere tutto il fluido che gli sta sopra: scendendo, il carico cresce e
      con esso la pressione. Che sia uno scalare deriva dall'incapacità del fluido fermo di sostenere sforzi
      tangenziali: qualunque orientazione dia alla superficie di prova, sento la stessa spinta normale.


      **Scaletta:**


      - Definire la pressione e le sue unità (Pa, atm, mmHg)

      - Enunciare il principio di Pascal (isotropia della pressione)

      - Ricavare dp/dz = −ρg dall'equilibrio del cilindretto

      - Integrare e ottenere p = p₀ + ρgh

      - Spiegare vasi comunicanti e paradosso idrostatico

      - Descrivere il barometro di Torricelli

      - Collegare Stevino alla spinta di Archimede
