    - legge-di-stevino.6
    - legge-di-stevino.7
  kind: concetto
  front:
    it: 'Ipotesi di validità: Pressione e legge di Stevino'
    en: 'Validity assumptions: Pressure and Stevin''s law'
  back:
    it: >-
      Fluido in quiete (statica); per la forma integrata: incomprimibile (ρ costante) e g uniforme. Il fluido
      non sostiene sforzi di taglio (definizione stessa di fluido).
    en: >-
      Fluid at rest (statics); for the integrated form: incompressible (constant ρ) and uniform g. The fluid
      does not sustain shear stresses (the very definition of a fluid).
- id: legge-di-stevino-casi-limite
  topic: legge-di-stevino
  objectives:
    - legge-di-stevino.1
    - legge-di-stevino.2
    - legge-di-stevino.3
    - legge-di-stevino.4
    - legge-di-stevino.5
    - legge-di-stevino.6
    - legge-di-stevino.7
  kind: concetto
  front:
    it: 'Casi limite: Pressione e legge di Stevino'
    en: 'Limiting cases: Pressure and Stevin''s law'
  back:
    it: >-
      Gas su piccoli dislivelli: ρ minuscola, p quasi uniforme (si trascura Stevino nell'aria di una stanza).
      Atmosfera su grande scala: ρ non costante, integrando con il gas perfetto isotermo si ottiene
      l'esponenziale barometrica. g → 0 (orbita): niente gradiente di pressione, il fluido fluttua.
    en: >-
      Gases over small height differences: tiny ρ, almost uniform p (Stevin is neglected in the air of a
      room). Atmosphere on a large scale: ρ not constant; integrating with the isothermal ideal gas gives the
      barometric exponential. g → 0 (orbit): no pressure gradient, the fluid floats.
- id: legge-di-stevino-errori
  topic: legge-di-stevino
  objectives:
    - legge-di-stevino.1
    - legge-di-stevino.2
    - legge-di-stevino.3
    - legge-di-stevino.4
    - legge-di-stevino.5
    - legge-di-stevino.6
    - legge-di-stevino.7
  kind: concetto
  front:
    it: 'Errori da evitare: Pressione e legge di Stevino'
    en: 'Mistakes to avoid: Pressure and Stevin''s law'
  back:
    it: >-
      - Pensare la pressione come vettore 'diretto verso il basso': è uno scalare, agisce in tutte le
      direzioni.

      - Credere che la pressione sul fondo dipenda dalla forma o dalla quantità totale di liquido: conta solo
      la profondità (paradosso idrostatico).

      - Confondere pressione assoluta e relativa (manometrica).

      - Applicare la forma ρgh a un gas su grandi dislivelli dove ρ varia.
    en: >-
      - Thinking of pressure as a vector 'pointing down': it is a scalar, acting in all directions.

      - Believing that the pressure on the bottom depends on the shape or on the total amount of liquid: only
      depth matters (hydrostatic paradox).

      - Confusing absolute and gauge pressure.

      - Applying the ρgh form to a gas over large height differences where ρ varies.
