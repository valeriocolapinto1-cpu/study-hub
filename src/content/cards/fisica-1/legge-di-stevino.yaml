    - legge-di-stevino.7
  kind: formula
  front:
    it: Le formule chiave di «Pressione e legge di Stevino»
  back:
    it: |-
      - \(p = \frac{dF_\perp}{dA}\)
      - \(\frac{dp}{dz} = -\rho g\)
      - \(p = p_0 + \rho g h\)
      - \(F_{Arch} = \rho_{fl}\,g\,V_{imm}\)
