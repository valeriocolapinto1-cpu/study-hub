  kind: concetto
  front:
    it: 'Ipotesi di validità: Oscillatore armonico smorzato'
    en: 'Validity assumptions: Damped harmonic oscillator'
  back:
    it: >-
      Attrito puramente viscoso, lineare nella velocità (valido per moti lenti in fluidi, regime di Stokes);
      molla ideale lineare; parametri m, b, k costanti.
    en: >-
      Purely viscous friction, linear in the velocity (valid for slow motion in fluids, Stokes regime); ideal
      linear spring; constant parameters m, b, k.
- id: oscillatore-smorzato-casi-limite
  topic: oscillatore-smorzato
  objectives:
    - oscillatore-smorzato.1
    - oscillatore-smorzato.2
    - oscillatore-smorzato.3
    - oscillatore-smorzato.4
    - oscillatore-smorzato.5
    - oscillatore-smorzato.6
    - oscillatore-smorzato.7
  kind: concetto
  front:
    it: 'Casi limite: Oscillatore armonico smorzato'
    en: 'Limiting cases: Damped harmonic oscillator'
  back:
    it: >-
      b → 0: si ritrova l'oscillatore armonico ideale (γ = 0, ω_s = ω₀). γ ≪ ω₀: molte oscillazioni quasi
      armoniche con ampiezza lentamente decrescente. γ ≫ ω₀: moto 'strisciante', ritorno lentissimo dominato
      dalla radice piccola.
    en: >-
      b → 0: the ideal harmonic oscillator is recovered (γ = 0, ω_s = ω₀). γ ≪ ω₀: many almost harmonic
      oscillations with slowly decreasing amplitude. γ ≫ ω₀: 'creeping' motion, very slow return dominated by
      the small root.
- id: oscillatore-smorzato-errori
  topic: oscillatore-smorzato
  objectives:
    - oscillatore-smorzato.1
    - oscillatore-smorzato.2
    - oscillatore-smorzato.3
    - oscillatore-smorzato.4
    - oscillatore-smorzato.5
    - oscillatore-smorzato.6
    - oscillatore-smorzato.7
  kind: concetto
  front:
    it: 'Errori da evitare: Oscillatore armonico smorzato'
    en: 'Mistakes to avoid: Damped harmonic oscillator'
  back:
    it: |-
      - Scrivere che la pulsazione di oscillazione resta ω₀: è ω_s = √(ω₀² − γ²) < ω₀.
      - Confondere il decadimento dell'ampiezza (e^{−γt}) con quello dell'energia (e^{−2γt}).
      - Credere che il sovrasmorzato torni all'equilibrio più in fretta del critico: è il contrario.
      - Dimenticare il fattore 2 nella definizione γ = b/2m.
    en: >-
      - Writing that the oscillation angular frequency stays ω₀: it is ω_s = √(ω₀² − γ²) < ω₀.

      - Confusing the decay of the amplitude (e^{−γt}) with that of the energy (e^{−2γt}).

      - Believing that the overdamped oscillator returns to equilibrium faster than the critical one: it is
      the opposite.

      - Forgetting the factor 2 in the definition γ = b/2m.
