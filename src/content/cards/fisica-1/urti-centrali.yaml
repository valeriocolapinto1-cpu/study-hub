- id: urti-centrali-casi-limite
  topic: urti-centrali
  objectives:
    - urti-centrali.1
    - urti-centrali.2
    - urti-centrali.3
    - urti-centrali.4
    - urti-centrali.5
    - urti-centrali.6
    - urti-centrali.7
  kind: concetto
  front:
    it: 'Casi limite: Urti centrali elastici e anelastici'
  back:
    it: >-
      Urto elastico con bersaglio infinitamente massivo: inversione pura della velocità (palla contro muro).
      Masse uguali elastico: scambio delle velocità (biliardo, pendolo di Newton). Anelastico con corpi che
      partono l'uno contro l'altro con P totale nulla: si fermano entrambi, K interamente dissipata.
- id: urti-centrali-errori
  topic: urti-centrali
  objectives:
    - urti-centrali.1
    - urti-centrali.2
    - urti-centrali.3
    - urti-centrali.4
    - urti-centrali.5
    - urti-centrali.6
    - urti-centrali.7
  kind: concetto
  front:
    it: 'Errori da evitare: Urti centrali elastici e anelastici'
  back:
    it: >-
      - Conservare l'energia cinetica in un urto anelastico.

      - Non conservare la quantità di moto 'perché c'è attrito col piano': durante l'urto le forze impulsive
      dominano.

      - Usare le formule dell'urto elastico con v₂ = 0 anche quando il bersaglio si muove.

      - Dimenticare che nell'urto perfettamente anelastico la perdita di K è determinata, non arbitraria.
