- id: urti-centrali-definizione
  topic: urti-centrali
  objectives:
    - urti-centrali.1
  kind: definizione
  front:
    it: 'Definizione: Urti centrali elastici e anelastici'
  back:
    it: >-
      Un urto è un'interazione impulsiva tra due corpi, di durata così breve che le forze esterne sono
      trascurabili rispetto a quelle interne: la quantità di moto totale si conserva SEMPRE. L'urto è elastico
      se si conserva anche l'energia cinetica, anelastico se parte di K si converte in altre forme,
      perfettamente anelastico se i corpi restano attaccati (massima perdita di K compatibile con la
      conservazione di P). Un urto è centrale (frontale) se le velocità giacciono sulla congiungente dei
      centri: il problema è unidimensionale.
- id: urti-centrali-formule
  topic: urti-centrali
  objectives:
    - urti-centrali.1
    - urti-centrali.2
    - urti-centrali.3
    - urti-centrali.4
    - urti-centrali.5
    - urti-centrali.6
    - urti-centrali.7
  kind: formula
  front:
    it: Le formule chiave di «Urti centrali elastici e anelastici»
  back:
    it: |-
      - \(m_1v_1 + m_2v_2 = m_1v_1' + m_2v_2'\)
      - \(v_1' - v_2' = -(v_1 - v_2)\;(\text{elastico})\)
      - \(v' = v_{cm}\;(\text{perf. anelastico})\)
      - \(\Delta K = -\tfrac{1}{2}\mu v_{rel}^2\)
