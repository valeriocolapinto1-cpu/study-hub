  topic: teoria-cinetica-gas
  objectives:
    - teoria-cinetica-gas.1
    - teoria-cinetica-gas.2
    - teoria-cinetica-gas.3
    - teoria-cinetica-gas.4
    - teoria-cinetica-gas.5
    - teoria-cinetica-gas.6
    - teoria-cinetica-gas.7
  kind: concetto
  front:
    it: 'Ipotesi di validità: Teoria cinetica dei gas: la pressione dei gas perfetti'
    en: 'Validity assumptions: Kinetic theory of gases: the pressure of ideal gases'
  back:
    it: >-
      Gas perfetto: molecole puntiformi (volume proprio trascurabile), nessuna interazione a distanza, urti
      elastici; numero enorme di molecole; moto caotico e isotropo; distribuzione delle velocità stazionaria;
      pareti lisce.
    en: >-
      Ideal gas: point-like molecules (negligible own volume), no action at a distance, elastic collisions; an
      enormous number of molecules; chaotic and isotropic motion; stationary velocity distribution; smooth
      walls.
- id: teoria-cinetica-gas-casi-limite
  topic: teoria-cinetica-gas
  objectives:
    - teoria-cinetica-gas.1
    - teoria-cinetica-gas.2
    - teoria-cinetica-gas.3
    - teoria-cinetica-gas.4
    - teoria-cinetica-gas.5
    - teoria-cinetica-gas.6
    - teoria-cinetica-gas.7
  kind: concetto
  front:
    it: 'Casi limite: Teoria cinetica dei gas: la pressione dei gas perfetti'
    en: 'Limiting cases: Kinetic theory of gases: the pressure of ideal gases'
  back:
    it: >-
      Alta pressione o bassa temperatura: il volume proprio e le interazioni non sono più trascurabili → gas
      reali (Van der Waals). T → 0: v_qm → 0 (classicamente). Miscela di gas: ogni specie contribuisce con la
      propria pressione parziale (legge di Dalton, immediata dalla derivazione).
    en: >-
      High pressure or low temperature: the molecules' own volume and interactions are no longer negligible →
      real gases (Van der Waals). T → 0: v_rms → 0 (classically). Gas mixture: each species contributes its
      own partial pressure (Dalton's law, immediate from the derivation).
- id: teoria-cinetica-gas-errori
  topic: teoria-cinetica-gas
  objectives:
    - teoria-cinetica-gas.1
    - teoria-cinetica-gas.2
    - teoria-cinetica-gas.3
    - teoria-cinetica-gas.4
    - teoria-cinetica-gas.5
    - teoria-cinetica-gas.6
    - teoria-cinetica-gas.7
  kind: concetto
  front:
    it: 'Errori da evitare: Teoria cinetica dei gas: la pressione dei gas perfetti'
    en: 'Mistakes to avoid: Kinetic theory of gases: the pressure of ideal gases'
  back:
    it: >-
      - Dimenticare il fattore 1/3 (isotropia) o il fattore 2 dell'impulso.

      - Confondere velocità media, velocità quadratica media e velocità più probabile.

      - Dire che la temperatura misura l'energia TOTALE delle molecole: misura solo quella cinetica
      traslazionale media.

      - Pensare che tutte le molecole abbiano la stessa velocità: c'è una distribuzione (Maxwell-Boltzmann).
    en: >-
      - Forgetting the factor 1/3 (isotropy) or the factor 2 of the impulse.

      - Confusing average speed, root-mean-square speed and most probable speed.

      - Saying that temperature measures the TOTAL energy of the molecules: it measures only the average
      translational kinetic energy.

      - Thinking that all molecules have the same speed: there is a distribution (Maxwell–Boltzmann).
