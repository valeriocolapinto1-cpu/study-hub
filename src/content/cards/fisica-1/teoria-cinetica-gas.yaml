- id: teoria-cinetica-gas-definizione
  topic: teoria-cinetica-gas
  objectives:
    - teoria-cinetica-gas.1
  kind: definizione
  front:
    it: 'Definizione: Teoria cinetica dei gas: la pressione dei gas perfetti'
  back:
    it: >-
      La teoria cinetica interpreta le grandezze macroscopiche di un gas in termini del moto disordinato delle
      sue molecole. Modello di gas perfetto: N molecole puntiformi identiche, non interagenti se non tramite
      urti elastici istantanei, in moto caotico e isotropo. Risultato centrale: la pressione sulle pareti è
      \(p = \frac{1}{3}\frac{N}{V}m\langle v^2\rangle\), cioè due terzi della densità di energia cinetica
      traslazionale.
- id: teoria-cinetica-gas-formule
  topic: teoria-cinetica-gas
  objectives:
    - teoria-cinetica-gas.1
    - teoria-cinetica-gas.2
    - teoria-cinetica-gas.3
    - teoria-cinetica-gas.4
    - teoria-cinetica-gas.5
    - teoria-cinetica-gas.6
    - teoria-cinetica-gas.7
  kind: formula
  front:
    it: 'Le formule chiave di «Teoria cinetica dei gas: la pressione dei gas perfetti»'
  back:
    it: |-
      - \(p = \frac{1}{3}\frac{N}{V}m\langle v^2\rangle\)
      - \(pV = \frac{2}{3}N\langle\tfrac{1}{2}mv^2\rangle\)
      - \(\langle\tfrac{1}{2}mv^2\rangle = \frac{3}{2}k_BT\)
      - \(v_{qm} = \sqrt{3RT/M_{mol}}\)
