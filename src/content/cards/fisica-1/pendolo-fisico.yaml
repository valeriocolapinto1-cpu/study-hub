    it: 'Ipotesi di validità: Pendolo fisico (o composto)'
    en: 'Validity assumptions: Physical (compound) pendulum'
  back:
    it: >-
      Corpo rigido; asse fisso orizzontale privo di attrito; campo di gravità uniforme; per l'isocronismo,
      piccole oscillazioni.
