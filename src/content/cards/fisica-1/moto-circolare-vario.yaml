  kind: concetto
  front:
    it: 'Ipotesi di validità: Moto circolare vario: accelerazione tangenziale e centripeta'
    en: 'Validity assumptions: Non-uniform circular motion: tangential and centripetal acceleration'
  back:
    it: >-
      Punto materiale vincolato a una traiettoria circolare di raggio R costante; cinematica classica (non
      relativistica). Non serve alcuna ipotesi sulla causa del moto: è pura cinematica.
    en: >-
      Point particle constrained to a circular path of constant radius R; classical (non-relativistic)
      kinematics. No assumption on the cause of the motion is needed: this is pure kinematics.
- id: moto-circolare-vario-casi-limite
  topic: moto-circolare-vario
  objectives:
    - moto-circolare-vario.1
    - moto-circolare-vario.2
    - moto-circolare-vario.3
    - moto-circolare-vario.4
    - moto-circolare-vario.5
    - moto-circolare-vario.6
    - moto-circolare-vario.7
  kind: concetto
  front:
    it: 'Casi limite: Moto circolare vario: accelerazione tangenziale e centripeta'
    en: 'Limiting cases: Non-uniform circular motion: tangential and centripetal acceleration'
  back:
    it: >-
      Se \(\alpha = 0\) (ω costante) il moto è circolare uniforme: resta solo l'accelerazione centripeta \(a_n
      = \omega^2 R\). Se \(R \to \infty\) la traiettoria tende a una retta e \(a_n \to 0\): resta solo
      l'accelerazione tangenziale, come nel moto rettilineo. Se v = 0 istantaneamente (inversione del moto),
      a_n = 0 in quell'istante.
    en: >-
      If \(\alpha = 0\) (constant ω) the motion is uniform circular motion: only the centripetal acceleration
      \(a_n = \omega^2 R\) remains. If \(R \to \infty\) the path tends to a straight line and \(a_n \to 0\):
      only the tangential acceleration remains, as in rectilinear motion. If v = 0 at some instant (reversal
      of motion), a_n = 0 at that instant.
- id: moto-circolare-vario-errori
  topic: moto-circolare-vario
  objectives:
    - moto-circolare-vario.1
    - moto-circolare-vario.2
    - moto-circolare-vario.3
    - moto-circolare-vario.4
    - moto-circolare-vario.5
    - moto-circolare-vario.6
    - moto-circolare-vario.7
  kind: concetto
  front:
    it: 'Errori da evitare: Moto circolare vario: accelerazione tangenziale e centripeta'
    en: 'Mistakes to avoid: Non-uniform circular motion: tangential and centripetal acceleration'
  back:
    it: >-
      - Dire che nel moto circolare uniforme l'accelerazione è nulla perché la velocità 'è costante': è
      costante solo il modulo, non il vettore.

      - Confondere a_t = αR (deriva dal cambiamento del modulo di v) con a_n = ω²R (deriva dal cambiamento di
      direzione).

      - Scrivere a_n = v²/R con v velocità angolare invece che tangenziale.

      - Trattare la 'forza centripeta' come una forza in più: è la risultante delle forze reali proiettata
      sulla normale.
    en: >-
      - Saying that in uniform circular motion the acceleration is zero because the velocity 'is constant':
      only its magnitude is constant, not the vector.

      - Confusing a_t = αR (due to the change in the magnitude of v) with a_n = ω²R (due to the change in
      direction).

      - Writing a_n = v²/R with v the angular velocity instead of the tangential speed.

      - Treating the 'centripetal force' as an extra force: it is the resultant of the real forces projected
      on the normal.
