  kind: concetto
  front:
    it: 'Ipotesi di validità: Disuguaglianza di Clausius'
  back:
    it: >-
      Secondo principio (Kelvin-Planck); T nella formula è la temperatura della sorgente esterna (coincide con
      quella del sistema solo negli scambi reversibili); macchine ausiliarie di Carnot ideali; cicli chiusi.
