  kind: orale
  front:
    it: 'Esponi all''orale: «Disuguaglianza di Clausius».'
  back:
    it: >-
      Il rapporto Q/T pesa il calore per la 'qualità' della temperatura a cui viene scambiato: calore preso ad
      alta temperatura è pregiato, calore scaricato a bassa temperatura è degradato. La disuguaglianza dice
      che in ogni giro completo il bilancio dei calori pesati non può mai essere positivo: un ciclo non può
      'guadagnare qualità'. Al pareggio esatto operano solo i cicli reversibili — ed è quel pareggio a rendere
      ben definita l'entropia.


      **Scaletta:**


      - Enunciare la disuguaglianza precisando cos'è T

      - Verificarla sul caso a due sorgenti (rev e irrev)

      - Descrivere la costruzione con le macchine ausiliarie di Carnot

      - Applicare Kelvin-Planck al sistema composto

      - Dimostrare l'uguaglianza per i cicli reversibili (inversione)

      - Dedurre che δQ_rev/T è un differenziale esatto

      - Collegare al concetto di entropia
- id: disuguaglianza-di-clausius-definizione
  topic: disuguaglianza-di-clausius
  objectives:
    - disuguaglianza-di-clausius.1
  kind: definizione
  front:
    it: 'Definizione: Disuguaglianza di Clausius'
  back:
    it: >-
      La disuguaglianza di Clausius generalizza il teorema di Carnot a cicli qualsiasi con scambi di calore a
      più temperature: per ogni ciclo termodinamico \(\oint \frac{\delta Q}{T} \le 0\), dove δQ è il calore
      assorbito dal sistema e T la temperatura della SORGENTE con cui avviene lo scambio. L'uguaglianza vale
      se e solo se il ciclo è reversibile. È il ponte che porta dalla teoria delle macchine alla definizione
      di entropia.
