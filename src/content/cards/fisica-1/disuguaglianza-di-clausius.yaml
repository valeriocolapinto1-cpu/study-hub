- id: disuguaglianza-di-clausius-casi-limite
  topic: disuguaglianza-di-clausius
  objectives:
    - disuguaglianza-di-clausius.1
    - disuguaglianza-di-clausius.2
    - disuguaglianza-di-clausius.3
    - disuguaglianza-di-clausius.4
    - disuguaglianza-di-clausius.5
    - disuguaglianza-di-clausius.6
    - disuguaglianza-di-clausius.7
  kind: concetto
  front:
    it: 'Casi limite: Disuguaglianza di Clausius'
    en: 'Limiting cases: Clausius'' inequality'
  back:
    it: >-
      Ciclo reversibile: uguaglianza. Due sole sorgenti: si riottiene il teorema di Carnot. Ciclo con un solo
      contatto termico (una sorgente): ∮δQ/T = Q/T₀ ≤ 0, cioè Q ≤ 0 — un ciclo monotermo può solo cedere
      calore (ri-ottengo Kelvin-Planck: coerenza perfetta).
    en: >-
      Reversible cycle: equality. Only two reservoirs: Carnot's theorem is recovered. Cycle with a single
      thermal contact (one reservoir): ∮δQ/T = Q/T₀ ≤ 0, i.e. Q ≤ 0 — a single-reservoir cycle can only
      release heat (Kelvin–Planck again: perfect consistency).
- id: disuguaglianza-di-clausius-errori
  topic: disuguaglianza-di-clausius
  objectives:
    - disuguaglianza-di-clausius.1
    - disuguaglianza-di-clausius.2
    - disuguaglianza-di-clausius.3
    - disuguaglianza-di-clausius.4
    - disuguaglianza-di-clausius.5
    - disuguaglianza-di-clausius.6
    - disuguaglianza-di-clausius.7
  kind: concetto
  front:
    it: 'Errori da evitare: Disuguaglianza di Clausius'
    en: 'Mistakes to avoid: Clausius'' inequality'
  back:
    it: |-
      - Usare la temperatura del sistema invece di quella della sorgente nei processi irreversibili.
      - Concludere che ∮δQ/T = 0 per ogni ciclo: solo per i reversibili.
      - Dimenticare i segni dei Qᵢ (assorbito positivo, ceduto negativo).
      - Non saper motivare il passaggio con le macchine ausiliarie (il cuore della dimostrazione).
    en: |-
      - Using the temperature of the system instead of that of the reservoir in irreversible processes.
      - Concluding that ∮δQ/T = 0 for every cycle: only for reversible ones.
      - Forgetting the signs of the Qᵢ (absorbed positive, released negative).
      - Not being able to justify the step with the auxiliary engines (the heart of the proof).
