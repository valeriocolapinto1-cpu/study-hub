    - oscillatore-massa-molla.4
    - oscillatore-massa-molla.5
    - oscillatore-massa-molla.6
    - oscillatore-massa-molla.7
  kind: concetto
  front:
    it: 'Ipotesi di validità: Oscillatore armonico massa-molla'
    en: 'Validity assumptions: Mass–spring harmonic oscillator'
  back:
    it: >-
      Molla ideale: massa trascurabile, perfettamente elastica, risposta lineare F = −kx (valida per piccole
      deformazioni). Nessun attrito né resistenza dell'aria. Corpo puntiforme.
    en: >-
      Ideal spring: negligible mass, perfectly elastic, linear response F = −kx (valid for small
      deformations). No friction or air drag. Point-like body.
- id: oscillatore-massa-molla-casi-limite
  topic: oscillatore-massa-molla
  objectives:
    - oscillatore-massa-molla.1
    - oscillatore-massa-molla.2
    - oscillatore-massa-molla.3
    - oscillatore-massa-molla.4
    - oscillatore-massa-molla.5
    - oscillatore-massa-molla.6
    - oscillatore-massa-molla.7
  kind: concetto
  front:
    it: 'Casi limite: Oscillatore armonico massa-molla'
    en: 'Limiting cases: Mass–spring harmonic oscillator'
  back:
    it: >-
      k → ∞ (molla rigidissima): T → 0, il corpo resta praticamente fermo. m → 0: T → 0. Grandi deformazioni:
      la legge di Hooke cede (termini non lineari) e l'isocronismo si perde. Con attrito si passa
      all'oscillatore smorzato.
    en: >-
      k → ∞ (very stiff spring): T → 0, the body practically stays still. m → 0: T → 0. Large deformations:
      Hooke's law breaks down (non-linear terms) and isochronism is lost. With friction we move on to the
      damped oscillator.
- id: oscillatore-massa-molla-errori
  topic: oscillatore-massa-molla
  objectives:
    - oscillatore-massa-molla.1
    - oscillatore-massa-molla.2
    - oscillatore-massa-molla.3
    - oscillatore-massa-molla.4
    - oscillatore-massa-molla.5
    - oscillatore-massa-molla.6
    - oscillatore-massa-molla.7
  kind: concetto
  front:
    it: 'Errori da evitare: Oscillatore armonico massa-molla'
    en: 'Mistakes to avoid: Mass–spring harmonic oscillator'
  back:
    it: >-
      - Scrivere ω = k/m invece di ω = √(k/m).

      - Nel sistema verticale, misurare x dalla lunghezza a riposo della molla e dimenticare il termine mg (o
      viceversa contarlo due volte).

      - Credere che la gravità cambi il periodo dell'oscillatore verticale: cambia solo la posizione di
      equilibrio.

      - Confondere l'energia totale ½kA² con la potenziale istantanea ½kx².
    en: >-
      - Writing ω = k/m instead of ω = √(k/m).

      - In the vertical system, measuring x from the rest length of the spring and forgetting the mg term (or
      counting it twice).

      - Believing that gravity changes the period of the vertical oscillator: it only changes the equilibrium
      position.

      - Confusing the total energy ½kA² with the instantaneous potential energy ½kx².
