- id: momento-angolare-casi-limite
  topic: momento-angolare
  objectives:
    - momento-angolare.1
    - momento-angolare.2
    - momento-angolare.3
    - momento-angolare.4
    - momento-angolare.5
    - momento-angolare.6
    - momento-angolare.7
  kind: concetto
  front:
    it: 'Casi limite: Momento di una forza e momento angolare'
    en: 'Limiting cases: Torque and angular momentum'
  back:
    it: >-
      Forza con retta d'azione passante per il polo: momento nullo anche se F ≠ 0. Moto rettilineo uniforme: L
      = mvb costante (b = distanza polo-retta), il momento angolare non richiede rotazione. Moto circolare col
      polo nel centro: L = mvr = mr²ω, tutto perpendicolare al piano.
    en: >-
      A force whose line of action passes through the pole: zero torque even if F ≠ 0. Uniform rectilinear
      motion: L = mvb constant (b = distance from pole to line), angular momentum does not require rotation.
      Circular motion with the pole at the centre: L = mvr = mr²ω, entirely perpendicular to the plane.
- id: momento-angolare-errori
  topic: momento-angolare
  objectives:
    - momento-angolare.1
    - momento-angolare.2
    - momento-angolare.3
    - momento-angolare.4
    - momento-angolare.5
    - momento-angolare.6
    - momento-angolare.7
  kind: concetto
  front:
    it: 'Errori da evitare: Momento di una forza e momento angolare'
    en: 'Mistakes to avoid: Torque and angular momentum'
  back:
    it: >-
      - Dimenticare che τ e L dipendono dal polo e confrontare momenti calcolati rispetto a poli diversi.

      - Calcolare τ = rF invece che rF sin θ (dimenticare il braccio).

      - Credere che L ≠ 0 implichi moto curvo: anche un moto rettilineo ha momento angolare rispetto a un polo
      esterno.

      - Sbagliare il verso col prodotto vettoriale: usare la regola della mano destra.
    en: >-
      - Forgetting that τ and L depend on the pole and comparing moments computed about different poles.

      - Computing τ = rF instead of rF sin θ (forgetting the lever arm).

      - Believing that L ≠ 0 implies curved motion: even rectilinear motion has angular momentum about an
      external pole.

      - Getting the direction of the cross product wrong: use the right-hand rule.
