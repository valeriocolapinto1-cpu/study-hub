  kind: orale
  front:
    it: 'Esponi all''orale: «Energia interna dei gas e principio di equipartizione».'
  back:
    it: >-
      All'equilibrio l'energia termica è perfettamente democratica: gli urti continui la redistribuiscono
      finché ogni 'modo quadratico' di immagazzinarla — muoversi lungo x, ruotare, vibrare — ne possiede in
      media la stessa quota ½k_BT. L'energia interna è il censimento di questi modi; e il fatto che dipenda
      solo da T (non da V) rispecchia l'assenza di legami tra molecole che non si parlano.


      **Scaletta:**


      - Enunciare il principio di equipartizione con precisione (termini quadratici)

      - Contare i gradi di libertà di mono e biatomici

      - Spiegare perché la rotazione assiale del biatomico non conta

      - Ricavare U = (f/2)nRT

      - Enunciare la legge di Joule e l'esperimento dell'espansione libera

      - Dedurre c_V = (f/2)R

      - Accennare al congelamento quantistico dei gradi di libertà
