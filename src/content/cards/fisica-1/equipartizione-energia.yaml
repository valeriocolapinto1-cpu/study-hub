  kind: concetto
  front:
    it: 'Casi limite: Energia interna dei gas e principio di equipartizione'
  back:
    it: >-
      Basse temperature: le rotazioni si 'congelano' e il biatomico si comporta da monoatomico (f→3). Alte
      temperature: si attiva la vibrazione (f→7). Questi gradini nei calori specifici sono inspiegabili
      classicamente: prima evidenza storica della quantizzazione.
