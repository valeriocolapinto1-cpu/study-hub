  kind: concetto
  front:
    it: 'Ipotesi di validità: Energia interna dei gas e principio di equipartizione'
    en: 'Validity assumptions: Internal energy of gases and the equipartition principle'
  back:
    it: >-
      Gas perfetto (niente interazioni intermolecolari); equilibrio termodinamico; validità della meccanica
      classica per i gradi di libertà considerati (fallisce quando i quanti di energia
      rotazionali/vibrazionali superano k_BT).
    en: >-
      Ideal gas (no intermolecular interactions); thermodynamic equilibrium; validity of classical mechanics
      for the degrees of freedom considered (it fails when rotational/vibrational energy quanta exceed k_BT).
- id: equipartizione-energia-casi-limite
  topic: equipartizione-energia
  objectives:
    - equipartizione-energia.1
    - equipartizione-energia.2
    - equipartizione-energia.3
    - equipartizione-energia.4
    - equipartizione-energia.5
    - equipartizione-energia.6
    - equipartizione-energia.7
  kind: concetto
  front:
    it: 'Casi limite: Energia interna dei gas e principio di equipartizione'
    en: 'Limiting cases: Internal energy of gases and the equipartition principle'
  back:
    it: >-
      Basse temperature: le rotazioni si 'congelano' e il biatomico si comporta da monoatomico (f→3). Alte
      temperature: si attiva la vibrazione (f→7). Questi gradini nei calori specifici sono inspiegabili
      classicamente: prima evidenza storica della quantizzazione.
    en: >-
      Low temperatures: rotations 'freeze' and the diatomic gas behaves as monatomic (f→3). High temperatures:
      vibration is activated (f→7). These steps in the specific heats cannot be explained classically: the
      first historical evidence of quantisation.
- id: equipartizione-energia-errori
  topic: equipartizione-energia
  objectives:
    - equipartizione-energia.1
    - equipartizione-energia.2
    - equipartizione-energia.3
    - equipartizione-energia.4
    - equipartizione-energia.5
    - equipartizione-energia.6
    - equipartizione-energia.7
  kind: concetto
  front:
    it: 'Errori da evitare: Energia interna dei gas e principio di equipartizione'
    en: 'Mistakes to avoid: Internal energy of gases and the equipartition principle'
  back:
    it: |-
      - Contare 3 rotazioni per il biatomico invece di 2.
      - Usare ΔU = nc_VΔT solo per le isocore: vale per ogni trasformazione del gas perfetto.
      - Includere un'energia potenziale intermolecolare nell'energia interna del gas perfetto.
      - Dimenticare che la vibrazione conta 2 mezzi-k_BT (termine cinetico + termine elastico).
    en: |-
      - Counting 3 rotations for the diatomic molecule instead of 2.
      - Using ΔU = nc_VΔT only for isochoric processes: it holds for every transformation of the ideal gas.
      - Including an intermolecular potential energy in the internal energy of the ideal gas.
      - Forgetting that vibration counts 2 halves of k_BT (kinetic term + elastic term).
