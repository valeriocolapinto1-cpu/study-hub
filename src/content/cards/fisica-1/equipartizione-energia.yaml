  back:
    it: >-
      Gas perfetto (niente interazioni intermolecolari); equilibrio termodinamico; validità della meccanica
      classica per i gradi di libertà considerati (fallisce quando i quanti di energia
      rotazionali/vibrazionali superano k_BT).
