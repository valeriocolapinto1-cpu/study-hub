    - forze-conservative.4
    - forze-conservative.5
    - forze-conservative.6
    - forze-conservative.7
  kind: concetto
  front:
    it: "Ipotesi di validità: Forze conservative, energia potenziale e conservazione dell'energia meccanica"
    en: 'Validity assumptions: Conservative forces, potential energy and conservation of mechanical energy'
  back:
    it: >-
      Forze dipendenti solo dalla posizione (non da velocità o tempo); dominio spaziale in cui l'integrale di
      linea è ben definito. Per la conservazione di E: nessuna forza non conservativa che compia lavoro.
    en: >-
      Forces depending only on position (not on velocity or time); a region of space where the line integral
      is well defined. For the conservation of E: no non-conservative force doing work.
- id: forze-conservative-casi-limite
  topic: forze-conservative
  objectives:
    - forze-conservative.1
    - forze-conservative.2
    - forze-conservative.3
    - forze-conservative.4
    - forze-conservative.5
    - forze-conservative.6
    - forze-conservative.7
  kind: concetto
  front:
    it: "Casi limite: Forze conservative, energia potenziale e conservazione dell'energia meccanica"
    en: 'Limiting cases: Conservative forces, potential energy and conservation of mechanical energy'
  back:
    it: >-
      Se una forza è perpendicolare al moto (normale, tensione) non lavora: E si conserva anche in sua
      presenza. Campo uniforme: U lineare in h. La costante additiva di U non ha effetti fisici: contano solo
      le differenze.
    en: >-
      If a force is perpendicular to the motion (normal force, tension) it does no work: E is conserved even
      in its presence. Uniform field: U linear in h. The additive constant in U has no physical effect: only
      differences matter.
- id: forze-conservative-errori
  topic: forze-conservative
  objectives:
    - forze-conservative.1
    - forze-conservative.2
    - forze-conservative.3
    - forze-conservative.4
    - forze-conservative.5
    - forze-conservative.6
    - forze-conservative.7
  kind: concetto
  front:
    it: "Errori da evitare: Forze conservative, energia potenziale e conservazione dell'energia meccanica"
    en: 'Mistakes to avoid: Conservative forces, potential energy and conservation of mechanical energy'
  back:
    it: >-
      - Dire che U 'appartiene al corpo': appartiene al sistema corpo + campo (o alla configurazione).

      - Sbagliare il segno: W_cons = −ΔU, non +ΔU.

      - Considerare conservativa la forza di attrito perché 'costante': il suo lavoro dipende dal cammino ed è
      sempre negativo.

      - Dimenticare di verificare che TUTTE le forze che lavorano siano conservative prima di usare E = cost.
    en: >-
      - Saying that U 'belongs to the body': it belongs to the body + field system (or to the configuration).

      - Getting the sign wrong: W_cons = −ΔU, not +ΔU.

      - Considering friction conservative because it is 'constant': its work depends on the path and is always
      negative.

      - Forgetting to check that ALL the forces doing work are conservative before using E = const.
