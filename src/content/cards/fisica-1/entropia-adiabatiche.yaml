  kind: concetto
  front:
    it: 'Ipotesi di validità: Entropia e trasformazioni adiabatiche'
    en: 'Validity assumptions: Entropy and adiabatic transformations'
  back:
    it: >-
      Esistenza di cammini reversibili tra gli stati (stati di equilibrio); T ben definita lungo il cammino
      reversibile usato per il calcolo; per la legge di aumento: sistema isolato o adiabatico.
    en: >-
      Existence of reversible paths between the states (equilibrium states); T well defined along the
      reversible path used for the calculation; for the law of increase: isolated or adiabatic system.
- id: entropia-adiabatiche-casi-limite
  topic: entropia-adiabatiche
  objectives:
    - entropia-adiabatiche.1
    - entropia-adiabatiche.2
    - entropia-adiabatiche.3
    - entropia-adiabatiche.4
    - entropia-adiabatiche.5
    - entropia-adiabatiche.6
    - entropia-adiabatiche.7
    - entropia-adiabatiche.8
  kind: concetto
  front:
    it: 'Casi limite: Entropia e trasformazioni adiabatiche'
    en: 'Limiting cases: Entropy and adiabatic transformations'
  back:
    it: >-
      Trasformazione reversibile adiabatica: ΔS = 0. Isoterma reversibile: ΔS = Q/T. Scambio di calore tra due
      corpi a temperature diverse: ΔS_univ = Q(1/T_F − 1/T_C) > 0, la quintessenza dell'irreversibilità. Ciclo
      qualsiasi: ΔS_sistema = 0 (funzione di stato) ma ΔS_univ ≥ 0.
    en: >-
      Reversible adiabatic transformation: ΔS = 0. Reversible isotherm: ΔS = Q/T. Heat exchange between two
      bodies at different temperatures: ΔS_univ = Q(1/T_F − 1/T_C) > 0, the quintessence of irreversibility.
      Any cycle: ΔS_system = 0 (state function) but ΔS_univ ≥ 0.
- id: entropia-adiabatiche-errori
  topic: entropia-adiabatiche
  objectives:
    - entropia-adiabatiche.1
    - entropia-adiabatiche.2
    - entropia-adiabatiche.3
    - entropia-adiabatiche.4
    - entropia-adiabatiche.5
    - entropia-adiabatiche.6
    - entropia-adiabatiche.7
    - entropia-adiabatiche.8
  kind: concetto
  front:
    it: 'Errori da evitare: Entropia e trasformazioni adiabatiche'
    en: 'Mistakes to avoid: Entropy and adiabatic transformations'
  back:
    it: >-
      - Calcolare ΔS integrando δQ/T lungo la trasformazione irreversibile reale: va usato un cammino
      reversibile ausiliario.

      - Credere che adiabatico implichi ΔS = 0: vale solo se anche reversibile (controesempio: espansione
      libera).

      - Dire che l'entropia di un sistema non può mai diminuire: può, se cede calore; è quella dell'universo a
      non diminuire.

      - Dimenticare che in un ciclo ΔS del sistema è nullo per definizione di funzione di stato.
    en: >-
      - Computing ΔS by integrating δQ/T along the real irreversible transformation: an auxiliary reversible
      path must be used.

      - Believing that adiabatic implies ΔS = 0: only if also reversible (counterexample: free expansion).

      - Saying that the entropy of a system can never decrease: it can, if it releases heat; it is the entropy
      of the universe that does not decrease.

      - Forgetting that over a cycle the ΔS of the system is zero by definition of state function.
