    - entropia-adiabatiche.7
    - entropia-adiabatiche.8
  kind: orale
  front:
    it: 'Esponi all''orale: «Entropia e trasformazioni adiabatiche».'
  back:
    it: >-
      L'entropia è il contachilometri dell'irreversibilità: registra quanta 'qualità' l'energia ha perso. Ogni
      processo reale lascia l'universo con più entropia di prima — non perché una forza lo imponga, ma perché
      gli stati disordinati sono astronomicamente più numerosi di quelli ordinati. L'adiabatica reversibile è
      il moto perfetto che non lascia traccia; l'espansione libera è la stessa assenza di scambi, ma con una
      traccia indelebile.


      **Scaletta:**


      - Dimostrare che δQ_rev/T è un differenziale esatto (da Clausius)

      - Definire ΔS e spiegare l'uso del cammino reversibile ausiliario

      - Ricavare ΔS ≥ ∫δQ/T per trasformazioni aperte

      - Enunciare la legge dell'aumento dell'entropia (sistema isolato / universo)

      - Ricavare la formula ΔS del gas perfetto

      - Distinguere adiabatico da isoentropico con l'espansione libera

      - Calcolare ΔS_univ per lo scambio termico tra due corpi

      - Accennare a S = k_B ln Ω
- id: entropia-adiabatiche-definizione
  topic: entropia-adiabatiche
  objectives:
    - entropia-adiabatiche.1
  kind: definizione
  front:
    it: 'Definizione: Entropia e trasformazioni adiabatiche'
  back:
    it: >-
      L'entropia è la funzione di stato definita da \(dS = \delta Q_{rev}/T\): la variazione tra due stati si
      calcola lungo una QUALSIASI trasformazione reversibile che li congiunge, \(\Delta S = \int_A^B \delta
      Q_{rev}/T\). Per una trasformazione qualunque vale \(\Delta S \ge \int_A^B \delta Q/T\) (uguaglianza se
      reversibile). In un sistema isolato (in particolare adiabatico: δQ = 0) l'entropia non può diminuire:
      \(\Delta S \ge 0\) — legge dell'aumento dell'entropia.
- id: entropia-adiabatiche-formule
  topic: entropia-adiabatiche
