    - entropia-adiabatiche.7
    - entropia-adiabatiche.8
  kind: formula
  front:
    it: Le formule chiave di «Entropia e trasformazioni adiabatiche»
  back:
    it: |-
      - \(dS = \frac{\delta Q_{rev}}{T}\)
      - \(\Delta S \ge \int \frac{\delta Q}{T}\)
      - \(\Delta S_{isolato} \ge 0\)
      - \(\Delta S = nc_V\ln\frac{T_B}{T_A} + nR\ln\frac{V_B}{V_A}\)
      - \(S = k_B\ln\Omega\)
