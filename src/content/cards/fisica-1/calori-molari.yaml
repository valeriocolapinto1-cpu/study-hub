    - calori-molari.7
  kind: orale
  front:
    it: "Esponi all'orale: «Calori molari dei gas ideali e dei solidi ideali»."
    en: 'Present at the oral exam: “Molar heat capacities of ideal gases and ideal solids”.'
  back:
    it: >-
      Scaldare a volume costante è 'versare' energia solo nel serbatoio interno; scaldare a pressione costante
      costringe anche a pagare il pedaggio del lavoro di espansione, sempre pari a R per mole e per grado:
      ecco Mayer. Nei solidi ogni atomo, molla tra molle, ha sei tasche da ½k_BT: per questo materiali
      diversissimi condividono lo stesso calore molare 3R.


      **Scaletta:**


      - Definire il calore molare e spiegare perché dipende dalla trasformazione

      - Ricavare c_V = (f/2)R dal primo principio a V costante

      - Dimostrare la relazione di Mayer c_p = c_V + R

      - Interpretare fisicamente la differenza c_p − c_V

      - Dare i valori per mono/biatomici e definire γ = 1 + 2/f

      - Ricavare Dulong-Petit contando i termini quadratici

      - Accennare ai limiti quantistici (basse temperature)
    en: >-
      Heating at constant volume 'pours' energy only into the internal tank; heating at constant pressure also
      forces you to pay the toll of expansion work, always equal to R per mole per degree: that is Mayer. In
      solids every atom, a spring among springs, has six pockets of ½k_BT: that is why very different
      materials share the same molar heat capacity 3R.


      **Outline:**


      - Define the molar heat capacity and explain why it depends on the transformation

      - Derive c_V = (f/2)R from the first law at constant V

      - Prove Mayer's relation c_p = c_V + R

      - Interpret physically the difference c_p − c_V

      - Give the values for monatomic/diatomic gases and define γ = 1 + 2/f

      - Derive Dulong–Petit by counting quadratic terms

      - Mention the quantum limits (low temperatures)
- id: calori-molari-orale-1
  topic: calori-molari
  objectives:
    - calori-molari.6
    - calori-molari.7
  kind: orale
  front:
    it: Perché γ compare nell'equazione delle adiabatiche e nella velocità del suono?
    en: Why does γ appear in the adiabatic equation and in the speed of sound?
  back:
    it: >-
      In un'adiabatica il lavoro è pagato dall'energia interna (\(nc_VdT = -p\,dV\)) e la combinazione con pV
      = nRT dà \(pV^\gamma = \text{cost}\): γ dice quanto più rapidamente cala la pressione rispetto
      all'isoterma. Il suono è una sequenza di compressioni e rarefazioni troppo rapide per scambiare calore,
      quindi adiabatiche: la comprimibilità è \(1/(\gamma p)\) e la velocità \(v = \sqrt{\gamma p/\rho} =
      \sqrt{\gamma RT/M}\) (Laplace corresse così il valore isotermo di Newton).
    en: >-
      In an adiabatic process the work is paid for by internal energy (\(nc_VdT = -p\,dV\)) and combining with
      pV = nRT gives \(pV^\gamma = \text{const}\): γ tells how much faster pressure drops compared with the
      isotherm. Sound is a sequence of compressions and rarefactions too fast to exchange heat, hence
      adiabatic: the compressibility is \(1/(\gamma p)\) and the speed is \(v = \sqrt{\gamma p/\rho} =
      \sqrt{\gamma RT/M}\) (Laplace corrected Newton's isothermal value this way).
- id: calori-molari-orale-2
  topic: calori-molari
  objectives:
    - calori-molari.6
    - calori-molari.7
  kind: orale
  front:
    it: È possibile una trasformazione con calore molare negativo?
    en: Is a transformation with negative molar heat capacity possible?
  back:
    it: >-
      Sì. Per una politropica \(pV^k = \text{cost}\) il calore molare è \(c = c_V - R/(k-1)\), negativo per
      \(1 < k < \gamma\): il gas compie più lavoro di quanto calore riceva, quindi si raffredda pur assorbendo
      calore (o si scalda cedendolo). Non c'è contraddizione: il calore molare dipende dalla trasformazione,
      non è una "capacità" fissa.
    en: >-
      Yes. For a polytropic \(pV^k = \text{const}\) the molar heat capacity is \(c = c_V - R/(k-1)\), negative
      for \(1 < k < \gamma\): the gas does more work than the heat it receives, so it cools while absorbing
      heat (or warms while releasing it). There is no contradiction: the molar heat capacity depends on the
      transformation, it is not a fixed "capacity".
- id: calori-molari-orale-3
  topic: calori-molari
  objectives:
    - calori-molari.6
    - calori-molari.7
  kind: orale
  front:
    it: Cosa misura il crollo di c dei solidi a bassa temperatura?
    en: What does the collapse of c for solids at low temperature measure?
  back:
    it: >-
      Misura il congelamento quantistico delle vibrazioni del reticolo: quando \(k_BT\) diventa minore del
      quanto di energia vibrazionale \(\hbar\omega\), i modi non sono più eccitati e non assorbono ½k_BT
      ciascuno. Einstein (un'unica frequenza) spiegò il calo, Debye (spettro di frequenze dei fononi) la legge
      \(c \propto T^3\). È una delle prime prove della quantizzazione dell'energia.
    en: >-
      It measures the quantum freezing of lattice vibrations: when \(k_BT\) becomes smaller than the
      vibrational energy quantum \(\hbar\omega\), the modes are no longer excited and do not absorb ½k_BT
      each. Einstein (a single frequency) explained the drop, Debye (a spectrum of phonon frequencies) the law
      \(c \propto T^3\). It is one of the first proofs of energy quantisation.
- id: calori-molari-definizione
  topic: calori-molari
  objectives:
    - calori-molari.1
  kind: definizione
  front:
    it: 'Definizione: Calori molari dei gas ideali e dei solidi ideali'
    en: 'Definition: Molar heat capacities of ideal gases and ideal solids'
  back:
    it: >-
      Il calore molare è il calore necessario per innalzare di 1 K la temperatura di una mole: \(c =
      \frac{1}{n}\frac{\delta Q}{dT}\). Dipende dalla trasformazione: a volume costante c_V, a pressione
      costante c_p. Per i gas perfetti vale la relazione di Mayer \(c_p = c_V + R\) e si definisce \(\gamma =
      c_p/c_V\). Per i solidi cristallini la legge di Dulong-Petit prevede c ≈ 3R, indipendente dal materiale.
    en: >-
      The molar heat capacity is the heat needed to raise the temperature of one mole by 1 K: \(c =
      \frac{1}{n}\frac{\delta Q}{dT}\). It depends on the transformation: at constant volume c_V, at constant
      pressure c_p. For ideal gases Mayer's relation \(c_p = c_V + R\) holds and one defines \(\gamma =
      c_p/c_V\). For crystalline solids the Dulong–Petit law predicts c ≈ 3R, independent of the material.
