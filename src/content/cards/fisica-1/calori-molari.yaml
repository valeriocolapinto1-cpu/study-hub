  kind: formula
  front:
    it: Le formule chiave di «Calori molari dei gas ideali e dei solidi ideali»
    en: The key formulas of “Molar heat capacities of ideal gases and ideal solids”
  back:
    it: |-
      - \(c_V = \frac{f}{2}R\)
      - \(c_p = c_V + R\)
      - \(\gamma = \frac{c_p}{c_V} = 1 + \frac{2}{f}\)
      - \(c_{solido} \approx 3R\)
    en: |-
      - \(c_V = \frac{f}{2}R\)
      - \(c_p = c_V + R\)
      - \(\gamma = \frac{c_p}{c_V} = 1 + \frac{2}{f}\)
      - \(c_{solido} \approx 3R\)
