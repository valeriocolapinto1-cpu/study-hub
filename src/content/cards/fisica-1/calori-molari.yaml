    - calori-molari.7
  kind: concetto
  front:
    it: 'Ipotesi di validità: Calori molari dei gas ideali e dei solidi ideali'
    en: 'Validity assumptions: Molar heat capacities of ideal gases and ideal solids'
  back:
    it: >-
      Gas perfetto in equilibrio; trasformazioni quasi-statiche; gradi di libertà classicamente attivi. Per
      Dulong-Petit: solido cristallino armonico a temperatura abbastanza alta (T sopra la temperatura di
      Debye).
    en: >-
      Ideal gas at equilibrium; quasi-static transformations; degrees of freedom classically active. For
      Dulong–Petit: harmonic crystalline solid at high enough temperature (T above the Debye temperature).
- id: calori-molari-casi-limite
  topic: calori-molari
  objectives:
