    - calori-molari.7
  kind: concetto
  front:
    it: 'Casi limite: Calori molari dei gas ideali e dei solidi ideali'
    en: 'Limiting cases: Molar heat capacities of ideal gases and ideal solids'
  back:
    it: >-
      Per i solidi a bassa T: c → 0 come T³ (Debye), Dulong-Petit fallisce. Per i gas a T crescente: c_V sale
      a gradini con l'attivazione di rotazioni e vibrazioni. Nei liquidi non esiste una teoria altrettanto
      semplice.
    en: >-
      For solids at low T: c → 0 as T³ (Debye), Dulong–Petit fails. For gases at increasing T: c_V rises in
      steps as rotations and vibrations switch on. For liquids there is no equally simple theory.
- id: calori-molari-errori
  topic: calori-molari
  objectives:
    - calori-molari.1
    - calori-molari.2
    - calori-molari.3
    - calori-molari.4
    - calori-molari.5
    - calori-molari.6
    - calori-molari.7
  kind: concetto
  front:
    it: 'Errori da evitare: Calori molari dei gas ideali e dei solidi ideali'
    en: 'Mistakes to avoid: Molar heat capacities of ideal gases and ideal solids'
  back:
    it: >-
      - Dire che il calore molare è una proprietà unica del gas: dipende dalla trasformazione (c_V ≠ c_p, e
      ogni politropica ha il suo).

      - Usare c_p in ΔU = nc ΔT: l'energia interna va sempre con c_V.

      - Dimenticare che la relazione di Mayer vale solo per i gas perfetti.

      - Contare 3 gradi di libertà per l'atomo del solido invece di 6 (manca il potenziale elastico).
    en: >-
      - Saying that the molar heat capacity is a single property of the gas: it depends on the transformation
      (c_V ≠ c_p, and every polytropic has its own).

      - Using c_p in ΔU = nc ΔT: internal energy always goes with c_V.

      - Forgetting that Mayer's relation holds only for ideal gases.

      - Counting 3 degrees of freedom for the atom of a solid instead of 6 (the elastic potential is missing).
