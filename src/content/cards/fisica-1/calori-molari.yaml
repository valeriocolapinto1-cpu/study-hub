- id: calori-molari-definizione
  topic: calori-molari
  objectives:
    - calori-molari.1
  kind: definizione
  front:
    it: 'Definizione: Calori molari dei gas ideali e dei solidi ideali'
  back:
    it: >-
      Il calore molare è il calore necessario per innalzare di 1 K la temperatura di una mole: \(c =
      \frac{1}{n}\frac{\delta Q}{dT}\). Dipende dalla trasformazione: a volume costante c_V, a pressione
      costante c_p. Per i gas perfetti vale la relazione di Mayer \(c_p = c_V + R\) e si definisce \(\gamma =
      c_p/c_V\). Per i solidi cristallini la legge di Dulong-Petit prevede c ≈ 3R, indipendente dal materiale.
- id: calori-molari-formule
  topic: calori-molari
  objectives:
    - calori-molari.1
    - calori-molari.2
    - calori-molari.3
    - calori-molari.4
    - calori-molari.5
    - calori-molari.6
    - calori-molari.7
  kind: formula
  front:
    it: Le formule chiave di «Calori molari dei gas ideali e dei solidi ideali»
  back:
    it: |-
      - \(c_V = \frac{f}{2}R\)
      - \(c_p = c_V + R\)
      - \(\gamma = \frac{c_p}{c_V} = 1 + \frac{2}{f}\)
      - \(c_{solido} \approx 3R\)
