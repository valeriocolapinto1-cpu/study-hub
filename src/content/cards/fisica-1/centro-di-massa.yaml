    - centro-di-massa.7
  kind: concetto
  front:
    it: 'Ipotesi di validità: Centro di massa e prima equazione cardinale'
    en: 'Validity assumptions: Centre of mass and the first cardinal equation'
  back:
    it: >-
      Validità della terza legge di Newton per le forze interne; masse costanti; sistema di riferimento
      inerziale. Non serve alcuna ipotesi di rigidità: vale per qualsiasi sistema.
    en: >-
      Validity of Newton's third law for internal forces; constant masses; inertial reference frame. No
      rigidity assumption is needed: it holds for any system.
- id: centro-di-massa-casi-limite
  topic: centro-di-massa
  objectives:
    - centro-di-massa.1
    - centro-di-massa.2
    - centro-di-massa.3
    - centro-di-massa.4
    - centro-di-massa.5
    - centro-di-massa.6
    - centro-di-massa.7
  kind: concetto
  front:
    it: 'Casi limite: Centro di massa e prima equazione cardinale'
    en: 'Limiting cases: Centre of mass and the first cardinal equation'
  back:
    it: >-
      Sistema isolato: P costante (base per lo studio degli urti). Proiettile che esplode in volo: i frammenti
      si disperdono ma il loro CM continua sulla parabola originaria. Corpo rigido: r_cm coincide col centro
      geometrico se la densità è uniforme e c'è simmetria.
    en: >-
      Isolated system: P constant (the basis for studying collisions). A projectile exploding in flight: the
      fragments scatter but their CM continues along the original parabola. Rigid body: r_cm coincides with
      the geometric centre if density is uniform and there is symmetry.
- id: centro-di-massa-errori
  topic: centro-di-massa
  objectives:
    - centro-di-massa.1
    - centro-di-massa.2
    - centro-di-massa.3
    - centro-di-massa.4
    - centro-di-massa.5
    - centro-di-massa.6
    - centro-di-massa.7
  kind: concetto
  front:
    it: 'Errori da evitare: Centro di massa e prima equazione cardinale'
    en: 'Mistakes to avoid: Centre of mass and the first cardinal equation'
  back:
    it: >-
      - Includere le forze interne nella prima cardinale: contano solo le esterne.

      - Credere che il CM debba trovarsi dentro il corpo (controesempio: anello, boomerang).

      - Confondere v_cm con la velocità di un punto specifico del corpo.

      - Usare la conservazione di P quando la risultante esterna non è nulla (es. durante un urto con vincoli
      esterni impulsivi).
    en: >-
      - Including internal forces in the first cardinal equation: only external ones count.

      - Believing that the CM must lie inside the body (counterexamples: ring, boomerang).

      - Confusing v_cm with the velocity of a specific point of the body.

      - Using conservation of P when the external resultant is not zero (e.g. during a collision with
      impulsive external constraints).
