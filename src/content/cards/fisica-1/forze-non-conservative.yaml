    - forze-non-conservative.3
    - forze-non-conservative.4
    - forze-non-conservative.5
    - forze-non-conservative.6
  kind: concetto
  front:
    it: 'Ipotesi di validità: Energia meccanica in presenza di forze non conservative'
    en: 'Validity assumptions: Mechanical energy in the presence of non-conservative forces'
  back:
    it: >-
      Sistema in cui le forze sono classificabili in conservative e non; per l'attrito radente, modello di
      Coulomb F = μ_d N con μ_d costante; N nota lungo il cammino.
    en: >-
      A system in which forces can be classified as conservative or not; for sliding friction, Coulomb's model
      F = μ_d N with constant μ_d; N known along the path.
- id: forze-non-conservative-casi-limite
  topic: forze-non-conservative
  objectives:
    - forze-non-conservative.1
    - forze-non-conservative.2
    - forze-non-conservative.3
    - forze-non-conservative.4
    - forze-non-conservative.5
    - forze-non-conservative.6
  kind: concetto
  front:
    it: 'Casi limite: Energia meccanica in presenza di forze non conservative'
    en: 'Limiting cases: Mechanical energy in the presence of non-conservative forces'
  back:
    it: >-
      W_nc = 0: conservazione esatta di E. Moto a regime (velocità costante) con attrito: la forza motrice
      compensa esattamente la dissipazione, ΔK = 0 e W_motrice = −W_attrito. Tempo lungo con sola
      dissipazione: E decresce monotonicamente fino al minimo di U accessibile.
    en: >-
      W_nc = 0: exact conservation of E. Steady motion (constant speed) with friction: the driving force
      exactly compensates the dissipation, ΔK = 0 and W_driving = −W_friction. Long times with dissipation
      only: E decreases monotonically down to the lowest accessible minimum of U.
- id: forze-non-conservative-errori
  topic: forze-non-conservative
  objectives:
    - forze-non-conservative.1
    - forze-non-conservative.2
    - forze-non-conservative.3
    - forze-non-conservative.4
    - forze-non-conservative.5
    - forze-non-conservative.6
  kind: concetto
  front:
    it: 'Errori da evitare: Energia meccanica in presenza di forze non conservative'
    en: 'Mistakes to avoid: Mechanical energy in the presence of non-conservative forces'
  back:
    it: >-
      - Usare E = cost in presenza di attrito che lavora.

      - Nel lavoro dell'attrito usare lo spostamento netto invece della lunghezza del cammino percorso.

      - Dimenticare il segno: il lavoro dell'attrito radente sul corpo che striscia è sempre negativo (opposto
      al moto relativo).

      - Dire che l'energia 'si perde': si trasforma in energia interna, il bilancio complessivo torna.
    en: >-
      - Using E = const in the presence of friction doing work.

      - In the work of friction, using the net displacement instead of the length of the path travelled.

      - Forgetting the sign: the work of sliding friction on the sliding body is always negative (opposite to
      the relative motion).

      - Saying that energy 'is lost': it is transformed into internal energy, the overall balance adds up.
