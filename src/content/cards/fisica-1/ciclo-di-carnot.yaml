- id: ciclo-di-carnot-definizione
  topic: ciclo-di-carnot
  objectives:
    - ciclo-di-carnot.1
  kind: definizione
  front:
    it: 'Definizione: Ciclo di Carnot'
  back:
    it: >-
      Il ciclo di Carnot è il ciclo reversibile compiuto tra DUE sole sorgenti termiche (T_C calda e T_F
      fredda), composto da quattro trasformazioni quasi-statiche: espansione isoterma a T_C, espansione
      adiabatica da T_C a T_F, compressione isoterma a T_F, compressione adiabatica di ritorno a T_C. Per un
      gas perfetto il suo rendimento vale \(\eta_{Carnot} = 1 - T_F/T_C\): dipende solo dalle temperature
      delle sorgenti.
- id: ciclo-di-carnot-formule
  topic: ciclo-di-carnot
  objectives:
    - ciclo-di-carnot.1
    - ciclo-di-carnot.2
    - ciclo-di-carnot.3
    - ciclo-di-carnot.4
    - ciclo-di-carnot.5
    - ciclo-di-carnot.6
    - ciclo-di-carnot.7
  kind: formula
  front:
    it: Le formule chiave di «Ciclo di Carnot»
  back:
    it: |-
      - \(Q_C = nRT_C\ln\frac{V_2}{V_1}\)
      - \(\frac{V_2}{V_1} = \frac{V_3}{V_4}\)
      - \(\eta_{Carnot} = 1 - \frac{T_F}{T_C}\)
      - \(\frac{Q_C}{T_C} = \frac{|Q_F|}{T_F}\)
