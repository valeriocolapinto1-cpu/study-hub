    - ciclo-di-carnot.7
  kind: orale
  front:
    it: 'Esponi all''orale: «Ciclo di Carnot».'
  back:
    it: >-
      Carnot progetta la macchina 'perfetta' eliminando ogni spreco: mai un contatto termico con salto finito
      di temperatura (per questo il calore si scambia solo lungo isoterme) e mai attriti. Anche così, una
      parte del calore DEVE essere scaricata alla sorgente fredda: è il prezzo minimo, dettato dal rapporto
      delle temperature, che nessuna ingegneria può eliminare.


      **Scaletta:**


      - Disegnare il ciclo nel piano p-V (e sapere com'è nel piano T-S)

      - Descrivere le quattro trasformazioni con i segni di Q e W

      - Calcolare Q_C e Q_F sulle isoterme

      - Dimostrare V₂/V₁ = V₃/V₄ con le adiabatiche

      - Ricavare η = 1 − T_F/T_C

      - Osservare che Q_C/T_C = |Q_F|/T_F

      - Discutere i casi limite e il ciclo invertito
