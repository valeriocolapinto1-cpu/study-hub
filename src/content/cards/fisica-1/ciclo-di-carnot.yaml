  kind: concetto
  front:
    it: 'Ipotesi di validità: Ciclo di Carnot'
    en: 'Validity assumptions: Carnot cycle'
  back:
    it: >-
      Tutte le trasformazioni reversibili (quasi-statiche, senza attriti, scambi termici a differenza di
      temperatura infinitesima); due sole sorgenti ideali; per il calcolo esplicito, gas perfetto come fluido
      di lavoro (ma il risultato è universale per il teorema di Carnot).
    en: >-
      All transformations reversible (quasi-static, frictionless, heat exchanges across infinitesimal
      temperature differences); only two ideal reservoirs; for the explicit calculation, an ideal gas as
      working fluid (but the result is universal by Carnot's theorem).
- id: ciclo-di-carnot-casi-limite
  topic: ciclo-di-carnot
  objectives:
    - ciclo-di-carnot.1
    - ciclo-di-carnot.2
    - ciclo-di-carnot.3
    - ciclo-di-carnot.4
    - ciclo-di-carnot.5
    - ciclo-di-carnot.6
    - ciclo-di-carnot.7
  kind: concetto
  front:
    it: 'Casi limite: Ciclo di Carnot'
    en: 'Limiting cases: Carnot cycle'
  back:
    it: >-
      T_F → T_C: η → 0, senza dislivello termico niente lavoro. T_F → 0: η → 1, ma lo zero assoluto è
      irraggiungibile (terzo principio). Ciclo invertito: frigorifero di Carnot con COP = T_F/(T_C − T_F), il
      massimo possibile.
    en: >-
      T_F → T_C: η → 0, no temperature difference, no work. T_F → 0: η → 1, but absolute zero is unreachable
      (third law). Reversed cycle: Carnot refrigerator with COP = T_F/(T_C − T_F), the maximum possible.
- id: ciclo-di-carnot-errori
  topic: ciclo-di-carnot
  objectives:
    - ciclo-di-carnot.1
    - ciclo-di-carnot.2
    - ciclo-di-carnot.3
    - ciclo-di-carnot.4
    - ciclo-di-carnot.5
    - ciclo-di-carnot.6
    - ciclo-di-carnot.7
  kind: concetto
  front:
    it: 'Errori da evitare: Ciclo di Carnot'
    en: 'Mistakes to avoid: Carnot cycle'
  back:
    it: |-
      - Usare le temperature in gradi Celsius nel rendimento.
      - Dire che il rendimento dipende dal gas o dalle dimensioni del ciclo: solo dalle temperature.
      - Dimenticare la dimostrazione del vincolo V₂/V₁ = V₃/V₄ (l'esaminatore la chiede).
      - Confondere il lavoro dei singoli tratti con il lavoro netto del ciclo (area racchiusa nel piano p-V).
    en: >-
      - Using temperatures in degrees Celsius in the efficiency.

      - Saying that the efficiency depends on the gas or on the size of the cycle: only on the temperatures.

      - Forgetting the proof of the constraint V₂/V₁ = V₃/V₄ (the examiner asks for it).

      - Confusing the work of the single branches with the net work of the cycle (area enclosed in the p-V
      plane).
