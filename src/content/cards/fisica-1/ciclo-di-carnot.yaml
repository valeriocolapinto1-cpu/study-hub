    - ciclo-di-carnot.4
    - ciclo-di-carnot.5
    - ciclo-di-carnot.6
    - ciclo-di-carnot.7
  kind: concetto
  front:
    it: 'Casi limite: Ciclo di Carnot'
  back:
    it: >-
      T_F → T_C: η → 0, senza dislivello termico niente lavoro. T_F → 0: η → 1, ma lo zero assoluto è
      irraggiungibile (terzo principio). Ciclo invertito: frigorifero di Carnot con COP = T_F/(T_C − T_F), il
      massimo possibile.
