  kind: concetto
  front:
    it: 'Ipotesi di validità: Ciclo di Carnot'
  back:
    it: >-
      Tutte le trasformazioni reversibili (quasi-statiche, senza attriti, scambi termici a differenza di
      temperatura infinitesima); due sole sorgenti ideali; per il calcolo esplicito, gas perfetto come fluido
      di lavoro (ma il risultato è universale per il teorema di Carnot).
- id: ciclo-di-carnot-casi-limite
  topic: ciclo-di-carnot
  objectives:
    - ciclo-di-carnot.1
    - ciclo-di-carnot.2
