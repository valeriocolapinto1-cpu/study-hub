- id: moto-corpo-rigido-esposizione
  topic: moto-corpo-rigido
  objectives:
    - moto-corpo-rigido.1
    - moto-corpo-rigido.2
    - moto-corpo-rigido.3
    - moto-corpo-rigido.4
    - moto-corpo-rigido.5
    - moto-corpo-rigido.6
    - moto-corpo-rigido.7
  kind: orale
  front:
    it: "Esponi all'orale: «Moto di un corpo rigido»."
    en: 'Present at the oral exam: “Motion of a rigid body”.'
  back:
    it: >-
      Il vincolo di rigidità riduce un numero enorme di gradi di libertà a soli 6: dire dove sta il CM e come
      il corpo è orientato basta a conoscere la posizione di ogni suo punto. Il moto si legge sempre come 'il
      CM trasla + il corpo gira attorno al CM', e ciascuna delle due parti obbedisce alla propria equazione
      cardinale.


      **Scaletta:**


      - Definire il corpo rigido e contarne i gradi di libertà

      - Scrivere la formula fondamentale v_P = v_Q + ω×(r_P−r_Q)

      - Impostare le due equazioni cardinali per il moto rototraslatorio

      - Ricavare Iα = τ per l'asse fisso e l'analogia con F = ma

      - Scrivere le leggi orarie rotazionali per α costante

      - Spiegare il centro di istantanea rotazione

      - Scrivere lavoro e potenza rotazionali
    en: >-
      The rigidity constraint reduces an enormous number of degrees of freedom to just 6: knowing where the CM
      is and how the body is oriented is enough to know the position of every point. The motion can always be
      read as 'the CM translates + the body spins about the CM', and each of the two parts obeys its own
      cardinal equation.


      **Outline:**


      - Define a rigid body and count its degrees of freedom

      - Write the fundamental formula v_P = v_Q + ω×(r_P−r_Q)

      - Set up the two cardinal equations for roto-translational motion

      - Derive Iα = τ for the fixed axis and the analogy with F = ma

      - Write the rotational equations of motion for constant α

      - Explain the instantaneous centre of rotation

      - Write rotational work and power
- id: moto-corpo-rigido-orale-1
  topic: moto-corpo-rigido
  objectives:
    - moto-corpo-rigido.6
    - moto-corpo-rigido.7
  kind: orale
  front:
    it: Perché per un corpo rigido il lavoro delle forze interne è nullo?
    en: Why is the work of internal forces zero for a rigid body?
  back:
    it: >-
      Le forze interne vengono a coppie opposte \(\vec f_{ij} = -\vec f_{ji}\) lungo la congiungente. Il
      lavoro di una coppia è \(\vec f_{ij}\cdot(d\vec r_i - d\vec r_j)\) e per un rigido lo spostamento
      relativo è una rotazione, perpendicolare alla congiungente (perché \(|\vec r_i - \vec r_j|\) è
      costante): il prodotto scalare è nullo. Quindi in un rigido conta solo il lavoro delle forze esterne.
    en: >-
      Internal forces come in opposite pairs \(\vec f_{ij} = -\vec f_{ji}\) along the line joining the points.
      The work of a pair is \(\vec f_{ij}\cdot(d\vec r_i - d\vec r_j)\) and for a rigid body the relative
      displacement is a rotation, perpendicular to that line (because \(|\vec r_i - \vec r_j|\) is constant):
      the dot product vanishes. So in a rigid body only the work of external forces counts.
- id: moto-corpo-rigido-orale-2
  topic: moto-corpo-rigido
  objectives:
    - moto-corpo-rigido.6
    - moto-corpo-rigido.7
  kind: orale
  front:
    it: Come trovi graficamente il centro di istantanea rotazione conoscendo le velocità di due punti?
    en: How do you find the instantaneous centre of rotation graphically, knowing the velocities of two points?
  back:
    it: >-
      Ogni velocità è perpendicolare al segmento che congiunge il punto con il centro di istantanea rotazione
      C. Si tracciano quindi, dai due punti, le rette perpendicolari alle rispettive velocità: C è la loro
      intersezione. Se le velocità sono parallele e perpendicolari alla congiungente, C sta sulla
      congiungente, dove si incontrano le rette che uniscono le punte dei vettori; se sono uguali, C è
      all'infinito (traslazione pura).
    en: >-
      Every velocity is perpendicular to the segment joining the point to the instantaneous centre of rotation
      C. So, from the two points, draw the lines perpendicular to their velocities: C is their intersection.
      If the velocities are parallel and perpendicular to the joining line, C lies on that line, where the
      line through the tips of the vectors meets it; if they are equal, C is at infinity (pure translation).
- id: moto-corpo-rigido-orale-3
  topic: moto-corpo-rigido
  objectives:
    - moto-corpo-rigido.6
    - moto-corpo-rigido.7
  kind: orale
  front:
    it: Cosa succede se si applica una forza il cui momento rispetto al CM è nullo?
    en: What happens if you apply a force whose torque about the CM is zero?
  back:
    it: >-
      La prima cardinale dà \(\vec a_{cm} = \vec F/M\); la seconda, con polo nel CM, dà \(d\vec L_{cm}/dt =
      0\): se il corpo era fermo non inizia a ruotare. Il risultato è una traslazione accelerata pura, come
      per una forza applicata esattamente in linea con il baricentro (es. il peso in caduta libera).
    en: >-
      The first cardinal equation gives \(\vec a_{cm} = \vec F/M\); the second, with the pole at the CM, gives
      \(d\vec L_{cm}/dt = 0\): if the body was at rest it does not start rotating. The result is a pure
      accelerated translation, as for a force applied exactly in line with the centre of mass (e.g. weight in
      free fall).
- id: moto-corpo-rigido-definizione
  topic: moto-corpo-rigido
  objectives:
    - moto-corpo-rigido.1
  kind: definizione
  front:
    it: 'Definizione: Moto di un corpo rigido'
    en: 'Definition: Motion of a rigid body'
  back:
    it: >-
      Un corpo rigido è un sistema di punti le cui distanze mutue restano costanti. Il suo moto più generale è
      la composizione di una traslazione (descritta dal moto del CM) e di una rotazione attorno a un asse
      passante per il CM: servono 6 coordinate (3 + 3). Il campo delle velocità è \(\vec{v}_P = \vec{v}_{cm} +
      \vec{\omega}\times\vec{r}_{P}\), con r_P posizione di P rispetto al CM. Il moto è governato dalle due
      equazioni cardinali.
    en: >-
      A rigid body is a system of points whose mutual distances stay constant. Its most general motion is the
      composition of a translation (described by the motion of the CM) and a rotation about an axis through
      the CM: 6 coordinates are needed (3 + 3). The velocity field is \(\vec{v}_P = \vec{v}_{cm} +
      \vec{\omega}\times\vec{r}_{P}\), with r_P the position of P relative to the CM. The motion is governed
      by the two cardinal equations.
- id: moto-corpo-rigido-formule
  topic: moto-corpo-rigido
  objectives:
    - moto-corpo-rigido.1
    - moto-corpo-rigido.2
    - moto-corpo-rigido.3
    - moto-corpo-rigido.4
    - moto-corpo-rigido.5
    - moto-corpo-rigido.6
    - moto-corpo-rigido.7
  kind: formula
  front:
    it: Le formule chiave di «Moto di un corpo rigido»
    en: The key formulas of “Motion of a rigid body”
  back:
    it: |-
      - \(\vec{v}_P = \vec{v}_{cm} + \vec{\omega}\times\vec{r}_P\)
      - \(\vec{F}^{ext} = M\vec{a}_{cm},\;\; \vec{\tau}_{cm} = \frac{d\vec{L}_{cm}}{dt}\)
      - \(I\alpha = \tau_z\)
      - \(P = \tau\omega\)
    en: |-
      - \(\vec{v}_P = \vec{v}_{cm} + \vec{\omega}\times\vec{r}_P\)
      - \(\vec{F}^{ext} = M\vec{a}_{cm},\;\; \vec{\tau}_{cm} = \frac{d\vec{L}_{cm}}{dt}\)
      - \(I\alpha = \tau_z\)
      - \(P = \tau\omega\)
