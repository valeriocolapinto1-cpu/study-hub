- id: moto-corpo-rigido-casi-limite
  topic: moto-corpo-rigido
  objectives:
    - moto-corpo-rigido.1
    - moto-corpo-rigido.2
    - moto-corpo-rigido.3
    - moto-corpo-rigido.4
    - moto-corpo-rigido.5
    - moto-corpo-rigido.6
    - moto-corpo-rigido.7
  kind: concetto
  front:
    it: 'Casi limite: Moto di un corpo rigido'
  back:
    it: >-
      Pura traslazione: ω = 0, tutti i punti hanno la stessa velocità. Pura rotazione attorno ad asse fisso:
      v_cm dell'asse nulla. Rotolamento: combinazione con vincolo v_cm = ωR. Corpo libero nello spazio: il CM
      va di moto rettilineo uniforme e il corpo ruota attorno a esso.
- id: moto-corpo-rigido-errori
  topic: moto-corpo-rigido
  objectives:
    - moto-corpo-rigido.1
    - moto-corpo-rigido.2
    - moto-corpo-rigido.3
    - moto-corpo-rigido.4
    - moto-corpo-rigido.5
    - moto-corpo-rigido.6
    - moto-corpo-rigido.7
  kind: concetto
  front:
    it: 'Errori da evitare: Moto di un corpo rigido'
  back:
    it: |-
      - Assegnare ω 'a un punto': la velocità angolare è unica per tutto il corpo rigido.
      - Usare la seconda cardinale con polo mobile diverso dal CM senza correzioni.
      - Applicare L = Iω vettorialmente quando l'asse non è principale.
      - Dimenticare che servono ENTRAMBE le cardinali: la sola prima non descrive la rotazione.
