  kind: concetto
  front:
    it: 'Ipotesi di validità: Moto di un corpo rigido'
    en: 'Validity assumptions: Motion of a rigid body'
  back:
    it: >-
      Rigidità perfetta (nessuna deformazione); per L = Iω asse fisso o principale d'inerzia; sistemi di
      riferimento inerziali (o polo nel CM).
    en: >-
      Perfect rigidity (no deformation); for L = Iω a fixed axis or a principal axis of inertia; inertial
      reference frames (or pole at the CM).
- id: moto-corpo-rigido-casi-limite
  topic: moto-corpo-rigido
  objectives:
    - moto-corpo-rigido.1
    - moto-corpo-rigido.2
    - moto-corpo-rigido.3
    - moto-corpo-rigido.4
    - moto-corpo-rigido.5
    - moto-corpo-rigido.6
    - moto-corpo-rigido.7
  kind: concetto
  front:
    it: 'Casi limite: Moto di un corpo rigido'
    en: 'Limiting cases: Motion of a rigid body'
  back:
    it: >-
      Pura traslazione: ω = 0, tutti i punti hanno la stessa velocità. Pura rotazione attorno ad asse fisso:
      v_cm dell'asse nulla. Rotolamento: combinazione con vincolo v_cm = ωR. Corpo libero nello spazio: il CM
      va di moto rettilineo uniforme e il corpo ruota attorno a esso.
    en: >-
      Pure translation: ω = 0, all points have the same velocity. Pure rotation about a fixed axis: zero
      velocity of the axis. Rolling: combination with the constraint v_cm = ωR. Free body in space: the CM
      moves in uniform rectilinear motion and the body rotates about it.
- id: moto-corpo-rigido-errori
  topic: moto-corpo-rigido
  objectives:
    - moto-corpo-rigido.1
    - moto-corpo-rigido.2
    - moto-corpo-rigido.3
    - moto-corpo-rigido.4
    - moto-corpo-rigido.5
    - moto-corpo-rigido.6
    - moto-corpo-rigido.7
  kind: concetto
  front:
    it: 'Errori da evitare: Moto di un corpo rigido'
    en: 'Mistakes to avoid: Motion of a rigid body'
  back:
    it: |-
      - Assegnare ω 'a un punto': la velocità angolare è unica per tutto il corpo rigido.
      - Usare la seconda cardinale con polo mobile diverso dal CM senza correzioni.
      - Applicare L = Iω vettorialmente quando l'asse non è principale.
      - Dimenticare che servono ENTRAMBE le cardinali: la sola prima non descrive la rotazione.
    en: |-
      - Assigning ω 'to a point': the angular velocity is unique for the whole rigid body.
      - Using the second cardinal equation with a moving pole other than the CM without corrections.
      - Applying L = Iω as a vector relation when the axis is not principal.
      - Forgetting that BOTH cardinal equations are needed: the first alone does not describe rotation.
