- id: memoria-virtuale-verifica-1
  topic: memoria-virtuale
  objectives:
    - memoria-virtuale.2
  kind: concetto
  front:
    it: "Pagine da 4 KiB e indirizzo virtuale a 32 bit: quanti bit di offset, e quante pagine?"
    en: "4 KiB pages and a 32-bit virtual address: how many offset bits, and how many pages?"
  back:
    it: Offset **12 bit**, perché 4096 = 2¹². Restano 20 bit per il numero di pagina, quindi **2²⁰ = 1 048 576**
      pagine.
    en: Offset **12 bits**, because 4096 = 2¹². 20 bits remain for the page number, so **2²⁰ = 1,048,576** pages.
- id: memoria-virtuale-verifica-2
  topic: memoria-virtuale
  objectives:
    - memoria-virtuale.1
  kind: concetto
  front:
    it: Perché nella traduzione l'offset resta identico?
    en: Why does the offset stay identical in translation?
  back:
    it: "Perché pagina e frame hanno la stessa dimensione: la traduzione cambia **quale blocco** si sta guardando,
      non la posizione dentro il blocco. Si traduce solo la parte alta dell'indirizzo."
    en: "Because page and frame have the same size: translation changes **which block** is being looked at, not
      the position within the block. Only the upper part of the address is translated."
- id: memoria-virtuale-verifica-3
  topic: memoria-virtuale
  objectives:
    - memoria-virtuale.3
  kind: concetto
  front:
    it: TLB miss e page fault sono la stessa cosa?
    en: Are a TLB miss and a page fault the same thing?
  back:
    it: "No. Il **TLB miss** dice solo che la traduzione non era nella cache delle traduzioni: la pagina può
      benissimo essere in memoria, e si va a leggere la tabella. Il **page fault** dice che la pagina non è in
      memoria fisica e va caricata da disco: costa milioni di volte di più."
    en: "No. A **TLB miss** only says that the translation was not in the translation cache: the page may well be
      in memory, and the table is read. A **page fault** says that the page is not in physical memory and must
      be loaded from disk: it costs millions of times more."
- id: open-vm-01
  topic: memoria-virtuale
  objectives:
    - memoria-virtuale.1
    - memoria-virtuale.3
  kind: orale
  front:
    it: Che cos'è la memoria virtuale? Spiega la traduzione di un indirizzo e il ruolo del TLB.
  back:
    it: "Ogni processo lavora su uno spazio di indirizzi **logico** proprio, mappato dal sistema sulla memoria
      **fisica**, appoggiandosi al disco per ciò che non ci sta: si eseguono programmi più grandi della RAM e
      si isolano i processi fra loro. Con la **paginazione**, spazio logico e memoria fisica sono divisi in
      pagine e frame di uguale dimensione. L'indirizzo virtuale si spezza in numero di pagina + offset: solo
      il numero di pagina viene tradotto in numero di frame tramite la **tabella delle pagine**, mentre
      l'**offset resta invariato**. Poiché la tabella sta in memoria, tradurre costerebbe un accesso in più a
      ogni accesso: il **TLB** è una piccola cache associativa delle traduzioni recenti che elimina quasi
      sempre quel costo, sfruttando la località. Se la pagina non è in memoria (bit valid a 0) si ha un **page
      fault**: eccezione, caricamento da disco, riesecuzione dell'istruzione."
- id: open-vm-02
  topic: memoria-virtuale
  objectives:
    - memoria-virtuale.1
    - memoria-virtuale.3
  kind: orale
  front:
    it: Cache e memoria virtuale risolvono lo stesso problema? Motiva.
  back:
    it: "No, e vanno tenute distinte anche a parole. Entrambe sfruttano la **località**, ma stanno a livelli
      diversi della gerarchia: la **cache** sta fra CPU e memoria principale e accelera l'**accesso ai dati**;
      la **memoria virtuale** sta fra memoria principale e disco e serve a dare a ogni processo uno spazio
      proprio più grande della RAM, con protezione e possibilità di condivisione. Anche i costi sono di ordini
      diversi: un cache miss costa decine di cicli e si gestisce in hardware, un page fault costa un accesso a
      disco — milioni di cicli — e viene gestito dal sistema operativo, che può quindi permettersi politiche
      di sostituzione sofisticate. Il **TLB** è l'anello che li avvicina: è una cache, ma delle traduzioni,
      non dei dati."
- id: def-memoriavirtuale
  topic: memoria-virtuale
  objectives:
    - memoria-virtuale.1
    - memoria-virtuale.3
  kind: definizione
  front:
    it: Memoria virtuale
  back:
    it: >-
      Meccanismo che dà a ogni processo uno spazio di indirizzi logico proprio, mappato sulla memoria fisica e
      sul disco.


      undefined
- id: def-tlb
  topic: memoria-virtuale
  objectives:
    - memoria-virtuale.1
    - memoria-virtuale.3
  kind: definizione
  front:
    it: TLB
  back:
    it: |-
      Piccola cache delle traduzioni pagina→frame usate di recente.

      Senza, ogni accesso ne costerebbe due: uno per la tabella delle pagine e uno per il dato.
- id: def-pagefault
  topic: memoria-virtuale
  objectives:
    - memoria-virtuale.1
    - memoria-virtuale.3
  kind: definizione
  front:
    it: Page fault
  back:
    it: >-
      Eccezione sollevata quando la pagina richiesta non è in memoria: il sistema la carica da disco e
      riesegue l’istruzione.


      undefined
