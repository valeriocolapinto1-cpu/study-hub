- id: algebra-di-boole-verifica-1
  topic: algebra-di-boole
  objectives:
    - algebra-di-boole.3
  kind: concetto
  front:
    it: Scrivi NOT, AND e OR usando solo porte NAND.
    en: Write NOT, AND and OR using only NAND gates.
  back:
    it: "NOT a = `a NAND a`. AND: `(a NAND b) NAND (a NAND b)`, cioè si nega la NAND. OR: `(a NAND a) NAND (b NAND
      b)`, che è De Morgan applicato."
    en: "NOT a = `a NAND a`. AND: `(a NAND b) NAND (a NAND b)`, i.e. you negate the NAND. OR: `(a NAND a) NAND (b
      NAND b)`, which is De Morgan applied."
- id: algebra-di-boole-verifica-2
  topic: algebra-di-boole
  objectives:
    - algebra-di-boole.4
  kind: concetto
  front:
    it: "Una funzione di 3 variabili vale 1 su tre righe: quanti termini ha la SOP canonica e quanti la POS
      canonica?"
    en: "A function of 3 variables is 1 on three rows: how many terms does the canonical SOP have, and how many
      the canonical POS?"
  back:
    it: Tre la SOP (un mintermine per ogni riga a 1) e cinque la POS (un maxtermine per ognuna delle 8 − 3 righe a
      0). Le due forme descrivono la stessa funzione con costi diversi.
    en: Three for the SOP (one minterm for each row at 1) and five for the POS (one maxterm for each of the 8 − 3
      rows at 0). The two forms describe the same function at different costs.
- id: algebra-di-boole-verifica-3
  topic: algebra-di-boole
  objectives:
    - algebra-di-boole.2
  kind: concetto
  front:
    it: Vale a + a·b = a? Perché?
    en: Does a + a·b = a hold? Why?
  back:
    it: "Sì, è l'**assorbimento**: se a = 1 la somma fa 1 comunque, se a = 0 anche a·b vale 0. Riconoscerlo serve
      a scartare i termini ridondanti prima ancora di disegnare la mappa."
    en: "Yes, it is **absorption**: if a = 1 the sum is 1 anyway, if a = 0 then a·b is 0 too. Spotting it lets you
      discard redundant terms before you even draw the map."
- id: open-bool-01
  topic: algebra-di-boole
  objectives:
    - algebra-di-boole.1
  kind: orale
  front:
    it: Enuncia i teoremi di De Morgan e spiega perché NAND e NOR sono universali.
    en: State De Morgan's theorems and explain why NAND and NOR are universal.
  back:
    it: "De Morgan: $\\overline{A\\cdot B}$ = $\\overline{A}$ + $\\overline{B}$ e $\\overline{A+B}$ =
      $\\overline{A}$ · $\\overline{B}$; valgono anche per più di due fattori. Con soli ∧ e ∨ non si ottiene
      la negazione, quindi quell'insieme non è funzionalmente completo. NAND e NOR invece lo sono da soli: da
      ciascuno si ricava il NOT (collegando insieme gli ingressi) e, per De Morgan, anche AND e OR — quindi
      qualunque rete combinatoria."
    en: "De Morgan: $\\overline{A\\cdot B}$ = $\\overline{A}$ + $\\overline{B}$ and $\\overline{A+B}$ =
      $\\overline{A}$ · $\\overline{B}$; they also hold for more than two factors. With only ∧ and ∨ negation
      cannot be obtained, so that set is not functionally complete. NAND and NOR, on the other hand, are
      complete on their own: from each one you get NOT (tying the inputs together) and, by De Morgan, also AND
      and OR — hence any combinational network."
- id: def-completo
  topic: algebra-di-boole
  objectives:
    - algebra-di-boole.1
  kind: definizione
  front:
    it: Insieme funzionalmente completo
    en: Functionally complete set
  back:
    it: |-
      Insieme di operatori con cui si può esprimere qualunque funzione booleana.

      {AND, OR} **non** lo è: manca la negazione. NAND da solo e NOR da solo lo sono.
    en: |-
      Set of operators with which any Boolean function can be expressed.

      {AND, OR} is **not**: negation is missing. NAND alone and NOR alone are.
- id: def-demorgan
  topic: algebra-di-boole
  objectives:
    - algebra-di-boole.1
  kind: definizione
  front:
    it: Teoremi di De Morgan
    en: De Morgan's theorems
  back:
    it: >-
      La negazione di un prodotto è la somma delle negazioni, e la negazione di una somma è il prodotto delle
      negazioni.


      Valgono anche per più di due fattori.
    en: >-
      The negation of a product is the sum of the negations, and the negation of a sum is the product of the
      negations.


      They also hold for more than two factors.
- id: def-mintermine
  topic: algebra-di-boole
  objectives:
    - algebra-di-boole.1
  kind: definizione
  front:
    it: Mintermine
    en: Minterm
  back:
    it: >-
      Prodotto in cui compaiono tutte le variabili, dirette o negate, corrispondente a una riga della tabella
      di verità.


      La somma dei mintermini delle righe a 1 è la forma canonica SOP.
    en: |-
      Product in which all variables appear, plain or negated, corresponding to one row of the truth table.

      The sum of the minterms of the rows at 1 is the canonical SOP form.
- id: def-sop
  topic: algebra-di-boole
  objectives:
    - algebra-di-boole.1
  kind: definizione
  front:
    it: SOP (somma di prodotti)
    en: SOP (sum of products)
  back:
    it: Espressione formata da termini prodotto messi in OR.
    en: Expression made of product terms combined with OR.
