- id: risc-cisc-assembly-verifica-1
  topic: risc-cisc-assembly
  objectives:
    - risc-cisc-assembly.2
  kind: concetto
  front:
    it: Che cosa fa `Load R1, 20(R2)`?
    en: What does `Load R1, 20(R2)` do?
  back:
    it:
      "È base + spiazzamento: calcola l'indirizzo `[R2] + 20` e carica in R1 il **contenuto** di quella cella.
      R2 non viene modificato, e lo spiazzamento è una costante nell'istruzione."
    en:
      'It is base + displacement: it computes the address `[R2] + 20` and loads into R1 the **contents** of that
      cell. R2 is not modified, and the displacement is a constant in the instruction.'
- id: risc-cisc-assembly-verifica-2
  topic: risc-cisc-assembly
  objectives:
    - risc-cisc-assembly.1
  kind: concetto
  front:
    it: Perché i RISC usano istruzioni di lunghezza fissa?
    en: Why do RISC processors use fixed-length instructions?
  back:
    it:
      'Perché prelievo e decodifica diventano regolari: ogni istruzione occupa lo stesso spazio e i campi stanno
      sempre nelle stesse posizioni. È la condizione che rende efficiente la pipeline.'
    en:
      'Because fetch and decode become regular: every instruction takes the same space and the fields are always
      in the same positions. It is the condition that makes the pipeline efficient.'
- id: risc-cisc-assembly-verifica-3
  topic: risc-cisc-assembly
  objectives:
    - risc-cisc-assembly.4
  kind: concetto
  front:
    it: Perché l'indirizzo di ritorno finisce sulla pila e non sempre in un registro?
    en: Why does the return address end up on the stack and not always in a register?
  back:
    it: Con le chiamate annidate un singolo registro verrebbe sovrascritto dalla seconda chiamata. La pila,
      essendo LIFO, conserva un indirizzo di ritorno per ogni livello di annidamento.
    en:
      With nested calls a single register would be overwritten by the second call. The stack, being LIFO, keeps
      one return address per nesting level.
- id: open-isa-01
  topic: risc-cisc-assembly
  objectives:
    - risc-cisc-assembly.3
    - risc-cisc-assembly.5
  kind: orale
  front:
    it: Perché conviene aggiornare il PC all'istruzione successiva e non a quella corrente?
    en: Why is it convenient to update the PC to the next instruction and not to the current one?
  back:
    it:
      "Per la sequenzialità dell'esecuzione: dopo il fetch, incrementare il PC prepara la prossima istruzione
      senza ricalcolo, utile in pipeline (fetch anticipato). I salti (branch) caricano un nuovo indirizzo nel
      PC."
    en: 'Because execution is sequential: after the fetch, incrementing the PC prepares the next instruction
      without recomputation, useful in a pipeline (early fetch). Branches load a new address into the PC.'
- id: open-isa-02
  topic: risc-cisc-assembly
  objectives:
    - risc-cisc-assembly.3
    - risc-cisc-assembly.5
  kind: orale
  front:
    it: Confronta le architetture RISC e CISC.
    en: Compare RISC and CISC architectures.
  back:
    it: '**RISC**: istruzioni semplici, di lunghezza fissa (una parola); modello **load/store** (i dati vanno
      portati in registro prima di essere elaborati, niente operazioni memoria-memoria); pochi modi di
      indirizzamento → decodifica semplice e circuito veloce, adatto alla pipeline. Esempi: ARM, Nios II.
      **CISC**: istruzioni complesse di lunghezza variabile, operazioni anche su operandi in memoria; i
      programmi risultano più corti ma la decodifica è più onerosa. Esempi: Intel IA-32, ColdFire.'
    en:
      '**RISC**: simple instructions of fixed length (one word); **load/store** model (data must be brought into
      a register before being processed, no memory-to-memory operations); few addressing modes → simple
      decoding and a fast circuit, suited to pipelining. Examples: ARM, Nios II. **CISC**: complex
      variable-length instructions, operations also on operands in memory; programs are shorter but decoding
      is more costly. Examples: Intel IA-32, ColdFire.'
- id: def-risc
  topic: risc-cisc-assembly
  objectives:
    - risc-cisc-assembly.3
    - risc-cisc-assembly.5
  kind: definizione
  front:
    it: RISC
    en: RISC
  back:
    it:
      'Architettura con istruzioni semplici di lunghezza fissa e modello load/store: solo Load e Store toccano
      la memoria.'
    en: 'Architecture with simple fixed-length instructions and a load/store model: only Load and Store touch
      memory.'
- id: def-cisc
  topic: risc-cisc-assembly
  objectives:
    - risc-cisc-assembly.3
    - risc-cisc-assembly.5
  kind: definizione
  front:
    it: CISC
    en: CISC
  back:
    it:
      Architettura con istruzioni complesse di lunghezza variabile, che possono operare direttamente su operandi
      in memoria.
    en: Architecture with complex variable-length instructions, which can operate directly on operands in memory.
- id: def-indicizzato
  topic: risc-cisc-assembly
  objectives:
    - risc-cisc-assembly.3
    - risc-cisc-assembly.5
  kind: definizione
  front:
    it: Indirizzamento indicizzato
    en: Indexed addressing
  back:
    it: L’indirizzo dell’operando è la somma di un registro base e di uno spiazzamento costante.
    en: The operand address is the sum of a base register and a constant displacement.
- id: def-pila
  topic: risc-cisc-assembly
  objectives:
    - risc-cisc-assembly.3
    - risc-cisc-assembly.5
  kind: definizione
  front:
    it: Pila (stack)
    en: Stack
  back:
    it: >-
      Struttura LIFO in memoria, gestita dallo stack pointer, su cui viaggiano indirizzo di ritorno, parametri
      e variabili locali.


      È ciò che rende possibili annidamento e ricorsione, che il solo link register non regge.
    en: >-
      LIFO structure in memory, managed by the stack pointer, carrying the return address, parameters and
      local variables.


      It is what makes nesting and recursion possible, which the link register alone cannot handle.
- id: def-linker
  topic: risc-cisc-assembly
  objectives:
    - risc-cisc-assembly.3
    - risc-cisc-assembly.5
  kind: definizione
  front:
    it: Compilatore, linker, loader
    en: Compiler, linker, loader
  back:
    it:
      Il compilatore traduce in linguaggio macchina, il linker combina i file oggetto risolvendo i riferimenti
      esterni, il loader porta il programma in memoria.
    en: The compiler translates into machine language, the linker combines object files resolving external
      references, the loader brings the program into memory.
