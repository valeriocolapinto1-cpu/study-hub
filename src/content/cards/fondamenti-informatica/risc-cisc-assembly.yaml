  front:
    it: Pila (stack)
  back:
    it: >-
      Struttura LIFO in memoria, gestita dallo stack pointer, su cui viaggiano indirizzo di ritorno, parametri
      e variabili locali.


      È ciò che rende possibili annidamento e ricorsione, che il solo link register non regge.
