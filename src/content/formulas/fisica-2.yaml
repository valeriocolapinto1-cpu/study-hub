# Formulario di Fisica Generale II, dal sito originale (legacy/fisica-2/data/formule.json), ordine originale.
- id: coulomb
  topic: elettrostatica-nel-vuoto
  latex: \vec F_{12} = \frac{1}{4\pi\varepsilon_0}\,\frac{q_1 q_2}{r^2}\,\hat u_{r}
  label:
    it: Legge di Coulomb
    en: Coulomb's law
  note:
    it: $\varepsilon_0 \simeq 8.854\times10^{-12}\ \mathrm{F/m}$; $\frac{1}{4\pi\varepsilon_0}\simeq 8.99\times10^{9}\ \mathrm{N\,m^2/C^2}$
    en: $\varepsilon_0 \simeq 8.854\times10^{-12}\ \mathrm{F/m}$; $\frac{1}{4\pi\varepsilon_0}\simeq 8.99\times10^{9}\ \mathrm{N\,m^2/C^2}$
- id: campo-def
  topic: elettrostatica-nel-vuoto
  latex: \vec E = \frac{\vec F}{q_0}
  label:
    it: Definizione di campo elettrico
    en: Definition of the electric field
- id: campo-distr
  topic: elettrostatica-nel-vuoto
  latex: \vec E(\vec r) = \frac{1}{4\pi\varepsilon_0}\int_V \frac{\rho(\vec r\,')\,(\vec r-\vec r\,')}{|\vec r-\vec r\,'|^3}\,dV'
  label:
    it: Campo di una distribuzione continua
    en: Field of a continuous distribution
  note:
    it: Analogamente con $\lambda\,dl'$ (lineare) e $\sigma\,dS'$ (superficiale).
    en: Likewise with $\lambda\,dl'$ (linear) and $\sigma\,dS'$ (surface).
- id: filo-inf
  topic: elettrostatica-nel-vuoto
  latex: E = \frac{\lambda}{2\pi\varepsilon_0\, r}
  label:
    it: Filo rettilineo infinito
    en: Infinite straight wire
  note:
    it: Campo radiale, r distanza dal filo.
    en: Radial field, r distance from the wire.
- id: piano-inf
  topic: elettrostatica-nel-vuoto
  latex: E = \frac{\sigma}{2\varepsilon_0}
  label:
    it: Piano infinito uniformemente carico
    en: Uniformly charged infinite plane
  note:
    it: Uniforme, perpendicolare al piano.
    en: Uniform, perpendicular to the plane.
- id: sfera-unif
  topic: elettrostatica-nel-vuoto
  latex: E(r) = \begin{cases} \dfrac{Q\,r}{4\pi\varepsilon_0 R^3} & r<R \\[2mm] \dfrac{Q}{4\pi\varepsilon_0 r^2} & r\ge R \end{cases}
  label:
    it: Sfera uniformemente carica (raggio R, carica Q)
    en: Uniformly charged sphere (radius R, charge Q)
- id: gauss-int
  topic: elettrostatica-nel-vuoto
  latex: \Phi_S(\vec E) = \oint_S \vec E\cdot\hat n\,dS = \frac{Q_{\text{int}}}{\varepsilon_0}
  label:
    it: Teorema di Gauss (forma integrale)
    en: Gauss's theorem (integral form)
- id: maxwell1-loc
  topic: elettrostatica-nel-vuoto
  latex: \nabla\cdot\vec E = \frac{\rho}{\varepsilon_0}
  label:
    it: I equazione di Maxwell (forma locale, vuoto)
    en: Maxwell's first equation (local form, vacuum)
- id: divergenza
  topic: elettrostatica-nel-vuoto
  latex: \oint_S \vec F\cdot\hat n\,dS = \int_V \nabla\cdot\vec F\,dV
  label:
    it: Teorema della divergenza
    en: Divergence theorem
- id: ddp
  topic: elettrostatica-nel-vuoto
  latex: V(B)-V(A) = -\int_A^B \vec E\cdot d\vec l
  label:
    it: Differenza di potenziale
    en: Potential difference
- id: grad
  topic: elettrostatica-nel-vuoto
  latex: \vec E = -\nabla V
  label:
    it: Campo come gradiente del potenziale
    en: Field as the gradient of the potential
- id: grad-sfer
  topic: elettrostatica-nel-vuoto
  latex: \nabla V = \frac{\partial V}{\partial r}\hat u_r + \frac{1}{r}\frac{\partial V}{\partial \theta}\hat u_\theta + \frac{1}{r\sin\theta}\frac{\partial V}{\partial \phi}\hat u_\phi
  label:
    it: Gradiente in coordinate sferiche
    en: Gradient in spherical coordinates
- id: pot-distr
  topic: elettrostatica-nel-vuoto
  latex: V(\vec r) = \frac{1}{4\pi\varepsilon_0}\int_V \frac{\rho(\vec r\,')}{|\vec r-\vec r\,'|}\,dV'
  label:
    it: Potenziale di una distribuzione
    en: Potential of a distribution
  note:
    it: Riferimento V = 0 all'infinito (distribuzioni limitate).
    en: Reference V = 0 at infinity (bounded distributions).
- id: rot-e
  topic: elettrostatica-nel-vuoto
  latex: \oint_\gamma \vec E\cdot d\vec l = 0 \quad\Longleftrightarrow\quad \nabla\times\vec E = 0
  label:
    it: Conservatività del campo elettrostatico
    en: Conservativeness of the electrostatic field
- id: stokes
  topic: elettrostatica-nel-vuoto
  latex: \oint_\gamma \vec F\cdot d\vec l = \int_S (\nabla\times\vec F)\cdot\hat n\,dS
  label:
    it: Teorema di Stokes
    en: Stokes' theorem
- id: poisson
  topic: elettrostatica-nel-vuoto
  latex: \nabla^2 V = -\frac{\rho}{\varepsilon_0} \qquad\qquad \nabla^2 V = 0\ \ (\rho=0)
  label:
    it: Equazioni di Poisson e di Laplace
    en: Poisson's and Laplace's equations
- id: dipolo-p
  topic: elettrostatica-nel-vuoto
  latex: \vec p = q\,\vec d
  label:
    it: Momento di dipolo
    en: Dipole moment
  note:
    it: d orientato dalla carica negativa alla positiva.
    en: d points from the negative to the positive charge.
- id: dipolo-v
  topic: elettrostatica-nel-vuoto
  latex: V(r,\theta) = \frac{1}{4\pi\varepsilon_0}\frac{\vec p\cdot\hat u_r}{r^2} = \frac{p\cos\theta}{4\pi\varepsilon_0 r^2}
  label:
    it: Potenziale del dipolo (r ≫ d)
    en: Dipole potential (r ≫ d)
- id: dipolo-e
  topic: elettrostatica-nel-vuoto
  latex: E_r = \frac{2p\cos\theta}{4\pi\varepsilon_0 r^3},\qquad E_\theta = \frac{p\sin\theta}{4\pi\varepsilon_0 r^3}
  label:
    it: Campo del dipolo (r ≫ d)
    en: Dipole field (r ≫ d)
- id: dipolo-mom
  topic: elettrostatica-nel-vuoto
  latex: \vec M = \vec p\times\vec E
  label:
    it: Momento meccanico su dipolo
    en: Torque on a dipole
- id: dipolo-u
  topic: elettrostatica-nel-vuoto
  latex: U = -\vec p\cdot\vec E
  label:
    it: Energia potenziale del dipolo
    en: Potential energy of a dipole
- id: dipolo-f
  topic: elettrostatica-nel-vuoto
  latex: \vec F = \nabla(\vec p\cdot\vec E) = (\vec p\cdot\nabla)\vec E
  label:
    it: Forza su dipolo rigido
    en: Force on a rigid dipole
  note:
    it: La seconda uguaglianza vale per $\nabla\times\vec E = 0$. In campo uniforme $\vec F = 0$.
    en: The second equality holds because $\nabla\times\vec E = 0$. In a uniform field $\vec F = 0$.
- id: th-coulomb
  topic: conduttori-capacita
  latex: \vec E = \frac{\sigma}{\varepsilon_0}\,\hat n
  label:
    it: Teorema di Coulomb
    en: Coulomb's theorem
  note:
    it: Campo immediatamente all'esterno della superficie di un conduttore in equilibrio.
    en: Field just outside the surface of a conductor in equilibrium.
- id: capacita
  topic: conduttori-capacita
  latex: "C = \\frac{Q}{V}\\qquad \\text{(condensatore: } C = Q/\\Delta V)"
  label:
    it: Capacità
    en: Capacitance
- id: cap-sfera
  topic: conduttori-capacita
  latex: C = 4\pi\varepsilon_0 R
  label:
    it: Conduttore sferico isolato
    en: Isolated spherical conductor
- id: cap-piano
  topic: conduttori-capacita
  latex: C = \frac{\varepsilon_0 S}{d}
  label:
    it: Condensatore piano
    en: Parallel-plate capacitor
- id: cap-sferico
  topic: conduttori-capacita
  latex: C = 4\pi\varepsilon_0\,\frac{R_1 R_2}{R_2-R_1}
  label:
    it: Condensatore sferico
    en: Spherical capacitor
- id: cap-cil
  topic: conduttori-capacita
  latex: C = \frac{2\pi\varepsilon_0\, L}{\ln(R_2/R_1)}
  label:
    it: Condensatore cilindrico
    en: Cylindrical capacitor
- id: cap-serie-par
  topic: conduttori-capacita
  latex: \frac{1}{C_s} = \sum_i \frac{1}{C_i}\qquad\qquad C_p = \sum_i C_i
  label:
    it: Condensatori in serie e in parallelo
    en: Capacitors in series and in parallel
- id: u-cariche
  topic: conduttori-capacita
  latex: U = \frac{1}{2}\sum_{i} q_i V_i = \frac{1}{4\pi\varepsilon_0}\sum_{i<j}\frac{q_i q_j}{r_{ij}}
  label:
    it: Energia di un sistema di cariche
    en: Energy of a system of charges
- id: u-cond
  topic: conduttori-capacita
  latex: U = \frac{1}{2}QV = \frac{1}{2}CV^2 = \frac{Q^2}{2C}
  label:
    it: Energia di un condensatore
    en: Energy of a capacitor
- id: u-e
  topic: conduttori-capacita
  latex: u = \frac{1}{2}\varepsilon_0 E^2
  label:
    it: Densità di energia (vuoto)
    en: Energy density (vacuum)
- id: press-el
  topic: conduttori-capacita
  latex: p = \frac{\sigma^2}{2\varepsilon_0} = \frac{1}{2}\varepsilon_0 E^2
  label:
    it: Pressione elettrostatica
    en: Electrostatic pressure
- id: forza-lav-virt
  topic: conduttori-capacita
  latex: F_x = -\left(\frac{\partial U}{\partial x}\right)_{Q} = +\left(\frac{\partial U}{\partial x}\right)_{V}
  label:
    it: Forza con il metodo dei lavori virtuali
    en: Force by the method of virtual work
  note:
    it: A carica costante (sistema isolato) o a potenziale costante (collegato a generatore).
    en: At constant charge (isolated system) or at constant potential (connected to a generator).
- id: eps-r
  topic: dielettrici
  latex: \varepsilon = \varepsilon_0\varepsilon_r,\qquad C = \varepsilon_r C_0
  label:
    it: Costante dielettrica relativa
    en: Relative dielectric constant
- id: p-vett
  topic: dielettrici
  latex: \vec P = n\,\langle\vec p\,\rangle,\qquad \vec P = \varepsilon_0(\varepsilon_r-1)\vec E = \varepsilon_0\chi\,\vec E
  label:
    it: Vettore di polarizzazione
    en: Polarisation vector
  note:
    it: La relazione lineare vale per dielettrici lineari e isotropi; χ suscettività elettrica.
    en: The linear relation holds for linear isotropic dielectrics; χ electric susceptibility.
- id: cariche-pol
  topic: dielettrici
  latex: \sigma_p = \vec P\cdot\hat n,\qquad \rho_p = -\nabla\cdot\vec P
  label:
    it: Cariche di polarizzazione
    en: Polarisation charges
- id: d-vett
  topic: dielettrici
  latex: \vec D = \varepsilon_0\vec E + \vec P = \varepsilon\,\vec E\ \ \text{(mezzo lineare)}
  label:
    it: Induzione elettrica D
    en: Electric displacement D
- id: gauss-d
  topic: dielettrici
  latex: \oint_S \vec D\cdot\hat n\,dS = Q_{\text{lib}},\qquad \nabla\cdot\vec D = \rho_{\text{lib}}
  label:
    it: Gauss per D
    en: Gauss's law for D
- id: raccordo-diel
  topic: dielettrici
  latex: D_{1n} = D_{2n},\qquad E_{1t} = E_{2t},\qquad \frac{\tan\theta_1}{\tan\theta_2} = \frac{\varepsilon_1}{\varepsilon_2}
  label:
    it: Condizioni al contorno tra due dielettrici
    en: Boundary conditions between two dielectrics
  note:
    it: In assenza di cariche libere sulla superficie; angoli misurati dalla normale.
    en: Without free charges on the surface; angles measured from the normal.
- id: u-diel
  topic: dielettrici
  latex: u = \frac{1}{2}\vec E\cdot\vec D
  label:
    it: Densità di energia con dielettrici
    en: Energy density with dielectrics
- id: corrente
  topic: corrente-stazionaria
  latex: I = \frac{dq}{dt} = \int_S \vec J\cdot\hat n\,dS
  label:
    it: Intensità di corrente
    en: Electric current
- id: j
  topic: corrente-stazionaria
  latex: \vec J = n\,q\,\vec v_d
  label:
    it: Densità di corrente
    en: Current density
- id: continuita
  topic: corrente-stazionaria
  latex: "\\nabla\\cdot\\vec J + \\frac{\\partial\\rho}{\\partial t} = 0 \\qquad\\text{(stazionario: } \\nabla\\cdot\\vec J = 0)"
  label:
    it: Equazione di continuità
    en: Continuity equation
- id: ohm
  topic: corrente-stazionaria
  latex: V = R\,I
  label:
    it: Legge di Ohm
    en: Ohm's law
- id: ohm-loc
  topic: corrente-stazionaria
  latex: \vec J = \sigma\vec E = \frac{\vec E}{\rho}
  label:
    it: Legge di Ohm locale
    en: Local Ohm's law
- id: resistenza
  topic: corrente-stazionaria
  latex: R = \rho\,\frac{l}{S}
  label:
    it: Resistenza di un conduttore omogeneo a sezione costante
    en: Resistance of a homogeneous conductor of constant cross-section
  note:
    it: In generale $R = \int \rho\,\frac{dl}{S(l)}$ lungo le linee di corrente.
    en: In general $R = \int \rho\,\frac{dl}{S(l)}$ along the current lines.
- id: rho-t
  topic: corrente-stazionaria
  latex: \rho(T) \simeq \rho_0\,[1+\alpha\,(T-T_0)]
  label:
    it: Dipendenza della resistività dalla temperatura (metalli)
    en: Temperature dependence of resistivity (metals)
- id: joule
  topic: corrente-stazionaria
  latex: P = VI = RI^2 = \frac{V^2}{R}
  label:
    it: Effetto Joule
    en: Joule heating
- id: joule-loc
  topic: corrente-stazionaria
  latex: \frac{dP}{d\tau} = \vec J\cdot\vec E = \rho J^2
  label:
    it: Legge di Joule locale
    en: Local Joule's law
- id: r-serie-par
  topic: corrente-stazionaria
  latex: R_s = \sum_i R_i\qquad\qquad \frac{1}{R_p} = \sum_i\frac{1}{R_i}
  label:
    it: Resistenze in serie e in parallelo
    en: Resistors in series and in parallel
- id: fem
  topic: corrente-stazionaria
  latex: \mathcal E = \oint \vec E^{*}\cdot d\vec l
  label:
    it: Forza elettromotrice
    en: Electromotive force
  note:
    it: $\vec E^*$ campo elettromotore (non conservativo) interno al generatore.
    en: $\vec E^*$ electromotive (non-conservative) field inside the generator.
- id: gen-reale
  topic: corrente-stazionaria
  latex: V_{AB} = \mathcal E - r\,I
  label:
    it: Generatore reale
    en: Real generator
  note:
    it: r resistenza interna.
    en: r internal resistance.
- id: kirchhoff-nodi
  topic: corrente-stazionaria
  latex: \sum_k I_k = 0
  label:
    it: I legge di Kirchhoff (nodi)
    en: Kirchhoff's first law (nodes)
- id: kirchhoff-maglie
  topic: corrente-stazionaria
  latex: \sum_k R_k I_k = \sum_k \mathcal E_k
  label:
    it: II legge di Kirchhoff (maglie)
    en: Kirchhoff's second law (loops)
- id: partitori
  topic: corrente-stazionaria
  latex: V_2 = V\,\frac{R_2}{R_1+R_2}\qquad\qquad I_1 = I\,\frac{R_2}{R_1+R_2}
  label:
    it: Partitore di tensione e di corrente
    en: Voltage and current divider
- id: thevenin
  topic: corrente-stazionaria
  latex: V_{Th} = V_{AB}\big|_{\text{circuito aperto}},\qquad R_{Th} = R_{AB}\big|_{\text{generatori spenti}}
  label:
    it: Teorema di Thevenin
    en: Thevenin's theorem
  note:
    it: Generatori ideali di tensione sostituiti da cortocircuiti, di corrente da circuiti aperti.
    en: Ideal voltage generators replaced by short circuits, current generators by open circuits.
- id: max-pot
  topic: corrente-stazionaria
  latex: R_L = R_{Th}\ \Rightarrow\ P_{\max} = \frac{V_{Th}^2}{4R_{Th}}
  label:
    it: Massimo trasferimento di potenza
    en: Maximum power transfer
- id: wheatstone
  topic: corrente-stazionaria
  latex: \frac{R_1}{R_2} = \frac{R_3}{R_4}
  label:
    it: Ponte di Wheatstone (equilibrio)
    en: Wheatstone bridge (balance)
  note:
    it: R1, R2 in serie su un ramo, R3, R4 sull'altro; il rivelatore collega i punti intermedi.
    en: R1, R2 in series on one branch, R3, R4 on the other; the detector connects the middle points.
- id: inserzione
  topic: corrente-stazionaria
  latex: "\\text{voltmetro a valle: } R_{mis} = \\frac{R\\,R_V}{R+R_V}\\qquad \\text{voltmetro a monte: } R_{mis} = R + R_A"
  label:
    it: "Misura voltamperometrica: errori di inserzione"
    en: "Voltmeter-ammeter measurement: insertion errors"
  note:
    it: R_A resistenza dell'amperometro, R_V del voltmetro.
    en: R_A resistance of the ammeter, R_V of the voltmeter.
- id: rc-carica
  topic: corrente-stazionaria
  latex: q(t) = C\mathcal E\left(1-e^{-t/\tau}\right),\qquad I(t) = \frac{\mathcal E}{R}\,e^{-t/\tau},\qquad \tau = RC
  label:
    it: Carica di un condensatore
    en: Charging a capacitor
- id: rc-scarica
  topic: corrente-stazionaria
  latex: q(t) = Q_0\,e^{-t/\tau},\qquad V_C(t) = V_0\,e^{-t/\tau}
  label:
    it: Scarica di un condensatore
    en: Discharging a capacitor
- id: rc-energia
  topic: corrente-stazionaria
  latex: W_{gen} = C\mathcal E^2,\qquad U_C = \tfrac{1}{2}C\mathcal E^2,\qquad W_{Joule} = \tfrac{1}{2}C\mathcal E^2
  label:
    it: Bilancio energetico della carica
    en: Energy balance of charging
- id: diel-perdita
  topic: corrente-stazionaria
  latex: \tau = RC = \varepsilon\,\rho = \frac{\varepsilon_0\varepsilon_r}{\sigma}
  label:
    it: Condensatore con dielettrico in perdita
    en: Capacitor with a lossy dielectric
  note:
    it: Indipendente dalla geometria (dielettrico omogeneo che riempie il condensatore).
    en: Independent of the geometry (homogeneous dielectric filling the capacitor).
- id: lorentz
  topic: magnetostatica-nel-vuoto
  latex: \vec F = q\left(\vec E + \vec v\times\vec B\right)
  label:
    it: Forza di Lorentz
    en: Lorentz force
- id: ciclotrone
  topic: magnetostatica-nel-vuoto
  latex: r = \frac{m v_\perp}{|q| B},\qquad \omega = \frac{|q| B}{m},\qquad T = \frac{2\pi m}{|q| B}
  label:
    it: Moto circolare in B uniforme
    en: Circular motion in uniform B
- id: selettore
  topic: magnetostatica-nel-vuoto
  latex: v = \frac{E}{B}
  label:
    it: Selettore di velocità
    en: Velocity selector
- id: laplace2
  topic: magnetostatica-nel-vuoto
  latex: d\vec F = I\,d\vec l\times\vec B
  label:
    it: Forza su un elemento di circuito (II formula di Laplace)
    en: Force on a circuit element (Laplace's second formula)
- id: mom-magn
  topic: magnetostatica-nel-vuoto
  latex: \vec m = I\,S\,\hat n
  label:
    it: Momento magnetico di una spira piana
    en: Magnetic moment of a plane loop
- id: coppia-spira
  topic: magnetostatica-nel-vuoto
  latex: \vec M = \vec m\times\vec B,\qquad U = -\vec m\cdot\vec B
  label:
    it: Momento meccanico ed energia potenziale
    en: Torque and potential energy
- id: hall
  topic: magnetostatica-nel-vuoto
  latex: E_H = v_d B,\qquad V_H = \frac{I\,B}{n\,q\,t}
  label:
    it: Effetto Hall
    en: Hall effect
  note:
    it: t spessore della lamina nella direzione di B.
    en: t thickness of the strip along B.
- id: biot-savart
  topic: magnetostatica-nel-vuoto
  latex: d\vec B = \frac{\mu_0}{4\pi}\,\frac{I\,d\vec l\times\hat u_r}{r^2}
  label:
    it: I formula di Laplace (Biot-Savart)
    en: Laplace's first formula (Biot-Savart)
  note:
    it: $\mu_0 = 4\pi\times10^{-7}\ \mathrm{H/m}$ (valore esatto prima della revisione SI del 2019, oggi con ottima approssimazione).
    en: $\mu_0 = 4\pi\times10^{-7}\ \mathrm{H/m}$ (exact value before the 2019 SI revision, still an excellent approximation today).
- id: carica-moto
  topic: magnetostatica-nel-vuoto
  latex: \vec B = \frac{\mu_0}{4\pi}\,\frac{q\,\vec v\times\hat u_r}{r^2}
  label:
    it: Campo di una carica in moto (non relativistico)
    en: Field of a moving charge (non-relativistic)
- id: b-filo
  topic: magnetostatica-nel-vuoto
  latex: B = \frac{\mu_0 I}{2\pi r}
  label:
    it: Filo rettilineo infinito
    en: Infinite straight wire
- id: b-spira
  topic: magnetostatica-nel-vuoto
  latex: B(z) = \frac{\mu_0 I R^2}{2\,(R^2+z^2)^{3/2}}
  label:
    it: Spira circolare, sull'asse
    en: Circular loop, on the axis
  note:
    it: "Per $z\\gg R$: campo di dipolo con $m = I\\pi R^2$."
    en: "For $z\\gg R$: dipole field with $m = I\\pi R^2$."
- id: b-sol-inf
  topic: magnetostatica-nel-vuoto
  latex: B = \mu_0\, n\, I
  label:
    it: Solenoide infinito
    en: Infinite solenoid
  note:
    it: n numero di spire per unità di lunghezza; campo nullo all'esterno.
    en: n number of turns per unit length; zero field outside.
- id: b-sol-fin
  topic: magnetostatica-nel-vuoto
  latex: B(z) = \frac{\mu_0 n I}{2}\left[\frac{z+L/2}{\sqrt{(z+L/2)^2+R^2}} - \frac{z-L/2}{\sqrt{(z-L/2)^2+R^2}}\right]
  label:
    it: Solenoide finito (lunghezza L, raggio R), sull'asse
    en: Finite solenoid (length L, radius R), on the axis
  note:
    it: z misurato dal centro del solenoide.
    en: z measured from the centre of the solenoid.
- id: fili-paralleli
  topic: magnetostatica-nel-vuoto
  latex: \frac{F}{l} = \frac{\mu_0 I_1 I_2}{2\pi d}
  label:
    it: Forza tra due fili paralleli
    en: Force between two parallel wires
- id: maxwell2
  topic: magnetostatica-nel-vuoto
  latex: \oint_S \vec B\cdot\hat n\,dS = 0\qquad\Longleftrightarrow\qquad \nabla\cdot\vec B = 0
  label:
    it: II equazione di Maxwell
    en: Maxwell's second equation
- id: ampere
  topic: magnetostatica-nel-vuoto
  latex: \oint_\gamma \vec B\cdot d\vec l = \mu_0 I_{\text{conc}}\qquad\Longleftrightarrow\qquad \nabla\times\vec B = \mu_0\vec J
  label:
    it: Teorema della circuitazione di Ampère (IV eq., caso stazionario)
