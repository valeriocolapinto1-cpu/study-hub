title:
  it: Fisica 1
  en: Physics 1
subtitle:
  it: Meccanica e termodinamica
  en: Mechanics and thermodynamics
description:
  it: 'Trentatré argomenti di meccanica e termodinamica, dal moto circolare all’entropia: per ognuno l’idea
    fisica, le definizioni, la derivazione da ricostruire un passaggio alla volta, ipotesi, casi limite ed
    errori tipici. Esercizi da scritto svolti e generati, flashcard e domande d’orale con risposta modello,
    otto simulazioni interattive, la simulazione dello scritto e quella dell’orale con timer e checklist.'
  en: 'Thirty-three topics in mechanics and thermodynamics, from circular motion to entropy: for each one the
    physical idea, the definitions, the derivation to rebuild one step at a time, assumptions, limiting cases
    and common mistakes. Worked and generated written-exam problems, flashcards and oral-exam questions with
    model answers, eight interactive simulations, a mock written exam and a mock oral with timer and checklist.'
