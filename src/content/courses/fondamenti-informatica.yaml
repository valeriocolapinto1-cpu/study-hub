title:
  it: Fondamenti di Informatica
  en: Fundamentals of Computer Science
subtitle:
  it: Architettura degli elaboratori
  en: Computer architecture
description:
  it: "Dai bit al processore: numeri binari e complemento a 2, algebra di Boole e mappe di Karnaugh, reti
    combinatorie e sequenziali, percorso dati e unità di controllo, assembly, interruzioni e I/O, pipeline,
    cache, memoria virtuale, prestazioni e IEEE 754. Diciassette moduli scritti per partire da zero, esercizi
    svolti passo per passo, schemi da completare e prove generate che si correggono da sole."
  en: "From bits to the processor: binary numbers and two’s complement, Boolean algebra and Karnaugh maps,
    combinational and sequential networks, datapath and control unit, assembly, interrupts and I/O,
    pipelining, caches, virtual memory, performance and IEEE 754. Seventeen modules written to start from
    scratch, step-by-step worked exercises, diagrams to complete and generated self-grading mock exams."
