        en: $R=\left(\frac{n_1-n_2}{n_1+n_2}\right)^2=(0.33/2.33)^2\simeq2.01$%.
  origin: originale
  answer:
    - label:
        it: Risultato
        en: Result
      value: 2.006
      unit: '%'
      tol: 0.03
- id: quiz-q513
  topic: radiazione-materia
  objectives:
