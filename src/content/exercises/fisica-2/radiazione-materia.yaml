- id: quiz-q507
  topic: radiazione-materia
  objectives:
    - radiazione-materia.6
  difficulty: 1
  kind: static
  statement:
    it: 'Nella diffrazione di Fraunhofer da una fenditura di larghezza $a$, restringendo la fenditura il massimo centrale:'
    en: 'In Fraunhofer diffraction by a slit of width $a$, narrowing the slit makes the central maximum:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "Il primo minimo è a $\\sin\\theta=\\lambda/a$: più $a$ è piccola, più il massimo centrale è largo."
        en: "The first minimum is at $\\sin\\theta=\\lambda/a$: the smaller $a$, the wider the central maximum."
  origin: originale
  choices:
    - text:
        it: si allarga
        en: wider
      correct: true
    - text:
        it: si restringe
        en: narrower
      correct: false
    - text:
        it: resta uguale
        en: unchanged
      correct: false
    - text:
        it: scompare
        en: disappear
      correct: false
- id: quiz-q511
  topic: radiazione-materia
  objectives:
    - radiazione-materia.2
  difficulty: 2
  kind: static
  statement:
    it: Calcola l'angolo limite per la riflessione totale tra vetro ($n=1{,}5$) e aria (in gradi).
    en: Compute the critical angle for total internal reflection between glass ($n=1.5$) and air (in degrees).
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $\sin\theta_c=1/1{,}5$ ⇒ $\theta_c\simeq41,8°$.
        en: $\sin\theta_c=1/1.5$ ⇒ $\theta_c\simeq41.8°$.
  origin: originale
  answer:
    - label:
        it: Risultato
        en: Result
      value: 41.81
      unit: °
      tol: 0.03
- id: quiz-q512
  topic: radiazione-materia
  objectives:
    - radiazione-materia.2
  difficulty: 2
  kind: static
  statement:
    it: Luce che passa dall'aria all'acqua ($n=1{,}33$) all'incidenza normale. Calcola la frazione di intensità riflessa (in %).
    en: Light passes from air to water ($n=1.33$) at normal incidence. Compute the fraction of intensity reflected (in %).
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $R=\left(\frac{n_1-n_2}{n_1+n_2}\right)^2=(0{,}33/2{,}33)^2\simeq2,01$%.
        en: $R=\left(\frac{n_1-n_2}{n_1+n_2}\right)^2=(0.33/2.33)^2\simeq2.01$%.
  origin: originale
  answer:
    - label:
        it: Risultato
        en: Result
      value: 2.006
      unit: '%'
      tol: 0.03
- id: quiz-q513
  topic: radiazione-materia
  objectives:
    - radiazione-materia.6
  difficulty: 2
  kind: static
  statement:
    it: 'Young: fenditure a 0,2 mm, schermo a 2 m, λ = 600 nm. Calcola la distanza tra due frange chiare consecutive (in mm).'
    en: 'Young: slits 0.2 mm apart, screen at 2 m, λ = 600 nm. Compute the distance between two consecutive bright fringes (in mm).'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $\Delta y=\lambda D/d=600\times10^{-9}\cdot2/(2\times10^{-4})=6$ mm.
        en: $\Delta y=\lambda D/d=600\times10^{-9}\cdot2/(2\times10^{-4})=6$ mm.
  origin: originale
  answer:
    - label:
        it: Risultato
        en: Result
      value: 6
      unit: mm
      tol: 0.03
- id: quiz-q514
