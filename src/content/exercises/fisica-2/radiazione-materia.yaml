  statement:
    it: Luce non polarizzata di intensità $I_0=40$ W/m² attraversa due polarizzatori con assi a 60°. Calcola l'intensità finale (in W/m²).
    en: Unpolarised light of intensity $I_0=40$ W/m² goes through two polarisers with axes at 60°. Compute the final intensity (in W/m²).
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
