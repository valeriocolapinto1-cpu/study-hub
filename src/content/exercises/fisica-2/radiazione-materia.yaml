- id: quiz-q504
  topic: radiazione-materia
  objectives:
    - radiazione-materia.2
  difficulty: 1
  kind: static
  statement:
    it: 'La riflessione totale può avvenire quando la luce passa:'
    en: 'Total internal reflection can occur when light passes:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "Da Snell $\\sin\\theta_2=\\frac{n_1}{n_2}\\sin\\theta_1$: se $n_1>n_2$ e $\\sin\\theta_1>n_2/n_1$ non esiste angolo di rifrazione."
        en: "From Snell $\\sin\\theta_2=\\frac{n_1}{n_2}\\sin\\theta_1$: if $n_1>n_2$ and $\\sin\\theta_1>n_2/n_1$ there is no refraction angle."
  origin: originale
  choices:
    - text:
        it: da un mezzo a indice maggiore a uno a indice minore, oltre l'angolo limite
        en: from a medium of higher index to one of lower index, beyond the critical angle
      correct: true
    - text:
        it: da un mezzo a indice minore a uno a indice maggiore
        en: from a medium of lower index to one of higher index
      correct: false
    - text:
        it: solo all'incidenza normale
        en: only at normal incidence
      correct: false
    - text:
        it: solo all'angolo di Brewster
        en: only at Brewster's angle
      correct: false
- id: quiz-q505
  topic: radiazione-materia
  objectives:
    - radiazione-materia.4
  difficulty: 1
  kind: static
  statement:
    it: "All'angolo di Brewster la luce riflessa è:"
    en: "At Brewster's angle the reflected light is:"
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "Per $\\tan\\theta_B=n_2/n_1$ la componente con $\\vec E$ nel piano di incidenza non viene riflessa: resta solo quella perpendicolare."
        en: "For $\\tan\\theta_B=n_2/n_1$ the component with $\\vec E$ in the plane of incidence is not reflected: only the perpendicular one remains."
  origin: originale
  choices:
    - text:
        it: polarizzata linearmente perpendicolarmente al piano di incidenza
        en: linearly polarised perpendicular to the plane of incidence
      correct: true
    - text:
        it: polarizzata nel piano di incidenza
        en: polarised in the plane of incidence
      correct: false
    - text:
        it: non polarizzata
        en: unpolarised
      correct: false
    - text:
        it: assente
        en: absent
      correct: false
