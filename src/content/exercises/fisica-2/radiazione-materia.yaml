        en: The first polariser transmits $I_0/2=20$ W/m²; the second, by Malus, $20\cos^260°=5$ W/m².
  origin: originale
  answer:
    - label:
        it: Risultato
        en: Result
      value: 5
      unit: W/m²
      tol: 0.03
