- id: quiz-q307
  topic: magnetismo-nella-materia
  objectives:
    - magnetismo-nella-materia.2
  difficulty: 1
  kind: static
  statement:
    it: 'Alla superficie di separazione tra due materiali magnetici (senza correnti libere superficiali) sono continue:'
    en: 'At the interface between two magnetic materials (with no free surface currents) the following are continuous:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $\nabla\cdot\vec B=0$ dà $B_{1n}=B_{2n}$; $\oint\vec H\cdot d\vec l=I_{lib}=0$ dà $H_{1t}=H_{2t}$.
        en: $\nabla\cdot\vec B=0$ gives $B_{1n}=B_{2n}$; $\oint\vec H\cdot d\vec l=I_{lib}=0$ gives $H_{1t}=H_{2t}$.
  origin: originale
  choices:
    - text:
        it: la componente normale di $\vec B$ e quella tangenziale di $\vec H$
        en: the normal component of $\vec B$ and the tangential component of $\vec H$
      correct: true
    - text:
        it: la componente tangenziale di $\vec B$ e quella normale di $\vec H$
        en: the tangential component of $\vec B$ and the normal component of $\vec H$
      correct: false
    - text:
        it: tutte le componenti di $\vec B$
        en: all components of $\vec B$
      correct: false
    - text:
        it: tutte le componenti di $\vec H$
        en: all components of $\vec H$
      correct: false
- id: quiz-q314
  topic: magnetismo-nella-materia
  objectives:
    - magnetismo-nella-materia.5
  difficulty: 2
  kind: static
  figure:
    diagram:
      type: magnetic-field
      params: { source: toroid, gap: true, radiusLabel: l = 2πR, gapLabel: h = l/1000 }
  statement:
    it: "In un nucleo di ferro ($\\mu_r=1000$, lunghezza media $l$) si pratica un traferro di spessore $h=l/1000$. A parità di corrente, il campo nel traferro diventa circa:"
    en: "An air gap of thickness $h=l/1000$ is cut in an iron core ($\\mu_r=1000$, mean length $l$). For the same current, the field in the gap becomes about:"
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "$B=\\frac{\\mu_0NI}{l/\\mu_r+h}$: senza traferro il denominatore è $l/1000$, con il traferro diventa $2l/1000$, quindi $B$ si dimezza."
        en: "$B=\\frac{\\mu_0NI}{l/\\mu_r+h}$: without the gap the denominator is $l/1000$, with the gap it becomes $2l/1000$, so $B$ halves."
  origin: originale
  choices:
    - text:
        it: la metà di quello senza traferro
        en: half of that without the gap
      correct: true
    - text:
        it: uguale
        en: the same
      correct: false
    - text:
        it: un millesimo
        en: one thousandth
      correct: false
    - text:
        it: il doppio
        en: twice
      correct: false
