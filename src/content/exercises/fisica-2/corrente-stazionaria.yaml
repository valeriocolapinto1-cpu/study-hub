- id: quiz-q204
  topic: corrente-stazionaria
  objectives:
    - corrente-stazionaria.7
  difficulty: 1
  kind: static
  statement:
    it: "Durante la carica di un condensatore da parte di un generatore ideale attraverso una resistenza $R$, l'energia dissipata per effetto Joule è:"
    en: "While an ideal generator charges a capacitor through a resistance $R$, the energy dissipated by Joule heating is:"
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "Il generatore fornisce $C\\mathcal E^2$: metà va nel condensatore e metà si dissipa, qualunque sia $R$."
        en: "The generator supplies $C\\mathcal E^2$: half goes into the capacitor and half is dissipated, whatever $R$ is."
  origin: originale
  choices:
    - text:
        it: uguale all'energia finale immagazzinata nel condensatore
        en: equal to the final energy stored in the capacitor
      correct: true
    - text:
        it: nulla se $R$ è piccola
        en: zero if $R$ is small
      correct: false
    - text:
        it: il doppio dell'energia immagazzinata
        en: twice the stored energy
      correct: false
    - text:
        it: dipendente da $R$
        en: dependent on $R$
      correct: false
- id: quiz-q205
  topic: corrente-stazionaria
  objectives:
    - corrente-stazionaria.6
  difficulty: 1
  kind: static
  statement:
    it: "Per misurare una resistenza molto grande con il metodo voltamperometrico conviene:"
    en: "To measure a very large resistance with the voltmeter-ammeter method it is better to place:"
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "A monte si misura $R+R_A$: l'errore è trascurabile se $R\\gg R_A$. A valle si misurerebbe il parallelo con $R_V$, molto sbagliato se $R$ è confrontabile con $R_V$."
        en: "Upstream one measures $R+R_A$: the error is negligible if $R\\gg R_A$. Downstream one would measure the parallel with $R_V$, badly wrong if $R$ is comparable with $R_V$."
  origin: originale
  choices:
    - text:
        it: il voltmetro a monte (su resistenza e amperometro)
        en: the voltmeter upstream (across resistor and ammeter)
      correct: true
    - text:
        it: il voltmetro a valle (in parallelo alla sola resistenza)
        en: the voltmeter downstream (in parallel with the resistor only)
      correct: false
    - text:
        it: indifferente
        en: it makes no difference
      correct: false
    - text:
        it: non usare l'amperometro
        en: no ammeter at all
      correct: false
