- id: quiz-q201
  topic: corrente-stazionaria
  objectives:
    - corrente-stazionaria.1
  difficulty: 1
  kind: static
  statement:
    it: "In regime stazionario l'equazione di continuità si riduce a:"
    en: "In the steady regime the continuity equation reduces to:"
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "$\\nabla\\cdot\\vec J+\\partial\\rho/\\partial t=0$ e in regime stazionario $\\partial\\rho/\\partial t=0$: da qui la legge dei nodi."
        en: "$\\nabla\\cdot\\vec J+\\partial\\rho/\\partial t=0$ and in the steady regime $\\partial\\rho/\\partial t=0$: hence the node law."
  origin: originale
  choices:
    - text:
        it: $\nabla\cdot\vec J=0$
        en: $\nabla\cdot\vec J=0$
      correct: true
    - text:
        it: $\nabla\times\vec J=0$
        en: $\nabla\times\vec J=0$
      correct: false
    - text:
        it: $\vec J=0$
        en: $\vec J=0$
      correct: false
    - text:
        it: $\partial\rho/\partial t=\nabla\cdot\vec J$
        en: $\partial\rho/\partial t=\nabla\cdot\vec J$
      correct: false
