- id: quiz-q209
  topic: corrente-stazionaria
  objectives:
    - corrente-stazionaria.7
  difficulty: 2
  kind: static
  statement:
    it: Un condensatore si scarica attraverso una resistenza con $\tau=2$ s. Dopo quanti secondi la sua tensione si è dimezzata?
    en: A capacitor discharges through a resistance with $\tau=2$ s. After how many seconds has its voltage halved?
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $V=V_0e^{-t/\tau}=V_0/2$ per $t=\tau\ln2\simeq1,39$ s.
        en: $V=V_0e^{-t/\tau}=V_0/2$ for $t=\tau\ln2\simeq1.39$ s.
  origin: originale
  answer:
    - label:
        it: Risultato
        en: Result
      value: 1.386
      unit: s
      tol: 0.03
- id: quiz-q210
  topic: corrente-stazionaria
  objectives:
    - corrente-stazionaria.4
  difficulty: 2
  kind: static
  statement:
    it: Generatore con f.e.m. $\mathcal E=12$ V e resistenza interna $r=2\ \Omega$. Calcola la massima potenza trasferibile a un carico (in W).
    en: Generator with emf $\mathcal E=12$ V and internal resistance $r=2\ \Omega$. Compute the maximum power that can be transferred to a load (in W).
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "Il massimo si ha per $R_L=r$: $P_{max}=\\mathcal E^2/(4r)=144/8=18$ W."
        en: "The maximum occurs for $R_L=r$: $P_{max}=\\mathcal E^2/(4r)=144/8=18$ W."
  origin: originale
  answer:
    - label:
        it: Risultato
        en: Result
      value: 18
      unit: W
      tol: 0.03
