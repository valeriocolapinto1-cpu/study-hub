- id: quiz-q207
  topic: corrente-stazionaria
  objectives:
    - corrente-stazionaria.5
  difficulty: 2
  kind: static
  statement:
    it: Tre resistori da $R=6\ \Omega$ sono collegati in parallelo e il gruppo è in serie a un resistore da $4\ \Omega$. Calcola la resistenza equivalente (in Ω).
    en: Three $R=6\ \Omega$ resistors are connected in parallel and the group is in series with a $4\ \Omega$ resistor. Compute the equivalent resistance (in Ω).
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Il parallelo di tre resistenze da 6 Ω vale 2 Ω; in serie a 4 Ω si ottengono 6 Ω.
        en: The parallel of three 6 Ω resistances is 2 Ω; in series with 4 Ω this gives 6 Ω.
  origin: originale
  answer:
    - label:
        it: Risultato
        en: Result
      value: 6
      unit: Ω
      tol: 0.03
