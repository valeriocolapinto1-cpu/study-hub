- id: quiz-q212
  topic: corrente-stazionaria
  objectives:
    - corrente-stazionaria.7
  difficulty: 2
  kind: static
  statement:
    it: "Un condensatore $C$ carico a $V_0$ viene collegato a un secondo condensatore identico scarico. La tensione finale e l'energia finale sono:"
    en: "A capacitor $C$ charged to $V_0$ is connected to a second, identical, uncharged capacitor. The final voltage and final energy are:"
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "La carica si conserva: $V_f=CV_0/(2C)=V_0/2$. L'energia finale è $2\\cdot\\frac12C(V_0/2)^2=\\frac14CV_0^2$, metà di quella iniziale (il resto si dissipa)."
        en: "Charge is conserved: $V_f=CV_0/(2C)=V_0/2$. The final energy is $2\\cdot\\frac12C(V_0/2)^2=\\frac14CV_0^2$, half the initial one (the rest is dissipated)."
  origin: originale
  choices:
    - text:
        it: $V_0/2$ ed energia dimezzata
        en: $V_0/2$ and half the energy
      correct: true
    - text:
        it: $V_0/2$ ed energia conservata
        en: $V_0/2$ and energy conserved
      correct: false
    - text:
        it: $V_0$ ed energia dimezzata
        en: $V_0$ and half the energy
      correct: false
    - text:
        it: $V_0/\sqrt2$ ed energia conservata
        en: $V_0/\sqrt2$ and energy conserved
      correct: false
- id: quiz-q213
  topic: corrente-stazionaria
  objectives:
    - corrente-stazionaria.6
  difficulty: 2
  kind: static
  statement:
    it: "Nel ponte di Wheatstone all'equilibrio ($R_1$, $R_2$ su un ramo, $R_3$, $R_4$ sull'altro) vale:"
    en: "In a balanced Wheatstone bridge ($R_1$, $R_2$ on one branch, $R_3$, $R_4$ on the other):"
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "All'equilibrio i punti intermedi sono allo stesso potenziale: $\\frac{R_2}{R_1+R_2}=\\frac{R_4}{R_3+R_4}$, cioè $R_1/R_2=R_3/R_4$."
        en: "At balance the middle points are at the same potential: $\\frac{R_2}{R_1+R_2}=\\frac{R_4}{R_3+R_4}$, that is $R_1/R_2=R_3/R_4$."
  origin: originale
  choices:
    - text:
        it: $R_1/R_2=R_3/R_4$
        en: $R_1/R_2=R_3/R_4$
      correct: true
    - text:
        it: $R_1R_2=R_3R_4$
        en: $R_1R_2=R_3R_4$
      correct: false
    - text:
        it: $R_1+R_2=R_3+R_4$
        en: $R_1+R_2=R_3+R_4$
      correct: false
    - text:
        it: $R_1/R_3=R_4/R_2$
        en: $R_1/R_3=R_4/R_2$
      correct: false
