        en: $U=\tfrac12CV^2=\tfrac12\cdot88.5\times10^{-12}\cdot10^4\simeq443$ nJ.
  origin: originale
  answer:
    - label:
        it: Risultato
        en: Result
      value: 442.7
      unit: nJ
      tol: 0.03
