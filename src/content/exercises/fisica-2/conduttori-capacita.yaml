- id: quiz-q114
  topic: conduttori-capacita
  objectives:
    - conduttori-capacita.4
  difficulty: 2
  kind: static
  statement:
    it: 'Un condensatore resta collegato a un generatore di tensione $V$ mentre si raddoppia la distanza tra le armature. La carica sulle armature:'
    en: 'A capacitor stays connected to a voltage generator $V$ while the distance between the plates is doubled. The charge on the plates:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $V$ è fissata dal generatore e $C=\varepsilon_0S/d$ si dimezza, quindi $Q=CV$ si dimezza.
        en: $V$ is fixed by the generator and $C=\varepsilon_0S/d$ halves, so $Q=CV$ halves.
  origin: originale
  choices:
    - text:
        it: si dimezza
        en: halves
      correct: true
    - text:
        it: raddoppia
        en: doubles
      correct: false
    - text:
        it: resta uguale
        en: stays the same
      correct: false
    - text:
        it: si riduce a un quarto
        en: drops to a quarter
      correct: false
