- id: quiz-q313
  topic: magnetostatica-nel-vuoto
  objectives:
    - magnetostatica-nel-vuoto.1
  difficulty: 2
  kind: static
  figure:
    diagram:
      type: uniform-field
      params: { field: B-in, object: particle }
  statement:
    it: "Un protone e un elettrone entrano con la stessa velocità, perpendicolarmente, nello stesso campo magnetico uniforme. Rispetto al raggio dell'elettrone, quello del protone è:"
    en: "A proton and an electron enter the same uniform magnetic field perpendicularly with the same speed. Compared with the electron's radius, the proton's is:"
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "$r=mv/(|q|B)$: le cariche hanno lo stesso modulo, quindi il raggio è proporzionale alla massa ($m_p/m_e\\simeq1836$); il segno opposto inverte il verso di rotazione."
        en: "$r=mv/(|q|B)$: the charges have the same magnitude, so the radius is proportional to the mass ($m_p/m_e\\simeq1836$); the opposite sign reverses the sense of rotation."
  origin: originale
  choices:
    - text:
        it: circa 1836 volte maggiore, con verso di rotazione opposto
        en: about 1836 times larger, with opposite sense of rotation
      correct: true
    - text:
        it: uguale, con verso opposto
        en: the same, with opposite sense
      correct: false
    - text:
        it: circa 1836 volte minore
        en: about 1836 times smaller
      correct: false
    - text:
        it: uguale e con lo stesso verso
        en: the same and with the same sense
      correct: false
