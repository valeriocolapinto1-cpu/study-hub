  difficulty: 1
  kind: static
  statement:
    it: "La II equazione di Maxwell $\\nabla\\cdot\\vec B=0$ esprime il fatto che:"
    en: "Maxwell's second equation $\\nabla\\cdot\\vec B=0$ expresses the fact that:"
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "Il flusso di $\\vec B$ attraverso una superficie chiusa è nullo: le linee di campo sono chiuse e non esistono cariche magnetiche isolate."
        en: "The flux of $\\vec B$ through a closed surface is zero: field lines are closed and there are no isolated magnetic charges."
  origin: originale
  choices:
    - text:
        it: non esistono monopoli magnetici
        en: there are no magnetic monopoles
      correct: true
    - text:
        it: il campo magnetico è conservativo
        en: the magnetic field is conservative
      correct: false
    - text:
        it: le correnti sono stazionarie
        en: the currents are steady
      correct: false
    - text:
        it: $\vec B$ è sempre uniforme
        en: $\vec B$ is always uniform
      correct: false
- id: quiz-q303
  topic: magnetostatica-nel-vuoto
  objectives:
    - magnetostatica-nel-vuoto.6
  difficulty: 1
  kind: static
  figure:
    diagram:
      type: magnetic-field
      params: { source: wire-pair, forces: false }
  statement:
    it: 'Due fili paralleli percorsi da correnti nello stesso verso:'
    en: 'Two parallel wires carrying currents in the same direction:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "Il campo del primo filo sul secondo, con $d\\vec F=I\\,d\\vec l\\times\\vec B$, dà una forza diretta verso il primo filo: $F/l=\\mu_0I_1I_2/(2\\pi d)$, attrattiva."
        en: "The field of the first wire at the second, with $d\\vec F=I\\,d\\vec l\\times\\vec B$, gives a force directed towards the first wire: $F/l=\\mu_0I_1I_2/(2\\pi d)$, attractive."
  origin: originale
  choices:
    - text:
        it: si attraggono
        en: attract each other
      correct: true
    - text:
        it: si respingono
        en: repel each other
      correct: false
    - text:
        it: non interagiscono
        en: do not interact
      correct: false
    - text:
        it: ruotano uno attorno all'altro
        en: rotate around each other
      correct: false
- id: quiz-q304
  topic: magnetostatica-nel-vuoto
  objectives:
    - magnetostatica-nel-vuoto.2
  difficulty: 1
  kind: static
  figure:
    diagram:
      type: uniform-field
      params: { field: B-right, object: loop, angle: 50, forces: false }
  statement:
    it: 'Una spira percorsa da corrente in un campo magnetico uniforme tende a disporsi:'
    en: 'A current loop in a uniform magnetic field tends to settle:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "$\\vec M=\\vec m\\times\\vec B$ e $U=-\\vec m\\cdot\\vec B$: l'equilibrio stabile è $\\vec m\\parallel\\vec B$."
        en: "$\\vec M=\\vec m\\times\\vec B$ and $U=-\\vec m\\cdot\\vec B$: the stable equilibrium is $\\vec m\\parallel\\vec B$."
  origin: originale
  choices:
    - text:
        it: con il momento magnetico parallelo e concorde a $\vec B$
        en: with its magnetic moment parallel to and in the same direction as $\vec B$
      correct: true
    - text:
        it: con il piano della spira parallelo a $\vec B$
        en: with the plane of the loop parallel to $\vec B$
      correct: false
    - text:
        it: con il momento magnetico antiparallelo a $\vec B$
        en: with its magnetic moment antiparallel to $\vec B$
      correct: false
    - text:
        it: in qualsiasi posizione (nessun momento)
        en: in any position (no torque)
      correct: false
- id: quiz-q305
  topic: magnetostatica-nel-vuoto
  objectives:
    - magnetostatica-nel-vuoto.4
  difficulty: 1
  kind: static
  statement:
    it: 'Nel teorema della circuitazione di Ampère (caso stazionario) compare:'
    en: "Ampère's circuital theorem (steady case) involves:"
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "$\\oint\\vec B\\cdot d\\vec l=\\mu_0I_{conc}$: contano solo le correnti che attraversano una superficie delimitata dalla curva."
        en: "$\\oint\\vec B\\cdot d\\vec l=\\mu_0I_{conc}$: only the currents crossing a surface bounded by the curve count."
  origin: originale
  choices:
    - text:
        it: solo la corrente concatenata con la curva
        en: only the current linked with the curve
      correct: true
    - text:
        it: la corrente totale del circuito
        en: the total current of the circuit
      correct: false
    - text:
        it: la carica racchiusa
        en: the enclosed charge
      correct: false
    - text:
        it: il flusso di $\vec B$
        en: the flux of $\vec B$
      correct: false
