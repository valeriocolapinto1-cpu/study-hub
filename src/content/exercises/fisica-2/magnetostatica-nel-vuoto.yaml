- id: quiz-q301
  topic: magnetostatica-nel-vuoto
  objectives:
    - magnetostatica-nel-vuoto.1
  difficulty: 1
  kind: static
  figure:
    diagram:
      type: uniform-field
      params: { field: B-in, object: particle, forces: false }
  statement:
    it: 'Il lavoro compiuto dalla forza magnetica su una carica in moto è:'
    en: 'The work done by the magnetic force on a moving charge is:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "$\\vec F=q\\vec v\\times\\vec B$ è sempre perpendicolare a $\\vec v$: la potenza $\\vec F\\cdot\\vec v$ è nulla e l'energia cinetica non cambia."
        en: "$\\vec F=q\\vec v\\times\\vec B$ is always perpendicular to $\\vec v$: the power $\\vec F\\cdot\\vec v$ is zero and the kinetic energy does not change."
  origin: originale
  choices:
    - text:
        it: sempre nullo
        en: always zero
      correct: true
    - text:
        it: positivo se la carica è positiva
        en: positive if the charge is positive
      correct: false
    - text:
        it: uguale a $qvB$
        en: equal to $qvB$
      correct: false
    - text:
        it: massimo se $\vec v\perp\vec B$
        en: maximum if $\vec v\perp\vec B$
      correct: false
- id: quiz-q302
  topic: magnetostatica-nel-vuoto
