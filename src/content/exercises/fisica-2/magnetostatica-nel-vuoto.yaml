  statement:
    it: Un elettrone con velocità $v=10^6$ m/s entra perpendicolarmente in un campo $B=10$ mT. Calcola il raggio della traiettoria (in mm).
    en: An electron with speed $v=10^6$ m/s enters perpendicularly a field $B=10$ mT. Compute the radius of its trajectory (in mm).
