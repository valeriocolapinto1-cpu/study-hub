      unit: μT
      tol: 0.03
- id: quiz-q510
  topic: onde-elettromagnetiche
  objectives:
    - onde-elettromagnetiche.4
  difficulty: 2
  kind: static
  statement:
    it: Una lampadina irraggia isotropicamente 100 W. Calcola l'intensità a 2 m (in W/m²).
    en: A light bulb radiates 100 W isotropically. Compute the intensity at 2 m (in W/m²).
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $I=P/(4\pi r^2)=100/(16\pi)\simeq1,99$ W/m².
        en: $I=P/(4\pi r^2)=100/(16\pi)\simeq1.99$ W/m².
  origin: originale
  answer:
    - label:
        it: Risultato
        en: Result
      value: 1.989
      unit: W/m²
      tol: 0.03
