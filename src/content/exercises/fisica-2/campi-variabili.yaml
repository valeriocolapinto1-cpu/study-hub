  difficulty: 2
  kind: static
  statement:
    it: Una sbarretta lunga 20 cm scorre a 3 m/s su binari, perpendicolare a un campo $B=0{,}5$ T. Calcola la f.e.m. indotta (in V).
    en: A 20 cm bar slides at 3 m/s on rails, perpendicular to a field $B=0.5$ T. Compute the induced emf (in V).
  steps:
