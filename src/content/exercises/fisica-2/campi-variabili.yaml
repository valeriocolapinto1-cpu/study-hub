- id: quiz-q405
  topic: campi-variabili
  objectives:
    - campi-variabili.5
  difficulty: 1
  kind: static
  statement:
    it: "La legge di Felici afferma che la carica che attraversa un circuito di resistenza $R$ durante una variazione di flusso $\\Delta\\Phi$:"
    en: "Felici's law states that the charge flowing through a circuit of resistance $R$ during a flux change $\\Delta\\Phi$:"
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $Q=\int I\,dt=\int\frac{-d\Phi/dt}{R}dt=\frac{\Phi_i-\Phi_f}{R}$.
        en: $Q=\int I\,dt=\int\frac{-d\Phi/dt}{R}dt=\frac{\Phi_i-\Phi_f}{R}$.
  origin: originale
  choices:
    - text:
        it: vale $|\Delta\Phi|/R$ e non dipende dalla rapidità della variazione
        en: equals $|\Delta\Phi|/R$ and does not depend on how fast the change is
      correct: true
    - text:
        it: è proporzionale alla velocità di variazione
        en: is proportional to the rate of change
      correct: false
    - text:
        it: vale $R\Delta\Phi$
        en: equals $R\Delta\Phi$
      correct: false
    - text:
        it: è sempre nulla
        en: is always zero
      correct: false
- id: quiz-q406
  topic: campi-variabili
  objectives:
    - campi-variabili.3
  difficulty: 1
  kind: static
  statement:
    it: 'Il coefficiente di mutua induzione tra due circuiti:'
    en: 'The mutual-inductance coefficient between two circuits:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Dalla formula di Neumann $M$ è simmetrico e puramente geometrico (per mezzi lineari); inoltre $M\le\sqrt{L_1L_2}$.
        en: From Neumann's formula $M$ is symmetric and purely geometric (for linear media); moreover $M\le\sqrt{L_1L_2}$.
  origin: originale
  choices:
    - text:
        it: è simmetrico ($M_{12}=M_{21}$) e dipende solo dalla geometria
        en: is symmetric ($M_{12}=M_{21}$) and depends only on the geometry
      correct: true
    - text:
        it: dipende dalle correnti
        en: depends on the currents
      correct: false
    - text:
        it: è sempre maggiore di $\sqrt{L_1L_2}$
        en: is always greater than $\sqrt{L_1L_2}$
      correct: false
    - text:
        it: è diverso nei due versi
        en: differs in the two directions
      correct: false
- id: quiz-q407
  topic: campi-variabili
  objectives:
