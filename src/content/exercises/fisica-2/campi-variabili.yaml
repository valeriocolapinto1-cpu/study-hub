- id: quiz-q401
  topic: campi-variabili
  objectives:
    - campi-variabili.1
  difficulty: 1
  kind: static
  statement:
    it: 'La legge di Lenz afferma che la corrente indotta:'
    en: "Lenz's law states that the induced current:"
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: È il segno meno in $\mathcal E=-d\Phi/dt$ ed è una conseguenza della conservazione dell'energia.
        en: It is the minus sign in $\mathcal E=-d\Phi/dt$ and a consequence of energy conservation.
  origin: originale
  choices:
    - text:
        it: si oppone alla variazione di flusso che la genera
        en: opposes the change of flux that produces it
      correct: true
    - text:
        it: ha sempre il verso orario
        en: always flows clockwise
      correct: false
    - text:
        it: è proporzionale al flusso
        en: is proportional to the flux
      correct: false
    - text:
        it: rafforza la variazione di flusso
        en: reinforces the change of flux
      correct: false
- id: quiz-q402
  topic: campi-variabili
  objectives:
    - campi-variabili.2
  difficulty: 1
  kind: static
  statement:
    it: 'La forma locale della legge di Faraday (III equazione di Maxwell) è:'
    en: "The local form of Faraday's law (Maxwell's third equation) is:"
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Da $\oint\vec E\cdot d\vec l=-\frac{d}{dt}\int\vec B\cdot\hat n\,dS$ con Stokes, per un circuito fermo.
        en: From $\oint\vec E\cdot d\vec l=-\frac{d}{dt}\int\vec B\cdot\hat n\,dS$ with Stokes, for a circuit at rest.
  origin: originale
  choices:
    - text:
        it: $\nabla\times\vec E=-\partial\vec B/\partial t$
        en: $\nabla\times\vec E=-\partial\vec B/\partial t$
      correct: true
    - text:
        it: $\nabla\cdot\vec E=-\partial\vec B/\partial t$
        en: $\nabla\cdot\vec E=-\partial\vec B/\partial t$
      correct: false
    - text:
        it: $\nabla\times\vec B=-\partial\vec E/\partial t$
        en: $\nabla\times\vec B=-\partial\vec E/\partial t$
      correct: false
    - text:
        it: $\nabla\times\vec E=0$
        en: $\nabla\times\vec E=0$
      correct: false
- id: quiz-q403
  topic: campi-variabili
  objectives:
    - campi-variabili.8
  difficulty: 1
  kind: static
  statement:
    it: "La corrente di spostamento $\\varepsilon_0\\,\\partial\\vec E/\\partial t$ è stata introdotta per:"
    en: "The displacement current $\\varepsilon_0\\,\\partial\\vec E/\\partial t$ was introduced to:"
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Senza di essa $\nabla\cdot(\nabla\times\vec B)=0$ imporrebbe $\nabla\cdot\vec J=0$ anche fuori dal regime stazionario, contro l'equazione di continuità.
        en: Without it $\nabla\cdot(\nabla\times\vec B)=0$ would impose $\nabla\cdot\vec J=0$ even outside the steady regime, contradicting the continuity equation.
  origin: originale
  choices:
    - text:
        it: rendere la legge di Ampère compatibile con la conservazione della carica
        en: make Ampère's law consistent with charge conservation
      correct: true
    - text:
        it: spiegare l'effetto Hall
        en: explain the Hall effect
      correct: false
    - text:
        it: descrivere le correnti nei dielettrici
        en: describe currents in dielectrics
      correct: false
    - text:
        it: spiegare la legge di Lenz
        en: explain Lenz's law
      correct: false
