        it: Spiegazione
        en: Explanation
      body:
        it: $\mathcal E=vBl=3\cdot0{,}5\cdot0{,}2=0{,}3$ V.
        en: $\mathcal E=vBl=3\cdot0.5\cdot0.2=0.3$ V.
  origin: originale
  answer:
    - label:
        it: Risultato
        en: Result
      value: 0.3
      unit: V
      tol: 0.03
