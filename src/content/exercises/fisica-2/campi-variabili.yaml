- id: quiz-q413
  topic: campi-variabili
  objectives:
    - campi-variabili.1
  difficulty: 2
  kind: static
  statement:
    it: 'Una spira è ferma vicino a un filo rettilineo percorso da corrente costante. Se la spira si allontana dal filo, la corrente indotta nella spira:'
    en: 'A loop is at rest near a straight wire carrying a constant current. If the loop moves away from the wire, the current induced in the loop:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Allontanandosi il flusso diminuisce; per Lenz la corrente indotta tende a mantenerlo, quindi produce dentro la spira un campo concorde con quello del filo.
        en: Moving away, the flux decreases; by Lenz the induced current tends to keep it, so it produces inside the loop a field in the same direction as the wire's.
  origin: originale
  choices:
    - text:
        it: crea un campo che, dentro la spira, ha lo stesso verso di quello del filo
        en: creates a field that, inside the loop, has the same direction as the wire's field
      correct: true
    - text:
        it: crea un campo opposto a quello del filo
        en: creates a field opposite to the wire's field
      correct: false
    - text:
        it: è nulla perché la corrente del filo è costante
        en: is zero because the wire's current is constant
      correct: false
    - text:
        it: non dipende dalla velocità
        en: does not depend on the speed
      correct: false
- id: quiz-q414
  topic: campi-variabili
  objectives:
    - campi-variabili.8
  difficulty: 2
  kind: static
  statement:
    it: "In un condensatore piano circolare (raggio $R$) che si carica con corrente $I$, il campo magnetico tra le armature a distanza $r\\lt R$ dall'asse vale:"
    en: "In a circular parallel-plate capacitor (radius $R$) charging with current $I$, the magnetic field between the plates at distance $r\\lt R$ from the axis is:"
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "Solo la corrente di spostamento è concatenata, e in proporzione all'area: $B\\cdot2\\pi r=\\mu_0I\\,r^2/R^2$."
        en: "Only the displacement current is linked, in proportion to the area: $B\\cdot2\\pi r=\\mu_0I\\,r^2/R^2$."
  origin: originale
  choices:
    - text:
        it: $\dfrac{\mu_0Ir}{2\pi R^2}$
        en: $\dfrac{\mu_0Ir}{2\pi R^2}$
      correct: true
    - text:
        it: $\dfrac{\mu_0I}{2\pi r}$
        en: $\dfrac{\mu_0I}{2\pi r}$
      correct: false
    - text:
        it: zero
        en: zero
      correct: false
    - text:
        it: $\mu_0I/(2R)$
        en: $\mu_0I/(2R)$
      correct: false
