  difficulty: 2
  kind: static
  statement:
    it: Nel nullore la potenza erogata dal generatore pilota (di corrente) è nulla perché ai suoi capi la tensione è nulla.
    en: In the nullor the power delivered by the driving (current) source is zero because the voltage across it is zero.
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: 'Nel nullatore $v=0$ e $i=0$: nessuna potenza scambiata.'
        en: 'In the nullator $v=0$ and $i=0$: no power is exchanged.'
  choices:
    - text:
        it: Vero
        en: 'True'
      correct: true
    - text:
        it: Falso
        en: 'False'
      correct: false
  origin: originale
