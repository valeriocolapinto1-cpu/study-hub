- id: q-i-027
  topic: generatori-controllati
  objectives:
    - generatori-controllati.1
  difficulty: 1
  kind: static
  statement:
    it: 'Un generatore di corrente controllato in tensione (VCCS) è descritto da:'
    en: 'A voltage-controlled current source (VCCS) is described by:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: 'VCCS: $i_2=g_m v_1$ con $i_1=0$.'
        en: 'VCCS: $i_2=g_m v_1$ with $i_1=0$.'
  choices:
    - text:
        it: $v_2=r_mi_1$
        en: $v_2=r_mi_1$
      correct: false
    - text:
        it: $v_2=\mu v_1$
        en: $v_2=\mu v_1$
      correct: false
    - text:
        it: $i_2=g_mv_1$
        en: $i_2=g_mv_1$
      correct: true
    - text:
        it: $i_2=\beta i_1$
        en: $i_2=\beta i_1$
      correct: false
  origin: originale
- id: q-i-028
  topic: generatori-controllati
  objectives:
    - generatori-controllati.1
  difficulty: 2
  kind: static
  statement:
    it: Per calcolare la resistenza equivalente con il metodo del generatore di prova si spengono anche i generatori controllati.
    en: To compute the equivalent resistance with the test-source method, the controlled sources are switched off as well.
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Si spengono solo gli indipendenti; i controllati restano.
        en: Only the independent sources are switched off; the controlled ones stay.
  choices:
    - text:
        it: Vero
        en: 'True'
      correct: false
    - text:
        it: Falso
        en: 'False'
      correct: true
  origin: originale
- id: q-i-029
  topic: generatori-controllati
  objectives:
    - generatori-controllati.1
  difficulty: 2
  kind: static
  statement:
    it: I generatori controllati sono elementi attivi.
    en: Controlled sources are active elements.
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Possono erogare potenza netta.
        en: They can deliver net power.
  choices:
    - text:
        it: Vero
        en: 'True'
      correct: true
    - text:
        it: Falso
        en: 'False'
      correct: false
  origin: originale
- id: r2-gc-1
  topic: generatori-controllati
  objectives:
    - generatori-controllati.2
  difficulty: 2
  kind: static
  statement:
    it: 'Un generatore $E=10\,\mathrm{V}$ in serie a $R_1=2\,\Omega$ è collegato al nodo $A$; da $A$ a massa c''è $R_2=2\,\Omega$. Un generatore di corrente controllato in tensione inietta nel nodo $A$ (da massa) la corrente $g\,v_A$ con $g=0{,}2\,\mathrm{S}$. Calcola $v_A$ e la potenza erogata dal generatore controllato.'
    en: 'A source $E=10\,\mathrm{V}$ in series with $R_1=2\,\Omega$ is connected to node $A$; from $A$ to ground there is $R_2=2\,\Omega$. A voltage-controlled current source injects into node $A$ (from ground) the current $g\,v_A$ with $g=0.2\,\mathrm{S}$. Find $v_A$ and the power delivered by the controlled source.'
  steps:
    - title:
        it: 'Equazione al nodo'
        en: 'Node equation'
      body:
        it: 'Il generatore controllato entra nell''equazione come un generatore di corrente, poi si sostituisce la grandezza di controllo: $\dfrac{10-v_A}{2}+0{,}2\,v_A=\dfrac{v_A}{2}\Rightarrow 5=0{,}8\,v_A\Rightarrow v_A=6{,}25\,\mathrm{V}$.'
        en: 'The controlled source enters the equation like a current source, then the controlling variable is substituted: $\dfrac{10-v_A}{2}+0.2\,v_A=\dfrac{v_A}{2}\Rightarrow 5=0.8\,v_A\Rightarrow v_A=6.25\,\mathrm{V}$.'
    - title:
        it: 'Potenza'
        en: 'Power'
      body:
        it: 'Eroga $g\,v_A=1{,}25\,\mathrm{A}$ verso il nodo a tensione $v_A$: $p=v_A\,g\,v_A=6{,}25\cdot1{,}25\approx7{,}81\,\mathrm{W}$.'
        en: 'It pushes $g\,v_A=1.25\,\mathrm{A}$ into the node at voltage $v_A$: $p=v_A\,g\,v_A=6.25\cdot1.25\approx7.81\,\mathrm{W}$.'
  answer:
    - label:
        it: '$v_A$'
        en: '$v_A$'
      value: 6.25
      unit: 'V'
    - label:
        it: 'Potenza erogata'
        en: 'Delivered power'
      value: 7.8125
      unit: 'W'
  origin: originale
- id: r2-gc-2
  topic: generatori-controllati
  objectives:
    - generatori-controllati.3
    - generatori-controllati.2
  difficulty: 2
  kind: static
  statement:
    it: 'Tra i morsetti $a$ e $b$ ci sono, in serie, un generatore $E=6\,\mathrm{V}$, un resistore $R=2\,\Omega$ e un generatore di tensione controllato in corrente $v_x=r\,i$ con $r=3\,\Omega$, dove $i$ è la corrente entrante nel morsetto $a$. Calcola l''equivalente di Thevenin visto da $a$-$b$.'
    en: 'Between terminals $a$ and $b$ there are, in series, a source $E=6\,\mathrm{V}$, a resistor $R=2\,\Omega$ and a current-controlled voltage source $v_x=r\,i$ with $r=3\,\Omega$, where $i$ is the current entering terminal $a$. Find the Thévenin equivalent seen from $a$-$b$.'
  steps:
    - title:
        it: 'Tensione a vuoto'
        en: 'Open-circuit voltage'
      body:
        it: 'A vuoto $i=0$, quindi anche $v_x=0$: $V_{th}=E=6\,\mathrm{V}$.'
        en: 'Open circuit: $i=0$, hence $v_x=0$ too: $V_{th}=E=6\,\mathrm{V}$.'
    - title:
        it: 'Resistenza equivalente'
        en: 'Equivalent resistance'
      body:
        it: 'Si spegne **solo** $E$; il generatore controllato resta, perché dipende da $i$. Con un generatore di prova: $v=R\,i+r\,i=5\,i\Rightarrow R_{th}=5\,\Omega$. Spegnendo anche $v_x$ si otterrebbe il valore sbagliato $2\,\Omega$.'
        en: 'Only $E$ is switched off; the controlled source stays, because it depends on $i$. With a test source: $v=R\,i+r\,i=5\,i\Rightarrow R_{th}=5\,\Omega$. Switching off $v_x$ too would give the wrong value $2\,\Omega$.'
  answer:
    - label:
        it: '$V_{th}$'
        en: '$V_{th}$'
      value: 6
      unit: 'V'
    - label:
        it: '$R_{th}$'
        en: '$R_{th}$'
      value: 5
      unit: 'Ω'
  origin: originale
