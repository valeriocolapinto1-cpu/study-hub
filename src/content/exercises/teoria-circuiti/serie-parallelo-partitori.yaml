- id: q-ii-044
  topic: serie-parallelo-partitori
  objectives:
    - serie-parallelo-partitori.1
  difficulty: 2
  kind: static
  statement:
    it: Due resistori in parallelo hanno resistenza equivalente maggiore di ciascuno dei due.
    en: Two resistors in parallel have an equivalent resistance larger than either of them.
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Il parallelo ha resistenza minore del minore dei due.
        en: The parallel has a resistance smaller than the smaller of the two.
  choices:
    - text:
        it: Vero
        en: 'True'
      correct: false
    - text:
        it: Falso
        en: 'False'
      correct: true
  origin: originale
- id: q-ii-047
  topic: serie-parallelo-partitori
  objectives:
    - serie-parallelo-partitori.1
  difficulty: 1
  kind: static
  statement:
    it: Per $n$ resistori in serie $R_{eq}=$ ___.
    en: For $n$ resistors in series $R_{eq}=$ ___.
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Le resistenze si sommano.
        en: The resistances add.
  choices:
    - text:
        it: $1/\sum R_k$
        en: $1/\sum R_k$
      correct: false
    - text:
        it: $\sum R_k$
        en: $\sum R_k$
      correct: true
    - text:
        it: $\prod R_k$
        en: $\prod R_k$
      correct: false
    - text:
        it: $\sum 1/R_k$
        en: $\sum 1/R_k$
      correct: false
  origin: originale
