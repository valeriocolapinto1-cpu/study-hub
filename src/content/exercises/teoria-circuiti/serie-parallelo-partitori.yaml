  difficulty: 1
  kind: static
  statement:
    it: "$R_1=1\\,\\Omega$ e $R_2=3\\,\\Omega$ in serie con $12\\,\\mathrm V$: la tensione su $R_2$ è"
    en: "$R_1=1\\,\\Omega$ and $R_2=3\\,\\Omega$ in series with $12\\,\\mathrm V$: the voltage across $R_2$ is"
  figure:
    netlist:
      elements:
        - type: V
          id: V1
          a: a
          b: "0"
          dc: 12
        - type: R
          id: R1
          a: a
          b: b
          value: 1
        - type: R
          id: R2
          a: b
          b: "0"
          value: 3
          show:
            v: v_2
