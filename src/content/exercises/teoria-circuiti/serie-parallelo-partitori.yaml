- id: q-ii-025
  topic: serie-parallelo-partitori
  objectives:
    - serie-parallelo-partitori.1
  difficulty: 1
  kind: static
  statement:
    it: "Due resistori $6\\,\\Omega$ e $3\\,\\Omega$ in parallelo equivalgono a:"
    en: "Two resistors of $6\\,\\Omega$ and $3\\,\\Omega$ in parallel are equivalent to:"
  figure:
    netlist:
      elements:
        - type: R
          id: R1
          a: a
          b: "0"
          value: 6
        - type: R
          id: R2
          a: a
          b: "0"
          value: 3
      ports:
        - id: AB
          plus: a
          minus: "0"
          label: R_{eq}
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $6\cdot3/9=2\,\Omega$.
        en: $6\cdot3/9=2\,\Omega$.
  choices:
    - text:
        it: $2\,\Omega$
        en: $2\,\Omega$
      correct: true
    - text:
        it: $18\,\Omega$
        en: $18\,\Omega$
      correct: false
    - text:
        it: $9\,\Omega$
        en: $9\,\Omega$
      correct: false
    - text:
        it: $4{,}5\,\Omega$
        en: $4.5\,\Omega$
      correct: false
  origin: originale
- id: q-ii-026
