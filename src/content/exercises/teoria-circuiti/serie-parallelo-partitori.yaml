        it: $12\,\mathrm V$
        en: $12\,\mathrm V$
      correct: false
  origin: originale
- id: q-ii-027
  topic: serie-parallelo-partitori
  objectives:
    - serie-parallelo-partitori.2
  difficulty: 2
  kind: static
  statement:
    it: "Partitore di corrente: $i$ entra nel parallelo di $G_1=1\\,\\mathrm S$ e $G_2=3\\,\\mathrm S$. La corrente in $G_2$ è:"
    en: "Current divider: $i$ enters the parallel of $G_1=1\\,\\mathrm S$ and $G_2=3\\,\\mathrm S$. The current in $G_2$ is:"
  figure:
    netlist:
      elements:
        - type: I
          id: i
          a: "0"
          b: a
          dc: 1
          show:
            value: false
        - type: R
          id: G1
          a: a
          b: "0"
          value: 1
          label: 1 S
          show:
            i: i_1
        - type: R
          id: G2
          a: a
          b: "0"
          value: 0.3333333333333333
          label: 3 S
          show:
            i: i_2
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $i_2=i\,G_2/(G_1+G_2)$.
        en: $i_2=i\,G_2/(G_1+G_2)$.
  choices:
    - text:
        it: $i/4$
        en: $i/4$
      correct: false
    - text:
        it: $3i$
        en: $3i$
      correct: false
    - text:
        it: $3i/4$
        en: $3i/4$
      correct: true
    - text:
        it: $i/3$
        en: $i/3$
      correct: false
  origin: originale
- id: q-ii-028
  topic: serie-parallelo-partitori
  objectives:
    - serie-parallelo-partitori.2
  difficulty: 2
  kind: static
  statement:
    it: Il partitore di tensione si applica correttamente se la corrente nei due resistori è la stessa.
    en: The voltage divider is correctly applied if the current in the two resistors is the same.
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Cioè in assenza di carico che sottragga corrente.
        en: That is, with no load drawing current.
  choices:
    - text:
        it: Vero
        en: 'True'
      correct: true
    - text:
        it: Falso
        en: 'False'
      correct: false
  origin: originale
