- id: q-vi-034
  topic: massimo-trasferimento-potenza
  objectives:
    - massimo-trasferimento-potenza.1
  difficulty: 2
  kind: static
  statement:
    it: 'Con carico puramente resistivo $R_L$ e $Z_{th}=R_{th}+jX_{th}$ il massimo si ha per:'
    en: 'With a purely resistive load $R_L$ and $Z_{th}=R_{th}+jX_{th}$, the maximum occurs for:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "Vincolo: $X_L=0$; il massimo è per $R_L=\\sqrt{R_{th}^2+X_{th}^2}$."
        en: "Constraint: $X_L=0$; the maximum is at $R_L=\\sqrt{R_{th}^2+X_{th}^2}$."
  choices:
    - text:
        it: $R_L=X_{th}$
        en: $R_L=X_{th}$
      correct: false
    - text:
        it: $R_L=|Z_{th}|$
        en: $R_L=|Z_{th}|$
      correct: true
    - text:
        it: $R_L=R_{th}$
        en: $R_L=R_{th}$
      correct: false
    - text:
        it: $R_L=0$
        en: $R_L=0$
      correct: false
  origin: originale
