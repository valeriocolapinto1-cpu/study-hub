- id: q-v-024
  topic: fasori-e-laplace
  objectives:
    - fasori-e-laplace.3
  difficulty: 2
  kind: static
  statement:
    it: 'Il legame tra fasori e Laplace è:'
    en: 'The link between phasors and Laplace is:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Sostituzione $s=j\omega$.
        en: Substitution $s=j\omega$.
  choices:
    - text:
        it: $H(j\omega)=H(\omega)$
        en: $H(j\omega)=H(\omega)$
      correct: false
    - text:
        it: $H(j\omega)=s$
        en: $H(j\omega)=s$
      correct: false
    - text:
        it: $H(j\omega)=1/H(s)$
        en: $H(j\omega)=1/H(s)$
      correct: false
    - text:
        it: $H(j\omega)=H(s)|_{s=j\omega}$ se il sistema è stabile
        en: $H(j\omega)=H(s)|_{s=j\omega}$ if the system is stable
      correct: true
  origin: originale
- id: q-v-025
  topic: fasori-e-laplace
  objectives:
    - fasori-e-laplace.1
  difficulty: 3
  kind: static
  statement:
    it: Se il sistema è instabile, $H(j\omega)$ descrive comunque la risposta a regime.
    en: If the system is unstable, $H(j\omega)$ still describes the steady-state response.
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: 'Non esiste un regime: i modi naturali divergono.'
        en: 'There is no steady state: the natural modes diverge.'
  choices:
    - text:
        it: Vero
        en: 'True'
      correct: false
    - text:
        it: Falso
        en: 'False'
      correct: true
  origin: originale
- id: r2-fl-1
  topic: fasori-e-laplace
  objectives:
    - fasori-e-laplace.2
  difficulty: 2
  kind: static
  statement:
    it: 'Per $H(s)=\dfrac{10}{s^2+2s+10}$ calcola modulo e fase di $H(j\omega)$ a $\omega=3\,\mathrm{rad/s}$.'
    en: 'For $H(s)=\dfrac{10}{s^2+2s+10}$ find magnitude and phase of $H(j\omega)$ at $\omega=3\,\mathrm{rad/s}$.'
  steps:
    - title:
        it: 'Svolgimento'
        en: 'Solution'
      body:
        it: 'Si pone $s=j3$: denominatore $-9+6j+10=1+6j$. $|H|=\dfrac{10}{\sqrt{37}}\approx1{,}644$, $\angle H=-\arctan6\approx-80{,}5^\circ$. Il modulo supera $1$: siamo vicini alla risonanza ($\omega_0=\sqrt{10}\approx3{,}16$).'
        en: 'Set $s=j3$: denominator $-9+6j+10=1+6j$. $|H|=\dfrac{10}{\sqrt{37}}\approx1.644$, $\angle H=-\arctan6\approx-80.5^\circ$. The magnitude exceeds $1$: we are close to resonance ($\omega_0=\sqrt{10}\approx3.16$).'
  answer:
    - label:
        it: '$|H(j3)|$'
        en: '$|H(j3)|$'
      value: 1.64399
    - label:
        it: '$\angle H(j3)$'
        en: '$\angle H(j3)$'
      value: -80.537678
      unit: '°'
  origin: originale
