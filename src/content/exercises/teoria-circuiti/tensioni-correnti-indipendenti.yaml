    it: Se $\mathbf v_t=(5,3)^{\mathsf T}$ e $F^{\mathsf T}=(-1\ \ 1)$, allora $v_c=$
    en: If $\mathbf v_t=(5,3)^{\mathsf T}$ and $F^{\mathsf T}=(-1\ \ 1)$, then $v_c=$
