- id: q-iii-022
  topic: potenza-complessa
  objectives:
    - potenza-complessa.1
  difficulty: 1
  kind: static
  statement:
    it: 'Con valori di picco la potenza attiva è:'
    en: 'With peak values the active power is:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $P=\tfrac12V_mI_m\cos\varphi$.
        en: $P=\tfrac12V_mI_m\cos\varphi$.
  choices:
    - text:
        it: $V_mI_m\sin\varphi$
        en: $V_mI_m\sin\varphi$
      correct: false
    - text:
        it: $\tfrac12V_mI_m\cos\varphi$
        en: $\tfrac12V_mI_m\cos\varphi$
      correct: true
    - text:
        it: $V_mI_m\cos\varphi$
        en: $V_mI_m\cos\varphi$
      correct: false
    - text:
        it: $\tfrac12V_mI_m$
        en: $\tfrac12V_mI_m$
      correct: false
  origin: originale
