- id: q-iii-026
  topic: potenza-complessa
  objectives:
    - potenza-complessa.1
  difficulty: 2
  kind: static
  statement:
    it: La potenza reattiva di un induttore ideale è positiva (convenzione degli utilizzatori).
    en: The reactive power of an ideal inductor is positive (passive sign convention).
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $Q_L=\omega L I^2>0$.
        en: $Q_L=\omega L I^2>0$.
  choices:
    - text:
        it: Vero
        en: 'True'
      correct: true
    - text:
        it: Falso
        en: 'False'
      correct: false
  origin: originale
- id: q-iii-027
  topic: potenza-complessa
  objectives:
    - potenza-complessa.1
  difficulty: 2
  kind: static
  statement:
    it: La potenza attiva media assorbita da un induttore o da un condensatore ideale è nulla in regime sinusoidale.
    en: The average active power absorbed by an ideal inductor or capacitor is zero in sinusoidal steady state.
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Solo scambio di energia.
        en: Energy is only exchanged.
  choices:
    - text:
        it: Vero
        en: 'True'
      correct: true
    - text:
        it: Falso
        en: 'False'
      correct: false
  origin: originale
