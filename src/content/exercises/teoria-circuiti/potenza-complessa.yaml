- id: q-iii-029
  topic: potenza-complessa
  objectives:
    - potenza-complessa.1
  difficulty: 2
  kind: static
  statement:
    it: "La potenza complessa è $S=P+jQ=\\dot V\\,\\dot I^{\\,\\square}$ (valori efficaci); al posto di $\\square$ va:"
    en: "The complex power is $S=P+jQ=\\dot V\\,\\dot I^{\\,\\square}$ (RMS values); $\\square$ stands for:"
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $S=\dot V\dot I^*$.
        en: $S=\dot V\dot I^*$.
  choices:
    - text:
        it: $*$ (coniugato)
        en: $*$ (conjugate)
      correct: true
    - text:
        it: $\mathsf T$
        en: $\mathsf T$
      correct: false
    - text:
        it: $2$
        en: $2$
      correct: false
    - text:
        it: $-1$
        en: $-1$
      correct: false
  origin: originale
