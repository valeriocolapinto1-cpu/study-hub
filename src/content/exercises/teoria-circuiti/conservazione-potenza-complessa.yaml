- id: q-iii-030
  topic: conservazione-potenza-complessa
  objectives:
    - conservazione-potenza-complessa.1
  difficulty: 2
  kind: static
  statement:
    it: 'La conservazione della potenza complessa afferma che:'
    en: 'Conservation of complex power states that:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "Tellegen applicato ai fasori: $\\sum\\dot V_k\\dot I_k^*=0$."
        en: "Tellegen applied to phasors: $\\sum\\dot V_k\\dot I_k^*=0$."
  choices:
    - text:
        it: $S$ è costante nel tempo
        en: $S$ is constant in time
      correct: false
    - text:
        it: la somma delle $S$ assorbite da tutti i rami è nulla
        en: the sum of the $S$ absorbed by all the branches is zero
      correct: true
    - text:
        it: la somma dei moduli $|S|$ è nulla
        en: the sum of the magnitudes $|S|$ is zero
      correct: false
    - text:
        it: $P=Q$
        en: $P=Q$
      correct: false
  origin: originale
- id: q-iii-031
  topic: conservazione-potenza-complessa
  objectives:
    - conservazione-potenza-complessa.1
  difficulty: 3
  kind: static
  statement:
    it: Poiché $\sum S_k=0$, anche la somma dei moduli $|S_k|$ è nulla.
    en: Since $\sum S_k=0$, the sum of the magnitudes $|S_k|$ is also zero.
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Si conservano $P$ e $Q$ separatamente, non i moduli.
        en: $P$ and $Q$ are conserved separately, not the magnitudes.
  choices:
    - text:
        it: Vero
        en: 'True'
      correct: false
    - text:
        it: Falso
        en: 'False'
      correct: true
  origin: originale
- id: q-iii-032
  topic: conservazione-potenza-complessa
  objectives:
    - conservazione-potenza-complessa.2
  difficulty: 2
  kind: static
  statement:
    it: 'Il bilancio delle potenze attive: potenza erogata dai generatori = potenza assorbita dai resistori.'
    en: 'Active-power balance: power delivered by the sources = power absorbed by the resistors.'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Gli elementi reattivi hanno $P=0$.
        en: Reactive elements have $P=0$.
  choices:
    - text:
        it: Vero
        en: 'True'
      correct: true
    - text:
        it: Falso
        en: 'False'
      correct: false
  origin: originale
- id: r2-cons-1
  topic: conservazione-potenza-complessa
  objectives:
    - conservazione-potenza-complessa.3
  difficulty: 2
  kind: static
  statement:
    it: 'Due carichi in parallelo assorbono $P_1=3\,\mathrm{kW}$, $Q_1=4\,\mathrm{kvar}$ e $P_2=3\,\mathrm{kW}$, $Q_2=-4\,\mathrm{kvar}$. Calcola potenza attiva, reattiva e apparente totali e confronta la potenza apparente con $|S_1|+|S_2|$.'
    en: 'Two loads in parallel absorb $P_1=3\,\mathrm{kW}$, $Q_1=4\,\mathrm{kvar}$ and $P_2=3\,\mathrm{kW}$, $Q_2=-4\,\mathrm{kvar}$. Find the total active, reactive and apparent power and compare the apparent power with $|S_1|+|S_2|$.'
  steps:
    - title:
        it: 'Cosa si conserva'
        en: 'What is conserved'
      body:
        it: 'Per Tellegen si conserva la potenza complessa $\bar S=P+jQ$, quindi si sommano $P$ e $Q$: $P=6\,\mathrm{kW}$, $Q=4-4=0$.'
        en: 'By Tellegen the complex power $\bar S=P+jQ$ is conserved, so $P$ and $Q$ add: $P=6\,\mathrm{kW}$, $Q=4-4=0$.'
    - title:
        it: 'Cosa non si conserva'
        en: 'What is not conserved'
      body:
        it: '$|\bar S|=\sqrt{P^2+Q^2}=6\,\mathrm{kVA}$, mentre $|S_1|+|S_2|=5+5=10\,\mathrm{kVA}$: le potenze apparenti non si sommano.'
        en: '$|\bar S|=\sqrt{P^2+Q^2}=6\,\mathrm{kVA}$, while $|S_1|+|S_2|=5+5=10\,\mathrm{kVA}$: apparent powers do not add.'
  answer:
    - label:
        it: '$P$ totale'
        en: 'Total $P$'
      value: 6
      unit: 'kW'
    - label:
        it: '$|\bar S|$ totale'
        en: 'Total $|\bar S|$'
      value: 6
      unit: 'kVA'
    - label:
        it: '$|S_1|+|S_2|$'
        en: '$|S_1|+|S_2|$'
      value: 10
      unit: 'kVA'
  origin: originale
