    en: With the Laplace method the initial conditions appear directly in the transformed equation.
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Tramite i termini $x(0^-)$.
        en: Through the terms $x(0^-)$.
  choices:
