- id: q-vi-028
  topic: prove-validita-connessioni
  objectives:
    - prove-validita-connessioni.1
  difficulty: 3
  kind: static
  statement:
    it: Le formule di somma delle matrici $Z$ valgono solo se, dopo il collegamento, le correnti entranti nelle porte restano uguali a quelle uscenti (prova di validità).
    en: The formulas adding the $Z$ matrices hold only if, after the connection, the currents entering the ports stay equal to those leaving them (validity test).
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Altrimenti la connessione altera il funzionamento dei singoli doppi bipoli.
        en: Otherwise the connection alters the behaviour of the individual two-ports.
  choices:
    - text:
        it: Vero
        en: 'True'
      correct: true
    - text:
        it: Falso
        en: 'False'
      correct: false
  origin: originale
- id: q-vi-029
  topic: prove-validita-connessioni
  objectives:
    - prove-validita-connessioni.1
  difficulty: 3
  kind: static
  statement:
    it: La prova di validità si esegue alimentando una connessione con le porte a vuoto e verificando che tra i morsetti da collegare non ci sia tensione.
    en: The validity test is carried out by driving a connection with the ports open and checking that there is no voltage between the terminals to be connected.
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Se la tensione è nulla si può collegare senza modificare le correnti.
        en: If the voltage is zero the connection can be made without changing the currents.
  choices:
    - text:
        it: Vero
        en: 'True'
      correct: true
    - text:
        it: Falso
        en: 'False'
      correct: false
  origin: originale
- id: q-vi-030
  topic: prove-validita-connessioni
  objectives:
    - prove-validita-connessioni.2
  difficulty: 3
  kind: static
  statement:
    it: 'Se la prova di validità fallisce per la connessione serie-serie, un rimedio è:'
    en: 'If the validity test fails for a series-series connection, a remedy is:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Ripristina l'uguaglianza delle correnti di porta.
        en: It restores the equality of the port currents.
  choices:
    - text:
        it: eliminare il carico
        en: removing the load
      correct: false
    - text:
        it: inserire trasformatori di isolamento (1:1) su una delle porte
        en: inserting (1:1) isolation transformers at one of the ports
      correct: true
    - text:
        it: usare solo condensatori
        en: using capacitors only
      correct: false
    - text:
        it: aumentare la frequenza
        en: raising the frequency
      correct: false
  origin: originale
- id: r2-pv-1
  topic: prove-validita-connessioni
  objectives:
    - prove-validita-connessioni.3
  difficulty: 2
  kind: static
  statement:
    it: 'La prova di validità di una connessione serie di due doppi bipoli fallisce (le condizioni di porta non sono rispettate). Quale rimedio la rende valida senza cambiare il comportamento dei due doppi bipoli?'
    en: 'The validity test for a series connection of two two-ports fails (the port conditions are not met). Which remedy makes it valid without changing the behaviour of the two two-ports?'
  steps:
    - title:
        it: 'Spiegazione'
        en: 'Explanation'
      body:
        it: 'Un trasformatore ideale $1{:}1$ su una porta di uno dei due doppi bipoli impone che le correnti della porta siano uguali e opposte (isola galvanicamente) senza alterare tensioni e correnti alla porta: la condizione di porta torna valida e le matrici si possono sommare.'
        en: 'An ideal $1{:}1$ transformer on one port of one of the two two-ports forces the port currents to be equal and opposite (galvanic isolation) without altering the port voltages and currents: the port condition holds again and the matrices can be added.'
  choices:
    - text:
        it: 'Inserire un trasformatore ideale $1{:}1$ su una porta di uno dei due doppi bipoli'
        en: 'Insert an ideal $1{:}1$ transformer on one port of one of the two two-ports'
      correct: true
    - text:
        it: "Sommare comunque le matrici $Z$: l'errore è trascurabile"
        en: 'Add the $Z$ matrices anyway: the error is negligible'
      correct: false
    - text:
        it: 'Collegare a massa tutti i morsetti inferiori'
        en: 'Ground all the lower terminals'
      correct: false
    - text:
        it: 'Usare le matrici $Y$ al posto delle $Z$'
        en: 'Use the $Y$ matrices instead of the $Z$ ones'
      correct: false
  origin: originale
