- id: q-vi-038
  topic: reti-n-porte
  objectives:
    - reti-n-porte.2
  difficulty: 3
  kind: static
  statement:
    it: 'Una rete a $N$ porte lineare è descritta da:'
    en: 'A linear $N$-port network is described by:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Una relazione per porta.
        en: One relation per port.
  choices:
    - text:
        it: $2N$ relazioni
        en: $2N$ relations
      correct: false
    - text:
        it: $N^2$ relazioni
        en: $N^2$ relations
      correct: false
    - text:
        it: una relazione
        en: a single relation
      correct: false
    - text:
        it: $N$ relazioni lineari tra le $2N$ variabili di porta
        en: $N$ linear relations among the $2N$ port variables
      correct: true
  origin: originale
