  difficulty: 2
  kind: static
  statement:
    it: 'Un doppio bipolo (2 porte) è caratterizzato, nei casi lineari, da:'
    en: 'In the linear case, a two-port (2 ports) is characterised by:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Due equazioni lineari tra le quattro variabili.
        en: Two linear equations among the four variables.
  choices:
