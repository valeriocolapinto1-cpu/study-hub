        it: $6$ relazioni
        en: $6$ relations
      correct: false
    - text:
        it: $2$ relazioni tra $v_1,v_2,i_1,i_2$
        en: $2$ relations among $v_1,v_2,i_1,i_2$
      correct: true
    - text:
        it: $4$ relazioni
        en: $4$ relations
