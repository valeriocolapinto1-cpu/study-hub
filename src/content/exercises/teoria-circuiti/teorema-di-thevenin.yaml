  statement:
    it: Il teorema di Thevenin non si applica se il carico contiene generatori controllati da grandezze interne al bipolo (accoppiamento tra bipolo e carico).
    en: Thévenin's theorem does not apply if the load contains sources controlled by quantities inside the one-port (coupling between one-port and load).
