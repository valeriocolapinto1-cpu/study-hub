        it: $Z_a+Z_b$
        en: $Z_a+Z_b$
      correct: true
    - text:
        it: $Y_a+Y_b$
        en: $Y_a+Y_b$
      correct: false
    - text:
        it: $Z_aZ_b$
        en: $Z_aZ_b$
      correct: false
    - text:
        it: $T_aT_b$
        en: $T_aT_b$
      correct: false
  origin: originale
