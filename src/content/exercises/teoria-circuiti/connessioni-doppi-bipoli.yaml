  difficulty: 2
  kind: static
  statement:
    it: 'Connessione serie-serie di due doppi bipoli: la matrice risultante è:'
    en: 'Series-series connection of two two-ports: the resulting matrix is:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Le impedenze si sommano.
        en: The impedances add.
  choices:
