        it: indipendente da
        en: independent of
      correct: false
    - text:
        it: opposta a
        en: opposite to
      correct: false
    - text:
        it: uguale a
        en: equal to
      correct: true
    - text:
        it: doppia di
        en: twice
      correct: false
  origin: originale
