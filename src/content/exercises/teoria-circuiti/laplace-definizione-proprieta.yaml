- id: q-iv-001
  topic: laplace-definizione-proprieta
  objectives:
    - laplace-definizione-proprieta.1
  difficulty: 1
  kind: static
  statement:
    it: 'La trasformata di Laplace unilatera di $x(t)$ è:'
    en: 'The unilateral Laplace transform of $x(t)$ is:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $X(s)=\int_{0^-}^{\infty}x(t)e^{-st}dt$.
        en: $X(s)=\int_{0^-}^{\infty}x(t)e^{-st}dt$.
  choices:
    - text:
        it: $\sum x(n)s^{-n}$
        en: $\sum x(n)s^{-n}$
      correct: false
    - text:
        it: $\int_0^{\infty}x(t)dt$
        en: $\int_0^{\infty}x(t)dt$
      correct: false
    - text:
        it: $\int_{0^-}^{\infty}x(t)e^{-st}dt$
        en: $\int_{0^-}^{\infty}x(t)e^{-st}dt$
      correct: true
    - text:
        it: $\int_{-\infty}^{\infty}x(t)e^{-st}dt$
        en: $\int_{-\infty}^{\infty}x(t)e^{-st}dt$
      correct: false
  origin: originale
- id: q-iv-002
  topic: laplace-definizione-proprieta
  objectives:
    - laplace-definizione-proprieta.3
  difficulty: 2
  kind: static
  statement:
    it: 'La trasformata della derivata è:'
    en: 'The transform of the derivative is:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $\mathcal L\{\dot x\}=sX-x(0^-)$.
        en: $\mathcal L\{\dot x\}=sX-x(0^-)$.
  choices:
    - text:
        it: $X(s)/s$
        en: $X(s)/s$
      correct: false
    - text:
        it: $sX(s)$
        en: $sX(s)$
      correct: false
    - text:
        it: $sX(s)-x(0^-)$
        en: $sX(s)-x(0^-)$
      correct: true
    - text:
        it: $X(s)-x(0^-)$
        en: $X(s)-x(0^-)$
      correct: false
  origin: originale
