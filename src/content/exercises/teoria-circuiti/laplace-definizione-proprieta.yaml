- id: q-iv-006
  topic: laplace-definizione-proprieta
  objectives:
    - laplace-definizione-proprieta.1
  difficulty: 2
  kind: static
  statement:
    it: La trasformata di Laplace è un operatore lineare.
    en: The Laplace transform is a linear operator.
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $\mathcal L\{ax+by\}=aX+bY$.
        en: $\mathcal L\{ax+by\}=aX+bY$.
  choices:
    - text:
        it: Vero
        en: 'True'
      correct: true
    - text:
        it: Falso
        en: 'False'
      correct: false
  origin: originale
