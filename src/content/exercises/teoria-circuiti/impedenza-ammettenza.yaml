    - impedenza-ammettenza.1
  difficulty: 1
  kind: static
  statement:
    it: "L'impedenza di un induttore è:"
    en: 'The impedance of an inductor is:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $Z_L=j\omega L$.
        en: $Z_L=j\omega L$.
  choices:
    - text:
        it: $1/(j\omega L)$
        en: $1/(j\omega L)$
      correct: false
    - text:
        it: $-j\omega L$
        en: $-j\omega L$
      correct: false
    - text:
        it: $j\omega L$
        en: $j\omega L$
      correct: true
    - text:
        it: $L$
        en: $L$
      correct: false
  origin: originale
