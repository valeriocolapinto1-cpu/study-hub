- id: q-iii-013
  topic: impedenza-ammettenza
  objectives:
    - impedenza-ammettenza.1
  difficulty: 2
  kind: static
  statement:
    it: "Un RC serie con $R=1\\,\\Omega$, $C=1\\,\\mathrm F$ a $\\omega=1$ ha impedenza:"
    en: "A series RC with $R=1\\,\\Omega$, $C=1\\,\\mathrm F$ at $\\omega=1$ has impedance:"
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $R+1/(j\omega C)=1-j$.
        en: $R+1/(j\omega C)=1-j$.
  choices:
    - text:
        it: $1-j$
        en: $1-j$
      correct: true
    - text:
        it: $j$
        en: $j$
      correct: false
    - text:
        it: $1+j$
        en: $1+j$
      correct: false
    - text:
        it: $1$
        en: $1$
      correct: false
  origin: originale
