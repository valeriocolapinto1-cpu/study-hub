- id: q-vi-012
  topic: teorema-di-norton
  objectives:
    - teorema-di-norton.1
  difficulty: 1
  kind: static
  statement:
    it: "L'equivalente di Norton è:"
    en: 'The Norton equivalent is:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $I_N$ in parallelo a $Z_N$.
        en: $I_N$ in parallel with $Z_N$.
  choices:
    - text:
        it: generatore di tensione in serie a un'impedenza
        en: a voltage source in series with an impedance
      correct: false
    - text:
        it: generatore di corrente in parallelo a un'impedenza
        en: a current source in parallel with an impedance
      correct: true
    - text:
        it: un solo generatore
        en: a single source
      correct: false
    - text:
        it: un trasformatore
        en: a transformer
      correct: false
  origin: originale
- id: q-vi-013
  topic: teorema-di-norton
  objectives:
    - teorema-di-norton.3
  difficulty: 2
  kind: static
  statement:
    it: '$I_N$ si calcola come:'
    en: '$I_N$ is computed as:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $I_N=i_{sc}=V_{th}/Z_{th}$.
        en: $I_N=i_{sc}=V_{th}/Z_{th}$.
  choices:
    - text:
        it: $Z_{th}/V_{th}$
        en: $Z_{th}/V_{th}$
      correct: false
    - text:
        it: $V_{th}\cdot Z_{th}$
        en: $V_{th}\cdot Z_{th}$
      correct: false
    - text:
        it: tensione a vuoto
        en: the open-circuit voltage
      correct: false
    - text:
        it: corrente di corto circuito della porta
        en: the short-circuit current of the port
      correct: true
  origin: originale
