        it: $(v_1,v_2)$ a $(i_1,i_2)$
        en: $(v_1,v_2)$ to $(i_1,i_2)$
      correct: false
    - text:
        it: $(v_1,i_2)$ a $(v_2,i_1)$
        en: $(v_1,i_2)$ to $(v_2,i_1)$
      correct: false
