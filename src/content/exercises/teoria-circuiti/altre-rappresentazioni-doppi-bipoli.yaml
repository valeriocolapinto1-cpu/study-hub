- id: q-vi-024
  topic: altre-rappresentazioni-doppi-bipoli
  objectives:
    - altre-rappresentazioni-doppi-bipoli.1
  difficulty: 3
  kind: static
  statement:
    it: Nelle matrici ibride $h$ le variabili indipendenti sono $i_1$ e $v_2$.
    en: In the hybrid matrices $h$ the independent variables are $i_1$ and $v_2$.
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $v_1=h_{11}i_1+h_{12}v_2$, $i_2=h_{21}i_1+h_{22}v_2$.
        en: $v_1=h_{11}i_1+h_{12}v_2$, $i_2=h_{21}i_1+h_{22}v_2$.
  choices:
    - text:
        it: Vero
        en: 'True'
      correct: true
    - text:
        it: Falso
        en: 'False'
      correct: false
  origin: originale
