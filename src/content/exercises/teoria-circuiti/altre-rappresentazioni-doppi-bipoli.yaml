  statement:
    it: 'La matrice di trasmissione (inversa) lega:'
    en: 'The (inverse) transmission matrix relates:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Rappresentazione a cascata.
        en: Cascade representation.
  choices:
    - text:
        it: $(i_1,i_2)$ a $(v_1,v_2)$
        en: $(i_1,i_2)$ to $(v_1,v_2)$
      correct: false
    - text:
        it: $(v_1,i_1)$ a $(v_2,-i_2)$
        en: $(v_1,i_1)$ to $(v_2,-i_2)$
      correct: true
