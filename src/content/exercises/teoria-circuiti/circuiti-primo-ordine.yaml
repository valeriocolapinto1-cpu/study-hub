        en: $10\,\mathrm s$
      correct: false
  origin: originale
- id: q-iii-004
  topic: circuiti-primo-ordine
  objectives:
    - circuiti-primo-ordine.2
  difficulty: 2
  kind: static
  statement:
    it: Nella risposta a $t>0$ con generatori spenti, $R_{eq}$ si calcola con un generatore di prova ai morsetti dell'elemento con memoria.
    en: In the response for $t>0$ with the sources off, $R_{eq}$ is computed with a test source at the terminals of the memory element.
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: Gli indipendenti sono spenti, i controllati restano.
        en: The independent sources are off, the controlled ones stay.
  choices:
    - text:
        it: Vero
        en: 'True'
      correct: true
    - text:
        it: Falso
        en: 'False'
      correct: false
  origin: originale
- id: q-iii-005
  topic: circuiti-primo-ordine
  objectives:
    - circuiti-primo-ordine.2
  difficulty: 3
  kind: static
  statement:
    it: Se $\tau$ risulta negativa, la risposta libera è una esponenziale decrescente.
    en: If $\tau$ turns out negative, the zero-input response is a decreasing exponential.
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: "$e^{-t/\\tau}$ con $\\tau<0$ cresce: instabilità."
        en: "$e^{-t/\\tau}$ with $\\tau<0$ grows: instability."
  choices:
    - text:
        it: Vero
        en: 'True'
      correct: false
    - text:
        it: Falso
        en: 'False'
      correct: true
  origin: originale
