- id: q-iii-001
  topic: circuiti-primo-ordine
  objectives:
    - circuiti-primo-ordine.1
  difficulty: 1
  kind: static
  statement:
    it: 'In un circuito RC la costante di tempo è:'
    en: 'In an RC circuit the time constant is:'
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $\tau=R_{eq}C$.
        en: $\tau=R_{eq}C$.
  choices:
    - text:
        it: $R/C$
        en: $R/C$
      correct: false
    - text:
        it: $1/(RC)$
        en: $1/(RC)$
      correct: false
    - text:
        it: $RC$
        en: $RC$
      correct: true
    - text:
        it: $C/R$
        en: $C/R$
      correct: false
  origin: originale
- id: q-iii-002
  topic: circuiti-primo-ordine
  objectives:
    - circuiti-primo-ordine.3
  difficulty: 1
  kind: static
  statement:
    it: "Dopo un tempo pari a $5\\tau$ una scarica esponenziale ha raggiunto circa:"
    en: "After a time equal to $5\\tau$ an exponential discharge has reached about:"
  steps:
    - title:
        it: Spiegazione
        en: Explanation
      body:
        it: $e^{-5}\approx0{,}0067$.
        en: $e^{-5}\approx0.0067$.
  choices:
    - text:
        it: esattamente zero
        en: exactly zero
      correct: false
    - text:
        it: il $10\%$ del valore iniziale
        en: $10\%$ of the initial value
      correct: false
    - text:
        it: meno dell'$1\%$ del valore iniziale
        en: less than $1\%$ of the initial value
      correct: true
    - text:
        it: il $50\%$ del valore iniziale
        en: $50\%$ of the initial value
      correct: false
  origin: originale
