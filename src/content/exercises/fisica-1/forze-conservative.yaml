- id: giro-della-morte
  topic: forze-conservative
  objectives:
    - forze-conservative.1
    - forze-conservative.2
    - forze-conservative.3
  difficulty: 2
  kind: static
  statement:
    it: >-
      Un carrellino di massa m = 0,50 kg parte da fermo da un'altezza h e scende lungo una guida liscia che
      termina con un giro della morte di raggio R = 0,40 m. Calcolare: (a) l'altezza minima h perché compia il
      giro senza staccarsi; (b) la velocità nel punto più basso in quel caso; (c) la reazione della guida nel
      punto più basso.
    en: >-
      A small cart of mass m = 0.50 kg starts from rest at height h and goes down a smooth track ending in a
      vertical loop of radius R = 0.40 m. Find: (a) the minimum height h for it to complete the loop without
      leaving the track; (b) the speed at the lowest point in that case; (c) the reaction of the track at the
      lowest point.
  figure:
    diagram:
      {
        'type': 'scene',
        'params':
          {
            'description':
              {
                'it': 'Guida liscia: discesa da quota h e giro della morte di raggio R; A punto più alto, B punto più basso.',
                'en': 'Smooth track: descent from height h and vertical loop of radius R; A top point, B lowest point.',
              },
            'items':
              [
                { 'kind': 'surface', 'from': [-3.4, 0], 'to': [4.6, 0] },
                {
                  'kind': 'line',
                  'points':
                    [
                      [-3, 2.5],
                      [-2.72, 2.256],
                      [-2.44, 2.025],
                      [-2.16, 1.806],
                      [-1.88, 1.6],
                      [-1.6, 1.406],
                      [-1.32, 1.225],
                      [-1.04, 1.056],
                      [-0.76, 0.9],
                      [-0.48, 0.756],
                      [-0.2, 0.625],
                      [0.08, 0.506],
                      [0.36, 0.4],
                      [0.64, 0.306],
                      [0.92, 0.225],
                      [1.2, 0.156],
                      [1.48, 0.1],
                      [1.76, 0.056],
                      [2.04, 0.025],
                      [2.32, 0.006],
                      [2.6, 0],
                    ],
                  'width': 'thick',
                },
                { 'kind': 'arc', 'center': [2.6, 1], 'r': 1, 'width': 'thick' },
                { 'kind': 'block', 'at': [-2.75, 2.7], 'w': 0.45, 'h': 0.35, 'angle': -40, 'label': '' },
                { 'kind': 'dim', 'from': [-3.5, 0], 'to': [-3.5, 2.5], 'label': 'h', 'offset': 0 },
                { 'kind': 'dim', 'from': [2.6, 1], 'to': [3.419, 1.574], 'label': 'R', 'offset': 0 },
                { 'kind': 'dot', 'at': [2.6, 2], 'label': 'A', 'labelAngle': 90 },
                { 'kind': 'dot', 'at': [2.6, 0], 'label': 'B', 'labelAngle': 270 },
              ],
          },
      }
  steps:
    - title:
        it: Condizione in cima
        en: Condition at the top
      body:
        it: 'In cima la reazione deve essere ≥ 0: \(mg + N = mv^2/R\) con \(N \ge 0\) dà \(v_{top}^2 \ge gR\).'
        en: >-
          At the top the reaction must be ≥ 0: \(mg + N = mv^2/R\) with \(N \ge 0\) gives \(v_{top}^2 \ge
          gR\).
    - title:
        it: Conservazione dell'energia
        en: Energy conservation
      body:
        it: >-
          La guida è liscia e la normale non lavora: \(mgh = mg\,2R + \tfrac12 m v_{top}^2 \ge \tfrac52 mgR
          \Rightarrow h_{min} = 2{,}5R = 1{,}00\ \text{m}\).
        en: >-
          The track is smooth and the normal force does no work: \(mgh = mg\,2R + \tfrac12 m v_{top}^2 \ge
          \tfrac52 mgR \Rightarrow h_{min} = 2.5R = 1.00\ \text{m}\).
    - title:
        it: Punto più basso
        en: Lowest point
      body:
        it: >-
          \(v = \sqrt{2gh} = \sqrt{5gR} \approx 4{,}43\ \text{m/s}\); \(N - mg = mv^2/R \Rightarrow N = 6mg
          \approx 29{,}4\ \text{N}\).
        en: >-
          \(v = \sqrt{2gh} = \sqrt{5gR} \approx 4.43\ \text{m/s}\); \(N - mg = mv^2/R \Rightarrow N = 6mg
          \approx 29.4\ \text{N}\).
  answer:
    - label:
        it: h_min
        en: h_min
      value: 1
      unit: m
    - label:
        it: v in basso
        en: v at the bottom
      value: 4.43
      unit: m/s
    - label:
        it: N in basso
        en: N at the bottom
      value: 29.4
      unit: 'N'
