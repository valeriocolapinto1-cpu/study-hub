- id: r2-tcg-1
  topic: teoria-cinetica-gas
  objectives:
    - teoria-cinetica-gas.4
  difficulty: 1
  kind: static
  statement:
    it: 'Nel calcolo della pressione si ottiene $p=n_v m\langle v_x^2\rangle$. Come si passa a $\langle v^2\rangle$?'
    en: 'In the pressure calculation one obtains $p=n_v m\langle v_x^2\rangle$. How does one get to $\langle v^2\rangle$?'
  steps:
    - title:
        it: 'Spiegazione'
        en: 'Explanation'
      body:
        it: 'Il gas è isotropo: nessuna direzione è privilegiata, quindi $\langle v_x^2\rangle=\langle v_y^2\rangle=\langle v_z^2\rangle$ e, poiché $v^2=v_x^2+v_y^2+v_z^2$, $\langle v_x^2\rangle=\tfrac13\langle v^2\rangle$.'
        en: 'The gas is isotropic: no direction is preferred, so $\langle v_x^2\rangle=\langle v_y^2\rangle=\langle v_z^2\rangle$ and, since $v^2=v_x^2+v_y^2+v_z^2$, $\langle v_x^2\rangle=\tfrac13\langle v^2\rangle$.'
  choices:
    - text:
        it: 'Per isotropia le tre medie sono uguali: $\langle v_x^2\rangle=\tfrac13\langle v^2\rangle$'
        en: 'By isotropy the three averages are equal: $\langle v_x^2\rangle=\tfrac13\langle v^2\rangle$'
      correct: true
    - text:
        it: '$\langle v_x^2\rangle=\langle v^2\rangle$ perché il moto è lungo $x$'
        en: '$\langle v_x^2\rangle=\langle v^2\rangle$ because motion is along $x$'
      correct: false
    - text:
        it: '$\langle v_x^2\rangle=\tfrac12\langle v^2\rangle$'
        en: '$\langle v_x^2\rangle=\tfrac12\langle v^2\rangle$'
      correct: false
    - text:
        it: '$\langle v_x\rangle^2=\langle v^2\rangle/3$'
        en: '$\langle v_x\rangle^2=\langle v^2\rangle/3$'
      correct: false
  origin: originale
