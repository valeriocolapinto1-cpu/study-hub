- id: velocita-quadratica-media
  topic: teoria-cinetica-gas
  objectives:
    - teoria-cinetica-gas.1
    - teoria-cinetica-gas.2
    - teoria-cinetica-gas.3
  difficulty: 1
  kind: static
  statement:
    it: >-
      Calcolare la velocità quadratica media delle molecole: (a) di elio (M = 4,0 g/mol) a 300 K; (b) di
      ossigeno (M = 32 g/mol) alla stessa temperatura; (c) l'energia cinetica media traslazionale per molecola
      a 300 K.
    en: >-
      Find the root-mean-square speed of the molecules: (a) of helium (M = 4.0 g/mol) at 300 K; (b) of oxygen
      (M = 32 g/mol) at the same temperature; (c) the average translational kinetic energy per molecule at 300
      K.
  figure:
    diagram:
      {
        'type': 'scene',
        'params':
          {
            'description':
              {
                'it': 'Molecole di gas in un recipiente, in moto disordinato; un urto elastico con la parete inverte la componente della velocità perpendicolare alla parete.',
                'en': 'Gas molecules moving randomly in a container; an elastic collision with the wall reverses the velocity component perpendicular to it.',
              },
            'items':
              [
                {
                  'kind': 'line',
                  'points': [[0, 0], [6, 0], [6, 4], [0, 4]],
                  'closed': true,
