- id: urti-sulla-parete
  topic: teoria-cinetica-gas
  objectives:
    - teoria-cinetica-gas.1
    - teoria-cinetica-gas.2
    - teoria-cinetica-gas.3
  difficulty: 2
  kind: static
  statement:
    it: >-
      Un recipiente da 2,0 L contiene azoto (M = 28 g/mol) a 1,0·10⁵ Pa e 300 K. Calcolare: (a) il numero di
      molecole; (b) la massa di gas; (c) la densità di energia cinetica traslazionale (J/m³) e verificare che
      vale 3p/2.
    en: >-
      A 2.0 L container holds nitrogen (M = 28 g/mol) at 1.0·10⁵ Pa and 300 K. Find: (a) the number of
      molecules; (b) the mass of gas; (c) the translational kinetic energy density (J/m³), and check that it
      equals 3p/2.
  figure:
    diagram:
      {
        'type': 'scene',
        'params':
          {
            'description':
              {
                'it': 'Molecole di gas in un recipiente, in moto disordinato; un urto elastico con la parete inverte la componente della velocità perpendicolare alla parete.',
                'en': 'Gas molecules moving randomly in a container; an elastic collision with the wall reverses the velocity component perpendicular to it.',
              },
            'items':
              [
                {
                  'kind': 'line',
                  'points': [[0, 0], [6, 0], [6, 4], [0, 4]],
                  'closed': true,
                  'fill': 'surface',
                  'width': 'thick',
