  statement:
    it: 'Un recipiente di $1\,\mathrm{m^3}$ contiene $2{,}5\cdot10^{25}$ molecole con energia cinetica media di traslazione $6\cdot10^{-21}\,\mathrm{J}$. Calcola la pressione e la temperatura.'
    en: 'A $1\,\mathrm{m^3}$ container holds $2.5\cdot10^{25}$ molecules with average translational kinetic energy $6\cdot10^{-21}\,\mathrm{J}$. Find the pressure and the temperature.'
