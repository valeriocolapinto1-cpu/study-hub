                { 'kind': 'disc', 'at': [2.1, 2.2], 'r': 0.12, 'axle': false },
                { 'kind': 'vector', 'from': [2.1, 2.2], 'to': [1.395, 2.457], 'vkind': 'velocity' },
                { 'kind': 'disc', 'at': [3.4, 1.1], 'r': 0.12, 'axle': false },
                { 'kind': 'vector', 'from': [3.4, 1.1], 'to': [3.075, 0.207], 'vkind': 'velocity' },
                { 'kind': 'disc', 'at': [4.6, 2.6], 'r': 0.12, 'axle': false },
                { 'kind': 'vector', 'from': [4.6, 2.6], 'to': [4.696, 3.142], 'vkind': 'velocity' },
                { 'kind': 'disc', 'at': [1.4, 3.1], 'r': 0.12, 'axle': false },
                { 'kind': 'vector', 'from': [1.4, 3.1], 'to': [1.775, 2.45], 'vkind': 'velocity' },
                { 'kind': 'disc', 'at': [3, 3.3], 'r': 0.12, 'axle': false },
