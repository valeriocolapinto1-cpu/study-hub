- id: uomo-sulla-barca
  topic: centro-di-massa
  objectives:
    - centro-di-massa.1
    - centro-di-massa.2
    - centro-di-massa.3
  difficulty: 1
  kind: static
  statement:
    it: >-
      Un uomo di massa m = 75 kg sta a poppa di una barca di massa M = 150 kg, lunga 4,5 m, ferma in acqua
      calma (attrito trascurabile). L'uomo cammina fino a prua. Calcolare: (a) lo spostamento della barca; (b)
      lo spostamento dell'uomo rispetto alla riva; (c) la velocità della barca quando l'uomo cammina a 1,2 m/s
      rispetto alla riva.
    en: >-
      A man of mass m = 75 kg stands at the stern of a boat of mass M = 150 kg and length 4.5 m, at rest in
      calm water (negligible friction). The man walks to the bow. Find: (a) the displacement of the boat; (b)
      the displacement of the man relative to the shore; (c) the velocity of the boat when the man walks at
      1.2 m/s relative to the shore.
  figure:
    diagram:
      {
        'type': 'scene',
        'params':
          {
            'description':
              {
                'it': 'Barca in acqua ferma con una persona che cammina da poppa a prua; senza forze esterne orizzontali il centro di massa resta fermo e la barca arretra.',
                'en': 'Boat in still water with a person walking from stern to bow; with no horizontal external forces the centre of mass stays put and the boat moves back.',
              },
            'items':
              [
                {
                  'kind': 'line',
                  'points': [[-4, 0], [4.5, 0], [4.5, -1.2], [-4, -1.2]],
                  'closed': true,
                  'fill': 'soft',
                  'tone': 'info',
                },
                {
                  'kind': 'line',
                  'points': [[-2.5, 0.6], [2.5, 0.6], [2, -0.4], [-2, -0.4]],
                  'closed': true,
                  'fill': 'surface2',
                },
                { 'kind': 'block', 'at': [-2.1, 1.25], 'w': 0.4, 'h': 1.3, 'label': 'm' },
                { 'kind': 'block', 'at': [2.1, 1.25], 'w': 0.4, 'h': 1.3 },
                { 'kind': 'label', 'at': [0, 0.15], 'text': 'M', 'italic': true },
                { 'kind': 'dim', 'from': [-2.5, -0.9], 'to': [2.5, -0.9], 'label': 'L', 'offset': 0 },
                {
                  'kind': 'vector',
                  'from': [-1.4, 2.3],
                  'to': [1.4, 2.3],
                  'label': 'v_{uomo}',
                  'labelAngle': 90,
                  'vkind': 'velocity',
                },
                {
                  'kind': 'vector',
                  'from': [0.6, -1.6],
                  'to': [-0.8, -1.6],
                  'label': 'V',
                  'labelAngle': 270,
                  'vkind': 'velocity',
                },
              ],
          },
      }
  steps:
    - title:
        it: Il CM resta fermo
        en: The CM stays still
      body:
        it: >-
          Nessuna forza esterna orizzontale: \(m\Delta x_u + M\Delta x_b = 0\). Lo spostamento relativo è L:
          \(\Delta x_u - \Delta x_b = 4{,}5\ \text{m}\).
        en: >-
          No external horizontal force: \(m\Delta x_m + M\Delta x_b = 0\). The relative displacement is L:
          \(\Delta x_m - \Delta x_b = 4.5\ \text{m}\).
    - title:
        it: Spostamenti
        en: Displacements
      body:
        it: >-
          \(\Delta x_b = -mL/(m+M) = -1{,}5\ \text{m}\) (la barca arretra), \(\Delta x_u = ML/(m+M) = 3{,}0\
          \text{m}\).
        en: >-
          \(\Delta x_b = -mL/(m+M) = -1.5\ \text{m}\) (the boat moves back), \(\Delta x_m = ML/(m+M) = 3.0\
          \text{m}\).
    - title:
        it: Velocità
        en: Velocity
      body:
        it: 'P totale nulla: \(v_b = -m v_u/M = -0{,}60\ \text{m/s}\).'
        en: 'Zero total P: \(v_b = -m v_m/M = -0.60\ \text{m/s}\).'
  answer:
    - label:
        it: Δx barca
        en: Δx boat
      value: -1.5
      unit: m
    - label:
        it: Δx uomo
        en: Δx man
      value: 3
      unit: m
    - label:
        it: v barca
        en: v boat
      value: -0.6
      unit: m/s
  origin: originale
- id: proiettile-esplode
  topic: centro-di-massa
  objectives:
    - centro-di-massa.1
    - centro-di-massa.2
    - centro-di-massa.3
  difficulty: 2
  kind: static
  statement:
    it: >-
      Un proiettile di massa 3,0 kg è sparato verticalmente e nel punto più alto, a 80 m di quota, esplode in
      due frammenti. Il primo, di 1,0 kg, parte orizzontalmente a 30 m/s. Calcolare: (a) la velocità del
      secondo frammento; (b) la distanza orizzontale tra i punti di atterraggio dei due frammenti; (c) dove
      atterra il centro di massa.
    en: >-
      A 3.0 kg projectile is fired vertically and at its highest point, 80 m up, it explodes into two
      fragments. The first, of 1.0 kg, leaves horizontally at 30 m/s. Find: (a) the velocity of the second
      fragment; (b) the horizontal distance between the landing points of the two fragments; (c) where the
      centre of mass lands.
  figure:
    diagram:
      {
        'type': 'scene',
        'params':
