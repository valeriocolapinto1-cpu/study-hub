                      [0.53, 3.859],
                      [0.707, 3.75],
                      [0.884, 3.609],
                      [1.061, 3.438],
                      [1.237, 3.234],
                      [1.414, 3],
                      [1.591, 2.734],
                      [1.768, 2.438],
                      [1.945, 2.109],
                      [2.121, 1.75],
                      [2.298, 1.359],
                      [2.475, 0.938],
                      [2.652, 0.484],
                      [2.828, 0],
                    ],
                  'tone': 'accent2',
                  'arrow': 'end',
                },
                {
                  'kind': 'line',
                  'points':
                    [
                      [0, 4],
                      [-0.088, 3.984],
                      [-0.177, 3.938],
                      [-0.265, 3.859],
                      [-0.354, 3.75],
                      [-0.442, 3.609],
                      [-0.53, 3.438],
                      [-0.619, 3.234],
                      [-0.707, 3],
                      [-0.795, 2.734],
                      [-0.884, 2.438],
                      [-0.972, 2.109],
                      [-1.061, 1.75],
                      [-1.149, 1.359],
                      [-1.237, 0.938],
                      [-1.326, 0.484],
                      [-1.414, 0],
                    ],
                  'tone': 'accent',
                  'arrow': 'end',
                },
                { 'kind': 'dot', 'at': [0, 4], 'label': 'H', 'labelAngle': 135 },
