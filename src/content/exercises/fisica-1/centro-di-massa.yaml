  steps:
    - title:
        it: Conservazione di P nell'esplosione
        en: Conservation of P in the explosion
      body:
        it: >-
          Nel punto più alto P = 0 e durante l'esplosione le forze interne dominano: \(1{,}0\cdot 30 +
          2{,}0\cdot v_2 = 0 \Rightarrow v_2 = -15\ \text{m/s}\) (orizzontale, verso opposto).
        en: >-
          At the top P = 0 and during the explosion internal forces dominate: \(1.0\cdot 30 + 2.0\cdot v_2 = 0
          \Rightarrow v_2 = -15\ \text{m/s}\) (horizontal, opposite direction).
    - title:
        it: Caduta
        en: Fall
      body:
        it: >-
          Entrambi cadono da 80 m in \(t = \sqrt{2h/g} \approx 4{,}04\ \text{s}\): distanze 121 m e 60,6 m da
          parti opposte, per un totale di \(45 \cdot 4{,}04 \approx 182\ \text{m}\).
        en: >-
          Both fall from 80 m in \(t = \sqrt{2h/g} \approx 4.04\ \text{s}\): distances 121 m and 60.6 m on
          opposite sides, for a total of \(45 \cdot 4.04 \approx 182\ \text{m}\).
    - title:
        it: Centro di massa
        en: Centre of mass
      body:
        it: >-
          \(x_{cm} = (1{,}0\cdot 121 - 2{,}0\cdot 60{,}6)/3{,}0 = 0\): il CM cade esattamente sotto il punto
          dell'esplosione, come se nulla fosse successo.
        en: >-
          \(x_{cm} = (1.0\cdot 121 - 2.0\cdot 60.6)/3.0 = 0\): the CM lands exactly below the explosion point,
          as if nothing had happened.
  answer:
    - label:
        it: v₂
        en: v₂
      value: -15
      unit: m/s
    - label:
        it: distanza
        en: distance
      value: 182
      unit: m
