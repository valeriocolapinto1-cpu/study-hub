- id: pendolo-balistico-proiettile
  topic: pendolo-balistico
  objectives:
    - pendolo-balistico.1
    - pendolo-balistico.2
    - pendolo-balistico.3
  difficulty: 2
  kind: static
  statement:
    it: >-
      Un proiettile di 10 g si conficca in un blocco di legno di 2,0 kg appeso a fili lunghi 1,5 m; il pendolo
      si solleva fino a un angolo massimo di 18°. Calcolare: (a) l'altezza di risalita; (b) la velocità del
      blocco subito dopo l'urto; (c) la velocità del proiettile; (d) la frazione di energia dissipata.
    en: >-
      A 10 g bullet embeds itself in a 2.0 kg wooden block hanging from 1.5 m strings; the pendulum rises to a
      maximum angle of 18°. Find: (a) the rise height; (b) the speed of the block right after the collision;
      (c) the speed of the bullet; (d) the fraction of energy dissipated.
  figure:
    diagram:
      {
        'type': 'scene',
        'params':
          {
            'description':
              {
                'it': 'Pendolo balistico: il proiettile si conficca nel blocco appeso, che risale di h deviando i fili di θ.',
                'en': 'Ballistic pendulum: the bullet embeds in the hanging block, which rises by h as the strings swing by θ.',
              },
            'items':
              [
                { 'kind': 'surface', 'from': [-2.5, 0], 'to': [2.5, 0] },
                { 'kind': 'line', 'points': [[-0.4, 0], [-0.4, -3.5]], 'dash': true, 'tone': 'muted' },
                { 'kind': 'line', 'points': [[0.4, 0], [0.4, -3.5]], 'dash': true, 'tone': 'muted' },
                { 'kind': 'block', 'at': [0, -4], 'w': 1.2, 'h': 1, 'label': 'M' },
                { 'kind': 'block', 'at': [-3.6, -4], 'w': 0.5, 'h': 0.22 },
                {
                  'kind': 'vector',
                  'from': [-3.3, -4],
                  'to': [-1.9, -4],
                  'label': 'v',
                  'labelAngle': 90,
                  'vkind': 'velocity',
                },
                { 'kind': 'label', 'at': [-3.6, -4.55], 'text': 'm', 'italic': true },
                { 'kind': 'line', 'points': [[-0.4, 0], [0.836, -3.304]] },
                { 'kind': 'line', 'points': [[0.4, 0], [1.636, -3.304]] },
                { 'kind': 'block', 'at': [1.236, -3.804], 'w': 1.2, 'h': 1, 'angle': 0, 'label': 'm+M' },
                { 'kind': 'angle', 'at': [0, 0], 'from': -90, 'to': -72, 'r': 44, 'label': 'θ' },
                { 'kind': 'dim', 'from': [2.9, -4], 'to': [2.9, -3.804], 'label': 'h', 'offset': 0 },
                {
                  'kind': 'line',
                  'points': [[0.6, -4], [3.1, -4]],
                  'dash': true,
                  'tone': 'muted',
                  'width': 'thin',
                },
                {
                  'kind': 'line',
                  'points': [[1.836, -3.804], [3.1, -3.804]],
                  'dash': true,
                  'tone': 'muted',
                  'width': 'thin',
                },
              ],
          },
      }
  steps:
    - title:
        it: Risalita
        en: Rise
      body:
        it: >-
          \(h = L(1 - \cos 18°) \approx 1{,}5 \cdot 0{,}04894 \approx 0{,}0734\ \text{m}\); \(V = \sqrt{2gh}
          \approx 1{,}20\ \text{m/s}\).
        en: >-
          \(h = L(1 - \cos 18°) \approx 1.5 \cdot 0.04894 \approx 0.0734\ \text{m}\); \(V = \sqrt{2gh} \approx
          1.20\ \text{m/s}\).
    - title:
        it: Urto
        en: Collision
      body:
        it: \(v_0 = \dfrac{m+M}{m}V = 201 \cdot 1{,}20 \approx 241\ \text{m/s}\).
        en: \(v_0 = \dfrac{m+M}{m}V = 201 \cdot 1.20 \approx 241\ \text{m/s}\).
    - title:
        it: Energia
        en: Energy
      body:
        it: >-
          Frazione dissipata \(M/(m+M) = 2{,}0/2{,}01 \approx 0{,}995\): il 99,5% dell'energia del proiettile
          diventa deformazione e calore.
        en: >-
          Dissipated fraction \(M/(m+M) = 2.0/2.01 \approx 0.995\): 99.5% of the bullet's energy becomes
          deformation and heat.
  answer:
    - label:
        it: h
        en: h
      value: 0.0734
      unit: m
    - label:
        it: V
        en: V
      value: 1.2
      unit: m/s
    - label:
        it: v₀
        en: v₀
      value: 241
      unit: m/s
    - label:
        it: frazione dissipata
        en: dissipated fraction
      value: 0.995
      tol: 0.005
  origin: originale
- id: errore-energia-urto
  topic: pendolo-balistico
  objectives:
    - pendolo-balistico.1
    - pendolo-balistico.2
    - pendolo-balistico.3
  difficulty: 1
  kind: static
  statement:
    it: >-
      Un proiettile di 5,0 g a 300 m/s si conficca in un blocco di 1,0 kg appeso. Calcolare: (a) l'altezza di
      risalita corretta; (b) l'altezza che si otterrebbe (sbagliando) conservando l'energia attraverso l'urto;
      (c) il rapporto tra le due.
    en: >-
      A 5.0 g bullet at 300 m/s embeds itself in a hanging 1.0 kg block. Find: (a) the correct rise height;
      (b) the height one would get (wrongly) by conserving energy across the collision; (c) the ratio between
      the two.
  figure:
    diagram:
      {
        'type': 'scene',
        'params':
          {
            'description':
              {
                'it': 'Pendolo balistico: il proiettile si conficca nel blocco appeso, che risale di h deviando i fili di θ.',
                'en': 'Ballistic pendulum: the bullet embeds in the hanging block, which rises by h as the strings swing by θ.',
              },
            'items':
              [
                { 'kind': 'surface', 'from': [-2.5, 0], 'to': [2.5, 0] },
                { 'kind': 'line', 'points': [[-0.4, 0], [-0.4, -3.5]], 'dash': true, 'tone': 'muted' },
                { 'kind': 'line', 'points': [[0.4, 0], [0.4, -3.5]], 'dash': true, 'tone': 'muted' },
                { 'kind': 'block', 'at': [0, -4], 'w': 1.2, 'h': 1, 'label': 'M' },
                { 'kind': 'block', 'at': [-3.6, -4], 'w': 0.5, 'h': 0.22 },
                {
                  'kind': 'vector',
                  'from': [-3.3, -4],
                  'to': [-1.9, -4],
                  'label': 'v',
                  'labelAngle': 90,
                  'vkind': 'velocity',
                },
                { 'kind': 'label', 'at': [-3.6, -4.55], 'text': 'm', 'italic': true },
                { 'kind': 'line', 'points': [[-0.4, 0], [1.098, -3.209]] },
                { 'kind': 'line', 'points': [[0.4, 0], [1.898, -3.209]] },
                { 'kind': 'block', 'at': [1.498, -3.709], 'w': 1.2, 'h': 1, 'angle': 0, 'label': 'm+M' },
                { 'kind': 'angle', 'at': [0, 0], 'from': -90, 'to': -68, 'r': 44, 'label': 'θ' },
                { 'kind': 'dim', 'from': [2.9, -4], 'to': [2.9, -3.709], 'label': 'h', 'offset': 0 },
                {
                  'kind': 'line',
                  'points': [[0.6, -4], [3.1, -4]],
                  'dash': true,
                  'tone': 'muted',
                  'width': 'thin',
                },
                {
                  'kind': 'line',
                  'points': [[2.098, -3.709], [3.1, -3.709]],
                  'dash': true,
                  'tone': 'muted',
                  'width': 'thin',
                },
              ],
          },
      }
  steps:
    - title:
        it: Procedura corretta
        en: Correct procedure
      body:
        it: >-
          \(V = \dfrac{m}{m+M}v_0 = \dfrac{1{,}5}{1{,}005} \approx 1{,}493\ \text{m/s}\), \(h = V^2/(2g)
          \approx 0{,}1136\ \text{m}\).
        en: >-
          \(V = \dfrac{m}{m+M}v_0 = \dfrac{1.5}{1.005} \approx 1.493\ \text{m/s}\), \(h = V^2/(2g) \approx
          0.1136\ \text{m}\).
    - title:
        it: L'errore
        en: The mistake
      body:
        it: >-
          \(\tfrac12 mv_0^2 = (m+M)gh' \Rightarrow h' = \dfrac{225}{1{,}005 \cdot 9{,}81} \approx 22{,}8\
          \text{m}\): assurdo, il rapporto è \((m+M)/m = 201\).
        en: >-
          \(\tfrac12 mv_0^2 = (m+M)gh' \Rightarrow h' = \dfrac{225}{1.005 \cdot 9.81} \approx 22.8\
          \text{m}\): absurd, the ratio is \((m+M)/m = 201\).
  answer:
    - label:
        it: h
        en: h
      value: 0.1136
      unit: m
    - label:
        it: h' (sbagliata)
        en: h' (wrong)
      value: 22.8
      unit: m
    - label:
        it: rapporto
        en: ratio
      value: 201
  origin: originale
