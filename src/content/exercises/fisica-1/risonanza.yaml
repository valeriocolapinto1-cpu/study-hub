- id: potenza-risonanza
  topic: risonanza
  objectives:
    - risonanza.1
    - risonanza.2
    - risonanza.3
  difficulty: 3
  kind: static
  statement:
    it: >-
      Per lo stesso oscillatore (m = 0,20 kg, k = 80 N/m, b = 0,40 kg/s, F₀ = 0,50 N) forzato esattamente a Ω
      = ω₀, calcolare: (a) l'ampiezza della velocità; (b) la potenza media assorbita; (c) verificare che
      coincide con la potenza media dissipata dall'attrito.
    en: >-
      For the same oscillator (m = 0.20 kg, k = 80 N/m, b = 0.40 kg/s, F₀ = 0.50 N) driven exactly at Ω = ω₀,
      find: (a) the velocity amplitude; (b) the average absorbed power; (c) check that it equals the average
      power dissipated by friction.
  figure:
    diagram:
      {
        'type': 'spring-mass',
        'params':
          {
            'orientation': 'horizontal',
            'damper': true,
            'displacement': 0.3,
            'force': false,
            'kLabel': 'k',
            'massLabel': 'm',
          },
      }
  steps:
    - title:
        it: Ampiezza a ω₀
        en: Amplitude at ω₀
      body:
        it: >-
          A Ω = ω₀: \(A = \dfrac{F_0/m}{2\gamma\omega_0} = \dfrac{2{,}5}{40} = 0{,}0625\ \text{m}\) e δ = π/2;
          la velocità ha ampiezza \(v_0 = \Omega A = 1{,}25\ \text{m/s}\).
        en: >-
          At Ω = ω₀: \(A = \dfrac{F_0/m}{2\gamma\omega_0} = \dfrac{2.5}{40} = 0.0625\ \text{m}\) and δ = π/2;
          the velocity amplitude is \(v_0 = \Omega A = 1.25\ \text{m/s}\).
    - title:
        it: Potenza assorbita
        en: Absorbed power
      body:
        it: >-
          \(\langle P \rangle = \tfrac12 F_0 \Omega A \sin\delta = \tfrac12 \cdot 0{,}5 \cdot 1{,}25 =
          0{,}3125\ \text{W}\).
        en: >-
          \(\langle P \rangle = \tfrac12 F_0 \Omega A \sin\delta = \tfrac12 \cdot 0.5 \cdot 1.25 = 0.3125\
          \text{W}\).
    - title:
        it: Potenza dissipata
        en: Dissipated power
      body:
        it: >-
          \(\langle b v^2\rangle = \tfrac12 b v_0^2 = \tfrac12 \cdot 0{,}4 \cdot 1{,}5625 = 0{,}3125\
          \text{W}\): a regime il bilancio è in pari, come deve essere.
        en: >-
          \(\langle b v^2\rangle = \tfrac12 b v_0^2 = \tfrac12 \cdot 0.4 \cdot 1.5625 = 0.3125\ \text{W}\): in
          steady state the balance is even, as it must be.
  answer:
    - label:
        it: v₀
        en: v₀
      value: 1.25
      unit: m/s
    - label:
        it: ⟨P⟩
        en: ⟨P⟩
      value: 0.3125
      unit: W
  origin: originale
