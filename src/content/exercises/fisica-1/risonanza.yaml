- id: r2-ris-2
  topic: risonanza
  objectives:
    - risonanza.5
  difficulty: 2
  kind: static
  statement:
    it: 'Come varia lo sfasamento $\delta$ fra spostamento e forza (spostamento in ritardo) al crescere di $\omega$?'
    en: 'How does the phase lag $\delta$ of the displacement behind the force change as $\omega$ increases?'
  steps:
    - title:
        it: 'Spiegazione'
        en: 'Explanation'
      body:
        it: '$\tan\delta=\dfrac{2\gamma\omega}{\omega_0^2-\omega^2}$: a bassa frequenza $\delta\approx0$ (segue la forza), a $\omega_0$ $\delta=90^\circ$ (la velocità è in fase con la forza), ad alta frequenza $\delta\to180^\circ$ (opposizione di fase).'
        en: '$\tan\delta=\dfrac{2\gamma\omega}{\omega_0^2-\omega^2}$: at low frequency $\delta\approx0$ (it follows the force), at $\omega_0$ $\delta=90^\circ$ (velocity in phase with the force), at high frequency $\delta\to180^\circ$ (phase opposition).'
  choices:
    - text:
        it: 'Da $\approx0$ a $90^\circ$ in risonanza, fino a $\approx180^\circ$ ad alta frequenza'
        en: 'From $\approx0$ to $90^\circ$ at resonance, up to $\approx180^\circ$ at high frequency'
      correct: true
    - text:
        it: 'Resta sempre nullo'
        en: 'It is always zero'
      correct: false
    - text:
        it: 'Da $180^\circ$ a $0$'
        en: 'From $180^\circ$ to $0$'
      correct: false
    - text:
        it: 'Vale $90^\circ$ a tutte le frequenze'
        en: 'It is $90^\circ$ at all frequencies'
      correct: false
  origin: originale
- id: r2-ris-3
  topic: risonanza
  objectives:
    - risonanza.6
  difficulty: 2
  kind: static
  statement:
    it: 'Perché la potenza media assorbita da un oscillatore forzato è massima esattamente a $\omega=\omega_0$ (anche se il massimo dell''ampiezza è un po'' più in basso)?'
    en: 'Why is the average power absorbed by a driven oscillator largest exactly at $\omega=\omega_0$ (even though the amplitude peak is slightly lower)?'
  steps:
    - title:
        it: 'Spiegazione'
        en: 'Explanation'
      body:
        it: '$\langle P\rangle=\langle F\,v\rangle$ dipende dall''ampiezza della **velocità** e dal suo sfasamento con la forza. A $\omega_0$ velocità e forza sono in fase e l''ampiezza di velocità $\omega A$ è massima: la forza spinge sempre nel verso del moto.'
        en: '$\langle P\rangle=\langle F\,v\rangle$ depends on the **velocity** amplitude and its phase relative to the force. At $\omega_0$ velocity and force are in phase and the velocity amplitude $\omega A$ is largest: the force always pushes along the motion.'
  choices:
    - text:
        it: 'A $\omega_0$ velocità e forza sono in fase e l''ampiezza della velocità è massima'
        en: 'At $\omega_0$ velocity and force are in phase and the velocity amplitude is largest'
      correct: true
    - text:
        it: 'Perché a $\omega_0$ lo smorzamento si annulla'
        en: 'Because at $\omega_0$ damping vanishes'
      correct: false
    - text:
        it: 'Perché a $\omega_0$ lo spostamento è in fase con la forza'
        en: 'Because at $\omega_0$ the displacement is in phase with the force'
      correct: false
    - text:
        it: 'Perché la potenza non dipende da $\omega$'
        en: 'Because the power does not depend on $\omega$'
      correct: false
  origin: originale
- id: r2-ris-4
  topic: risonanza
  objectives:
    - risonanza.7
  difficulty: 1
  kind: static
  statement:
    it: 'Quale di questi è un esempio di risonanza?'
    en: 'Which of these is an example of resonance?'
  steps:
    - title:
        it: 'Spiegazione'
        en: 'Explanation'
      body:
        it: "Spingere l'altalena al ritmo della sua oscillazione propria trasferisce energia a ogni spinta e fa crescere l'ampiezza; nello stesso modo un circuito RLC sintonizzato seleziona una stazione radio."
        en: 'Pushing a swing at the rhythm of its natural oscillation transfers energy at every push and makes the amplitude grow; in the same way a tuned RLC circuit selects a radio station.'
  choices:
    - text:
        it: "Spingere un'altalena al ritmo della sua oscillazione propria"
        en: 'Pushing a swing at the rhythm of its natural oscillation'
      correct: true
    - text:
        it: 'Una palla che rimbalza sempre più in basso'
        en: 'A ball bouncing lower and lower'
      correct: false
    - text:
        it: "Un pendolo che si ferma per l'attrito dell'aria"
        en: 'A pendulum stopping because of air drag'
      correct: false
    - text:
        it: 'Un blocco che scivola su un piano inclinato'
        en: 'A block sliding down an incline'
      correct: false
  origin: originale
