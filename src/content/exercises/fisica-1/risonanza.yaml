  steps:
    - title:
        it: Parametri
        en: Parameters
      body:
        it: >-
          \(\omega_0 = \sqrt{80/0{,}2} = 20\ \text{rad/s}\), \(\gamma = b/2m = 1{,}0\ \text{s}^{-1}\), \(F_0/m
          = 2{,}5\ \text{m/s}^2\).
        en: >-
          \(\omega_0 = \sqrt{80/0.2} = 20\ \text{rad/s}\), \(\gamma = b/2m = 1.0\ \text{s}^{-1}\), \(F_0/m =
          2.5\ \text{m/s}^2\).
    - title:
        it: Ampiezza a Ω = 15 rad/s
        en: Amplitude at Ω = 15 rad/s
      body:
        it: >-
          \(A = \dfrac{2{,}5}{\sqrt{(400-225)^2 + 4\cdot 225}} = \dfrac{2{,}5}{\sqrt{30625 + 900}} \approx
          0{,}01408\ \text{m}\).
        en: >-
          \(A = \dfrac{2.5}{\sqrt{(400-225)^2 + 4\cdot 225}} = \dfrac{2.5}{\sqrt{30625 + 900}} \approx
          0.01408\ \text{m}\).
    - title:
        it: Picco
        en: Peak
      body:
        it: >-
          \(\Omega_{ris} = \sqrt{\omega_0^2 - 2\gamma^2} = \sqrt{398} \approx 19{,}95\ \text{rad/s}\);
          \(A_{max} = \dfrac{F_0/m}{2\gamma\sqrt{\omega_0^2-\gamma^2}} = \dfrac{2{,}5}{2\sqrt{399}} \approx
          0{,}0626\ \text{m}\), circa 10 volte la risposta statica \(F_0/k = 6{,}25\ \text{mm}\) (≈ Q = 10).
        en: >-
          \(\Omega_{res} = \sqrt{\omega_0^2 - 2\gamma^2} = \sqrt{398} \approx 19.95\ \text{rad/s}\); \(A_{max}
          = \dfrac{F_0/m}{2\gamma\sqrt{\omega_0^2-\gamma^2}} = \dfrac{2.5}{2\sqrt{399}} \approx 0.0626\
          \text{m}\), about 10 times the static response \(F_0/k = 6.25\ \text{mm}\) (≈ Q = 10).
    - title:
        it: Fase
        en: Phase
      body:
        it: >-
          \(\tan\delta = \dfrac{2\gamma\Omega}{\omega_0^2-\Omega^2} = 30/175 \Rightarrow \delta \approx
          0{,}170\ \text{rad}\): sotto risonanza la risposta è quasi in fase.
        en: >-
          \(\tan\delta = \dfrac{2\gamma\Omega}{\omega_0^2-\Omega^2} = 30/175 \Rightarrow \delta \approx 0.170\
          \text{rad}\): below resonance the response is almost in phase.
