  kind: static
  statement:
    it: >-
      Un oscillatore con m = 0,20 kg, k = 80 N/m e b = 0,40 kg/s è forzato da F(t) = F₀ cos(Ωt) con F₀ = 0,50
      N. Calcolare: (a) ω₀ e γ; (b) l'ampiezza a regime per Ω = 15 rad/s; (c) l'ampiezza massima e la
      pulsazione a cui si ha; (d) il ritardo di fase a Ω = 15 rad/s.
    en: >-
      An oscillator with m = 0.20 kg, k = 80 N/m and b = 0.40 kg/s is driven by F(t) = F₀ cos(Ωt) with F₀ =
      0.50 N. Find: (a) ω₀ and γ; (b) the steady-state amplitude for Ω = 15 rad/s; (c) the maximum amplitude
      and the angular frequency at which it occurs; (d) the phase lag at Ω = 15 rad/s.
