      correct: false
  origin: originale
- id: mcq-tech-02
  topic: tempi-e-tecnologia
  objectives:
    - tempi-e-tecnologia.1
    - tempi-e-tecnologia.2
  difficulty: 1
  kind: static
  statement:
    it: "In una rete combinatoria con più porte **in cascata**, il ritardo complessivo:"
  steps:
    - title:
        it: Risposta
        en: Answer
      body:
        it: È la somma dei ritardi lungo il cammino più lento (cammino critico)
  choices:
    - text:
        it: È quello della porta più veloce
      correct: false
    - text:
        it: È la somma dei ritardi lungo il cammino più lento (cammino critico)
      correct: true
    - text:
        it: È sempre uguale a quello di una singola porta
      correct: false
    - text:
        it: Si annulla se la rete è minimizzata
      correct: false
  origin: originale
