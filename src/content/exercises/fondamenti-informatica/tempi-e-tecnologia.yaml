  topic: tempi-e-tecnologia
  objectives:
    - tempi-e-tecnologia.1
    - tempi-e-tecnologia.2
  difficulty: 1
  kind: static
  statement:
    it: Che cosa fissa il **periodo minimo di clock** di un circuito sincrono?
  steps:
    - title:
        it: Risposta
        en: Answer
      body:
        it: Il cammino critico fra due registri, più il tempo di setup
  choices:
    - text:
        it: Il numero di flip-flop
      correct: false
    - text:
        it: Il cammino critico fra due registri, più il tempo di setup
      correct: true
