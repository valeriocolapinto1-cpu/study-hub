  difficulty: 1
  kind: static
  statement:
    it: "Il **ritardo di propagazione** di una porta si misura:"
  steps:
    - title:
        it: Risposta
        en: Answer
      body:
        it: Fra gli istanti in cui ingresso e uscita attraversano il 50% dell'escursione
  choices:
