- id: tempi-e-tecnologia-es-1
  topic: tempi-e-tecnologia
  objectives:
    - tempi-e-tecnologia.1
  difficulty: 1
  kind: static
  statement:
    it: Tre porte hanno ritardo 3 ns, 2 ns e 4 ns. Qual è il ritardo totale se sono **in cascata**? E se le prime
      due lavorano **in parallelo** e la terza riceve entrambe le uscite?
    en: Three gates have delays of 3 ns, 2 ns and 4 ns. What is the total delay if they are **in cascade**? And if
      the first two work **in parallel** and the third receives both outputs?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: "In cascata i ritardi si sommano perché il segnale le attraversa una dopo l’altra. In parallelo no: il
          risultato è pronto quando è pronto il **più lento** dei due rami."
        en: "In cascade the delays add up because the signal crosses them one after the other. In parallel they do
          not: the result is ready when the **slower** of the two branches is."
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          in cascata:   3 + 2 + 4 = 9 ns


          in parallelo: max(3, 2) + 4 = 3 + 4 = 7 ns

          ```


          È l’errore più comune dell’argomento: sommare anche i rami paralleli, ottenendo 9 ns anche nel
          secondo caso. Il ritardo di una rete è quello del suo **cammino critico**, cioè il percorso
          ingresso→uscita più lento, non la somma di tutti i ritardi presenti.
        en: >-
          ```

          in cascade:   3 + 2 + 4 = 9 ns


          in parallel:  max(3, 2) + 4 = 3 + 4 = 7 ns

          ```


          It is the most common mistake on this topic: adding the parallel branches too, getting 9 ns in the
          second case as well. The delay of a network is that of its **critical path**, i.e. the slowest
          input→output path, not the sum of all the delays present.
  origin: originale
- id: tempi-e-tecnologia-es-2
  topic: tempi-e-tecnologia
  objectives:
    - tempi-e-tecnologia.3
  difficulty: 1
  kind: static
  statement:
    it: Una porta ha ritardo 1,5 ns quando pilota un solo ingresso, e ogni carico aggiuntivo aggiunge 0,2 ns.
      Quanto ritarda se pilota **otto** ingressi?
    en: A gate has a delay of 1.5 ns when it drives a single input, and each additional load adds 0.2 ns. What is
      its delay when it drives **eight** inputs?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: "Il carico è capacitivo: ogni ingresso collegato è una capacità in più da caricare, e caricare più
          capacità richiede più tempo."
        en: "The load is capacitive: every connected input is one more capacitance to charge, and charging more
          capacitance takes more time."
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          t = 1,5 + (8 − 1) × 0,2 = 1,5 + 1,4 = 2,9 ns

          ```


          Quasi il doppio. Quando il fan-out è alto conviene inserire un **buffer**: paradossalmente si
          aggiunge un ritardo (quello del buffer) ma se ne toglie di più, perché la porta originale si trova a
          pilotare un solo ingresso e il buffer è progettato per erogare più corrente.


          È lo stesso ragionamento per cui i segnali di clock, che devono raggiungere migliaia di flip-flop,
          viaggiano su un *albero* di buffer e non su un filo unico.
        en: >-
          ```

          t = 1.5 + (8 − 1) × 0.2 = 1.5 + 1.4 = 2.9 ns

          ```


          Almost double. When fan-out is high it pays to insert a **buffer**: paradoxically you add a delay
          (that of the buffer) but remove more, because the original gate ends up driving a single input and
          the buffer is designed to deliver more current.


          It is the same reasoning by which clock signals, which must reach thousands of flip-flops, travel on
          a *tree* of buffers and not on a single wire.
  origin: originale
- id: tempi-e-tecnologia-es-3
  topic: tempi-e-tecnologia
  objectives:
    - tempi-e-tecnologia.2
  difficulty: 2
  kind: static
  statement:
    it: Un sommatore a 16 bit va inserito fra due registri. Con il **ripple-carry** ogni stadio costa 2 ns; con il
      **carry-lookahead** l’intera somma costa 6 ns. Il resto dello stadio (propagazione del flip-flop più
      setup) costa 3 ns. Calcola la frequenza massima nei due casi.
    en: A 16-bit adder must be placed between two registers. With **ripple-carry** each stage costs 2 ns; with
      **carry-lookahead** the whole addition costs 6 ns. The rest of the stage (flip-flop propagation plus
      setup) costs 3 ns. Compute the maximum frequency in the two cases.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Il periodo minimo è la somma di tutto ciò che deve accadere fra due fronti di clock consecutivi.
        en: The minimum period is the sum of everything that must happen between two consecutive clock edges.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          RIPPLE-CARRY

          T ≥ 3 + (16 × 2) = 3 + 32 = 35 ns

          f_max = 1 / 35 ns ≈ 28,6 MHz


          CARRY-LOOKAHEAD

          T ≥ 3 + 6 = 9 ns

          f_max = 1 / 9 ns ≈ 111 MHz

          ```


          Quasi quattro volte tanto. Il prezzo è in **area**: la logica di lookahead richiede molte più porte,
          e cresce rapidamente con il numero di bit — per questo nei sommatori larghi si usano blocchi di
          lookahead a 4 bit messi in cascata, che è un compromesso fra le due soluzioni.


          Nota che il termine fisso di 3 ns non sparisce mai: è il motivo per cui, oltre un certo punto,
          accorciare il combinatorio smette di pagare.
        en: >-
          ```

          RIPPLE-CARRY

          T ≥ 3 + (16 × 2) = 3 + 32 = 35 ns

          f_max = 1 / 35 ns ≈ 28.6 MHz


          CARRY-LOOKAHEAD

          T ≥ 3 + 6 = 9 ns

          f_max = 1 / 9 ns ≈ 111 MHz

          ```


          Almost four times as much. The price is in **area**: the lookahead logic requires many more gates,
          and it grows quickly with the number of bits — which is why wide adders use cascaded 4-bit lookahead
          blocks, a compromise between the two solutions.


          Note that the fixed 3 ns term never disappears: it is why, beyond a certain point, shortening the
          combinational logic stops paying off.
  origin: originale
- id: tempi-e-tecnologia-es-4
  topic: tempi-e-tecnologia
  objectives:
    - tempi-e-tecnologia.4
  difficulty: 2
  kind: static
  statement:
    it: Un circuito CMOS consuma 4 W a 1 GHz con alimentazione 1,0 V. Quanto consumerà a **2 GHz** a parità di
      tensione? E a 2 GHz con la tensione alzata a **1,2 V**?
    en: A CMOS circuit consumes 4 W at 1 GHz with a 1.0 V supply. How much will it consume at **2 GHz** with the
      same voltage? And at 2 GHz with the voltage raised to **1.2 V**?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: "Il consumo dinamico è proporzionale a f·C·V². La capacità non cambia: cambiano frequenza e tensione, e la
          tensione pesa al quadrato."
        en: "Dynamic power is proportional to f·C·V². The capacitance does not change: frequency and voltage change,
          and voltage counts squared."
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          P ∝ f · C · V²


          a 2 GHz, 1,0 V:   P = 4 × (2/1) = 8 W


          a 2 GHz, 1,2 V:   P = 8 × (1,2/1,0)² = 8 × 1,44 = 11,5 W

          ```


          Raddoppiare la frequenza raddoppia il consumo; alzare la tensione del 20 % lo aumenta di un altro 44
          %. E in pratica salire di frequenza **richiede** più tensione, perché i transistor devono commutare
          più in fretta: le due cose vanno insieme, e il consumo cresce quasi con il cubo.


          È esattamente questa curva ad aver fermato la corsa ai gigahertz e spostato l’industria sul
          **multicore**: due core a 1 GHz consumano circa quanto uno a 1 GHz raddoppiato in area, ma molto
          meno di uno a 2 GHz.
        en: >-
          ```

          P ∝ f · C · V²


          at 2 GHz, 1.0 V:   P = 4 × (2/1) = 8 W


          at 2 GHz, 1.2 V:   P = 8 × (1.2/1.0)² = 8 × 1.44 = 11.5 W

          ```


          Doubling the frequency doubles the power; raising the voltage by 20 % increases it by another 44 %.
          And in practice going up in frequency **requires** more voltage, because the transistors must switch
          faster: the two go together, and power grows almost with the cube.


          It is exactly this curve that stopped the gigahertz race and moved the industry to **multicore**:
          two cores at 1 GHz consume about as much as one at 1 GHz doubled in area, but much less than one at
          2 GHz.
  origin: originale
- id: tempi-e-tecnologia-es-5
  topic: tempi-e-tecnologia
  objectives:
    - tempi-e-tecnologia.5
  difficulty: 2
  kind: static
  statement:
    it: Devi realizzare quattro funzioni logiche di otto variabili in un **prototipo** che verrà modificato più
      volte prima di essere definitivo. Scegli fra PLA, CPLD e FPGA, motivando.
    en: You must implement four logic functions of eight variables in a **prototype** that will be modified
      several times before being final. Choose between PLA, CPLD and FPGA, giving reasons.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: La domanda non è quale sia il più potente, ma quale costi meno **modificare**.
        en: The question is not which is the most powerful, but which costs least to **modify**.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          La scelta è la **FPGA**. Le ragioni, nell’ordine che conta:


          - **Riconfigurabile** quante volte si vuole: una modifica costa una nuova programmazione, non un
          nuovo dispositivo. In un prototipo che cambia, è il criterio decisivo.

          - **Capienza**: quattro funzioni di otto variabili stanno comodamente in una FPGA anche piccola,
          mentre una PLA con otto ingressi ha un numero limitato di termini prodotto e potrebbe non bastare.

          - Le **PLA/PAL** hanno piani AND-OR di dimensione fissa e, nelle versioni a fusibili, si programmano
          **una volta sola**: perfette per la produzione di una versione definitiva, non per un prototipo.

          - Il **CPLD** è la via di mezzo: riconfigurabile e con ritardi molto prevedibili, ma con meno
          risorse di una FPGA.


          Se la domanda fosse stata «grande volume di produzione, progetto congelato», la risposta sarebbe
          l’opposta: lì il costo unitario premia le soluzioni fisse, fino ad arrivare al circuito integrato
          dedicato.
        en: >-
          The choice is the **FPGA**. The reasons, in the order that matters:


          - **Reconfigurable** as many times as you like: a change costs a new programming, not a new device.
          In a prototype that changes, it is the decisive criterion.

          - **Capacity**: four functions of eight variables fit comfortably in even a small FPGA, while a PLA
          with eight inputs has a limited number of product terms and might not be enough.

          - **PLAs/PALs** have fixed-size AND-OR planes and, in the fuse versions, can be programmed **only
          once**: perfect for producing a final version, not for a prototype.

          - The **CPLD** is the middle way: reconfigurable and with very predictable delays, but with fewer
          resources than an FPGA.


          Had the question been “high production volume, frozen design”, the answer would be the opposite:
          there the unit cost rewards fixed solutions, all the way to a dedicated integrated circuit.
  origin: originale
- id: mcq-tech-01
