- id: reti-combinatorie-es-1
  topic: reti-combinatorie
  objectives:
    - reti-combinatorie.1
  difficulty: 1
  kind: static
  statement:
    it: Costruisci un decodificatore **3→8** usando due decodificatori **2→4** con ingresso di abilitazione.
    en: Build a **3→8** decoder using two **2→4** decoders with an enable input.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Con tre bit di indirizzo, uno deve decidere *quale dei due* decoder lavora e gli altri due scelgono la
          riga dentro il blocco.
        en: With three address bits, one must decide *which of the two* decoders works and the other two choose the
          row inside the block.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          A₂ ──┬── EN del decoder ALTO   (uscite 4…7)
               └──▷o── EN del decoder BASSO (uscite 0…3)

          A₁, A₀ ──── ingressi di ENTRAMBI i decoder

          ```


          Quando A₂ = 0 il primo decoder è abilitato e attiva una delle uscite 0-3 secondo A₁A₀; quando A₂ = 1
          tocca al secondo, che copre le uscite 4-7. Serve un solo invertitore.


          È esattamente lo schema con cui si compongono i banchi di memoria: i bit alti dell’indirizzo
          scelgono il chip, i bassi la cella al suo interno.
        en: >-
          ```

          A₂ ──┬── EN of the HIGH decoder   (outputs 4…7)
               └──▷o── EN of the LOW decoder (outputs 0…3)

          A₁, A₀ ──── inputs of BOTH decoders

          ```


          When A₂ = 0 the first decoder is enabled and activates one of outputs 0-3 according to A₁A₀; when A₂
          = 1 it is the second one's turn, covering outputs 4-7. A single inverter is needed.


          It is exactly the scheme with which memory banks are composed: the high address bits choose the
          chip, the low ones the cell inside it.
  origin: originale
- id: reti-combinatorie-es-2
  topic: reti-combinatorie
  objectives:
    - reti-combinatorie.2
  difficulty: 1
  kind: static
  statement:
    it: "Realizza con un multiplexer **8→1** la funzione di **parità dispari** di tre bit: `Y = A ⊕ B ⊕ C`."
    en: "Implement with an **8→1** multiplexer the **odd parity** function of three bits: `Y = A ⊕ B ⊕ C`."
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: I selettori prendono le variabili; sugli ingressi dati vanno le costanti della colonna d’uscita,
          nell’ordine dei mintermini da I₀ a I₇.
        en: The selects take the variables; the data inputs get the constants of the output column, in minterm order
          from I₀ to I₇.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          A B C │ Y      ingresso

          0 0 0 │ 0      I₀ = 0

          0 0 1 │ 1      I₁ = 1

          0 1 0 │ 1      I₂ = 1

          0 1 1 │ 0      I₃ = 0

          1 0 0 │ 1      I₄ = 1

          1 0 1 │ 0      I₅ = 0

          1 1 0 │ 0      I₆ = 0

          1 1 1 │ 1      I₇ = 1

          ```


          Collegamenti: S₂S₁S₀ = A B C, e gli otto ingressi dati alle costanti `0,1,1,0,1,0,0,1`. Nessuna
          porta logica: la tabella di verità **è** il cablaggio.
        en: >-
          ```

          A B C │ Y      input

          0 0 0 │ 0      I₀ = 0

          0 0 1 │ 1      I₁ = 1

          0 1 0 │ 1      I₂ = 1

          0 1 1 │ 0      I₃ = 0

          1 0 0 │ 1      I₄ = 1

          1 0 1 │ 0      I₅ = 0

          1 1 0 │ 0      I₆ = 0

          1 1 1 │ 1      I₇ = 1

          ```


          Connections: S₂S₁S₀ = A B C, and the eight data inputs to the constants `0,1,1,0,1,0,0,1`. No logic
          gates: the truth table **is** the wiring.
  answer:
    - label:
        it: Ingressi I₀…I₇
        en: Inputs I₀…I₇
      value: "01101001"
      kind: text
      accept:
        - 0110 1001
  origin: originale
- id: reti-combinatorie-es-3
  topic: reti-combinatorie
  objectives:
    - reti-combinatorie.2
  difficulty: 2
  kind: static
  statement:
    it: Realizza `Y(A,B,C) = Σm(1,2,5,7)` con un multiplexer **4→1**, usando A e B come selettori.
    en: Implement `Y(A,B,C) = Σm(1,2,5,7)` with a **4→1** multiplexer, using A and B as selects.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: "Con solo due selettori restano quattro ingressi per otto mintermini: ogni ingresso copre **due** righe,
          che differiscono per C. Su ciascuno va 0, 1, C oppure C̄."
        en: "With only two selects there are four inputs for eight minterms: each input covers **two** rows, which
          differ in C. Each gets 0, 1, C or C̄."
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          A B │ C=0        C=1        ingresso

          0 0 │ m0 = 0     m1 = 1     I₀ = C

          0 1 │ m2 = 1     m3 = 0     I₁ = C̄

          1 0 │ m4 = 0     m5 = 1     I₂ = C

          1 1 │ m6 = 0     m7 = 1     I₃ = C

          ```


          Quindi: I₀ = C, I₁ = C̄ (serve un invertitore), I₂ = C, I₃ = C. Il circuito completo è un MUX 4→1,
          un invertitore e nulla più.


          La regola generale: con n selettori e n+1 variabili, ogni ingresso vale una delle quattro funzioni
          della variabile residua — 0, 1, la variabile, la variabile negata.
        en: >-
          ```

          A B │ C=0        C=1        input

          0 0 │ m0 = 0     m1 = 1     I₀ = C

          0 1 │ m2 = 1     m3 = 0     I₁ = C̄

          1 0 │ m4 = 0     m5 = 1     I₂ = C

          1 1 │ m6 = 0     m7 = 1     I₃ = C

          ```


          So: I₀ = C, I₁ = C̄ (an inverter is needed), I₂ = C, I₃ = C. The complete circuit is a 4→1 MUX, an
          inverter and nothing else.


          The general rule: with n selects and n+1 variables, each input is one of the four functions of the
          remaining variable — 0, 1, the variable, the negated variable.
  origin: originale
- id: reti-combinatorie-es-4
  topic: reti-combinatorie
  objectives:
    - reti-combinatorie.3
  difficulty: 2
  kind: static
  statement:
    it: Progetta un comparatore di **uguaglianza** fra due numeri a 2 bit, A₁A₀ e B₁B₀. Poi aggiungi l’uscita «A
      maggiore di B».
    en: Design an **equality** comparator between two 2-bit numbers, A₁A₀ and B₁B₀. Then add the output “A greater
      than B”.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Due bit sono uguali quando il loro XOR è 0, cioè quando il loro **XNOR** è 1. Per il maggiore, ragiona a
          partire dal bit più significativo.
        en: Two bits are equal when their XOR is 0, i.e. when their **XNOR** is 1. For greater-than, reason starting
          from the most significant bit.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          **Uguaglianza** — tutti i bit devono coincidere:


          ```

          EQ = (A₁ ⊙ B₁) · (A₀ ⊙ B₀)        dove ⊙ è lo XNOR

          ```


          **Maggiore** — A > B se il bit alto di A è 1 e quello di B è 0; oppure se i bit alti sono uguali e
          il confronto si sposta su quelli bassi:


          ```

          GT = A₁·B̄₁ + (A₁ ⊙ B₁)·A₀·B̄₀

          ```


          La struttura si estende a n bit ripetendo lo stesso schema: è la ragione per cui i comparatori si
          costruiscono a cascata, dal bit più significativo verso il basso.
        en: >-
          **Equality** — all bits must match:


          ```

          EQ = (A₁ ⊙ B₁) · (A₀ ⊙ B₀)        where ⊙ is XNOR

          ```


          **Greater than** — A > B if the high bit of A is 1 and that of B is 0; or if the high bits are equal
          and the comparison moves to the low ones:


          ```

          GT = A₁·B̄₁ + (A₁ ⊙ B₁)·A₀·B̄₀

          ```


          The structure extends to n bits by repeating the same scheme: that is why comparators are built in
          cascade, from the most significant bit downwards.
  origin: originale
- id: reti-combinatorie-es-5
  topic: reti-combinatorie
  objectives:
    - reti-combinatorie.4
  difficulty: 2
  kind: static
  statement:
    it: Quattro registri a 8 bit devono poter scrivere sullo stesso bus a 8 bit. Quanti buffer tri-state servono,
      quante abilitazioni possono essere attive contemporaneamente, e che cosa succede se per errore ne sono
      attive due?
    en: Four 8-bit registers must be able to write onto the same 8-bit bus. How many tri-state buffers are needed,
      how many enables can be active at the same time, and what happens if by mistake two are active?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: "Il tri-state serve una linea per volta: conta quante linee ci sono in totale, non quanti registri."
        en: "A tri-state serves one line at a time: count how many lines there are in total, not how many registers."
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          Ogni bit di ogni registro ha bisogno del proprio buffer: **4 × 8 = 32 buffer**, organizzati in
          quattro banchi da otto, ciascuno con una sola linea di abilitazione comune.


          Le abilitazioni attive devono essere **al più una**: è proprio questa la condizione che rende
          possibile la condivisione del bus. Chi non è abilitato va in alta impedenza, cioè si «stacca»
          elettricamente dalla linea.


          Se due banchi sono abilitati insieme e su un bit impongono valori opposti, si crea un percorso
          diretto fra alimentazione e massa: il valore sulla linea è indefinito e la corrente elevata può
          danneggiare i buffer. Per questo la selezione passa sempre da un **decodificatore**, che per
          costruzione attiva una sola uscita.
        en: >-
          Every bit of every register needs its own buffer: **4 × 8 = 32 buffers**, organised in four banks of
          eight, each with a single common enable line.


          The active enables must be **at most one**: this is precisely the condition that makes bus sharing
          possible. Whoever is not enabled goes into high impedance, i.e. electrically “disconnects” from the
          line.


          If two banks are enabled together and drive opposite values on a bit, a direct path between supply
          and ground is created: the value on the line is undefined and the high current can damage the
          buffers. That is why the selection always goes through a **decoder**, which by construction
          activates a single output.
  answer:
    - label:
        it: Buffer tri-state
        en: Tri-state buffers
      value: 32
      tol: 1e-9
    - label:
        it: Abilitazioni attive al massimo
        en: Enables active at most
      value: 1
      tol: 1e-9
  origin: originale
