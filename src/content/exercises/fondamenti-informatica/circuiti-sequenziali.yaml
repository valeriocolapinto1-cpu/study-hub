- id: circuiti-sequenziali-es-1
  topic: circuiti-sequenziali
  objectives:
    - circuiti-sequenziali.2
    - circuiti-sequenziali.3
  difficulty: 1
  kind: static
  statement:
    it: Come si ottiene un flip-flop **D** partendo da uno **SR**? Che cosa si guadagna?
    en: How do you obtain a **D** flip-flop starting from an **SR** one? What do you gain?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Il problema dello SR è la combinazione S = R = 1. Basta rendere impossibile che i due ingressi valgano lo
          stesso valore.
        en: The problem with SR is the combination S = R = 1. It is enough to make it impossible for the two inputs to
          have the same value.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          D ──┬────────── S
              └──▷o────── R        (un solo invertitore)
          ```


          Con S = D e R = D̄ gli ingressi sono sempre opposti: le combinazioni possibili diventano due —
          S=1,R=0 (imposta) e S=0,R=1 (azzera) — e la combinazione proibita **non è più raggiungibile**.


          Il guadagno è che il componente diventa utilizzabile senza precauzioni: qualunque valore di D
          produce un comportamento definito, cioè «al prossimo fronte l’uscita diventa D». È il motivo per cui
          i registri si costruiscono con flip-flop D e non con SR.
        en: >-
          ```

          D ──┬────────── S
              └──▷o────── R        (a single inverter)
          ```


          With S = D and R = D̄ the inputs are always opposite: the possible combinations become two — S=1,R=0
          (set) and S=0,R=1 (reset) — and the forbidden combination is **no longer reachable**.


          The gain is that the component becomes usable without precautions: any value of D produces a defined
          behaviour, i.e. “at the next edge the output becomes D”. That is why registers are built with D
          flip-flops and not SR.
  origin: originale
- id: circuiti-sequenziali-es-2
  topic: circuiti-sequenziali
  objectives:
    - circuiti-sequenziali.3
  difficulty: 1
  kind: static
  statement:
    it: Un flip-flop **JK** ha J = K = 1 in modo permanente e riceve un clock a 100 MHz. Che segnale esce da Q?
    en: A **JK** flip-flop has J = K = 1 permanently and receives a 100 MHz clock. What signal comes out of Q?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Guarda che cosa fa il JK con quella combinazione, e conta quanti fronti servono perché l’uscita torni al
          valore di partenza.
        en: Look at what the JK does with that combination, and count how many edges it takes for the output to return
          to its starting value.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          Con J = K = 1 il JK **commuta** a ogni fronte attivo: 0 → 1 → 0 → 1…


          ```

          clock  ↑    ↑    ↑    ↑    ↑    ↑

          Q      1    0    1    0    1    0

          ```


          Servono **due** fronti perché Q completi un periodo, quindi l’uscita è un’onda quadra a **50 MHz**:
          il flip-flop funziona da **divisore di frequenza per 2**.


          Mettendone n in cascata si divide per 2ⁿ — ed è esattamente la struttura di un contatore asincrono,
          dove ogni stadio è pilotato dall’uscita del precedente.
        en: >-
          With J = K = 1 the JK **toggles** at every active edge: 0 → 1 → 0 → 1…


          ```

          clock  ↑    ↑    ↑    ↑    ↑    ↑

          Q      1    0    1    0    1    0

          ```


          It takes **two** edges for Q to complete a period, so the output is a **50 MHz** square wave: the
          flip-flop works as a **frequency divider by 2**.


          Putting n of them in cascade divides by 2ⁿ — and that is exactly the structure of an asynchronous
          counter, where each stage is driven by the output of the previous one.
  origin: originale
- id: circuiti-sequenziali-es-3
  topic: circuiti-sequenziali
  objectives:
    - circuiti-sequenziali.4
  difficulty: 2
  kind: static
  statement:
    it: Progetta un **contatore modulo 6** sincrono (conta 0…5 e riparte) a partire da un contatore binario a 3
      bit.
    en: Design a synchronous **modulo-6 counter** (counts 0…5 and starts over) starting from a 3-bit binary
      counter.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Tre bit contano fino a 7. Serve rilevare il primo valore **di troppo** e usarlo per riportare il contatore
          a zero.
        en: Three bits count up to 7. You need to detect the first value **too many** and use it to bring the counter
          back to zero.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          Il conteggio deve essere 000, 001, 010, 011, 100, 101 e poi tornare a 000. Il primo valore da non
          raggiungere è **6 = 110**.


          ```

          RESET = Q₂ · Q₁ · Q̄₀        (vale 1 quando l'uscita è 110)

          ```


          Il segnale RESET va all’ingresso di azzeramento **sincrono** del contatore: al fronte successivo
          l’uscita torna a 000.


          Nota da esame: se l’azzeramento fosse **asincrono**, il valore 110 comparirebbe per un istante
          brevissimo prima di sparire — un *glitch* che può ingannare la logica a valle. Con l’azzeramento
          sincrono lo stato 110 non viene mai raggiunto. Lo stesso schema con `Q₃·Q₁` (cioè 1010) dà il
          contatore modulo 10, quello dei display decimali.
        en: >-
          The count must be 000, 001, 010, 011, 100, 101 and then back to 000. The first value not to be
          reached is **6 = 110**.


          ```

          RESET = Q₂ · Q₁ · Q̄₀        (it is 1 when the output is 110)

          ```


          The RESET signal goes to the **synchronous** clear input of the counter: at the next edge the output
          returns to 000.


          Exam note: if the clear were **asynchronous**, the value 110 would appear for a very short instant
          before disappearing — a *glitch* that can fool the downstream logic. With a synchronous clear the
          state 110 is never reached. The same scheme with `Q₃·Q₁` (i.e. 1010) gives the modulo-10 counter,
          the one used for decimal displays.
  origin: originale
- id: circuiti-sequenziali-es-4
  topic: circuiti-sequenziali
  objectives:
    - circuiti-sequenziali.4
  difficulty: 2
  kind: static
  statement:
    it: Un registro a scorrimento a 4 bit contiene `1011` e scorre **a destra**. Entrano in serie, un bit per
      colpo di clock, i valori 1, 0, 1. Scrivi il contenuto dopo ogni colpo.
    en: A 4-bit shift register contains `1011` and shifts **right**. The values 1, 0, 1 enter serially, one bit
      per clock cycle. Write the contents after each cycle.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: "A ogni colpo tutti i bit si spostano di una posizione: il nuovo bit entra dalla parte opposta a quella in
          cui esce l’ultimo."
        en: "At every cycle all bits move one position: the new bit enters from the side opposite to the one where the
          last bit leaves."
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          partenza          1 0 1 1


          colpo 1, entra 1  1 1 0 1     (esce 1)

          colpo 2, entra 0  0 1 1 0     (esce 1)

          colpo 3, entra 1  1 0 1 1     (esce 0)

          ```


          Dopo tre colpi il contenuto è tornato a 1011 per pura coincidenza dei bit immessi — non c’è nessun
          ciclo automatico, a meno che l’uscita non venga **riportata all’ingresso**: in quel caso si ottiene
          un registro circolare, che ripete il contenuto ogni 4 colpi.


          Da ricordare: con accesso **seriale** servono n colpi per caricare n bit, con accesso **parallelo**
          uno solo. La conversione fra i due è proprio ciò che fa un registro a scorrimento a caricamento
          parallelo, usato in ogni interfaccia seriale.
        en: >-
          ```

          start             1 0 1 1


          cycle 1, in 1     1 1 0 1     (out 1)

          cycle 2, in 0     0 1 1 0     (out 1)

          cycle 3, in 1     1 0 1 1     (out 0)

          ```


          After three cycles the contents are back to 1011 by pure coincidence of the bits fed in — there is
          no automatic cycle, unless the output is **fed back to the input**: in that case you get a circular
          register, which repeats its contents every 4 cycles.


          To remember: with **serial** access n cycles are needed to load n bits, with **parallel** access
          just one. Converting between the two is exactly what a parallel-load shift register does, used in
          every serial interface.
  origin: originale
- id: circuiti-sequenziali-es-5
  topic: circuiti-sequenziali
  objectives:
    - circuiti-sequenziali.5
  difficulty: 2
  kind: static
  statement:
    it: "In uno stadio sincrono: ritardo di propagazione del flip-flop 2 ns, rete combinatoria 7 ns nel cammino
      più lungo e 1 ns in quello più corto, setup 1,5 ns, hold 0,5 ns. Qual è la **frequenza massima**? Il
      vincolo di hold è rispettato?"
    en: "In a synchronous stage: flip-flop propagation delay 2 ns, combinational network 7 ns on the longest path
      and 1 ns on the shortest, setup 1.5 ns, hold 0.5 ns. What is the **maximum frequency**? Is the hold
      constraint met?"
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: "Due vincoli distinti: il periodo dipende dal cammino **più lungo**, il vincolo di hold dal **più corto**
          — e non dipende dal periodo."
        en: "Two distinct constraints: the period depends on the **longest** path, the hold constraint on the
          **shortest** — and it does not depend on the period."
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          **Frequenza massima**, dal cammino lungo:


          ```

          T ≥ t_propagazione + t_combinatorio_max + t_setup
            ≥ 2 + 7 + 1,5 = 10,5 ns

          f_max = 1 / 10,5 ns ≈ 95 MHz

          ```


          **Vincolo di hold**, dal cammino corto: il dato nuovo non deve arrivare al flip-flop successivo
          prima che sia passato il tempo di hold dal fronte.


          ```

          t_propagazione + t_combinatorio_min ≥ t_hold

          2 + 1 = 3 ns  ≥  0,5 ns   ✓ rispettato

          ```


          Attenzione: rallentare il clock **non** risolve una violazione di hold, perché il vincolo non
          contiene il periodo. Si corregge solo allungando il cammino corto (per esempio inserendo dei buffer)
          — ed è per questo che le violazioni di hold sono considerate più gravi di quelle di setup.
        en: >-
          **Maximum frequency**, from the long path:


          ```

          T ≥ t_propagation + t_combinational_max + t_setup
            ≥ 2 + 7 + 1.5 = 10.5 ns

          f_max = 1 / 10.5 ns ≈ 95 MHz

          ```


          **Hold constraint**, from the short path: the new data must not reach the next flip-flop before the
          hold time has elapsed since the edge.


          ```

          t_propagation + t_combinational_min ≥ t_hold

          2 + 1 = 3 ns  ≥  0.5 ns   ✓ met

          ```


          Careful: slowing down the clock does **not** fix a hold violation, because the constraint does not
          contain the period. It can only be fixed by lengthening the short path (for example by inserting
          buffers) — which is why hold violations are considered more serious than setup ones.
  origin: originale
