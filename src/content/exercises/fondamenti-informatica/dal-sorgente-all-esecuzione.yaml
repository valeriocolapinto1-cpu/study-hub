- id: dal-sorgente-all-esecuzione-es-1
  topic: dal-sorgente-all-esecuzione
  objectives:
    - dal-sorgente-all-esecuzione.2
    - dal-sorgente-all-esecuzione.3
  difficulty: 1
  kind: static
  statement:
    it: Dato questo sorgente, elenca gli indirizzi assegnati a ogni riga e scrivi la **tabella dei simboli**. Le
      parole sono a 32 bit e la memoria è indirizzata al byte.
    en: Given this source, list the addresses assigned to each line and write the **symbol table**. Words are 32
      bits and memory is byte-addressed.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: "Tieni un contatore di posizione che parte dal valore di ORIGIN e cresce di 4 a ogni istruzione. Le
          etichette non occupano spazio: nominano l’indirizzo della riga su cui stanno."
        en: "Keep a location counter that starts at the ORIGIN value and grows by 4 at every instruction. Labels take
          no space: they name the address of the line they are on."
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```
                    ORIGIN 200
          PARTE:    Move  R1, #0        ; 200
                    Move  R2, CONT      ; 204
          GIRO:     Add   R1, R1, R2    ; 208
                    Sub   R2, R2, #1    ; 212
                    Branch>0 GIRO       ; 216
                    Move  TOT, R1       ; 220
          CONT:     DATAWORD 8          ; 224

          TOT:      RESERVE 4           ; 228
                    END PARTE
          ```


          Tabella dei simboli al termine della prima passata:


          ```

          PARTE → 200      GIRO → 208      CONT → 224      TOT → 228

          ```


          Attenzione a due cose: `DATAWORD` e `RESERVE` **occupano memoria** e fanno avanzare il contatore
          esattamente come le istruzioni; `ORIGIN` e `END` no, perché sono istruzioni per l’assemblatore e non
          finiscono in memoria.
        en: >-
          ```
                    ORIGIN 200
          PARTE:    Move  R1, #0        ; 200
                    Move  R2, CONT      ; 204
          GIRO:     Add   R1, R1, R2    ; 208
                    Sub   R2, R2, #1    ; 212
                    Branch>0 GIRO       ; 216
                    Move  TOT, R1       ; 220
          CONT:     DATAWORD 8          ; 224

          TOT:      RESERVE 4           ; 228
                    END PARTE
          ```


          Symbol table at the end of the first pass:


          ```

          PARTE → 200      GIRO → 208      CONT → 224      TOT → 228

          ```


          Watch out for two things: `DATAWORD` and `RESERVE` **take memory** and advance the counter exactly
          like instructions; `ORIGIN` and `END` do not, because they are instructions for the assembler and do
          not end up in memory.
  origin: originale
- id: dal-sorgente-all-esecuzione-es-2
  topic: dal-sorgente-all-esecuzione
  objectives:
    - dal-sorgente-all-esecuzione.2
  difficulty: 1
  kind: static
  statement:
    it: L’assemblatore segnala «simbolo `FINE` non definito». In quale delle due passate se ne accorge, e perché
      non prima?
    en: The assembler reports “undefined symbol `FINE`”. In which of the two passes does it notice, and why not
      earlier?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Chiediti che cosa fa ciascuna passata e quando l’assemblatore è in grado di sapere che un’etichetta
          **non** esiste.
        en: Ask yourself what each pass does and when the assembler is able to know that a label does **not** exist.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          Se ne accorge nella **seconda** passata, cioè quando prova a tradurre l’istruzione che nomina `FINE`
          e non trova la voce nella tabella dei simboli.


          Non può accorgersene prima perché durante la prima passata l’etichetta potrebbe semplicemente
          **essere più avanti**: incontrare un riferimento a un nome ancora ignoto è la situazione normale,
          non un errore. Solo a scansione conclusa la tabella è completa, e da quel momento un nome assente è
          davvero assente.


          È lo stesso motivo per cui esistono due passate: la prima **raccoglie**, la seconda **usa**. Un
          assemblatore a una sola passata dovrebbe tenere una lista dei riferimenti in sospeso e tornare a
          correggerli alla fine — che è, di fatto, una seconda passata mascherata.
        en: >-
          It notices in the **second** pass, i.e. when it tries to translate the instruction naming `FINE` and
          does not find the entry in the symbol table.


          It cannot notice earlier because during the first pass the label might simply **be further on**:
          meeting a reference to a name not yet known is the normal situation, not an error. Only once the
          scan is complete is the table complete, and from then on a missing name is really missing.


          It is the same reason why there are two passes: the first **collects**, the second **uses**. A
          one-pass assembler would have to keep a list of pending references and go back to fix them at the
          end — which is, in fact, a disguised second pass.
  origin: originale
- id: dal-sorgente-all-esecuzione-es-3
  topic: dal-sorgente-all-esecuzione
  objectives:
    - dal-sorgente-all-esecuzione.3
  difficulty: 2
  kind: static
  statement:
    it: "Con `ORIGIN 100`, calcola l’indirizzo di ogni riga: due istruzioni, poi `RESERVE 20`, poi `DATAWORD 7`,
      poi un’altra istruzione, infine l’etichetta `DOPO`. Parole a 32 bit, memoria al byte."
    en: "With `ORIGIN 100`, compute the address of each line: two instructions, then `RESERVE 20`, then `DATAWORD
      7`, then another instruction, finally the label `DOPO`. 32-bit words, byte-addressed memory."
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: "`RESERVE` prende il numero di **byte** indicato, non di parole. Le istruzioni ne occupano 4 ciascuna."
        en: "`RESERVE` takes the indicated number of **bytes**, not words. Instructions take 4 each."
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```
                    ORIGIN 100
                    Move R1, #0        →  100
                    Move R2, #1        →  104
          BUFFER:   RESERVE 20         →  108   (occupa 108…127)

          COST:     DATAWORD 7         →  128
                    Add  R1, R1, R2    →  132
          DOPO:     ...                →  136

          ```


          Il punto delicato è `RESERVE 20`: riserva venti **byte**, cioè cinque parole, quindi il contatore
          salta da 108 a 128. Chi lo legge come «venti parole» sbaglia tutti gli indirizzi successivi; chi lo
          legge come «una riga come le altre» avanza di 4 e sbaglia comunque.


          Nota anche che `RESERVE` **non inizializza**: quei venti byte contengono valori indefiniti finché il
          programma non ci scrive.
        en: >-
          ```
                    ORIGIN 100
                    Move R1, #0        →  100
                    Move R2, #1        →  104
          BUFFER:   RESERVE 20         →  108   (takes 108…127)

          COST:     DATAWORD 7         →  128
                    Add  R1, R1, R2    →  132
          DOPO:     ...                →  136

          ```


          The tricky point is `RESERVE 20`: it reserves twenty **bytes**, i.e. five words, so the counter
          jumps from 108 to 128. Whoever reads it as “twenty words” gets all the following addresses wrong;
          whoever reads it as “a line like any other” advances by 4 and is wrong anyway.


          Note also that `RESERVE` **does not initialise**: those twenty bytes hold undefined values until the
          program writes to them.
  origin: originale
- id: dal-sorgente-all-esecuzione-es-4
  topic: dal-sorgente-all-esecuzione
  objectives:
    - dal-sorgente-all-esecuzione.4
  difficulty: 2
  kind: static
  statement:
    it: Una libreria grafica occupa 2 MB. Cinque programmi la usano e sono in esecuzione contemporaneamente.
      Quanta memoria serve con collegamento **statico** e quanta con collegamento **dinamico**?
    en: A graphics library takes 2 MB. Five programs use it and run at the same time. How much memory is needed
      with **static** linking and how much with **dynamic** linking?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Con lo statico la libreria entra dentro ogni eseguibile. Con il dinamico esiste una copia sola, condivisa.
        en: With static linking the library goes inside every executable. With dynamic linking there is a single
          shared copy.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          STATICO    5 programmi × 2 MB = 10 MB di codice di libreria in memoria
                     (più 2 MB dentro ciascun file eseguibile su disco)

          DINAMICO   una copia sola = 2 MB, mappata nello spazio di indirizzi
                     di tutti e cinque i processi
          ```


          Il dinamico vince anche sull’**aggiornamento**: correggere un difetto nella libreria significa
          sostituire un file, senza ricollegare i cinque programmi.


          Che cosa costa: l’eseguibile non è più autosufficiente. Se la libreria manca, è di versione
          sbagliata o è stata sostituita in modo incompatibile, il programma non parte o si comporta male — il
          classico «manca una DLL». Lo statico paga spazio per comprare indipendenza.
        en: >-
          ```

          STATIC     5 programs × 2 MB = 10 MB of library code in memory
                     (plus 2 MB inside each executable file on disk)

          DYNAMIC    a single copy = 2 MB, mapped into the address space
                     of all five processes
          ```


          Dynamic linking also wins on **updates**: fixing a bug in the library means replacing one file,
          without relinking the five programs.


          What it costs: the executable is no longer self-sufficient. If the library is missing, of the wrong
          version or replaced incompatibly, the program does not start or misbehaves — the classic “missing
          DLL”. Static linking pays space to buy independence.
  origin: originale
- id: dal-sorgente-all-esecuzione-es-5
  topic: dal-sorgente-all-esecuzione
  objectives:
    - dal-sorgente-all-esecuzione.5
  difficulty: 2
  kind: static
  statement:
    it: "Attribuisci ciascun messaggio d’errore allo strumento che lo produce — compilatore, assemblatore,
      collegatore, caricatore o esecuzione: «manca il punto e virgola» · «simbolo `stampa` non definito» ·
      «indirizzo non allineato» · «riferimento esterno `sqrt` irrisolto» · «memoria insufficiente per caricare
      il programma»."
    en: "Attribute each error message to the tool that produces it — compiler, assembler, linker, loader or
      execution: “missing semicolon” · “undefined symbol `stampa`” · “misaligned address” · “unresolved
      external reference `sqrt`” · “not enough memory to load the program”."
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: "Ogni strumento vede solo una cosa: il compilatore la sintassi, l’assemblatore un modulo per volta, il
          collegatore i rapporti fra moduli, il caricatore la memoria disponibile."
        en: "Each tool sees only one thing: the compiler the syntax, the assembler one module at a time, the linker
          the relations between modules, the loader the available memory."
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          «manca il punto e virgola»            → compilatore (analisi sintattica)

          «simbolo stampa non definito»          → assemblatore (etichetta assente
                                                   dentro QUESTO modulo)
          «riferimento esterno sqrt irrisolto»   → collegatore (nessun modulo o
                                                   libreria lo definisce)
          «memoria insufficiente per caricare»   → caricatore

          «indirizzo non allineato»              → esecuzione (eccezione
                                                   sollevata dall'hardware)
          ```


          La coppia che si confonde più spesso è la seconda con la terza. Se il nome dovrebbe stare **nello
          stesso file** ed è assente, se ne accorge l’assemblatore in seconda passata. Se il nome è dichiarato
          esterno e va cercato **in un altro modulo**, l’assemblatore lascia il buco e la palla passa al
          collegatore.
        en: >-
          ```

          “missing semicolon”                     → compiler (syntax analysis)

          “undefined symbol stampa”               → assembler (label missing
                                                    inside THIS module)
          “unresolved external reference sqrt”    → linker (no module or
                                                    library defines it)
          “not enough memory to load”             → loader

          “misaligned address”                    → execution (exception
                                                    raised by the hardware)
          ```


          The pair most often confused is the second with the third. If the name should be **in the same
          file** and is missing, the assembler notices in the second pass. If the name is declared external
          and must be looked up **in another module**, the assembler leaves the hole and the ball passes to
          the linker.
  origin: originale
- id: mcq-sw-01
  topic: dal-sorgente-all-esecuzione
  objectives:
    - dal-sorgente-all-esecuzione.1
  difficulty: 1
  kind: static
  statement:
    it: Perché un assemblatore lavora in **due passate**?
    en: Why does an assembler work in **two passes**?
  steps:
    - title:
        it: Risposta
        en: Answer
      body:
        it: Perché nella prima passata costruisce la tabella dei simboli, e solo allora può risolvere i salti in
          avanti
        en: Because in the first pass it builds the symbol table, and only then can it resolve forward branches
  choices:
    - text:
        it: Per controllare due volte la sintassi
        en: To check the syntax twice
      correct: false
    - text:
        it: Perché nella prima passata costruisce la tabella dei simboli, e solo allora può risolvere i salti in
          avanti
        en: Because in the first pass it builds the symbol table, and only then can it resolve forward branches
      correct: true
    - text:
        it: Perché deve tradurre prima i dati e poi le istruzioni
        en: Because it must translate the data first and then the instructions
      correct: false
    - text:
        it: Per ottimizzare il codice generato
        en: To optimise the generated code
      correct: false
  origin: originale
- id: mcq-sw-02
  topic: dal-sorgente-all-esecuzione
  objectives:
    - dal-sorgente-all-esecuzione.1
  difficulty: 1
  kind: static
  statement:
    it: Che cosa produce la direttiva `DATAWORD 42`?
    en: What does the directive `DATAWORD 42` produce?
  steps:
    - title:
        it: Risposta
        en: Answer
      body:
        it: Una parola di memoria inizializzata a 42, non un’istruzione
        en: A memory word initialised to 42, not an instruction
  choices:
    - text:
        it: Un’istruzione che carica 42 in un registro
        en: An instruction that loads 42 into a register
      correct: false
    - text:
        it: Una parola di memoria inizializzata a 42, non un’istruzione
        en: A memory word initialised to 42, not an instruction
      correct: true
    - text:
        it: Una costante simbolica utilizzabile nel sorgente
        en: A symbolic constant usable in the source
      correct: false
    - text:
        it: Una riserva di 42 byte non inizializzati
        en: A reservation of 42 uninitialised bytes
      correct: false
  origin: originale
- id: mcq-sw-03
  topic: dal-sorgente-all-esecuzione
  objectives:
    - dal-sorgente-all-esecuzione.1
  difficulty: 1
  kind: static
  statement:
    it: Di che cosa si occupa il **collegatore** (linker)?
    en: What does the **linker** do?
  steps:
    - title:
        it: Risposta
        en: Answer
      body:
        it: Di risolvere i riferimenti esterni fra moduli oggetto e librerie, producendo l’eseguibile
        en: Resolves external references between object modules and libraries, producing the executable
  choices:
    - text:
        it: Di tradurre i mnemonici in codici operativi
        en: Translates mnemonics into opcodes
      correct: false
    - text:
        it: Di risolvere i riferimenti esterni fra moduli oggetto e librerie, producendo l’eseguibile
        en: Resolves external references between object modules and libraries, producing the executable
      correct: true
    - text:
        it: Di copiare il programma in memoria e avviarlo
        en: Copies the program into memory and starts it
      correct: false
    - text:
        it: Di allocare la memoria ai processi durante l’esecuzione
        en: Allocates memory to processes during execution
      correct: false
  origin: originale
- id: mcq-sw-04
  topic: dal-sorgente-all-esecuzione
  objectives:
    - dal-sorgente-all-esecuzione.1
  difficulty: 1
  kind: static
  statement:
    it: In quali casi il sistema operativo riprende il controllo del processore?
    en: In which cases does the operating system regain control of the processor?
  steps:
    - title:
        it: Risposta
        en: Answer
      body:
        it: Solo su chiamata di sistema, interruzione o eccezione
        en: Only on a system call, an interrupt or an exception
  choices:
    - text:
        it: In continuazione, perché gira in parallelo al programma utente
        en: Continuously, because it runs in parallel with the user program
      correct: false
    - text:
        it: Solo su chiamata di sistema, interruzione o eccezione
        en: Only on a system call, an interrupt or an exception
      correct: true
    - text:
        it: A ogni istruzione, che verifica prima di eseguirla
        en: At every instruction, which it checks before executing it
      correct: false
    - text:
        it: Solo quando il programma termina
        en: Only when the program terminates
      correct: false
  origin: originale
