- id: risc-cisc-assembly-es-1
  topic: risc-cisc-assembly
  objectives:
    - risc-cisc-assembly.2
  difficulty: 1
  kind: static
  statement:
    it: "Per ciascuna istruzione, di’ quale **modo di indirizzamento** usa e che cosa finisce in R1: `Move R1,#5`
      · `Move R1,5` · `Move R1,(R2)` · `Move R1,20(R2)` · `Move R1,(R2)+`."
    en: "For each instruction, state which **addressing mode** it uses and what ends up in R1: `Move R1,#5` ·
      `Move R1,5` · `Move R1,(R2)` · `Move R1,20(R2)` · `Move R1,(R2)+`."
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: "La domanda da farsi ogni volta è: il campo scritto nell’istruzione è il **dato**, l’**indirizzo del
          dato**, o l’indirizzo di dove sta l’indirizzo?"
        en: "The question to ask each time is: is the field written in the instruction the **data**, the **address of
          the data**, or the address of where the address is?"
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          Move R1, #5       immediato   → R1 = 5 (la costante è nell'istruzione)

          Move R1, 5        diretto      → R1 = contenuto della cella 5

          Move R1, (R2)     indiretto    → R1 = contenuto della cella il cui
                                           indirizzo sta in R2
          Move R1, 20(R2)   base+spiazz. → R1 = contenuto della cella [R2]+20;
                                           R2 non cambia
          Move R1, (R2)+    autoincremento → come l'indiretto, ma dopo l'accesso
                                           R2 avanza alla parola successiva
          ```


          Il cancelletto è la differenza fra *il numero 5* e *quello che c’è nella casella 5*.
          L’autoincremento esiste perché scorrere un vettore è l’operazione più frequente in assoluto:
          risparmia un’istruzione di somma a ogni giro.
        en: >-
          ```

          Move R1, #5       immediate    → R1 = 5 (the constant is in the instruction)

          Move R1, 5        direct       → R1 = contents of cell 5

          Move R1, (R2)     indirect     → R1 = contents of the cell whose
                                           address is in R2
          Move R1, 20(R2)   base+displ.  → R1 = contents of cell [R2]+20;
                                           R2 does not change
          Move R1, (R2)+    autoincrement → like indirect, but after the access
                                           R2 advances to the next word
          ```


          The hash is the difference between *the number 5* and *what is in box 5*. Autoincrement exists
          because walking an array is by far the most frequent operation: it saves an addition instruction at
          every iteration.
  origin: originale
- id: risc-cisc-assembly-es-2
  topic: risc-cisc-assembly
  objectives:
    - risc-cisc-assembly.5
  difficulty: 1
  kind: static
  statement:
    it: "Traduci in assembly questo ciclo: `somma = 0; for (i = 0; i < 10; i++) somma += i;`"
    en: "Translate this loop into assembly: `sum = 0; for (i = 0; i < 10; i++) sum += i;`"
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Servono due registri (accumulatore e contatore) e un salto condizionato in coda. Occhio a dove metti il
          confronto.
        en: Two registers (accumulator and counter) and a conditional branch at the end are needed. Watch where you
          put the comparison.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```
                Clear  R1              ; R1 = somma
                Clear  R2              ; R2 = i
          CICLO: Add    R1, R1, R2      ; somma += i
                Add    R2, R2, #1      ; i++
                Cmp    R2, #10
                Branch<  CICLO         ; se i < 10 ripeti
                Move   SOMMA, R1
          ```


          Il salto è **in coda**, quindi il corpo viene eseguito almeno una volta: qui va bene perché il ciclo
          parte da i = 0 e deve girare di sicuro. Se il numero di iterazioni potesse essere zero, servirebbe
          un controllo anche **prima** del corpo.


          Il risultato è 0+1+…+9 = 45. Un modo per verificare a mente una traduzione è sempre questo:
          eseguirla su un caso piccolo e confrontare con la formula.
        en: >-
          ```
                Clear  R1              ; R1 = sum
                Clear  R2              ; R2 = i
          CICLO: Add    R1, R1, R2      ; sum += i
                Add    R2, R2, #1      ; i++
                Cmp    R2, #10
                Branch<  CICLO         ; if i < 10 repeat
                Move   SOMMA, R1
          ```


          The branch is **at the end**, so the body is executed at least once: here that is fine because the
          loop starts at i = 0 and must certainly run. If the number of iterations could be zero, a check
          **before** the body would also be needed.


          The result is 0+1+…+9 = 45. A way to check a translation in your head is always this: run it on a
          small case and compare with the formula.
  origin: originale
- id: risc-cisc-assembly-es-3
  topic: risc-cisc-assembly
  objectives:
    - risc-cisc-assembly.5
  difficulty: 2
  kind: static
  statement:
    it: Scrivi un programma che trova il **valore massimo** in un vettore di N interi che comincia all’indirizzo
      `VETT`.
    en: Write a program that finds the **maximum value** in an array of N integers starting at address `VETT`.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Un registro tiene il massimo provvisorio, inizializzato al primo elemento; poi si scorre confrontando.
          Ricorda di avanzare il puntatore della dimensione della parola.
        en: A register holds the provisional maximum, initialised to the first element; then you walk the array
          comparing. Remember to advance the pointer by the word size.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```
                Move   R2, #VETT       ; puntatore al vettore
                Move   R3, N           ; quanti elementi
                Move   R1, (R2)        ; massimo provvisorio = primo elemento
                Add    R2, R2, #4      ; passa al secondo
                Sub    R3, R3, #1      ; ne resta uno in meno da esaminare

          CICLO: Move   R4, (R2)        ; elemento corrente
                Cmp    R4, R1
                Branch≤ AVANTI         ; se non è maggiore, lascia stare
                Move   R1, R4          ; nuovo massimo
          AVANTI: Add    R2, R2, #4
                Sub    R3, R3, #1
                Branch>0 CICLO

                Move   MAX, R1
          ```


          Tre punti che l’esame guarda: il massimo è inizializzato al **primo elemento** e non a zero
          (altrimenti su un vettore tutto negativo la risposta sarebbe sbagliata); il puntatore avanza di
          **4** perché le parole sono a 32 bit su memoria indirizzata al byte; il contatore parte da N−1
          perché il primo elemento è già stato consumato.
        en: >-
          ```
                Move   R2, #VETT       ; pointer to the array
                Move   R3, N           ; how many elements
                Move   R1, (R2)        ; provisional maximum = first element
                Add    R2, R2, #4      ; move to the second
                Sub    R3, R3, #1      ; one fewer left to examine

          CICLO: Move   R4, (R2)        ; current element
                Cmp    R4, R1
                Branch≤ AVANTI         ; if it is not larger, leave it
                Move   R1, R4          ; new maximum
          AVANTI: Add    R2, R2, #4
                Sub    R3, R3, #1
                Branch>0 CICLO

                Move   MAX, R1
          ```


          Three points the exam looks at: the maximum is initialised to the **first element** and not to zero
          (otherwise on an all-negative array the answer would be wrong); the pointer advances by **4**
          because words are 32 bits on byte-addressed memory; the counter starts at N−1 because the first
          element has already been consumed.
  origin: originale
- id: risc-cisc-assembly-es-4
  topic: risc-cisc-assembly
  objectives:
    - risc-cisc-assembly.4
  difficulty: 2
  kind: static
  statement:
    it: Il programma A chiama la procedura B, che a sua volta chiama C. Mostra come cambia la **pila** e spiega
      perché non basterebbe un registro per l’indirizzo di ritorno.
    en: Program A calls procedure B, which in turn calls C. Show how the **stack** changes and explain why a
      single register for the return address would not be enough.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Ogni chiamata deposita qualcosa e ogni ritorno lo toglie, nell’ordine inverso. Prova a immaginare cosa
          accadrebbe con un solo registro.
        en: Every call deposits something and every return removes it, in reverse order. Try to imagine what would
          happen with a single register.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          A chiama B →  pila:  [ ritorno in A ]                 ← SP


          B chiama C →  pila:  [ ritorno in A ]
                               [ ritorno in B ]                 ← SP

          C ritorna  →  si estrae «ritorno in B», si salta lì
                        pila:  [ ritorno in A ]                 ← SP

          B ritorna  →  si estrae «ritorno in A», si salta lì
                        pila:  vuota
          ```


          Con un **solo registro** di ritorno, la chiamata da B a C lo sovrascriverebbe: al momento di tornare
          da C si tornerebbe correttamente in B, ma l’indirizzo di rientro in A sarebbe perduto e il programma
          non saprebbe più dove andare.


          La pila risolve perché è **LIFO**, e le chiamate sono per natura annidate: l’ultima aperta è la
          prima a chiudersi. Oltre all’indirizzo di ritorno, sulla pila viaggiano i parametri, le variabili
          locali e i registri che la procedura deve preservare — l’insieme si chiama **record di
          attivazione**.
        en: >-
          ```

          A calls B  →  stack: [ return to A ]                  ← SP


          B calls C  →  stack: [ return to A ]
                               [ return to B ]                  ← SP

          C returns  →  "return to B" is popped, jump there
                        stack: [ return to A ]                  ← SP

          B returns  →  "return to A" is popped, jump there
                        stack: empty
          ```


          With a **single** return register, the call from B to C would overwrite it: on returning from C you
          would correctly go back to B, but the return address into A would be lost and the program would no
          longer know where to go.


          The stack solves it because it is **LIFO**, and calls are nested by nature: the last one opened is
          the first to close. Besides the return address, the stack carries parameters, local variables and
          the registers the procedure must preserve — together called the **activation record**.
  origin: originale
- id: risc-cisc-assembly-es-5
  topic: risc-cisc-assembly
  objectives:
    - risc-cisc-assembly.5
  difficulty: 2
  kind: static
  statement:
    it: "La parola `0x12345678` viene scritta a partire dall’indirizzo 100. Mostra il contenuto dei byte 100-103
      in **big-endian** e in **little-endian**. Poi: leggendo un solo byte all’indirizzo 100, che cosa si
      ottiene nei due casi?"
    en: "The word `0x12345678` is written starting at address 100. Show the contents of bytes 100-103 in
      **big-endian** and in **little-endian**. Then: reading a single byte at address 100, what do you get in
      the two cases?"
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Big-endian mette per primo il byte «grande», cioè il più significativo. Little-endian fa il contrario.
          L’indirizzo della parola resta 100 in entrambi i casi.
        en: Big-endian puts the “big” byte, i.e. the most significant one, first. Little-endian does the opposite. The
          address of the word stays 100 in both cases.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```
                      100   101   102   103
          big-endian   12    34    56    78

          little-endian 78    56    34    12

          ```


          Leggendo un byte all’indirizzo 100 si ottiene `0x12` in big-endian e `0x78` in little-endian: lo
          **stesso indirizzo** restituisce dati diversi.


          Perché conta: finché i dati restano nella stessa macchina la convenzione è invisibile. Diventa un
          problema quando si scambiano dati binari — un file, un pacchetto di rete, un dispositivo — fra
          macchine con convenzioni opposte. Per questo i protocolli di rete fissano un ordine (il *network
          byte order*, big-endian) e le macchine little-endian convertono in ingresso e in uscita.
        en: >-
          ```
                        100   101   102   103
          big-endian     12    34    56    78

          little-endian  78    56    34    12

          ```


          Reading a byte at address 100 gives `0x12` in big-endian and `0x78` in little-endian: the **same
          address** returns different data.


          Why it matters: as long as data stays on the same machine the convention is invisible. It becomes a
          problem when exchanging binary data — a file, a network packet, a device — between machines with
          opposite conventions. That is why network protocols fix an order (the *network byte order*,
          big-endian) and little-endian machines convert on input and output.
  origin: originale
