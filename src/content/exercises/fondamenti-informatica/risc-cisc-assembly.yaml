- id: asmw-mul
  topic: risc-cisc-assembly
  objectives:
    - risc-cisc-assembly.5
  difficulty: 3
  kind: static
  statement:
    it: Scrivi un programma in stile RISC che calcoli la moltiplicazione di due numeri in LOC1 e LOC2 tramite
      somme successive, salvando il risultato in LOC3.
  steps:
    - title:
        it: Soluzione modello
        en: Model solution
      body:
        it: |-
          ```
                Load  LOC1, NUM1
                Load  LOC2, NUM2
                Clear LOC3
          CICLO: Sub   LOC2, LOC2, 1
                Add   LOC3, LOC3, LOC1
                Branch_if_[LOC2]>0  CICLO
                Store LOC3, RES
          ```
  origin: originale
- id: asmw-sum-list
  topic: risc-cisc-assembly
  objectives:
    - risc-cisc-assembly.5
  difficulty: 3
  kind: static
  statement:
    it: Scrivi un programma che sommi N valori contigui a partire dall'indirizzo LIST e salvi il totale in SUM.
  steps:
    - title:
        it: Soluzione modello
        en: Model solution
      body:
        it: |-
          ```
                Load  N, R1
                Move  R2, #LIST
                Clear R3
          L:    Load  (R2), R4
                Add   R3, R3, R4
                Add   R2, R2, #4
                Sub   R1, R1, #1
                Branch_if_[R1]>0  L
                Store R3, SUM
          ```
  origin: originale
