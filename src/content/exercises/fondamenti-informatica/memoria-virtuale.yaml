- id: memoria-virtuale-es-1
  topic: memoria-virtuale
  objectives:
    - memoria-virtuale.1
  difficulty: 1
  kind: static
  statement:
    it:
      Pagine da **4 KiB**. Traduci l’indirizzo virtuale `0x0002A7F4` sapendo che la pagina cercata sta nel frame
      `0x0C3`.
    en: '**4 KiB** pages. Translate the virtual address `0x0002A7F4` knowing that the page sought is in frame
      `0x0C3`.'
  figure:
    diagram:
      type: bitfield
      params:
        bits: 0000 0000 0000 0010 1010 0111 1111 0100
        fields:
          - msb: 31
            lsb: 12
            label:
              it: numero di pagina virtuale
              en: virtual page number
          - msb: 11
            lsb: 0
            label: offset
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it:
          Prima separa offset e numero di pagina contando i bit. Con pagine da 4 KiB il taglio cade su un confine
          comodo in esadecimale.
        en:
          First separate offset and page number by counting bits. With 4 KiB pages the cut falls on a convenient
          boundary in hexadecimal.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          4 KiB = 2¹² byte  →  offset = 12 bit = 3 cifre esadecimali


          0x0002A7F4  =  0x0002A | 7F4
                         ↑ pagina  ↑ offset

          pagina 0x0002A  →  (tabella delle pagine)  →  frame 0x0C3


          fisico = 0x0C3 << 12  |  0x7F4  =  0x000C37F4

          ```


          Verifica immediata: le ultime **tre cifre esadecimali sono rimaste 7F4**. Se in un esercizio
          cambiano, la traduzione è sbagliata: pagina e frame hanno la stessa dimensione, quindi la posizione
          interna non può cambiare.
        en: >-
          ```

          4 KiB = 2¹² bytes  →  offset = 12 bits = 3 hex digits


          0x0002A7F4  =  0x0002A | 7F4
                         ↑ page    ↑ offset

          page 0x0002A  →  (page table)  →  frame 0x0C3


          physical = 0x0C3 << 12  |  0x7F4  =  0x000C37F4

          ```


          Immediate check: the last **three hex digits are still 7F4**. If in an exercise they change, the
          translation is wrong: page and frame have the same size, so the internal position cannot change.
  answer:
    - label:
        it: Indirizzo fisico
        en: Physical address
      value: 000C37F4
      kind: text
      accept:
        - '0x000C37F4'
        - 000C37F4h
        - 000C37F416
  origin: originale
- id: memoria-virtuale-es-2
  topic: memoria-virtuale
  objectives:
    - memoria-virtuale.2
  difficulty: 1
  kind: static
  statement:
    it: Indirizzi virtuali a **32 bit**, pagine da **4 KiB**, ogni voce della tabella delle pagine occupa **4
      byte**. Quanto occupa la tabella di un processo? E se i processi attivi sono 100?
    en:
      '**32-bit** virtual addresses, **4 KiB** pages, each page-table entry takes **4 bytes**. How much space
      does one process’s table take? And if there are 100 active processes?'
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Il numero di voci è il numero di pagine dello spazio virtuale, non di quelle effettivamente usate.
        en: The number of entries is the number of pages of the virtual space, not of those actually used.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          numero di pagine = 2³² / 2¹² = 2²⁰ = 1 048 576 voci

          dimensione = 2²⁰ × 4 byte = 4 MiB per processo


          100 processi → 100 × 4 MiB = 400 MiB di sole tabelle

          ```


          Un risultato assurdo: le tabelle occuperebbero più della memoria che devono gestire, e per giunta la
          maggior parte delle voci si riferisce a pagine **mai usate**, perché nessun processo occupa davvero
          4 GiB.


          Da qui le due soluzioni reali: la tabella a **più livelli**, in cui si allocano solo i rami
          effettivamente usati, e la tabella **invertita**, che ha una voce per frame fisico invece che per
          pagina virtuale — quindi cresce con la memoria installata e non con lo spazio di indirizzamento.
        en: >-
          ```

          number of pages = 2³² / 2¹² = 2²⁰ = 1,048,576 entries

          size = 2²⁰ × 4 bytes = 4 MiB per process


          100 processes → 100 × 4 MiB = 400 MiB of tables alone

          ```


          An absurd result: the tables would take more than the memory they must manage, and on top of that
          most entries refer to pages **never used**, because no process really occupies 4 GiB.


          Hence the two real solutions: the **multi-level** table, in which only the branches actually used
          are allocated, and the **inverted** table, which has one entry per physical frame instead of per
          virtual page — so it grows with installed memory and not with the address space.
  answer:
    - label:
        it: Tabella di un processo
        en: Table of one process
      value: 4
      unit: MiB
      tol: 1e-9
    - label:
        it: Tabelle di 100 processi
        en: Tables of 100 processes
      value: 400
      unit: MiB
      tol: 1e-9
  origin: originale
- id: memoria-virtuale-es-3
  topic: memoria-virtuale
  objectives:
    - memoria-virtuale.3
  difficulty: 2
  kind: static
  statement:
    it: 'Un accesso in memoria può risolversi in tre modi: **TLB hit**, **TLB miss** senza page fault, **page
      fault**. Descrivi che cosa succede in ciascun caso e quanto costa, in ordine di grandezza.'
    en: 'A memory access can be resolved in three ways: **TLB hit**, **TLB miss** without a page fault, **page
      fault**. Describe what happens in each case and how much it costs, in order of magnitude.'
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: 'Chiediti ogni volta dove si trova la traduzione e dove si trova il dato: sono due domande diverse.'
        en: 'Ask yourself each time where the translation is and where the data is: they are two different questions.'
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          TLB HIT
            la traduzione è nel TLB → indirizzo fisico immediato → si legge il dato
            costo: ~1 accesso in memoria (il dato), il TLB è quasi istantaneo

          TLB MISS, pagina presente
            la traduzione non è nel TLB → si legge la tabella delle pagine in
            memoria → si aggiorna il TLB → si legge il dato
            costo: ~2 accessi in memoria

          PAGE FAULT
            la voce dice «non valida»: la pagina non è in memoria fisica.
            Eccezione → il sistema operativo sceglie un frame, eventualmente
            riscrive su disco quello sfrattato se dirty, carica la pagina,
            aggiorna la tabella, e l'istruzione viene RIESEGUITA
            costo: ~10 ms, cioè MILIONI di cicli
          ```


          I tre casi non sono alternative dello stesso ordine: fra il secondo e il terzo ci sono cinque ordini
          di grandezza. È il motivo per cui il tasso di page fault deve restare bassissimo, mentre un TLB miss
          ogni tanto è del tutto tollerabile.
        en: >-
          ```

          TLB HIT
            the translation is in the TLB → physical address at once → the data is read
            cost: ~1 memory access (the data), the TLB is almost instantaneous

          TLB MISS, page present
            the translation is not in the TLB → the page table is read from
            memory → the TLB is updated → the data is read
            cost: ~2 memory accesses

          PAGE FAULT
            the entry says “not valid”: the page is not in physical memory.
            Exception → the operating system chooses a frame, writes back to
            disk the evicted one if dirty, loads the page,
            updates the table, and the instruction is RE-EXECUTED
            cost: ~10 ms, i.e. MILLIONS of cycles
          ```


          The three cases are not alternatives of the same order: between the second and the third there are
          five orders of magnitude. That is why the page-fault rate must stay extremely low, while an
          occasional TLB miss is entirely tolerable.
  origin: originale
- id: memoria-virtuale-es-4
  topic: memoria-virtuale
  objectives:
    - memoria-virtuale.3
  difficulty: 2
  kind: static
  statement:
    it: TLB con tasso di successo **99 %**, accesso alla memoria 100 cicli, TLB trascurabile. Il tasso di page
      fault è **0,001 %** e un fault costa 10 ms su un processore a **1 GHz**. Calcola il numero medio di
      cicli per accesso.
    en:
      TLB hit rate **99 %**, memory access 100 cycles, TLB negligible. The page-fault rate is **0.001 %** and a
      fault costs 10 ms on a **1 GHz** processor. Compute the average number of cycles per access.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it:
          Calcola prima il contributo delle traduzioni, poi quello dei page fault convertendo i millisecondi in
          cicli. Guarda quale dei due domina.
        en:
          First compute the contribution of translations, then that of page faults converting milliseconds into
          cycles. See which of the two dominates.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          TLB hit  (99 %):   100 cicli          (solo il dato)

          TLB miss (1 %):    200 cicli          (tabella + dato)


          media senza fault = 0,99×100 + 0,01×200 = 99 + 2 = 101 cicli


          un page fault = 10 ms × 1 GHz = 10⁷ cicli

          contributo    = 0,00001 × 10⁷ = 100 cicli


          totale ≈ 101 + 100 = 201 cicli per accesso

          ```


          Il risultato sorprendente: un page fault ogni **centomila** accessi **raddoppia** il tempo medio. Un
          evento rarissimo domina la media, perché il suo costo è cinque ordini di grandezza sopra tutto il
          resto.


          È la lezione generale della gerarchia di memoria: quando le penalità sono enormi, ciò che conta non
          è il caso tipico ma la **frequenza dei casi catastrofici**. E spiega perché il sistema operativo
          lavora tanto sulle politiche di sostituzione delle pagine.
        en: >-
          ```

          TLB hit  (99 %):   100 cycles         (data only)

          TLB miss (1 %):    200 cycles         (table + data)


          average without faults = 0.99×100 + 0.01×200 = 99 + 2 = 101 cycles


          one page fault = 10 ms × 1 GHz = 10⁷ cycles

          contribution   = 0.00001 × 10⁷ = 100 cycles


          total ≈ 101 + 100 = 201 cycles per access

          ```


          The surprising result: one page fault every **hundred thousand** accesses **doubles** the average
          time. An extremely rare event dominates the average, because its cost is five orders of magnitude
          above everything else.


          It is the general lesson of the memory hierarchy: when penalties are huge, what matters is not the
          typical case but the **frequency of catastrophic cases**. And it explains why the operating system
          works so hard on page-replacement policies.
  answer:
    - label:
        it: Cicli medi per accesso
        en: Average cycles per access
      value: 201
      tol: 1e-9
  origin: originale
- id: memoria-virtuale-es-5
  topic: memoria-virtuale
  objectives:
    - memoria-virtuale.4
  difficulty: 2
  kind: static
  statement:
    it:
      Un programma tenta di scrivere in una pagina marcata di **sola lettura**. Descrivi che cosa accade, passo
      per passo, e a che cosa serve questo meccanismo.
    en: A program tries to write to a page marked **read-only**. Describe what happens, step by step, and what
      this mechanism is for.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it:
          'La verifica non la fa il programma né il compilatore: la fanno i bit di protezione nella voce della
          tabella delle pagine, controllati dall’hardware a ogni accesso.'
        en:
          'The check is done neither by the program nor by the compiler: it is done by the protection bits in the
          page-table entry, checked by the hardware at every access.'
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          1. il programma esegue una Store verso un indirizzo virtuale

          2. l'unità di gestione della memoria traduce l'indirizzo e legge
             i bit di protezione della voce corrispondente
          3. il bit «scrivibile» è a 0, ma l'accesso è in scrittura:
             → violazione
          4. viene sollevata un'ECCEZIONE (violazione di protezione),
             sincrona rispetto all'istruzione
          5. il controllo passa al sistema operativo, che tipicamente
             termina il processo — il classico «segmentation fault»
          ```


          A che serve: a **isolare** i processi e a proteggere ciò che non deve cambiare. Il codice di un
          programma è mappato in sola lettura, così un difetto non può riscrivere le proprie istruzioni; le
          pagine di un processo non sono raggiungibili da un altro, perché semplicemente non compaiono nella
          sua tabella.


          Lo stesso meccanismo, usato in positivo, abilita la **copia su scrittura**: due processi condividono
          le stesse pagine fisiche marcate in sola lettura, e solo quando uno prova a scrivere l’eccezione fa
          creare al sistema operativo una copia privata. È così che le chiamate di creazione di un processo
          diventano economiche.
        en: >-
          ```

          1. the program executes a Store to a virtual address

          2. the memory management unit translates the address and reads
             the protection bits of the corresponding entry
          3. the “writable” bit is 0, but the access is a write:
             → violation
          4. an EXCEPTION is raised (protection violation),
             synchronous with respect to the instruction
          5. control passes to the operating system, which typically
             terminates the process — the classic “segmentation fault”
          ```


          What it is for: to **isolate** processes and protect what must not change. A program's code is
          mapped read-only, so a bug cannot overwrite its own instructions; a process's pages cannot be
          reached by another, because they simply do not appear in its table.


          The same mechanism, used positively, enables **copy-on-write**: two processes share the same
          physical pages marked read-only, and only when one tries to write does the exception make the
          operating system create a private copy. That is how process-creation calls become cheap.
  origin: originale
