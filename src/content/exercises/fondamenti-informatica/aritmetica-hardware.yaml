- id: schema-sommatore-sottrattore
  topic: aritmetica-hardware
  objectives:
    - aritmetica-hardware.1
    - aritmetica-hardware.2
  difficulty: 2
  kind: static
  statement:
    it: >-
      Completa lo schema «Circuito di addizione e sottrazione»: scrivi per ogni posizione numerata l'etichetta
      giusta. L'elenco contiene più etichette delle posizioni.


      Etichette: Bit di somma · Controllo Add/Sub · Decodificatore · Moltiplicatore · Overflow · Porte XOR di
      inversione · Registro accumulatore · Riporto entrante · Riporto uscente · Sommatore a n bit
    en: >-
      Complete the diagram “Addition and subtraction circuit”: for each numbered position write the right
      label. The list contains more labels than positions.


      Labels: Accumulator register · Add/Sub control · Carry in · Carry out · Decoder · Inverting XOR gates ·
      Multiplier · n-bit adder · Overflow · Sum bits
