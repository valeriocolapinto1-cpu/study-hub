          - from: alu
            to: z
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it:
          'Prelievo (tre passi, sempre gli stessi) più la parte specifica. La memoria va letta due volte: una per
          l’istruzione, una per il dato.'
        en:
          'Fetch (three steps, always the same) plus the specific part. Memory must be read twice: once for the
          instruction, once for the data.'
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          1.  PC_out, MAR_in, Read, Select4, Add, Z_in

          2.  Z_out, PC_in, WMFC

          3.  MDR_out, IR_in

          ────────────────────────── fine prelievo

          4.  R2_out, MAR_in, Read

          5.  WMFC

          6.  MDR_out, R1_in, End

          ```


          Al passo 4 il contenuto di R2 — che è un **indirizzo** — viene mandato a MAR e parte la seconda
          lettura. Il passo 5 è pura attesa: qui, a differenza del prelievo, non c’è nulla di utile da fare in
          parallelo. Al passo 6 il dato passa da MDR a R1.


          Se l’istruzione fosse stata `Load R1, 20(R2)` servirebbe un passo in più per sommare lo
          spiazzamento: R2 in Y, poi lo spiazzamento dall’IR sommato a Y e il risultato in MAR.
        en: >-
          ```

          1.  PC_out, MAR_in, Read, Select4, Add, Z_in

          2.  Z_out, PC_in, WMFC

          3.  MDR_out, IR_in

          ────────────────────────── end of fetch

          4.  R2_out, MAR_in, Read

          5.  WMFC

          6.  MDR_out, R1_in, End

          ```


          In step 4 the contents of R2 — which is an **address** — is sent to MAR and the second read starts.
          Step 5 is pure waiting: here, unlike in the fetch, there is nothing useful to do in parallel. In
          step 6 the data goes from MDR to R1.


          Had the instruction been `Load R1, 20(R2)` one more step would be needed to add the displacement: R2
          into Y, then the displacement from IR added to Y and the result into MAR.
  origin: originale
- id: processore-es-4
  topic: processore
  objectives:
    - processore.3
  difficulty: 2
  kind: static
  statement:
    it:
      L’istruzione `Add R1, R2, R3` richiede 6 cicli su un datapath a bus singolo e 4 su uno a tre bus. Con un
      ciclo di clock da 2 ns, quanto dura l’istruzione nei due casi? E su un programma di 10⁶ istruzioni
      analoghe?
    en:
      The instruction `Add R1, R2, R3` takes 6 cycles on a single-bus datapath and 4 on a three-bus one. With a
      2 ns clock cycle, how long does the instruction take in the two cases? And for a program of 10⁶ similar
      instructions?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it:
          Moltiplica cicli per durata del ciclo, poi scala. Chiediti anche **perché** il bus singolo richiede due
          cicli in più.
        en: Multiply cycles by cycle time, then scale. Also ask yourself **why** the single bus needs two more cycles.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          bus singolo:  6 × 2 ns = 12 ns       →  10⁶ × 12 ns = 12 ms

          tre bus:      4 × 2 ns = 8 ns        →  10⁶ ×  8 ns =  8 ms

          ```


          Un terzo di tempo in meno. La ragione dei due cicli risparmiati: sul bus singolo i due operandi
          devono viaggiare in momenti diversi (uno viene parcheggiato nel registro temporaneo Y) e il
          risultato in un terzo momento, mentre con tre bus i due operandi escono insieme su bus A e B e il
          risultato rientra su bus C nello **stesso ciclo**.


          Il prezzo è l’hardware: tre bus significa triplicare le linee e i multiplexer di accesso al banco
          dei registri. È il tipico compromesso costo/prestazioni che l’esame chiede di saper argomentare, non
          solo di calcolare.
        en: >-
          ```

          single bus:   6 × 2 ns = 12 ns       →  10⁶ × 12 ns = 12 ms

          three buses:  4 × 2 ns = 8 ns        →  10⁶ ×  8 ns =  8 ms

          ```


          A third less time. The reason for the two cycles saved: on the single bus the two operands must
          travel at different moments (one is parked in the temporary register Y) and the result at a third
          moment, while with three buses the two operands go out together on buses A and B and the result
          comes back on bus C in the **same cycle**.


          The price is hardware: three buses means tripling the lines and the access multiplexers of the
          register file. It is the typical cost/performance trade-off the exam asks you to be able to argue,
          not just compute.
  answer:
    - label:
        it: Bus singolo, per istruzione
        en: Single bus, per instruction
      value: 1.2e-8
      unit: s
      tol: 0.000001
    - label:
        it: Tre bus, per istruzione
        en: Three buses, per instruction
      value: 8e-9
      unit: s
      tol: 0.000001
    - label:
        it: Bus singolo, 10⁶ istruzioni
        en: Single bus, 10⁶ instructions
      value: 0.012
      unit: s
      tol: 0.000001
    - label:
        it: Tre bus, 10⁶ istruzioni
        en: Three buses, 10⁶ instructions
      value: 0.008
      unit: s
      tol: 0.000001
  origin: originale
- id: processore-es-5
  topic: processore
  objectives:
    - processore.4
  difficulty: 2
  kind: static
  statement:
    it:
      'A metà progetto il committente chiede di aggiungere dodici istruzioni complesse. L’unità di controllo era
      prevista **cablata**: conviene cambiare idea? Che cosa si guadagna e che cosa si perde?'
    en: 'Halfway through the project the client asks to add twelve complex instructions. The control unit was
      planned as **hardwired**: is it worth changing your mind? What do you gain and what do you lose?'
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Chiediti dove sta scritta la sequenza dei segnali di controllo nei due casi, e che cosa significa
          «modificarla».
        en:
          Ask yourself where the sequence of control signals is written in the two cases, and what “modifying it”
          means.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          Con l’unità **cablata** la sequenza dei segnali è una rete logica: aggiungere dodici istruzioni
          significa **ridisegnare la rete**, rifare la sintesi e riverificare i tempi di tutto il blocco. Con
          l’unità **microprogrammata** le sequenze stanno in una memoria di controllo: aggiungere istruzioni
          significa **scrivere altre microistruzioni**, senza toccare l’hardware.


          Quindi sì, conviene passare al microprogrammato — ed è storicamente la scelta dei processori CISC,
          il cui repertorio ricco è fatto proprio di istruzioni complesse.


          Che cosa si perde: **velocità**. Ogni passo richiede di leggere una microistruzione dalla memoria di
          controllo, e quella lettura si aggiunge al ciclo. Un’unità cablata può generare i segnali in modo
          combinatorio, senza letture intermedie. È il motivo per cui i RISC, che puntano su un ciclo
          brevissimo e su istruzioni semplici, tornano al controllo cablato.
        en: >-
          With a **hardwired** unit the sequence of signals is a logic network: adding twelve instructions
          means **redesigning the network**, redoing synthesis and re-verifying the timing of the whole block.
          With a **microprogrammed** unit the sequences live in a control store: adding instructions means
          **writing more microinstructions**, without touching the hardware.


          So yes, it pays to switch to microprogrammed — and it is historically the choice of CISC processors,
          whose rich repertoire is made precisely of complex instructions.


          What you lose: **speed**. Every step requires reading a microinstruction from the control store, and
          that read adds to the cycle. A hardwired unit can generate the signals combinationally, with no
          intermediate reads. That is why RISC processors, aiming at a very short cycle and simple
          instructions, go back to hardwired control.
  origin: originale
