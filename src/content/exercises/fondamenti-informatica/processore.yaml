      singolo**: carica in R1 il contenuto della cella il cui indirizzo sta in R2.'
    en:
      'Write the complete control sequence of the instruction `Load R1, (R2)` on a **single-bus** datapath: it
      loads into R1 the contents of the cell whose address is in R2.'
  figure:
