- id: processore-es-1
  topic: processore
  objectives:
    - processore.1
  difficulty: 1
  kind: static
  statement:
    it:
      Un’istruzione deve leggere un dato dalla memoria. Quali registri entrano in gioco, in che ordine, e a che
      serve ciascuno?
    en:
      An instruction must read data from memory. Which registers come into play, in what order, and what is each
      one for?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it:
          'La memoria non parla direttamente con i registri generali: c’è sempre una coppia di registri che fa da
          interfaccia.'
        en:
          'Memory does not talk directly to the general-purpose registers: there is always a pair of registers
          acting as the interface.'
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          1. l'indirizzo del dato va in MAR   (Memory Address Register)

          2. si attiva il segnale Read

          3. la memoria deposita il dato in MDR (Memory Data Register)

          4. da MDR il dato passa al registro destinazione

          ```


          MAR e MDR esistono perché la memoria è lenta e sta «fuori»: servono due punti di appoggio stabili,
          uno per l’indirizzo e uno per il dato, mentre il processore aspetta. L’attesa ha anche un nome nei
          diagrammi di controllo: **WMFC**, cioè «attendi che la memoria abbia finito».


          Gli altri due registri da saper nominare sono **PC**, che contiene l’indirizzo della prossima
          istruzione, e **IR**, che contiene l’istruzione in corso di esecuzione.
        en: >-
          ```

          1. the address of the data goes into MAR   (Memory Address Register)

          2. the Read signal is activated

          3. memory places the data in MDR (Memory Data Register)

          4. from MDR the data goes to the destination register

          ```


          MAR and MDR exist because memory is slow and sits “outside”: two stable holding points are needed,
          one for the address and one for the data, while the processor waits. The wait even has a name in the
          control diagrams: **WMFC**, i.e. “wait until memory has finished”.


          The other two registers you must be able to name are **PC**, which holds the address of the next
          instruction, and **IR**, which holds the instruction being executed.
  origin: originale
- id: processore-es-2
  topic: processore
  objectives:
    - processore.2
  difficulty: 1
  kind: static
  statement:
    it:
      Scrivi in RTN la sequenza di **prelievo dell’istruzione** e spiega perché l’incremento del PC si colloca
      proprio lì.
    en: Write in RTN the **instruction fetch** sequence and explain why the PC increment is placed exactly there.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Il prelievo è uguale per tutte le istruzioni. Chiediti che cosa fa il processore mentre aspetta la
          risposta della memoria.
        en:
          The fetch is the same for all instructions. Ask yourself what the processor does while it waits for memory
          to answer.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          1.  PC_out, MAR_in, Read, Select4, Add, Z_in

          2.  Z_out, PC_in, WMFC

          3.  MDR_out, IR_in

          ```


          Passo per passo: l’indirizzo della prossima istruzione esce dal PC e finisce in MAR, si avvia la
          lettura, e **contemporaneamente** la ALU calcola PC + 4 mettendolo nel registro temporaneo Z. Al
          passo 2 quel valore torna nel PC mentre si attende la memoria. Al passo 3 l’istruzione arrivata in
          MDR viene copiata in IR.


          L’incremento sta lì perché la memoria impiega comunque diversi cicli: farlo durante l’attesa **non
          costa nulla**. Metterlo in un passo separato allungherebbe ogni istruzione di un ciclo — su miliardi
          di istruzioni, una differenza enorme.
        en: >-
          ```

          1.  PC_out, MAR_in, Read, Select4, Add, Z_in

          2.  Z_out, PC_in, WMFC

          3.  MDR_out, IR_in

          ```


          Step by step: the address of the next instruction leaves the PC and ends up in MAR, the read starts,
          and **at the same time** the ALU computes PC + 4, placing it in the temporary register Z. In step 2
          that value goes back into the PC while waiting for memory. In step 3 the instruction that arrived in
          MDR is copied into IR.


          The increment is there because memory takes several cycles anyway: doing it during the wait **costs
          nothing**. Putting it in a separate step would lengthen every instruction by one cycle — over
          billions of instructions, a huge difference.
  origin: originale
