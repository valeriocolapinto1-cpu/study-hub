- id: pipeline-es-1
  topic: pipeline
  objectives:
    - pipeline.1
  difficulty: 1
  kind: static
  statement:
    it: Disegna il diagramma a stadi di **quattro istruzioni indipendenti** in una pipeline a 5 stadi (F, D, E, M,
      W) e conta i cicli necessari.
    en: Draw the stage diagram of **four independent instructions** in a 5-stage pipeline (F, D, E, M, W) and
      count the cycles needed.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: "Ogni istruzione entra un ciclo dopo la precedente. Il conto non è 4 × 5: chiediti quando esce
          l’**ultima**."
        en: "Each instruction enters one cycle after the previous one. The count is not 4 × 5: ask yourself when the
          **last** one comes out."
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          ciclo:  1  2  3  4  5  6  7  8

          I1      F  D  E  M  W

          I2         F  D  E  M  W

          I3            F  D  E  M  W

          I4               F  D  E  M  W

          ```


          L’ultima istruzione completa al ciclo **8**. La formula generale:


          ```

          cicli = k + (n − 1) = 5 + 3 = 8

          ```


          I primi 4 cicli sono il **riempimento**: la pipeline non ha ancora prodotto nulla. Dal ciclo 5 in
          poi esce un risultato per ciclo. Senza pipeline le stesse quattro istruzioni avrebbero richiesto 4 ×
          5 = 20 cicli.
        en: >-
          ```

          cycle:  1  2  3  4  5  6  7  8

          I1      F  D  E  M  W

          I2         F  D  E  M  W

          I3            F  D  E  M  W

          I4               F  D  E  M  W

          ```


          The last instruction completes in cycle **8**. The general formula:


          ```

          cycles = k + (n − 1) = 5 + 3 = 8

          ```


          The first 4 cycles are the **fill**: the pipeline has not produced anything yet. From cycle 5
          onwards one result comes out per cycle. Without a pipeline the same four instructions would have
          taken 4 × 5 = 20 cycles.
  origin: originale
- id: pipeline-es-2
  topic: pipeline
  objectives:
    - pipeline.1
  difficulty: 1
  kind: static
  statement:
    it: Un programma esegue 1000 istruzioni su una pipeline a 5 stadi, senza stalli. Quanti cicli servono? Qual è
      lo **speedup** rispetto a un processore non pipeline che impiega 5 cicli per istruzione?
    en: A program executes 1000 instructions on a 5-stage pipeline, with no stalls. How many cycles are needed?
      What is the **speedup** compared with a non-pipelined processor taking 5 cycles per instruction?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Applica k + (n − 1) e confronta con n × k. Poi guarda a che numero tende il rapporto.
        en: Apply k + (n − 1) and compare with n × k. Then look at what number the ratio tends to.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          con pipeline:    5 + 999 = 1004 cicli

          senza pipeline: 1000 × 5   = 5000 cicli


          speedup = 5000 / 1004 = 4,98×

          ```


          Quasi 5, cioè quasi il numero di stadi — ma non 5. La differenza sono i 4 cicli di riempimento, che
          si diluiscono al crescere di n: con 10 istruzioni lo speedup sarebbe 50/14 = 3,6; con un milione,
          4,99998.


          Il limite teorico è k, e nella realtà non lo si raggiunge mai: qui abbiamo **ipotizzato zero
          stalli**, cosa che nessun programma reale garantisce, e abbiamo ignorato che gli stadi non sono
          perfettamente bilanciati.
        en: >-
          ```

          with pipeline:    5 + 999 = 1004 cycles

          without pipeline: 1000 × 5 = 5000 cycles


          speedup = 5000 / 1004 = 4.98×

          ```


          Almost 5, i.e. almost the number of stages — but not 5. The difference is the 4 fill cycles, which
          are diluted as n grows: with 10 instructions the speedup would be 50/14 = 3.6; with a million,
          4.99998.


          The theoretical limit is k, and in reality it is never reached: here we **assumed zero stalls**,
          which no real program guarantees, and ignored that the stages are not perfectly balanced.
  origin: originale
- id: pipeline-es-3
  topic: pipeline
  objectives:
    - pipeline.3
  difficulty: 2
  kind: static
  statement:
    it: Data la sequenza `Add R3,R1,R2` · `Sub R5,R3,R4` · `And R6,R3,R7`, individua le dipendenze e disegna il
      diagramma **senza** e **con** forwarding, contando i cicli in entrambi i casi.
    en: Given the sequence `Add R3,R1,R2` · `Sub R5,R3,R4` · `And R6,R3,R7`, identify the dependences and draw the
      diagram **without** and **with** forwarding, counting the cycles in both cases.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Cerca i registri scritti da un’istruzione e letti dalle successive. Poi chiediti in quale stadio il valore
          è **disponibile** e in quale **serve**.
        en: Look for registers written by one instruction and read by the following ones. Then ask yourself in which
          stage the value is **available** and in which it is **needed**.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          Dipendenze: R3 è scritto da I1 e letto sia da I2 sia da I3. Sono due dipendenze **RAW** (read after
          write).


          ```

          SENZA FORWARDING (R3 leggibile solo dopo lo stadio W di I1)

          ciclo:  1  2  3  4  5  6  7  8  9

          I1      F  D  E  M  W

          I2         F  D  ·  ·  E  M  W

          I3            F  ·  ·  D  E  M  W
                                          → 9 cicli

          CON FORWARDING (il risultato passa dall'uscita della ALU)

          ciclo:  1  2  3  4  5  6  7

          I1      F  D  E  M  W

          I2         F  D  E  M  W

          I3            F  D  E  M  W
                                    → 7 cicli
          ```


          Con il forwarding il risultato di I1 viene prelevato all’uscita dello stadio E e portato
          direttamente all’ingresso della ALU al ciclo successivo: I2 non deve aspettare la scrittura nel
          banco dei registri. Due cicli risparmiati su tre istruzioni — su un programma vero, un guadagno
          enorme.
        en: >-
          Dependences: R3 is written by I1 and read by both I2 and I3. They are two **RAW** (read after write)
          dependences.


          ```

          WITHOUT FORWARDING (R3 readable only after stage W of I1)

          cycle:  1  2  3  4  5  6  7  8  9

          I1      F  D  E  M  W

          I2         F  D  ·  ·  E  M  W

          I3            F  ·  ·  D  E  M  W
                                          → 9 cycles

          WITH FORWARDING (the result is taken from the ALU output)

          cycle:  1  2  3  4  5  6  7

          I1      F  D  E  M  W

          I2         F  D  E  M  W

          I3            F  D  E  M  W
                                    → 7 cycles
          ```


          With forwarding the result of I1 is taken at the output of stage E and brought directly to the ALU
          input in the next cycle: I2 does not have to wait for the register file write. Two cycles saved over
          three instructions — on a real program, a huge gain.
  origin: originale
- id: pipeline-es-4
  topic: pipeline
  objectives:
    - pipeline.3
  difficulty: 2
  kind: static
  statement:
    it: Perché la sequenza `Load R1,(R2)` · `Add R3,R1,R4` costa uno stallo **anche con il forwarding**? Come lo
      elimina il compilatore?
    en: Why does the sequence `Load R1,(R2)` · `Add R3,R1,R4` cost a stall **even with forwarding**? How does the
      compiler remove it?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Confronta lo stadio in cui il dato diventa disponibile con quello in cui serve. Per la Load non è lo
          stesso caso di un’operazione aritmetica.
        en: Compare the stage in which the data becomes available with the one in which it is needed. For a Load it is
          not the same case as for an arithmetic operation.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          ciclo:  1  2  3  4  5  6

          Load    F  D  E  M  W
                           ↓ il dato esce dalla MEMORIA alla fine di M
          Add        F  D  ·  E  M  W
                              ↑ serve all'inizio di E
          ```


          Per un’operazione aritmetica il risultato è pronto alla fine dello stadio E, cioè **un ciclo prima**
          di quando serve all’istruzione seguente: il forwarding arriva in tempo. Per una `Load` il dato esce
          dalla memoria alla fine dello stadio M, cioè **esattamente** quando servirebbe: nessun percorso di
          forwarding può anticiparlo, perché significherebbe mandarlo indietro nel tempo.


          Resta quindi **uno** stallo, e si chiama **load-use hazard**. Il compilatore lo elimina spostando in
          quel buco un’istruzione indipendente:


          ```

          PRIMA                     DOPO

          Load R1,(R2)              Load R1,(R2)

          Add  R3,R1,R4    ←stallo  Sub  R7,R8,R9   ← istruzione indipendente

          Sub  R7,R8,R9             Add  R3,R1,R4   ← ora il dato c'è

          ```


          Stesso risultato, un ciclo in meno: è il tipo di riordino che rende il compilatore parte integrante
          delle prestazioni.
        en: >-
          ```

          cycle:  1  2  3  4  5  6

          Load    F  D  E  M  W
                           ↓ the data leaves MEMORY at the end of M
          Add        F  D  ·  E  M  W
                              ↑ needed at the start of E
          ```


          For an arithmetic operation the result is ready at the end of stage E, i.e. **one cycle before** the
          next instruction needs it: forwarding arrives in time. For a `Load` the data leaves memory at the
          end of stage M, i.e. **exactly** when it would be needed: no forwarding path can bring it earlier,
          because that would mean sending it back in time.


          So **one** stall remains, and it is called the **load-use hazard**. The compiler removes it by
          moving an independent instruction into that gap:


          ```

          BEFORE                    AFTER

          Load R1,(R2)              Load R1,(R2)

          Add  R3,R1,R4    ←stall   Sub  R7,R8,R9   ← independent instruction

          Sub  R7,R8,R9             Add  R3,R1,R4   ← now the data is there

          ```


          Same result, one cycle less: it is the kind of reordering that makes the compiler an integral part
          of performance.
  origin: originale
- id: pipeline-es-5
  topic: pipeline
  objectives:
    - pipeline.4
  difficulty: 2
  kind: static
  statement:
    it: In una pipeline a 5 stadi l’esito di un salto si conosce alla fine del **terzo** stadio. Il 20 % delle
      istruzioni sono salti e di questi il 60 % viene preso. Calcola il **CPI medio** supponendo che, quando
      il salto è preso, si perdano le istruzioni già prelevate.
    en: In a 5-stage pipeline the outcome of a branch is known at the end of the **third** stage. 20 % of
      instructions are branches and 60 % of these are taken. Compute the **average CPI**, assuming that when
      the branch is taken the instructions already fetched are lost.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: "Conta quante istruzioni sbagliate sono entrate in pipeline prima che l’esito fosse noto: quelle vanno
          annullate, e ogni annullamento è un ciclo perso."
        en: "Count how many wrong instructions entered the pipeline before the outcome was known: those must be
          cancelled, and every cancellation is a lost cycle."
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          Se l’esito si conosce alla fine dello stadio 3, nel frattempo sono entrate le istruzioni ai cicli 2
          e 3: **due** istruzioni da annullare quando il salto è preso. Quando non è preso, la sequenza
          proseguiva già correttamente e non si perde nulla.


          ```

          penalità = 2 cicli, ma solo sui salti PRESI


          CPI = 1 + (frazione di salti) × (frazione presi) × penalità
              = 1 + 0,20 × 0,60 × 2
              = 1 + 0,24 = 1,24
          ```


          Un 24 % di cicli in più rispetto all’ideale, solo per i salti. Le contromisure: **anticipare** il
          calcolo della condizione a uno stadio precedente (riduce la penalità), **predire** l’esito e
          proseguire sul ramo previsto (annulla solo quando la previsione sbaglia), o riempire i cicli con il
          **delay slot**, lasciando al compilatore il compito di trovare istruzioni utili da metterci.
        en: >-
          If the outcome is known at the end of stage 3, in the meantime the instructions of cycles 2 and 3
          have entered: **two** instructions to cancel when the branch is taken. When it is not taken, the
          sequence was already proceeding correctly and nothing is lost.


          ```

          penalty = 2 cycles, but only on TAKEN branches


          CPI = 1 + (fraction of branches) × (fraction taken) × penalty
              = 1 + 0.20 × 0.60 × 2
              = 1 + 0.24 = 1.24
          ```


          24 % more cycles than ideal, for branches alone. The countermeasures: **computing** the condition
          earlier, in a previous stage (reduces the penalty), **predicting** the outcome and proceeding on the
          predicted path (cancelling only when the prediction is wrong), or filling the cycles with the
          **delay slot**, leaving the compiler the task of finding useful instructions to put there.
  origin: originale
