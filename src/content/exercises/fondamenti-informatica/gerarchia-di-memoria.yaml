          3. Decodificatore di riga
          4. Matrice di celle
          5. Contatore indirizzo di colonna
          6. Decodificatore di colonna
          7. Circuiti di lettura/scrittura
          8. Registro di modo e temporizzazione
          9. Registri dati
        en: |-
          1. Refresh counter
          2. Row address latch
          3. Row decoder
          4. Cell array
          5. Column address counter
          6. Column decoder
          7. Read/write circuits
          8. Mode register and timing control
          9. Data registers
