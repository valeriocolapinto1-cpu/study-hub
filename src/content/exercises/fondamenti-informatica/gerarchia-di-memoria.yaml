- id: gerarchia-di-memoria-es-1
  topic: gerarchia-di-memoria
  objectives:
    - gerarchia-di-memoria.3
  difficulty: 1
  kind: static
  statement:
    it: Cache da **32 KiB** a mappatura **diretta**, blocchi da **16 byte**, indirizzi a **32 bit**. Come si
      spezza l’indirizzo?
    en: "**32 KiB** **direct-mapped** cache, **16-byte** blocks, **32-bit** addresses. How is the address split?"
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: "Tre campi, sempre nello stesso ordine: etichetta, indice, spiazzamento. Si parte dal fondo, cioè dallo
          spiazzamento."
        en: "Three fields, always in the same order: tag, index, offset. Start from the end, i.e. from the offset."
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          spiazzamento = log₂(16 byte)              = 4 bit

          numero di blocchi = 32768 / 16            = 2048

          indice = log₂(2048)                       = 11 bit

          etichetta = 32 − 11 − 4                   = 17 bit

          ```


          Controllo obbligatorio: 17 + 11 + 4 = 32 ✓, i tre campi sommano all’ampiezza dell’indirizzo.


          Nella mappatura diretta l’indice individua **una sola** linea possibile, quindi si confronta una
          sola etichetta: hardware minimo e risposta rapidissima. Il prezzo sono i **conflitti**: due blocchi
          con lo stesso indice si sfrattano a vicenda anche se il resto della cache è vuoto.
        en: >-
          ```

          offset = log₂(16 bytes)                   = 4 bits

          number of blocks = 32768 / 16             = 2048

          index = log₂(2048)                        = 11 bits

          tag = 32 − 11 − 4                         = 17 bits

          ```


          Mandatory check: 17 + 11 + 4 = 32 ✓, the three fields add up to the address width.


          In direct mapping the index identifies **only one** possible line, so a single tag is compared:
          minimal hardware and a very fast answer. The price is **conflicts**: two blocks with the same index
          evict each other even if the rest of the cache is empty.
  origin: originale
- id: gerarchia-di-memoria-es-2
  topic: gerarchia-di-memoria
  objectives:
    - gerarchia-di-memoria.2
  difficulty: 1
  kind: static
  statement:
    it: Una cache ha tempo di accesso 2 ns, miss rate 5 % e penalità di miss 80 ns. Qual è il **tempo medio di
      accesso**? E se il miss rate scendesse al 2 %?
    en: A cache has a 2 ns access time, a 5 % miss rate and an 80 ns miss penalty. What is the **average access
      time**? And if the miss rate fell to 2 %?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Il tempo medio è quello dell’hit più, in proporzione ai miss, la penalità aggiuntiva.
        en: The average time is that of the hit plus, in proportion to the misses, the additional penalty.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          t_medio = t_hit + miss_rate × miss_penalty


          con 5 %:  2 + 0,05 × 80 = 2 + 4 = 6 ns

          con 2 %:  2 + 0,02 × 80 = 2 + 1,6 = 3,6 ns

          ```


          Un miss su venti **triplica** il tempo medio rispetto all’hit. Dimezzare e più il miss rate lo
          riporta quasi al valore ideale.


          La morale progettuale: conviene molto di più lavorare sul **miss rate** (cache più grande, più
          associativa, blocchi di dimensione adeguata) o sulla **penalità** (cache di secondo livello) che non
          sull’hit time. E si vede anche perché la memoria virtuale con page fault da milioni di cicli
          richiede un tasso di fault bassissimo per essere praticabile.
        en: >-
          ```

          t_avg = t_hit + miss_rate × miss_penalty


          with 5 %:  2 + 0.05 × 80 = 2 + 4 = 6 ns

          with 2 %:  2 + 0.02 × 80 = 2 + 1.6 = 3.6 ns

          ```


          One miss in twenty **triples** the average time compared with a hit. Cutting the miss rate by more
          than half brings it almost back to the ideal value.


          The design moral: it pays much more to work on the **miss rate** (larger, more associative cache,
          suitably sized blocks) or on the **penalty** (second-level cache) than on the hit time. It also
          shows why virtual memory, with page faults costing millions of cycles, needs an extremely low fault
          rate to be practical.
  origin: originale
- id: gerarchia-di-memoria-es-3
  topic: gerarchia-di-memoria
  objectives:
    - gerarchia-di-memoria.3
    - gerarchia-di-memoria.4
  difficulty: 2
  kind: static
  statement:
    it: Stessa cache dell’esercizio 1 — 32 KiB, blocchi da 16 byte, indirizzi a 32 bit — ma **associativa a 4
      vie**. Come cambiano i campi? E che problema risolve l’associatività?
    en: Same cache as exercise 1 — 32 KiB, 16-byte blocks, 32-bit addresses — but **4-way set-associative**. How
      do the fields change? And what problem does associativity solve?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Con n vie l’indice non individua più un blocco ma un **gruppo** di n blocchi. Conta quanti gruppi ci sono.
        en: With n ways the index no longer identifies a block but a **set** of n blocks. Count how many sets there
          are.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          spiazzamento = log₂(16)                   = 4 bit   (invariato)

          numero di blocchi = 32768 / 16            = 2048

          numero di gruppi  = 2048 / 4 vie          = 512

          indice = log₂(512)                        = 9 bit

          etichetta = 32 − 9 − 4                    = 19 bit

          ```


          Rispetto alla mappatura diretta l’indice **perde 2 bit** e l’etichetta li guadagna: 19 + 9 + 4 = 32
          ✓.


          Il problema risolto sono i **conflitti**. Con la mappatura diretta due blocchi che condividono
          l’indice non possono coesistere: un ciclo che accede alternativamente a due indirizzi «sfortunati»
          produce un miss a ogni accesso, con la cache quasi vuota. Con quattro vie ce ne stanno quattro nello
          stesso gruppo.


          Il costo: quattro confronti di etichetta in parallelo invece di uno (più hardware, hit time
          leggermente più alto) e la necessità di una politica di **sostituzione**, che nella mappatura
          diretta non serve perché non c’è scelta.
        en: >-
          ```

          offset = log₂(16)                         = 4 bits   (unchanged)

          number of blocks = 32768 / 16             = 2048

          number of sets   = 2048 / 4 ways          = 512

          index = log₂(512)                         = 9 bits

          tag = 32 − 9 − 4                          = 19 bits

          ```


          Compared with direct mapping the index **loses 2 bits** and the tag gains them: 19 + 9 + 4 = 32 ✓.


          The problem solved is **conflicts**. With direct mapping two blocks sharing the index cannot
          coexist: a loop that alternately accesses two “unlucky” addresses produces a miss at every access,
          with the cache almost empty. With four ways, four of them fit in the same set.


          The cost: four tag comparisons in parallel instead of one (more hardware, slightly higher hit time)
          and the need for a **replacement** policy, which direct mapping does not need because there is no
          choice.
  origin: originale
- id: gerarchia-di-memoria-es-4
  topic: gerarchia-di-memoria
  objectives:
    - gerarchia-di-memoria.5
  difficulty: 2
  kind: static
  statement:
    it: Su 1000 istruzioni, il 20 % sono `store`. Il miss rate è 5 % e il 30 % dei blocchi sfrattati è *dirty*. I
      blocchi sono da 16 byte, le parole da 4. Confronta il **traffico verso la memoria** con write-through e
      con write-back.
    en: Out of 1000 instructions, 20 % are `store`s. The miss rate is 5 % and 30 % of evicted blocks are *dirty*.
      Blocks are 16 bytes, words 4. Compare the **traffic to memory** with write-through and with write-back.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Conta separatamente il traffico in lettura (il caricamento dei blocchi dopo un miss, uguale nei due casi)
          e quello in scrittura, che è ciò che distingue le due politiche.
        en: Count separately the read traffic (loading blocks after a miss, the same in both cases) and the write
          traffic, which is what distinguishes the two policies.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          LETTURE (uguali nei due casi)
            miss = 1000 × 5 % = 50  →  50 blocchi × 16 B = 800 byte

          WRITE-THROUGH: ogni store scrive anche in memoria
            200 store × 4 byte = 800 byte
            traffico totale = 800 + 800 = 1600 byte

          WRITE-BACK: si riscrive solo il blocco sfrattato se dirty
            50 sfratti × 30 % = 15 blocchi × 16 B = 240 byte
            traffico totale = 800 + 240 = 1040 byte
          ```


          Il write-back genera qui il **35 % di traffico in meno**, e il divario cresce quando un blocco viene
          scritto più volte prima di essere sfrattato: il write-through paga **ogni** scrittura, il write-back
          una sola volta per blocco.


          Che cosa si perde: con il write-back la memoria è temporaneamente **non aggiornata**, il che
          complica la vita a DMA e multiprocessori (è il problema della coerenza) e rende necessario un bit
          *dirty* per ogni blocco.
        en: >-
          ```

          READS (the same in both cases)
            misses = 1000 × 5 % = 50  →  50 blocks × 16 B = 800 bytes

          WRITE-THROUGH: every store also writes to memory
            200 stores × 4 bytes = 800 bytes
            total traffic = 800 + 800 = 1600 bytes

          WRITE-BACK: only an evicted dirty block is written back
            50 evictions × 30 % = 15 blocks × 16 B = 240 bytes
            total traffic = 800 + 240 = 1040 bytes
          ```


          Write-back here generates **35 % less traffic**, and the gap grows when a block is written several
          times before being evicted: write-through pays for **every** write, write-back only once per block.


          What you lose: with write-back memory is temporarily **out of date**, which complicates life for DMA
          and multiprocessors (it is the coherence problem) and requires a *dirty* bit for every block.
  origin: originale
- id: gerarchia-di-memoria-es-5
  topic: gerarchia-di-memoria
  objectives:
    - gerarchia-di-memoria.4
  difficulty: 2
  kind: static
  statement:
    it: Cache associativa a **2 vie** con **2 gruppi** (quattro blocchi in tutto), politica **LRU**. Il gruppo si
      sceglie con «numero di blocco modulo 2». Traccia gli accessi ai blocchi `0, 1, 2, 0, 3, 1, 2, 4, 0`
      indicando hit e miss.
    en: "**2-way** set-associative cache with **2 sets** (four blocks in all), **LRU** policy. The set is chosen
      by “block number modulo 2”. Trace the accesses to blocks `0, 1, 2, 0, 3, 1, 2, 4, 0` marking hits and
      misses."
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: "Per ogni accesso: calcola il gruppo, guarda se il blocco c’è, e aggiorna l’ordine di uso. Si sfratta solo
          quando il gruppo è pieno."
        en: "For each access: compute the set, check whether the block is there, and update the order of use. Eviction
          happens only when the set is full."
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          accesso  gruppo  contenuto dopo        esito
             0       0     g0: [0]               MISS
             1       1     g1: [1]               MISS
             2       0     g0: [0, 2]            MISS
             0       0     g0: [2, 0]            HIT   (0 diventa il più recente)
             3       1     g1: [1, 3]            MISS
             1       1     g1: [3, 1]            HIT
             2       0     g0: [0, 2]            HIT
             4       0     g0: [2, 4]            MISS  → sfratta 0 (meno recente)
             0       0     g0: [4, 0]            MISS  → sfratta 2
          ```


          Bilancio: **6 miss e 3 hit**. I primi quattro miss sono *obbligatori* (il blocco non era mai stato
          caricato); gli ultimi due sono di **capacità/conflitto**, causati dallo sfratto.


          Nota l’ultimo passaggio: al momento di caricare il blocco 4, nel gruppo 0 c’erano 0 e 2, usati
          rispettivamente al quarto e al settimo accesso. LRU sfratta il **meno recentemente usato**, cioè lo
          0 — che però viene richiesto subito dopo. È il caso in cui LRU sbaglia previsione: nessuna politica
          reale può indovinare sempre, perché il futuro non lo conosce.
        en: >-
          ```

          access   set     contents after        outcome
             0       0     s0: [0]               MISS
             1       1     s1: [1]               MISS
             2       0     s0: [0, 2]            MISS
             0       0     s0: [2, 0]            HIT   (0 becomes the most recent)
             3       1     s1: [1, 3]            MISS
             1       1     s1: [3, 1]            HIT
             2       0     s0: [0, 2]            HIT
             4       0     s0: [2, 4]            MISS  → evicts 0 (least recent)
             0       0     s0: [4, 0]            MISS  → evicts 2
          ```


          Tally: **6 misses and 3 hits**. The first four misses are *compulsory* (the block had never been
          loaded); the last two are **capacity/conflict** misses, caused by eviction.


          Note the last step: when block 4 was loaded, set 0 held 0 and 2, used at the fourth and seventh
          access respectively. LRU evicts the **least recently used**, i.e. 0 — which, however, is requested
          right after. It is the case where LRU predicts wrong: no real policy can always guess right, because
          it does not know the future.
  origin: originale
