- id: input-output-es-1
  topic: input-output
  objectives:
    - input-output.1
  difficulty: 1
  kind: static
  statement:
    it: Che cosa contengono i tre registri di un’interfaccia (dati, stato, controllo)? Scrivi la sequenza di
      operazioni per stampare un carattere in **I/O programmato**.
    en: What do the three registers of an interface (data, status, control) contain? Write the sequence of
      operations to print a character in **programmed I/O**.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it:
          'Il processore non «parla» col dispositivo: legge e scrive i suoi registri. Prima di scrivere un dato
          bisogna sapere se il dispositivo è pronto ad accettarlo.'
        en:
          'The processor does not “talk” to the device: it reads and writes its registers. Before writing data you
          need to know whether the device is ready to accept it.'
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          DATI       il byte da trasferire, in un verso o nell'altro

          STATO      bit di sola lettura: pronto, occupato, errore

          CONTROLLO  bit scritti dal processore: avvia, abilita interruzioni,
                     modo di funzionamento
          ```


          Sequenza per stampare un carattere:


          ```

          ATTENDI: leggi il registro di STATO
                   il bit PRONTO è 0?  → torna ad ATTENDI
                   scrivi il carattere nel registro DATI
                   (il dispositivo azzera PRONTO e comincia a stampare)
          ```


          Quel ciclo di attesa è il **busy waiting**: il processore gira a vuoto per tutto il tempo di stampa,
          che rispetto ai suoi tempi è un’eternità. Funziona, è semplicissimo, e spreca tutto.
        en: >-
          ```

          DATA       the byte to transfer, in one direction or the other

          STATUS     read-only bits: ready, busy, error

          CONTROL    bits written by the processor: start, enable interrupts,
                     operating mode
          ```


          Sequence to print a character:


          ```

          WAIT:    read the STATUS register
                   is the READY bit 0?  → back to WAIT
                   write the character into the DATA register
                   (the device clears READY and starts printing)
          ```


          That waiting loop is **busy waiting**: the processor spins idle for the whole printing time, which
          compared with its own timescale is an eternity. It works, it is very simple, and it wastes
          everything.
  origin: originale
- id: input-output-es-2
  topic: input-output
  objectives:
    - input-output.1
  difficulty: 1
  kind: static
  statement:
    it:
      Il registro di stato di una periferica è mappato in memoria all’indirizzo `0xFFFF0000`, con il bit 0 che
      segnala «pronto». Scrivi il codice di attesa e spiega perché con l’I/O **memory-mapped** non servono
      istruzioni speciali.
    en: The status register of a peripheral is memory-mapped at address `0xFFFF0000`, with bit 0 signalling
      “ready”. Write the waiting code and explain why **memory-mapped** I/O needs no special instructions.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it:
          Se il registro ha un indirizzo di memoria, tutte le istruzioni che accedono alla memoria funzionano anche
          su di lui.
        en: If the register has a memory address, all the instructions that access memory work on it too.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```
                Move   R2, #0xFFFF0000     ; indirizzo del registro di stato
          ATTESA: Move   R1, (R2)            ; una normale Load!
                And    R1, R1, #1          ; isola il bit 0
                Branch=0 ATTESA            ; non pronto → riprova
          ```


          Non c’è nessuna istruzione di I/O: si usano `Move` e `And`, le stesse che si userebbero su una
          variabile. È il vantaggio del **memory-mapped**: un solo spazio di indirizzi, un solo repertorio,
          tutti i modi di indirizzamento disponibili anche sui dispositivi.


          Il prezzo è che quegli indirizzi non sono più utilizzabili per la memoria vera, e che il sistema
          operativo deve proteggerli — altrimenti qualunque programma potrebbe pilotare l’hardware con una
          semplice `Move`. Nell’I/O **isolato**, invece, servono istruzioni dedicate (IN/OUT), tipicamente
          privilegiate, e lo spazio di memoria resta intatto.
        en: >-
          ```
                Move   R2, #0xFFFF0000     ; address of the status register
          ATTESA: Move   R1, (R2)            ; an ordinary Load!
                And    R1, R1, #1          ; isolate bit 0
                Branch=0 ATTESA            ; not ready → try again
          ```


          There is no I/O instruction: `Move` and `And` are used, the same ones you would use on a variable.
          It is the advantage of **memory-mapped** I/O: a single address space, a single repertoire, all
          addressing modes available on devices too.


          The price is that those addresses can no longer be used for real memory, and that the operating
          system must protect them — otherwise any program could drive the hardware with a simple `Move`. With
          **isolated** I/O, instead, dedicated instructions (IN/OUT) are needed, typically privileged, and the
          memory space stays intact.
  origin: originale
- id: input-output-es-3
  topic: input-output
  objectives:
    - input-output.2
  difficulty: 2
  kind: static
  statement:
    it:
      Un disco trasferisce a 100 MB/s e consegna parole da 4 byte. Con l’I/O **guidato da interruzioni**, quante
      interruzioni al secondo servirebbero? Se ogni interruzione costa 500 cicli su un processore a 2 GHz,
      quanta CPU resterebbe libera?
    en:
      A disk transfers at 100 MB/s and delivers 4-byte words. With **interrupt-driven** I/O, how many interrupts
      per second would be needed? If each interrupt costs 500 cycles on a 2 GHz processor, how much CPU would
      remain free?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Una interruzione per parola. Calcola quante parole al secondo, poi quanti cicli costano in tutto e
          confrontali con quelli disponibili.
        en:
          One interrupt per word. Compute how many words per second, then how many cycles they cost in total and
          compare with those available.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          parole al secondo = 100 MB/s ÷ 4 B = 25 × 10⁶ interruzioni/s


          cicli spesi = 25 × 10⁶ × 500 = 12,5 × 10⁹ cicli/s

          cicli disponibili a 2 GHz    =  2   × 10⁹ cicli/s

          ```


          Servirebbero **sei volte** i cicli che il processore possiede: il trasferimento è semplicemente
          **impossibile** con l’I/O a interruzione, indipendentemente da quanto sia efficiente la routine.


          Con il **DMA** il conto cambia natura: una sola interruzione a fine blocco, e il processore paga
          solo i cicli di bus «rubati» dal controllore mentre trasferisce. Ecco perché ogni disco e ogni
          scheda di rete usano il DMA, mentre la tastiera — poche decine di eventi al secondo — non ne ha
          alcun bisogno.
        en: >-
          ```

          words per second = 100 MB/s ÷ 4 B = 25 × 10⁶ interrupts/s


          cycles spent = 25 × 10⁶ × 500 = 12.5 × 10⁹ cycles/s

          cycles available at 2 GHz     =  2   × 10⁹ cycles/s

          ```


          It would take **six times** the cycles the processor has: the transfer is simply **impossible** with
          interrupt-driven I/O, however efficient the routine.


          With **DMA** the calculation changes nature: a single interrupt at the end of the block, and the
          processor pays only the bus cycles “stolen” by the controller while it transfers. That is why every
          disk and every network card uses DMA, while the keyboard — a few dozen events per second — has no
          need for it.
  answer:
    - label:
        it: Interruzioni al secondo
        en: Interrupts per second
      value: 25000000
      tol: 1e-9
    - label:
        it: Rapporto cicli richiesti / disponibili
        en: Ratio of cycles needed / available
      value: 6.25
      tol: 0.000001
  origin: originale
- id: input-output-es-4
  topic: input-output
  objectives:
    - input-output.3
  difficulty: 2
  kind: static
  statement:
    it: Descrivi la sequenza dei segnali in un **handshake completo** (a quattro fasi) fra un dispositivo che
      invia e uno che riceve, e spiega perché non basterebbe un segnale solo.
    en:
      Describe the sequence of signals in a **full (four-phase) handshake** between a sending and a receiving
      device, and explain why a single signal would not be enough.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it:
          'Servono due segnali: uno dice «c’è un dato», l’altro «l’ho preso». Il ciclo si chiude quando entrambi
          tornano a riposo.'
        en:
          'Two signals are needed: one says “there is data”, the other “I have taken it”. The cycle closes when both
          return to rest.'
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          1. il mittente mette il dato sulle linee e alza REQUEST

          2. il ricevente legge il dato e alza ACKNOWLEDGE

          3. il mittente, visto ACK, abbassa REQUEST
             (e può togliere il dato dalle linee)
          4. il ricevente, visto REQ basso, abbassa ACKNOWLEDGE
             → entrambi a riposo, pronti per il dato successivo
          ```


          Con un **solo** segnale il mittente non saprebbe quando togliere il dato: dovrebbe tenerlo per un
          tempo fisso, calcolato sul ricevente più lento immaginabile. L’handshake sostituisce quell’ipotesi
          con una **conferma esplicita**, e per questo funziona fra parti a velocità qualsiasi e indipendenti
          dal clock.


          Le quattro fasi (invece di due) servono a garantire che il ciclo successivo parta da uno stato
          pulito: senza il ritorno a riposo di entrambi i segnali, due trasferimenti consecutivi potrebbero
          confondersi.
        en: >-
          ```

          1. the sender puts the data on the lines and raises REQUEST

          2. the receiver reads the data and raises ACKNOWLEDGE

          3. the sender, seeing ACK, lowers REQUEST
             (and may remove the data from the lines)
          4. the receiver, seeing REQ low, lowers ACKNOWLEDGE
             → both at rest, ready for the next data
          ```


          With a **single** signal the sender would not know when to remove the data: it would have to hold it
          for a fixed time, calculated for the slowest receiver imaginable. The handshake replaces that
          assumption with an **explicit acknowledgement**, and that is why it works between parties of any
          speed and independently of the clock.


          The four phases (instead of two) guarantee that the next cycle starts from a clean state: without
          both signals returning to rest, two consecutive transfers could get mixed up.
  origin: originale
- id: input-output-es-5
  topic: input-output
  objectives:
    - input-output.4
  difficulty: 2
  kind: static
  statement:
    it:
      Un controllore DMA scrive 4 KiB in memoria mentre il processore lavora. Che cosa può andare storto con la
      **cache**, e come si evita?
    en: A DMA controller writes 4 KiB to memory while the processor is working. What can go wrong with the
      **cache**, and how is it avoided?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Il DMA scrive direttamente in memoria, senza passare per la cache. Chiediti che cosa succede se il
          processore ha in cache una copia di quelle celle.
        en:
          DMA writes directly to memory, without going through the cache. Ask yourself what happens if the processor
          has a copy of those cells in its cache.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          Il problema è la **coerenza**. Se il processore ha in cache una copia di una di quelle celle, la
          copia diventa **obsoleta**: leggendola otterrebbe il vecchio valore, non quello appena scritto dal
          DMA. La situazione simmetrica è altrettanto pericolosa — con la politica *write-back*, il dato
          aggiornato può trovarsi solo in cache e il DMA leggerebbe dalla memoria un valore vecchio.


          Le contromisure, dalla più semplice alla più raffinata:


          - **Invalidare** le linee di cache corrispondenti al buffer prima o dopo il trasferimento: se ne
          occupa il sistema operativo nel driver.

          - Dichiarare **non memorizzabile in cache** l’area usata per i buffer di I/O.

          - **Snooping**: il controllore di cache sorveglia il bus e invalida da sé le linee toccate dal DMA.
          È la soluzione hardware, la stessa usata per la coerenza fra le cache di più core.
        en: >-
          The problem is **coherence**. If the processor has a cached copy of one of those cells, the copy
          becomes **stale**: reading it would return the old value, not the one just written by DMA. The
          symmetric situation is just as dangerous — with a *write-back* policy, the updated data may be only
          in the cache and DMA would read an old value from memory.


          The countermeasures, from the simplest to the most refined:


          - **Invalidate** the cache lines corresponding to the buffer before or after the transfer: the
          operating system takes care of it in the driver.

          - Declare the area used for I/O buffers **non-cacheable**.

          - **Snooping**: the cache controller watches the bus and invalidates by itself the lines touched by
          DMA. It is the hardware solution, the same one used for coherence between the caches of several
          cores.
  origin: originale
