- id: virgola-mobile-es-1
  topic: virgola-mobile
  objectives:
    - virgola-mobile.1
  difficulty: 1
  kind: static
  statement:
    it: Rappresenta **−12,375** in singola precisione IEEE 754 e scrivi il risultato in esadecimale.
    en: Represent **−12.375** in IEEE 754 single precision and write the result in hexadecimal.
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it:
          Converti separatamente parte intera e parte frazionaria, normalizza in 1,xxx × 2ᵉ, poi somma il bias
          all’esponente.
        en: Convert integer and fractional parts separately, normalise to 1.xxx × 2ᵉ, then add the bias to the
          exponent.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          12      = 1100₂

          0,375   = 0,011₂        (0,25 + 0,125)

          12,375  = 1100,011₂


          normalizzo:  1100,011 = 1,100011 × 2³


          segno     s = 1                     (negativo)

          esponente E = 3 + 127 = 130 = 1000 0010

          mantissa  M = 100011 + zeri          (l'1 iniziale NON si scrive)


          1 10000010 10001100000000000000000

          = 1100 0001 0100 0110 0000 0000 0000 0000

          = 0xC1460000

          ```


          I due errori da evitare: mettere l’1 iniziale dentro la mantissa (è implicito, si guadagna un bit di
          precisione) e **sottrarre** il bias invece di sommarlo — si somma quando si codifica, si sottrae
          quando si decodifica.
        en: >-
          ```

          12      = 1100₂

          0.375   = 0.011₂        (0.25 + 0.125)

          12.375  = 1100.011₂


          normalise:  1100.011 = 1.100011 × 2³


          sign      s = 1                     (negative)

          exponent  E = 3 + 127 = 130 = 1000 0010

          mantissa  M = 100011 + zeros         (the leading 1 is NOT written)


          1 10000010 10001100000000000000000

          = 1100 0001 0100 0110 0000 0000 0000 0000

          = 0xC1460000

          ```


          The two mistakes to avoid: putting the leading 1 into the mantissa (it is implicit, one bit of
          precision is gained) and **subtracting** the bias instead of adding it — you add when encoding,
          subtract when decoding.
  answer:
    - label:
        it: Configurazione in esadecimale
        en: Pattern in hexadecimal
      value: C1460000
      kind: text
      accept:
        - '0xC1460000'
        - C1460000h
        - C146000016
  origin: originale
- id: virgola-mobile-es-2
  topic: virgola-mobile
  objectives:
    - virgola-mobile.2
  difficulty: 1
  kind: static
  statement:
    it: Che numero decimale rappresenta la configurazione `0x41200000` in singola precisione?
    en: What decimal number does the pattern `0x41200000` represent in single precision?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Scomponi i 32 bit nei tre campi, togli il bias dall’esponente e rimetti l’1 implicito davanti alla
          mantissa.
        en:
          Split the 32 bits into the three fields, remove the bias from the exponent and put the implicit 1 back in
          front of the mantissa.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          0x41200000 = 0100 0001 0010 0000 0000 0000 0000 0000


          segno     = 0                    → positivo

          esponente = 1000 0010 = 130      → e = 130 − 127 = 3

          mantissa  = 010 0000…            → 1,01₂ con l'1 implicito


          valore = 1,01₂ × 2³ = 1010₂ = 10,0

          ```


          Il procedimento è esattamente l’inverso della codifica: separa, sottrai il bias, ricostruisci. Un
          controllo utile: l’esponente 130 è poco sopra 127, quindi il numero è dell’ordine delle unità o
          delle decine — se fosse venuto 10 000 ci sarebbe stato un errore da qualche parte.
        en: >-
          ```

          0x41200000 = 0100 0001 0010 0000 0000 0000 0000 0000


          sign      = 0                    → positive

          exponent  = 1000 0010 = 130      → e = 130 − 127 = 3

          mantissa  = 010 0000…            → 1.01₂ with the implicit 1


          value = 1.01₂ × 2³ = 1010₂ = 10.0

          ```


          The procedure is exactly the inverse of encoding: split, subtract the bias, rebuild. A useful check:
          the exponent 130 is just above 127, so the number is in the units or tens — had it come out as
          10,000 there would have been a mistake somewhere.
  answer:
    - label:
        it: Valore
        en: Value
      value: 10
      tol: 1e-9
  origin: originale
- id: virgola-mobile-es-3
  topic: virgola-mobile
  objectives:
    - virgola-mobile.3
  difficulty: 2
  kind: static
  statement:
    it: Che cosa rappresentano queste configurazioni a 32 bit? `0x00000000` · `0x80000000` · `0x7F800000` ·
      `0xFF800000` · `0x7FC00000`
    en: What do these 32-bit patterns represent? `0x00000000` · `0x80000000` · `0x7F800000` · `0xFF800000` ·
      `0x7FC00000`
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it:
          'Guarda prima l’esponente: se è tutto 0 o tutto 1 non sei nel caso normale, e la mantissa dice quale caso
          speciale è.'
        en:
          'Look at the exponent first: if it is all 0s or all 1s you are not in the normal case, and the mantissa
          tells you which special case it is.'
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          0x00000000  s=0  E=00000000  M=0   →  +0

          0x80000000  s=1  E=00000000  M=0   →  −0

          0x7F800000  s=0  E=11111111  M=0   →  +∞

          0xFF800000  s=1  E=11111111  M=0   →  −∞

          0x7FC00000  s=0  E=11111111  M≠0   →  NaN

          ```


          La regola: esponente **tutto a 0** significa zero (mantissa nulla) oppure numero **denormalizzato**
          (mantissa diversa da zero, e allora l’1 implicito non c’è); esponente **tutto a 1** significa
          infinito (mantissa nulla) oppure **NaN** (mantissa diversa da zero).


          Curiosità che l’esame chiede volentieri: esistono **due zeri**, +0 e −0, e si comportano come uguali
          nei confronti ma sono distinguibili nei bit. Il NaN invece non è uguale nemmeno a se stesso: `x ≠ x`
          è il modo canonico per riconoscerlo.
        en: >-
          ```

          0x00000000  s=0  E=00000000  M=0   →  +0

          0x80000000  s=1  E=00000000  M=0   →  −0

          0x7F800000  s=0  E=11111111  M=0   →  +∞

          0xFF800000  s=1  E=11111111  M=0   →  −∞

          0x7FC00000  s=0  E=11111111  M≠0   →  NaN

          ```


          The rule: exponent **all 0s** means zero (zero mantissa) or a **denormal** number (non-zero
          mantissa, and then there is no implicit 1); exponent **all 1s** means infinity (zero mantissa) or
          **NaN** (non-zero mantissa).


          A curiosity the exam likes to ask: there are **two zeros**, +0 and −0, and they behave as equal in
          comparisons but are distinguishable in their bits. NaN, on the other hand, is not even equal to
          itself: `x ≠ x` is the canonical way to recognise it.
  origin: originale
- id: virgola-mobile-es-4
  topic: virgola-mobile
  objectives:
    - virgola-mobile.4
  difficulty: 2
  kind: static
  statement:
    it:
      Perché `0,1` non è rappresentabile esattamente in IEEE 754, mentre `0,5` e `0,25` sì? Che cosa comporta in
      pratica?
    en:
      Why can `0.1` not be represented exactly in IEEE 754, while `0.5` and `0.25` can? What does it imply in
      practice?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it:
          Un numero è rappresentabile con un numero finito di cifre binarie solo se il suo denominatore, ridotto ai
          minimi termini, è una potenza di 2.
        en:
          A number can be represented with a finite number of binary digits only if its denominator, in lowest
          terms, is a power of 2.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          0,5  = 1/2   = 2⁻¹        → 0,1₂         esatto

          0,25 = 1/4   = 2⁻²        → 0,01₂        esatto

          0,1  = 1/10  = 1/(2 × 5)  → il fattore 5 non è una potenza di 2

          ```


          In binario 0,1 diventa **periodico**:


          ```

          0,1₁₀ = 0,0001100110011001100110011…₂   (il gruppo 0011 si ripete)

          ```


          La mantissa ha 23 bit, quindi la sequenza viene troncata e arrotondata: il valore memorizzato è
          leggermente diverso da 0,1 (circa 0,100000001490116…).


          Conseguenze pratiche. Sommando dieci volte 0,1 **non** si ottiene esattamente 1, quindi confrontare
          due float con l’uguaglianza è quasi sempre sbagliato: si confronta la differenza con una tolleranza.
          E gli importi di denaro non si tengono in virgola mobile ma in interi (centesimi), proprio perché
          0,10 non è rappresentabile.
        en: >-
          ```

          0.5  = 1/2   = 2⁻¹        → 0.1₂         exact

          0.25 = 1/4   = 2⁻²        → 0.01₂        exact

          0.1  = 1/10  = 1/(2 × 5)  → the factor 5 is not a power of 2

          ```


          In binary 0.1 becomes **periodic**:


          ```

          0.1₁₀ = 0.0001100110011001100110011…₂   (the group 0011 repeats)

          ```


          The mantissa has 23 bits, so the sequence is truncated and rounded: the stored value differs
          slightly from 0.1 (about 0.100000001490116…).


          Practical consequences. Adding 0.1 ten times does **not** give exactly 1, so comparing two floats
          with equality is almost always wrong: you compare the difference with a tolerance. And amounts of
          money are not kept in floating point but in integers (cents), precisely because 0.10 cannot be
          represented.
  origin: originale
- id: virgola-mobile-es-5
  topic: virgola-mobile
  objectives:
    - virgola-mobile.4
  difficulty: 2
  kind: static
  statement:
    it:
      Verifica che due numeri in virgola mobile **positivi** si possano confrontare leggendo i loro bit come se
      fossero interi senza segno, usando 1,0 (`0x3F800000`) e 2,0 (`0x40000000`). La proprietà vale anche per
      i negativi?
    en: Check that two **positive** floating-point numbers can be compared by reading their bits as unsigned
      integers, using 1.0 (`0x3F800000`) and 2.0 (`0x40000000`). Does the property also hold for negatives?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it:
          'Guarda l’ordine dei campi dentro la parola: segno, poi esponente, poi mantissa. Chiediti perché è proprio
          quello.'
        en:
          'Look at the order of the fields within the word: sign, then exponent, then mantissa. Ask yourself why it
          is exactly that one.'
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          1,0 = 0x3F800000  →  come intero: 1 065 353 216

          2,0 = 0x40000000  →  come intero: 1 073 741 824


          1 065 353 216 < 1 073 741 824   ✓  e infatti 1,0 < 2,0

          ```


          Funziona per tre ragioni combinate: l’**esponente sta prima** della mantissa, quindi domina il
          confronto come deve; l’esponente è in **eccesso** (bias) e non in complemento a 2, quindi è un
          numero senza segno crescente; e la mantissa, essendo dopo, decide solo a parità di esponente.


          Per i **negativi** la proprietà si rompe: il bit di segno a 1 rende l’intero corrispondente più
          grande, quindi −2,0 risulterebbe «maggiore» di +1,0, e fra due negativi l’ordine si **inverte**
          (letti come interi, i bit di −1,0 sono minori di quelli di −2,0, mentre il valore è maggiore: al
          crescere del modulo cresce l’esponente).


          È il motivo per cui l’hardware di confronto in virgola mobile tratta il segno a parte: la
          scorciatoia vale solo nel semiasse positivo, ed è comunque una proprietà che il formato IEEE 754 ha
          ottenuto **per progetto**, non per caso.
        en: >-
          ```

          1.0 = 0x3F800000  →  as an integer: 1,065,353,216

          2.0 = 0x40000000  →  as an integer: 1,073,741,824


          1,065,353,216 < 1,073,741,824   ✓  and indeed 1.0 < 2.0

          ```


          It works for three combined reasons: the **exponent comes before** the mantissa, so it dominates the
          comparison as it should; the exponent is **biased** and not in two's complement, so it is an
          increasing unsigned number; and the mantissa, coming after, decides only when the exponents are
          equal.


          For **negatives** the property breaks: the sign bit at 1 makes the corresponding integer larger, so
          −2.0 would come out “greater” than +1.0, and between two negatives the order is **reversed** (read
          as integers, the bits of −1.0 are smaller than those of −2.0, while its value is larger: as the
          magnitude grows the exponent grows).


          That is why floating-point comparison hardware treats the sign separately: the shortcut holds only
          on the positive half-axis, and it is still a property the IEEE 754 format obtained **by design**,
          not by chance.
  origin: originale
