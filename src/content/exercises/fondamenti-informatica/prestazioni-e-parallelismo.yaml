- id: prestazioni-e-parallelismo-es-1
  topic: prestazioni-e-parallelismo
  objectives:
    - prestazioni-e-parallelismo.1
  difficulty: 1
  kind: static
  statement:
    it: Un programma esegue **2 × 10⁹** istruzioni con un numero medio di cicli per istruzione pari a **1,8**, su
      un processore a **3 GHz**. Quanto dura?
    en: A program executes **2 × 10⁹** instructions with an average of **1.8** cycles per instruction, on a **3
      GHz** processor. How long does it take?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Applica direttamente l’equazione delle prestazioni, badando alle unità di misura.
        en: Apply the performance equation directly, paying attention to the units.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          T = (N × S) / R
            = (2×10⁹ × 1,8) / (3×10⁹ Hz)
            = 3,6×10⁹ cicli / 3×10⁹ cicli al secondo
            = 1,2 s
          ```


          Da qui si legge subito quanto vale ogni miglioramento. Portare S da 1,8 a 1,5 (cache migliore)
          darebbe 1,0 s; portare la frequenza da 3 a 3,6 GHz darebbe la stessa cosa. Le due strade sono
          equivalenti sul risultato ma non sul costo: la prima è organizzazione, la seconda è consumo e
          calore.
        en: >-
          ```

          T = (N × S) / R
            = (2×10⁹ × 1.8) / (3×10⁹ Hz)
            = 3.6×10⁹ cycles / 3×10⁹ cycles per second
            = 1.2 s
          ```


          From here you can immediately read how much each improvement is worth. Bringing S from 1.8 to 1.5
          (better cache) would give 1.0 s; bringing the frequency from 3 to 3.6 GHz would give the same. The
          two routes are equivalent in result but not in cost: the first is organisation, the second is power
          and heat.
  origin: originale
- id: prestazioni-e-parallelismo-es-2
  topic: prestazioni-e-parallelismo
  objectives:
    - prestazioni-e-parallelismo.1
  difficulty: 1
  kind: static
  statement:
    it: La macchina A ha clock 2,5 GHz e S = 1,2. La macchina B ha clock 3 GHz e S = 1,8. Sullo stesso programma,
      quale è più veloce e di quanto?
    en: Machine A has a 2.5 GHz clock and S = 1.2. Machine B has a 3 GHz clock and S = 1.8. On the same program,
      which is faster and by how much?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: A parità di programma N è lo stesso, quindi si può confrontare direttamente S/R.
        en: On the same program N is the same, so S/R can be compared directly.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          T_A = N × 1,2 / 2,5×10⁹ = N × 0,48 ns

          T_B = N × 1,8 / 3,0×10⁹ = N × 0,60 ns


          T_B / T_A = 0,60 / 0,48 = 1,25

          ```


          La macchina **A è il 25 % più veloce**, pur avendo la frequenza più bassa: il suo vantaggio su S
          (1,2 contro 1,8) più che compensa i 500 MHz in meno.


          È la risposta alla domanda-trappola «un processore a frequenza più alta è più veloce?». No: la
          frequenza è un fattore su tre, e da sola non dice niente. Il confronto ha senso solo **a parità di
          programma**, perché anche N cambia da macchina a macchina.
        en: >-
          ```

          T_A = N × 1.2 / 2.5×10⁹ = N × 0.48 ns

          T_B = N × 1.8 / 3.0×10⁹ = N × 0.60 ns


          T_B / T_A = 0.60 / 0.48 = 1.25

          ```


          Machine **A is 25 % faster**, despite having the lower frequency: its advantage in S (1.2 against
          1.8) more than compensates for the 500 MHz less.


          It is the answer to the trick question “is a processor with a higher frequency faster?”. No:
          frequency is one factor out of three, and on its own it says nothing. The comparison makes sense
          only **on the same program**, because N too changes from machine to machine.
  origin: originale
- id: prestazioni-e-parallelismo-es-3
  topic: prestazioni-e-parallelismo
  objectives:
    - prestazioni-e-parallelismo.3
  difficulty: 2
  kind: static
  statement:
    it: Un programma spende il **25 %** del tempo in una funzione che riscrivi rendendola **8 volte** più veloce.
      Qual è il guadagno complessivo? E se la rendessi infinitamente veloce?
    en: A program spends **25 %** of its time in a function that you rewrite making it **8 times** faster. What is
      the overall gain? And if you made it infinitely fast?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: "Legge di Amdahl. Attenzione: *f* è la frazione di **tempo** occupata dalla parte migliorata, non la sua
          dimensione nel codice."
        en: "Amdahl's law. Careful: *f* is the fraction of **time** taken by the improved part, not its size in the
          code."
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          speedup = 1 / ( (1 − f) + f/k )
                  = 1 / ( 0,75 + 0,25/8 )
                  = 1 / ( 0,75 + 0,03125 )
                  = 1 / 0,78125 = 1,28×

          limite con k → ∞:
                  = 1 / 0,75 = 1,33×
          ```


          Otto volte più veloce su un quarto del tempo produce appena il 28 % di guadagno; e anche azzerando
          del tutto quella parte non si supera il 33 %. Il collo di bottiglia è il 75 % non toccato.


          Conseguenza operativa: **misurare prima di ottimizzare**. Investire settimane su una funzione che
          pesa il 25 % ha un tetto del 33 %; la stessa fatica su una che pesa il 70 % ne vale molto di più. È
          il motivo per cui i profiler esistono.
        en: >-
          ```

          speedup = 1 / ( (1 − f) + f/k )
                  = 1 / ( 0.75 + 0.25/8 )
                  = 1 / ( 0.75 + 0.03125 )
                  = 1 / 0.78125 = 1.28×

          limit with k → ∞:
                  = 1 / 0.75 = 1.33×
          ```


          Eight times faster on a quarter of the time produces barely a 28 % gain; and even reducing that part
          to zero you do not exceed 33 %. The bottleneck is the untouched 75 %.


          Operational consequence: **measure before optimising**. Investing weeks in a function weighing 25 %
          has a 33 % ceiling; the same effort on one weighing 70 % is worth much more. That is why profilers
          exist.
  origin: originale
- id: prestazioni-e-parallelismo-es-4
  topic: prestazioni-e-parallelismo
  objectives:
    - prestazioni-e-parallelismo.3
  difficulty: 2
  kind: static
  statement:
    it: Un programma è parallelizzabile all’**80 %**. Quanti core servono per dimezzare il tempo di esecuzione? E
      qual è il massimo guadagno raggiungibile con infiniti core?
    en: A program is **80 %** parallelisable. How many cores are needed to halve the execution time? And what is
      the maximum gain achievable with infinitely many cores?
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: Amdahl con k = numero di core sulla parte parallela. Imposta lo speedup a 2 e risolvi.
        en: Amdahl with k = number of cores on the parallel part. Set the speedup to 2 and solve.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          speedup = 1 / ( 0,20 + 0,80/k ) = 2


          0,20 + 0,80/k = 0,5

          0,80/k = 0,3

          k = 0,80 / 0,3 ≈ 2,7 → 3 core


          limite con k → ∞:  1 / 0,20 = 5×

          ```


          Tre core bastano per raddoppiare la velocità, ma per triplicarla ne servirebbero 8, e oltre 5× non
          si va **mai**, nemmeno con mille core. Il 20 % sequenziale è un muro.


          E il conto è ancora ottimistico: non tiene conto del costo di **sincronizzazione**, che cresce con
          il numero di core e a un certo punto può far *peggiorare* le prestazioni aggiungendo processori. È
          la ragione per cui il parallelismo non è una soluzione universale.
        en: >-
          ```

          speedup = 1 / ( 0.20 + 0.80/k ) = 2


          0.20 + 0.80/k = 0.5

          0.80/k = 0.3

          k = 0.80 / 0.3 ≈ 2.7 → 3 cores


          limit with k → ∞:  1 / 0.20 = 5×

          ```


          Three cores are enough to double the speed, but to triple it 8 would be needed, and beyond 5× you
          **never** go, not even with a thousand cores. The sequential 20 % is a wall.


          And the calculation is still optimistic: it does not account for the cost of **synchronisation**,
          which grows with the number of cores and at some point can make performance *worse* as processors
          are added. That is why parallelism is not a universal solution.
  origin: originale
- id: prestazioni-e-parallelismo-es-5
  topic: prestazioni-e-parallelismo
  objectives:
    - prestazioni-e-parallelismo.4
  difficulty: 2
  kind: static
  statement:
    it: "Due benchmark: sul primo la macchina X è **10 volte** più veloce del riferimento, sul secondo è **0,1
      volte** (cioè dieci volte più lenta). Calcola il punteggio con la media **aritmetica** e con la
      **geometrica**, e di’ quale è corretta."
    en: "Two benchmarks: on the first machine X is **10 times** faster than the reference, on the second it is
      **0.1 times** as fast (i.e. ten times slower). Compute the score with the **arithmetic** and with the
      **geometric** mean, and say which is correct."
  steps:
    - title:
        it: Da dove si comincia
        en: Where to start
      body:
        it: La media giusta è quella che non cambia se si sceglie una macchina di riferimento diversa. Prova a
          immaginare di invertire i ruoli.
        en: The right mean is the one that does not change if a different reference machine is chosen. Try to imagine
          swapping the roles.
    - title:
        it: Svolgimento
        en: Solution
      body:
        it: >-
          ```

          media aritmetica = (10 + 0,1) / 2 = 5,05

          media geometrica = √(10 × 0,1) = √1 = 1,0

          ```


          L’aritmetica dice che X è cinque volte più veloce del riferimento: assurdo, visto che su un
          benchmark vince di dieci e sull’altro perde di dieci. La geometrica dice **1,0**, cioè pari — che è
          la lettura sensata.


          Il motivo formale: i punteggi sono **rapporti**. La media geometrica di rapporti gode della
          proprietà che, invertendo il riferimento, il risultato si inverte coerentemente e l’**ordinamento
          fra le macchine non cambia**. La media aritmetica no: cambiando macchina di riferimento può cambiare
          persino chi vince, il che la rende inutilizzabile per un confronto.


          È per questo che le suite SPEC pubblicano medie geometriche, e la ragione per cui un punteggio
          sintetico va sempre letto sapendo **come** è stato aggregato.
        en: >-
          ```

          arithmetic mean = (10 + 0.1) / 2 = 5.05

          geometric mean  = √(10 × 0.1) = √1 = 1.0

          ```


          The arithmetic mean says X is five times faster than the reference: absurd, given that it wins by
          ten on one benchmark and loses by ten on the other. The geometric mean says **1.0**, i.e. even —
          which is the sensible reading.


          The formal reason: the scores are **ratios**. The geometric mean of ratios has the property that,
          inverting the reference, the result inverts consistently and the **ranking between machines does not
          change**. The arithmetic mean does not: changing the reference machine can even change who wins,
          which makes it useless for a comparison.


          That is why the SPEC suites publish geometric means, and why a summary score must always be read
          knowing **how** it was aggregated.
  origin: originale
